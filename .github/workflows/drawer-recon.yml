name: drawer-recon
# run 103 — verify redirect + menus (instant surfaces)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          echo "redirect: $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' 'https://maisoncroyez.com/pages/build-your-kit-2')"
          curl -sL 'https://maisoncroyez.com/pages/six-month-program?utm_campaign=m103' -o /tmp/p.html
          echo "header_menu_program: $(grep -o 'Six-Month Program' /tmp/p.html | wc -l)"
          echo "header_menu_oldkit: $(grep -o 'Build your Kit' /tmp/p.html | wc -l)"
          echo "footer_free_scents: $(grep -o 'Get Your FREE Scents' /tmp/p.html | wc -l)"
          echo "any_bk2_links: $(grep -o 'pages/build-your-kit-2' /tmp/p.html | wc -l)"
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          curl -sSL "$B/mc-home-app.js?v=og$RANDOM" -o /tmp/h.js
          echo "gate_home_repointed: $(grep -o 'six-month-program' /tmp/h.js | wc -l) old: $(grep -o 'build-your-kit-2' /tmp/h.js | wc -l) newcta: $(grep -o 'Start Your Program' /tmp/h.js | wc -l)"
