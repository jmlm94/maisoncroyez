name: drawer-recon
# run 188 — verify v3s8 live: pre-hero <video> adopted by the app (one mp4 request, element inside #root, prehero hidden), time to playing x3 (iPhone WebKit), firefox autoplay-blocked -> play button on the adopted element
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps webkit firefox
      - name: Video timing
        run: |
          cat > r188.mjs <<'EOF2'
          import { webkit, firefox, devices } from 'playwright';
          const URL = 'https://maisoncroyez.com/pages/six-month-program';
          const out = [];
          const probe = (pg) => pg.evaluate(() => { const v = document.querySelector('#root video'); const pre = document.getElementById('mc-prehero'); const b = document.querySelector('#root .hv-play'); return { inRoot: !!v, inSlide: !!(v && v.closest('.gal-slide')), preVideo: !!document.querySelector('#mc-prehero video'), preHidden: pre ? getComputedStyle(pre).display === 'none' : null, paused: v ? v.paused : null, t: v ? +v.currentTime.toFixed(2) : null, rs: v ? v.readyState : null, btn: !!b, key: [...document.scripts].map(s => s.src).filter(s => /mc-v3-app/.test(s)).map(s => s.split('v=')[1])[0] }; });
          for (let i = 0; i < 3; i++) {
            const b = await webkit.launch();
            const pg = await (await b.newContext({ ...devices['iPhone 13'], defaultBrowserType: undefined })).newPage();
            const errs = []; pg.on('pageerror', e => errs.push(e.message.slice(0, 120)));
            const mp4 = []; pg.on('request', r => { if (/mc-hero-loop/.test(r.url())) mp4.push(r.headers()['range'] || 'no-range'); });
            const t0 = Date.now();
            await pg.goto(URL, { waitUntil: 'commit', timeout: 90000 });
            let firstPlayAt = null, adoptedAt = null, playingInRootAt = null;
            for (let k = 0; k < 100; k++) {
              const s = await pg.evaluate(() => { const any = document.querySelector('video'); const inRoot = document.querySelector('#root video'); return { anyPlaying: !!(any && !any.paused && any.currentTime > 0), inRoot: !!inRoot, rootPlaying: !!(inRoot && !inRoot.paused && inRoot.currentTime > 0) }; }).catch(() => null);
              const now = Date.now() - t0;
              if (s && s.anyPlaying && firstPlayAt === null) firstPlayAt = now;
              if (s && s.inRoot && adoptedAt === null) adoptedAt = now;
              if (s && s.rootPlaying) { playingInRootAt = now; break; }
              await pg.waitForTimeout(150);
            }
            await pg.waitForTimeout(1500);
            const final = await probe(pg);
            out.push({ run: i + 1, firstPlayMs: firstPlayAt, adoptedMs: adoptedAt, rootPlayingMs: playingInRootAt, mp4Requests: mp4.length, mp4Ranges: mp4.slice(0, 6), final, errs });
            if (i === 0) await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3s8-webkit-iphone.png' });
            await b.close();
          }
          { const b = await firefox.launch({ firefoxUserPrefs: { 'media.autoplay.default': 5, 'media.autoplay.blocking_policy': 2 } });
            const pg = await (await b.newContext({ viewport: { width: 390, height: 844 } })).newPage();
            await pg.goto(URL, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await pg.waitForSelector('#root video', { timeout: 60000 }); await pg.waitForTimeout(5000);
            const before = await probe(pg);
            await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3s8-blocked-before.png' });
            const h1 = await pg.$('#root h1'); const bb = await h1.boundingBox(); await pg.mouse.click(bb.x + 5, bb.y + 5); await pg.waitForTimeout(2500);
            const after = await probe(pg);
            out.push({ firefoxBlocked: { before, after } });
            await b.close(); }
          console.log('TIMING ' + JSON.stringify(out, null, 1));
          EOF2
          node r188.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/
          git commit -m "r188: v3s8 live screenshots" || exit 0
          git pull --rebase -q origin claude/maison-diffuser-perf-fixes-f45ggl || true
          git push
