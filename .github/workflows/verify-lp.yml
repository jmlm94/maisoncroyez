name: verify-lp
# run: 43 — offer v3 re-check after CSS propagation: geometry asserts + stylesheet content probe
on:
  push:
    branches: [claude/maison-landing-page-iyikm5]
    paths: ['.github/workflows/verify-lp.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait out bot-protection block if present
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36' 'https://maisoncroyez.com/pages/free-diffuser')
            echo "attempt $i: HTTP $code" | tee -a gate-log.txt
            if [ "$code" = "200" ]; then break; fi
            sleep 45
          done
      - name: Verify live free-diffuser LP (offer v3 visitor walkthrough)
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > check.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          const errs=[], failed=[];
          page.on('console', m=>{ if(m.type()==='error') errs.push(m.text().slice(0,200)); });
          page.on('pageerror', e=>errs.push('PAGEERROR: '+String(e).slice(0,200)));
          page.on('requestfailed', r=>{ const u=r.url(); if(/cdn\.shopify|maisoncroyez/.test(u)) failed.push(r.failure()?.errorText+' '+u.slice(0,90)); });
          const resp=[];
          page.on('response', r=>{ const u=r.url(); if(/mc-lp-free-diffuser|mc-lp-vendor|mc-lp-diffuser-assets|mc-lp-fd-hero/.test(u)) resp.push(r.status()+' '+u.split('/').pop().slice(0,60)); });
          let nav=null;
          for(let a=0;a<4;a++){
            nav=await page.goto('https://maisoncroyez.com/pages/free-diffuser?cb='+Date.now(), {waitUntil:'load',timeout:60000});
            console.log('goto attempt '+(a+1)+': HTTP '+(nav?nav.status():'?'));
            if(nav && nav.status()===200) break;
            await page.waitForTimeout(30000);
          }
          await page.waitForTimeout(9000);
          await page.evaluate(async()=>{ for(let y=0;y<document.body.scrollHeight;y+=500){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,60));} window.scrollTo(0,0); await new Promise(r=>setTimeout(r,1500)); });
          const state = () => page.evaluate(()=>{
            const atc=document.querySelector('.buybox .atc');
            return {
              price:(document.querySelector('.price-row .price')||{}).innerText||'MISSING',
              compare:(document.querySelector('.price-row .compare')||{}).innerText||'',
              selected:[...document.querySelectorAll('.pick[aria-checked="true"]')].map(p=>(p.querySelector('.pick-name')||{}).innerText+' '+((p.querySelector('.pqn')||{}).innerText||'')),
              atcText:atc?atc.innerText.replace(/\s+/g,' ').trim().slice(0,80):'MISSING',
              atcDisabled:atc?atc.disabled:null,
              freeLine:(document.querySelector('.free-line')||{}).innerText||'MISSING',
              valstack:[...document.querySelectorAll('.valstack .vrow')].map(r=>r.innerText.replace(/\s+/g,' '))
            };
          });
          const geometry = () => page.evaluate(()=>{
            const out={};
            const q2=document.querySelectorAll('.qopt')[1];
            if(q2){
              const icons=[...q2.querySelectorAll('.qicons svg')].map(s=>s.getBoundingClientRect());
              out.qopt2_iconCount=icons.length;
              out.qopt2_iconsSameRow=icons.length<2?true:Math.abs(icons[0].top-icons[1].top)<3;
              out.qopt2_iconSize=icons[0]?Math.round(icons[0].width)+'x'+Math.round(icons[0].height):'none';
              const st=getComputedStyle(q2);
              out.qopt_border=st.borderTopWidth+' '+st.borderTopStyle;
              const sub=q2.querySelector('.qsub'), qr=q2.getBoundingClientRect(), sr=sub?sub.getBoundingClientRect():null;
              out.qsub_centered=sr?Math.abs((sr.left+sr.width/2)-(qr.left+qr.width/2))<4:null;
            }
            const on=document.querySelector('.pick[aria-checked="true"] .pick-qtyc');
            if(on){
              const minus=on.querySelectorAll('.pqb')[0], plus=on.querySelectorAll('.pqb')[1], n=on.querySelector('.pqn');
              const mr=minus.getBoundingClientRect(), pr=plus.getBoundingClientRect(), nr=n.getBoundingClientRect();
              const card=on.closest('.pick').getBoundingClientRect();
              out.stepper_sameRow=Math.abs((mr.top+mr.height/2)-(pr.top+pr.height/2))<3 && Math.abs((mr.top+mr.height/2)-(nr.top+nr.height/2))<4;
              out.stepper_circle=Math.round(mr.width)+'x'+Math.round(mr.height)+' / '+Math.round(pr.width)+'x'+Math.round(pr.height);
              out.stepper_insideCard=pr.right<=card.right+1 && mr.left>=card.left-1;
            }
            const qpop=document.querySelector('.qpop');
            out.qpop_bg=qpop?getComputedStyle(qpop).backgroundColor:'MISSING';
            const badge=document.querySelector('.pick-badge');
            out.badge_bg=badge?getComputedStyle(badge).backgroundColor:'MISSING';
            return out;
          });
          const audit = await page.evaluate(()=>{
            const q=s=>document.querySelectorAll(s).length;
            const imgs=[...document.querySelectorAll('#root img')];
            const gal1=document.querySelector('.gal-slide img');
            return {
              root:!!document.getElementById('root'),
              h1:(document.querySelector('#root h1')||{}).innerText||'MISSING',
              heroSrc:gal1?gal1.currentSrc.split('/').pop().slice(0,50):'MISSING',
              qtyOpts:q('.qopt'), fragCards:q('.pick'),
              topSellerCards:[...document.querySelectorAll('.pick:has(.pick-badge) .pick-name')].map(e=>e.innerText),
              boldScarcity:!!document.querySelector('.buybox .atc .btn-sub strong'),
              bulletsFirst:(()=>{const bb=document.querySelector('.offer-bullets'),vs=document.querySelector('.valstack');return bb&&vs?bb.getBoundingClientRect().top<vs.getBoundingClientRect().top:null;})(),
              faqs:q('.faq .qa'),
              brokenImgs:imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc.split('/').pop().slice(0,40)),
              overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth+2
            };
          });
          console.log('=== AUDIT ==='); console.log(JSON.stringify(audit,null,1));
          const cssProbe = await page.evaluate(async()=>{
            const l=[...document.querySelectorAll('link[rel=stylesheet]')].find(x=>/mc-lp-free-diffuser\.css/.test(x.href));
            if(!l) return {found:false};
            const t=await (await fetch(l.href)).text();
            return {href:l.href.split('?')[1], len:t.length, scopedQtysel:t.includes('#root .qtysel'), scopedPqb:t.includes('#root .pqb'), round12:t.includes('round 12')};
          });
          console.log('=== CSS PROBE (must be scoped) ==='); console.log(JSON.stringify(cssProbe));
          console.log('=== S0 initial ==='); console.log(JSON.stringify(await state()));
          // VISITOR JOURNEY
          const qopt=i=>page.click('.qopt:nth-child('+i+')').then(()=>page.waitForTimeout(400));
          const pickByName=async n=>{ await page.locator('.pick',{hasText:n}).first().click(); await page.waitForTimeout(300); };
          await qopt(2);
          console.log('=== S1 chose 2 diffusers ==='); console.log(JSON.stringify(await state()));
          await pickByName('Crisp Citrus Scape');
          await pickByName('Midnight Sensation');
          console.log('=== S2 picked 2 scents ==='); console.log(JSON.stringify(await state()));
          await page.locator('.qopt:nth-child(2)').scrollIntoViewIfNeeded(); await page.waitForTimeout(300);
          await page.screenshot({path:'fd-ux-m-qtysel.png'});
          console.log('=== GEO mobile (2 picked) ==='); console.log(JSON.stringify(await geometry(),null,1));
          await qopt(3);
          console.log('=== S3 upgrade 2->3 (picks kept, needs 1 more) ==='); console.log(JSON.stringify(await state()));
          // stack a scent with the + stepper
          await page.locator('.pick',{hasText:'Crisp Citrus Scape'}).locator('.pqb').nth(1).click(); await page.waitForTimeout(400);
          console.log('=== S4 stacked Crisp x2 via + ==='); console.log(JSON.stringify(await state()));
          console.log('=== GEO mobile (stepper x2) ==='); console.log(JSON.stringify(await geometry(),null,1));
          await page.locator('.pick',{hasText:'Crisp Citrus Scape'}).scrollIntoViewIfNeeded(); await page.waitForTimeout(300);
          await page.screenshot({path:'fd-ux-m-stepper.png'});
          // minus back down
          await page.locator('.pick',{hasText:'Crisp Citrus Scape'}).locator('.pqb').nth(0).click(); await page.waitForTimeout(400);
          console.log('=== S5 minus back to x1 ==='); console.log(JSON.stringify(await state()));
          await qopt(1);
          console.log('=== S6 downgrade 3->1 (expect picks CLEARED + ATC locked) ==='); console.log(JSON.stringify(await state()));
          await pickByName('Golden Blossom Harmony');
          console.log('=== S7 picked 1 (radio mode, ATC unlocked) ==='); console.log(JSON.stringify(await state()));
          await pickByName('Euphoric Bloom');
          console.log('=== S8 radio swap to Euphoric (still 1 selected) ==='); console.log(JSON.stringify(await state()));
          // final purchase config: 3 diffusers, Golden x2 + Euphoric x1
          await qopt(3);
          await pickByName('Golden Blossom Harmony');
          await page.locator('.pick',{hasText:'Golden Blossom Harmony'}).locator('.pqb').nth(1).click(); await page.waitForTimeout(400);
          console.log('=== S9 final: 3 diffusers, Golden x2 + Euphoric x1 ==='); console.log(JSON.stringify(await state()));
          // real ATC -> cart
          await page.evaluate(()=>document.querySelector('.buybox .atc').scrollIntoView({block:'center'}));
          await page.waitForTimeout(400);
          await page.click('.buybox .atc');
          await page.waitForTimeout(5000);
          await page.screenshot({ path:'fd-drawer.png' });
          const cart = await page.evaluate(async()=>{
            const j=await (await fetch('/cart.js')).json();
            return {total:j.total_price/100, items:j.items.map(i=>({t:i.product_title.slice(0,42), v:i.variant_id, q:i.quantity, line:i.final_line_price/100, plan:((i.selling_plan_allocation||{}).selling_plan||{}).id||null, discounts:(i.discounts||[]).map(d=>d.title+' -'+d.amount/100)}))};
          });
          console.log('=== CART (expect Golden x2 + Euphoric x1 on plan 2627895405, 3 diffusers -> $0, total 119.85) ===');
          console.log(JSON.stringify(cart,null,1));
          console.log('=== CONSOLE ERRORS ('+errs.length+') ==='); errs.slice(0,15).forEach(e=>console.log(' - '+e));
          console.log('=== FAILED REQUESTS ('+failed.length+') ==='); failed.slice(0,15).forEach(e=>console.log(' - '+e));
          console.log('=== OUR BUNDLE RESPONSES ==='); [...new Set(resp)].forEach(e=>console.log(' - '+e));
          await page.evaluate(()=>window.scrollTo(0,0));
          await page.waitForTimeout(800);
          await page.screenshot({ path:'fd-live-full.png', fullPage:true });
          // DESKTOP PASS — the two areas the owner flagged
          const d = await b.newPage({ viewport:{width:1320,height:900} });
          await d.goto('https://maisoncroyez.com/pages/free-diffuser?cb=d'+Date.now(), {waitUntil:'load',timeout:60000});
          await d.waitForTimeout(9000);
          await d.click('.qopt:nth-child(2)'); await d.waitForTimeout(400);
          await d.locator('.pick',{hasText:'Crisp Citrus Scape'}).first().click(); await d.waitForTimeout(400);
          const dgeo = await d.evaluate(()=>{
            const out={};
            const q2=document.querySelectorAll('.qopt')[1];
            const icons=q2?[...q2.querySelectorAll('.qicons svg')].map(s=>s.getBoundingClientRect()):[];
            out.qopt2_iconsSameRow=icons.length<2?('only '+icons.length):Math.abs(icons[0].top-icons[1].top)<3;
            out.qopt_border=q2?getComputedStyle(q2).borderTopWidth+' '+getComputedStyle(q2).borderTopStyle:'?';
            const sub=q2?q2.querySelector('.qsub'):null;
            if(sub){const qr=q2.getBoundingClientRect(), sr=sub.getBoundingClientRect(); out.qsub_centered=Math.abs((sr.left+sr.width/2)-(qr.left+qr.width/2))<4;}
            const on=document.querySelector('.pick[aria-checked="true"] .pick-qtyc');
            if(on){
              const bs=on.querySelectorAll('.pqb'), n=on.querySelector('.pqn');
              const mr=bs[0].getBoundingClientRect(), pr=bs[1].getBoundingClientRect(), nr=n.getBoundingClientRect();
              const card=on.closest('.pick').getBoundingClientRect();
              out.stepper_sameRow=Math.abs((mr.top+mr.height/2)-(pr.top+pr.height/2))<3 && Math.abs((mr.top+mr.height/2)-(nr.top+nr.height/2))<4;
              out.stepper_circle=Math.round(mr.width)+'x'+Math.round(mr.height)+' / '+Math.round(pr.width)+'x'+Math.round(pr.height);
              out.stepper_insideCard=pr.right<=card.right+1 && mr.left>=card.left-1;
            }
            return out;
          });
          console.log('=== GEO DESKTOP 1320px ==='); console.log(JSON.stringify(dgeo,null,1));
          await d.locator('.qtysel').screenshot({path:'fd-ux-d-qtysel.png'});
          await d.locator('.pick',{hasText:'Crisp Citrus Scape'}).first().screenshot({path:'fd-ux-d-pick.png'});
          await b.close();
          EOS
          node check.mjs 2>&1 | tee verify-log.txt
      - name: Performance audit (throttled mobile lab x3)
        if: always()
        run: |
          cat > perf.mjs <<'EOS'
          import { chromium } from 'playwright';
          const URL='https://maisoncroyez.com/pages/free-diffuser';
          const runs=[];
          for(let i=0;i<3;i++){
            const b=await chromium.launch();
            const ctx=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,userAgent:'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36'});
            const page=await ctx.newPage();
            const cdp=await ctx.newCDPSession(page);
            await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:150,downloadThroughput:1.6*1024*1024/8,uploadThroughput:750*1024/8});
            await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
            await page.addInitScript(()=>{
              window.__m={lcp:0,lcpEl:'',cls:0,fcp:0,lt:[],shifts:[]};
              const sel=n=>{ if(!n||!n.tagName) return '?'; let s=n.tagName.toLowerCase(); if(n.id) s+='#'+n.id; if(n.className&&typeof n.className==='string') s+='.'+n.className.trim().split(/\s+/).slice(0,2).join('.'); return s; };
              new PerformanceObserver(l=>{for(const e of l.getEntries()){ window.__m.lcp=e.startTime; window.__m.lcpEl=sel(e.element)+(e.url?' url='+e.url.split('/').pop().slice(0,50):''); }}).observe({type:'largest-contentful-paint',buffered:true});
              new PerformanceObserver(l=>{for(const e of l.getEntries()) if(!e.hadRecentInput){ window.__m.cls+=e.value; if(e.value>0.01) window.__m.shifts.push({t:Math.round(e.startTime),v:+e.value.toFixed(4),src:(e.sources||[]).slice(0,3).map(s=>sel(s.node)).join(',')}); }}).observe({type:'layout-shift',buffered:true});
              new PerformanceObserver(l=>{for(const e of l.getEntries()) if(e.name==='first-contentful-paint') window.__m.fcp=e.startTime;}).observe({type:'paint',buffered:true});
              new PerformanceObserver(l=>{for(const e of l.getEntries()) window.__m.lt.push({s:Math.round(e.startTime),d:Math.round(e.duration)});}).observe({type:'longtask',buffered:true});
            });
            const t0=Date.now();
            let nv=null;
            for(let a=0;a<5;a++){
              nv=await page.goto(URL+'?perf='+Date.now(),{waitUntil:'load',timeout:120000});
              console.log('perf run '+(i+1)+' goto attempt '+(a+1)+': HTTP '+(nv?nv.status():'?'));
              if(nv && nv.status()===200) break;
              await page.waitForTimeout(45000);
            }
            await page.waitForTimeout(12000);
            const m=await page.evaluate(()=>{
              const nav=performance.getEntriesByType('navigation')[0]||{};
              const res=performance.getEntriesByType('resource');
              const ours=res.filter(r=>/mc-lp/.test(r.name)).map(r=>({f:r.name.split('?')[0].split('/').pop(),transferKB:Math.round(r.transferSize/1024),decodedKB:Math.round(r.decodedBodySize/1024),ms:Math.round(r.duration)}));
              const tbt=window.__m.lt.reduce((s,t)=>s+Math.max(0,t.d-50),0);
              const hero=res.filter(r=>/mc-lp-fd-hero-callouts/.test(r.name)).map(r=>({transferKB:Math.round(r.transferSize/1024),ms:Math.round(r.duration)}));
              return {ttfbMs:Math.round(nav.responseStart||0),fcpMs:Math.round(window.__m.fcp),lcpMs:Math.round(window.__m.lcp),lcpEl:window.__m.lcpEl,cls:+window.__m.cls.toFixed(4),shifts:window.__m.shifts.slice(0,10),tbtMs:Math.round(tbt),longtasks:window.__m.lt.length,loadMs:Math.round(nav.loadEventEnd||0),reqCount:res.length,totalTransferKB:Math.round(res.reduce((s,r)=>s+r.transferSize,0)/1024),hero,ourBundles:ours};
            });
            m.wallMs=Date.now()-t0; runs.push(m); await b.close();
            if(i<2) await new Promise(r=>setTimeout(r,70000));
          }
          const med=k=>{const v=runs.map(r=>r[k]).sort((a,b)=>a-b);return v[1];};
          console.log('=== PERF RUNS (Slow4G 150ms RTT / 1.6Mbps / 4x CPU, Pixel-class) ===');
          runs.forEach((r,i)=>console.log('run'+(i+1)+': TTFB='+r.ttfbMs+'ms FCP='+r.fcpMs+'ms LCP='+r.lcpMs+'ms CLS='+r.cls+' TBT='+r.tbtMs+'ms load='+r.loadMs+'ms reqs='+r.reqCount+' transfer='+r.totalTransferKB+'KB'));
          console.log('=== MEDIAN ===');
          console.log(JSON.stringify({ttfbMs:med('ttfbMs'),fcpMs:med('fcpMs'),lcpMs:med('lcpMs'),cls:med('cls'),tbtMs:med('tbtMs'),loadMs:med('loadMs'),totalTransferKB:med('totalTransferKB')}));
          console.log('=== LCP ELEMENT (per run) ==='); runs.forEach((r,i)=>console.log('run'+(i+1)+': '+r.lcpEl));
          console.log('=== NEW HERO IMG (run1) ==='); console.log(JSON.stringify(runs[0].hero));
          console.log('=== OUR BUNDLES (run1) ==='); console.log(JSON.stringify(runs[0].ourBundles,null,1));
          EOS
          node perf.mjs 2>&1 | tee perf-log.txt
      - name: Commit results
        if: always()
        run: |
          mkdir -p lp-factory/pages/pdp-free-diffuser/verify
          mv fd-live-full.png fd-drawer.png fd-ux-m-qtysel.png fd-ux-m-stepper.png fd-ux-d-qtysel.png fd-ux-d-pick.png verify-log.txt perf-log.txt lp-factory/pages/pdp-free-diffuser/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-free-diffuser/verify
          git commit -m "Free-diffuser LP verify run 43: offer v3 UX re-check post-propagation" || true
          git pull --rebase -X theirs origin claude/maison-landing-page-iyikm5
          git push
