name: drawer-recon
# run 95 — final live verify after run-once guards + pixel fallback
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          curl -sSL "$B/mc-kits-app.js?v=og$RANDOM" -o /tmp/a.js
          echo "gate_guard: $(grep -o '__MC_KX_APP__' /tmp/a.js | wc -l)"
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[];p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          const beacons=[];p.on('request',r=>{const u=r.url();if(u.indexOf('facebook.com/tr')>-1)beacons.push(u);});
          let cartAdd=null;p.on('response',async r=>{if(r.url().indexOf('/cart/add.js')>-1)cartAdd=r.status();});
          await p.goto('https://maisoncroyez.com/products/maison-croyez-manifestation-specia-bundles?utm_campaign=kx95',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(12000);
          const r1=await p.evaluate(()=>{
            const q=s=>document.querySelector(s);const t=s=>(q(s)?q(s).textContent.trim().replace(/\s+/g,' '):null);
            const vis=[...document.querySelectorAll('button,input[type=submit]')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&/add to cart|buy it now|sold out/i.test(e.textContent||e.value||'');});
            return {
              rootMounted: !!q('#root') && q('#root').children.length>0,
              tiers: document.querySelectorAll('.kitcard').length,
              atc: t('.btn.atc') ? t('.btn.atc').slice(0,50) : null,
              themeBuyButtons: vis.length,
              overflow: document.documentElement.scrollWidth-document.documentElement.clientWidth,
            };});
          const pv=beacons.filter(u=>u.indexOf('PageView')>-1).length;
          await p.evaluate(()=>{const e=document.querySelector('.btn.atc'); if(e) e.click();});
          await p.waitForTimeout(6000);
          const drawer=await p.evaluate(()=>{const d=document.getElementById('cart-drawer');return d?(d.hasAttribute('open')||getComputedStyle(d).display!=='none'):null;});
          const atcB=beacons.filter(u=>u.indexOf('AddToCart')>-1).length;
          console.log('R95 '+JSON.stringify({...r1, fbPageView:pv, fbAddToCart:atcB, cartAdd, drawer, errs}));
          await b.close();})();
          EOS
