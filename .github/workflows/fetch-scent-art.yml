name: fetch-scent-art
# Downloads the generated art for the seven scent cards into lp-factory/assets/scent-notes/ (the session container cannot reach the image host). One "path-under-scent-notes url" pair per line in LIST below. Edit the list and push to run. [runs 1-3: the note illustrations, raw/<key>.png] [run 4: the 21 colourful photo panels, photo/raw/<key>-<n>.jpg]
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/fetch-scent-art.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIST: |
        photo/raw/love-1.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202148_e0111e31-041a-498a-bd3a-05d2397e233b.jpeg
        photo/raw/love-2.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202146_52d323aa-3691-415a-9460-7fc240c5f342.jpeg
        photo/raw/love-3.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202146_5f4e3adb-9142-4c00-b019-445982ee6cba.jpeg
        photo/raw/abundance-1.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202146_1c5a99a9-c0ca-4129-b7f4-09d0f0d799ed.jpeg
        photo/raw/abundance-2.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202148_291b10a8-d73e-4125-b807-9ab7d58dca19.jpeg
        photo/raw/abundance-3.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202147_f52ec169-d14d-4517-aab8-926ecae1e9a1.jpeg
        photo/raw/focus-1.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202145_1b08b8d4-c72b-49f5-83ac-acd9a3f299fc.jpeg
        photo/raw/focus-2.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202145_f1829850-6921-468a-8a5c-ce61549a3537.jpeg
        photo/raw/focus-3.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202145_bb3ed968-933b-497f-af32-c33a453d5444.jpeg
        photo/raw/ideas-1.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202147_d31793fe-6fe9-4b53-acfa-9db7f39724fb.jpeg
        photo/raw/ideas-2.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202144_14037744-ad8b-43c9-8122-bdd1c30a673c.jpeg
        photo/raw/ideas-3.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202148_27106615-6d6e-4cd4-9d51-415ad4b06f19.jpeg
        photo/raw/energy-1.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202212_f72b7137-81e2-4050-b509-da8e41282d4f.jpeg
        photo/raw/energy-2.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202212_8dc1a4fd-9c03-4045-8cfa-47d45eb17359.jpeg
        photo/raw/energy-3.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202211_25acda46-7fa1-4e41-93b9-ee7acf130875.jpeg
        photo/raw/purify-1.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202212_4a4438ff-1a60-4b20-b46d-e7e31cb13877.jpeg
        photo/raw/purify-2.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202213_b9695eb3-619c-45b2-a25d-c563bb7a0504.jpeg
        photo/raw/purify-3.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202211_1dfa8d77-f59d-4905-9959-7ec417e74dec.jpeg
        photo/raw/midnight-1.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202210_b79ebf25-cacf-4a25-9346-801db64ad90b.jpeg
        photo/raw/midnight-2.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202211_c4174563-8b27-4407-8865-937c777d4479.jpeg
        photo/raw/midnight-3.jpg https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261114_202210_2da99c11-8b54-4f62-9601-ca56aa2d7840.jpeg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch
        run: |
          D=lp-factory/assets/scent-notes
          echo "$LIST" | while read -r path url; do
            [ -z "$path" ] && continue
            mkdir -p "$(dirname "$D/$path")"
            code=$(curl -sSL -A "Mozilla/5.0" --max-time 120 -o "$D/$path" -w "%{http_code}" "$url" || true)
            echo "$path http $code $(wc -c < "$D/$path" 2>/dev/null) bytes $(file -b "$D/$path" | cut -c1-50)"
          done
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/assets/scent-notes
          git commit -m "scent-notes: fetched the generated art" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && break || sleep 3; done
