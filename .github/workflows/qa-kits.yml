name: qa-kits
# Kits page only (https://maisoncroyez.com/pages/diffuser-kits): live checks of the dk8 buy box on a phone and on desktop — nothing pre-selected, the 4-per-row / 7-per-row scent picker, the smells-like bar for all seven scents, single-select swap, Add to cart without a scent (grid outline + toast, no cart change, buy box and sticky bar), diffuser-count prices, removed copy, "Where it goes" compact — then two real cart flows (2 diffusers + 30-day refill, 3 diffusers + one-time). Edit this line and push to run. Run 2026-10-14 ~15:5x UTC (owner: "diffuser-kits only").
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/qa-kits.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: https://maisoncroyez.com/pages/diffuser-kits
      OUT: lp-factory/qa-kits
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Kits QA
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const URL_ = process.env.URL, stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 13), OUT = `${process.env.OUT}/${stamp}`;
          fs.mkdirSync(OUT, { recursive: true });
          const SCENTS = [
            { key: 'love', name: 'Golden Blossom Harmony', intention: 'Love', strength: 'medium', emoji: '🌻', smells: 'Fresh flowers and a little honey. Like walking into a florist.', notes: 'Buttercup, Honeysuckle & Sunflower', v: 41212020457581 },
            { key: 'abundance', name: 'Crisp Citrus Scape', intention: 'Abundance', strength: 'soft', emoji: '🍊', smells: 'Fresh citrus peel and green leaves. Like a clean hotel lobby.', notes: 'Yuzu Leaf, Green Mandarin & Cypress', v: 41212018655341 },
            { key: 'focus', name: 'Chilled Citrus', intention: 'Relaxation & Concentration', strength: 'soft', emoji: '🌿', smells: 'Lavender and eucalyptus. Like a day spa.', notes: 'Chilled Lavender, Eucalyptus & White Citrus', v: 41212021506157 },
            { key: 'ideas', name: 'Honey Nectar', intention: 'Turn Ideas Into Reality', strength: 'medium', emoji: '🍯', smells: 'Warm milk and honey. Like a café on a slow morning.', notes: 'Ginger Milk, White Birch & Eucalyptus Honey', v: 41212021342317 },
            { key: 'energy', name: 'Euphoric Bloom', intention: 'Raise Energy', strength: 'medium', emoji: '🍑', smells: 'White peach and jasmine tea. Fruity and bright, never sugary.', notes: 'Jasmine Tea, White Peach & Sandalwood Crème', v: 41212020752493 },
            { key: 'purify', name: 'Wildwood Mystique', intention: 'Purification', strength: 'bold', emoji: '🌲', smells: 'Pine and juniper. Like a walk in the woods after rain.', notes: 'Huckleberry, Wild Juniper & Mountain Fern', v: 41212021669997 },
            { key: 'midnight', name: 'Midnight Sensation', intention: 'Love Manifestation', strength: 'bold', emoji: '🌙', smells: 'White flowers and soft musk. Like perfume on warm skin.', notes: 'Moonflower, Night Lily & Skin Musk', v: 41212019933293 },
          ];
          const TIERS = [{ n: 1, v: 45784228429933, p: 109.95 }, { n: 2, v: 45784228462701, p: 129.95 }, { n: 3, v: 45784228495469, p: 189.95 }];
          /* copy the owner had removed in dk8 (buy box only — the "Say goodbye…" section heading further down the page stays) */
          const GONE = ['diffusers picked', '$39.95 value', 'We pre-selected', 'Skip, swap, pause', 'first scent bottle is free', 'Fact: 86%', 'candles forever', 'Fill every room within minutes', 'Organic Ingredients'];
          const GONE_SEL = ['#buybox .pick-pill', '#buybox .presel-note', '#buybox .refill-sub', '#buybox .refill-why', '#buybox .plan-fact', '#buybox .order-sum', '#buybox .sub-lede'];
          const checks = [];
          const ck = (id, name, ok, got) => { checks.push({ id, name, ok: !!ok, got }); console.log((ok ? 'PASS' : 'FAIL') + ' ' + id + ' — ' + name + (ok ? '' : ' => ' + JSON.stringify(got))); };
          const UA = 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36';
          const b = await chromium.launch();
          const open = async (mobile) => {
            const ctx = await b.newContext(mobile ? { viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, userAgent: UA } : { viewport: { width: 1366, height: 900 }, deviceScaleFactor: 1 });
            const pg = await ctx.newPage(); const errs = []; pg.on('pageerror', (e) => errs.push(e.message)); pg.on('console', (m) => { if (m.type() === 'error') errs.push('console: ' + m.text().slice(0, 140)); });
            await pg.goto(URL_, { waitUntil: 'domcontentloaded' });
            await pg.waitForSelector('#buybox .picker.e4 .pick', { timeout: 30000 });
            await pg.waitForTimeout(1500);
            return { ctx, pg, errs };
          };
          const tap = (pg, q, i = 0) => pg.evaluate(([q, i]) => { const e = document.querySelectorAll(q)[i]; if (!e) return false; e.scrollIntoView({ block: 'center' }); e.click(); return true; }, [q, i]);
          const cartJs = (pg) => pg.evaluate(async () => { let c; try { c = await (await fetch('/cart.js')).json(); } catch (e) { return { n: null, total: null, items: [], err: String(e).slice(0, 80) }; } return { n: c.item_count, total: c.total_price / 100, items: c.items.map((i) => ({ v: i.variant_id, t: i.product_title, q: i.quantity, price: i.price / 100, line: i.final_line_price / 100, plan: i.selling_plan_allocation ? i.selling_plan_allocation.selling_plan.name : null, disc: (i.line_level_discount_allocations || []).map((d) => d.discount_application.title + ' -' + d.amount / 100) })) }; });
          const state = (pg) => pg.evaluate(({ GONE, GONE_SEL }) => { const tx = (e) => e ? (e.innerText || '').replace(/\s+/g, ' ').trim() : null; const vis = (e) => { const r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight && getComputedStyle(e).visibility !== 'hidden'; }; return {
            tiles: document.querySelectorAll('#buybox .picker.e4 .pick').length,
            on: [...document.querySelectorAll('#buybox .picker .pick.on')].map((e) => tx(e.querySelector('.e4-name'))),
            checked: document.querySelectorAll('#buybox .picker .pick[aria-checked="true"]').length,
            bar: tx(document.querySelector('#buybox .e4-bar')),
            emoji: tx(document.querySelector('#buybox .e4-bar .e4-emoji')),
            barAlign: (() => { const e = document.querySelector('#buybox .e4-bar'); return e ? getComputedStyle(e).textAlign + ' / ' + getComputedStyle(e).justifyContent : null; })(),
            btn: tx(document.querySelector('#buybox .btn.atc')),
            sticky: tx(document.querySelector('.sticky .btn')),
            stickyShown: (() => { const e = document.querySelector('.sticky'); return e ? e.classList.contains('show') && getComputedStyle(e).display !== 'none' : null; })(),
            tierOn: tx(document.querySelector('.fq.dkt.on .fq-days')),
            freqOn: tx(document.querySelector('.fq.on:not(.dkt) .fq-days')),
            nudge: !!document.querySelector('#buybox .picker.nudge'),
            toast: [...document.querySelectorAll('.toast')].map((e) => tx(e)),
            toastVisible: [...document.querySelectorAll('.toast')].some(vis),
            drawerOpen: (() => { const d = document.getElementById('cart-drawer'); return d ? (d.hasAttribute('open') || !!d.open) : null; })(),
            pickerInView: (() => { const e = document.querySelector('#buybox .picker'); if (!e) return null; const r = e.getBoundingClientRect(); return r.top >= -10 && r.bottom <= innerHeight + 10; })(),
            cols: (() => { const e = document.querySelector('#buybox .picker.e4'); return e ? getComputedStyle(e).gridTemplateColumns.split(' ').length : null; })(),
            pickerH: (() => { const e = document.querySelector('#buybox .picker.e4'); return e ? Math.round(e.getBoundingClientRect().height) : null; })(),
            place: (() => { const e = document.querySelector('#buybox .place'); return e ? Math.round(e.getBoundingClientRect().height) : null; })(),
            placeHeadInSide: !!document.querySelector('#buybox .place-side .place-head'),
            atcTop: (() => { const e = document.querySelector('#buybox .btn.atc'); return e ? Math.round(e.getBoundingClientRect().top + scrollY) : null; })(),
            usp: [...document.querySelectorAll('#buybox .usp .usp-tx')].map(tx),
            gone: (() => { const t = (document.querySelector('#buybox') || document.body).innerText; return GONE.filter((g) => t.includes(g)); })(),
            goneSel: GONE_SEL.filter((s) => document.querySelector(s)),
            imgsBad: [...document.querySelectorAll('#buybox img')].filter((i) => !i.complete || i.naturalWidth === 0).length,
          }; }, { GONE, GONE_SEL });
          const run = async (vp) => {
            const mobile = vp === 'phone'; const { ctx, pg, errs } = await open(mobile);
            const cart0 = await cartJs(pg);
            let s = await state(pg);
            ck(`${vp}-mount`, 'buy box mounted with the 7-tile scent picker', s.tiles === 7, s.tiles);
            ck(`${vp}-cols`, mobile ? '4 tiles per row on a phone' : '7 tiles in a row on desktop', s.cols === (mobile ? 4 : 7), s.cols);
            ck(`${vp}-nopre`, 'no scent pre-selected on load', s.on.length === 0 && s.checked === 0, s.on);
            ck(`${vp}-bar0`, 'bar shows "Tap a scent to see what it smells like."', /Tap a scent to see what it smells like/.test(s.bar || ''), s.bar);
            ck(`${vp}-btn0`, 'Add to cart shows the 2-diffuser price on load', s.btn === 'ADD TO CART — $129.95 ➔', s.btn);
            ck(`${vp}-tier0`, '2 Diffusers selected by default', /^2 Diffusers/.test(s.tierOn || ''), s.tierOn);
            ck(`${vp}-freq0`, '30-day refill selected by default', /every 30 days/.test(s.freqOn || ''), s.freqOn);
            ck(`${vp}-usp`, 'tile 2 reads "Replaces room sprays, plug-ins and candles instantly."', s.usp[1] === 'Replaces room sprays, plug-ins and candles instantly.', s.usp);
            ck(`${vp}-gone`, 'removed copy is gone from the buy box (pills, pre-selected banner, refill lines, 86% fact, order summary, old lede)', s.gone.length === 0 && s.goneSel.length === 0, { gone: s.gone, goneSel: s.goneSel });
            ck(`${vp}-place`, '"Where it goes" compact (plan left, title + rooms right, under 200 px tall)', s.placeHeadInSide && s.place && s.place < (mobile ? 200 : 230), { h: s.place, headInSide: s.placeHeadInSide });
            checks.push({ id: `${vp}-info`, name: 'info: picker height / Add to cart offset from the top', ok: true, got: { pickerH: s.pickerH, atcTop: s.atcTop, barAlign: s.barAlign } });
            await tap(pg, '.fq.dkt', 0); await pg.waitForTimeout(350); s = await state(pg);
            ck(`${vp}-tier1`, '1 Diffuser → $109.95', s.btn === 'ADD TO CART — $109.95 ➔', s.btn);
            await tap(pg, '.fq.dkt', 2); await pg.waitForTimeout(350); s = await state(pg);
            ck(`${vp}-tier3`, '3 Diffusers → $189.95', s.btn === 'ADD TO CART — $189.95 ➔', s.btn);
            await tap(pg, '.fq.dkt', 1); await pg.waitForTimeout(350); s = await state(pg);
            ck(`${vp}-tier2`, 'back to 2 Diffusers → $129.95', s.btn === 'ADD TO CART — $129.95 ➔', s.btn);
            /* Add to cart with no scent picked */
            await tap(pg, '#buybox .btn.atc'); await pg.waitForTimeout(900); s = await state(pg);
            await pg.screenshot({ path: `${OUT}/${vp}-noscent-tap.png` }).catch(() => {});
            const cart1 = await cartJs(pg);
            ck(`${vp}-noscent`, 'Add to cart with no scent: picker outlined + toast "Pick your free scent first. It’s included.", nothing added, no drawer', s.nudge && s.toast.some((t) => /Pick your free scent first/.test(t)) && s.toastVisible && cart1.n === cart0.n && !s.drawerOpen, { nudge: s.nudge, toast: s.toast, toastVisible: s.toastVisible, cartN: cart1.n, drawer: s.drawerOpen });
            ck(`${vp}-noscent-scroll`, 'and the picker is scrolled into view', s.pickerInView, s.pickerInView);
            await pg.waitForTimeout(2500);
            /* sticky bar with no scent picked */
            await pg.evaluate(() => { const bb = document.querySelector('#buybox'); window.scrollTo(0, bb.getBoundingClientRect().bottom + scrollY + 700); }); await pg.waitForTimeout(1000); s = await state(pg);
            if (s.stickyShown) {
              ck(`${vp}-sticky-label`, 'sticky bar shows the price', s.sticky === 'ADD TO CART — $129.95 ➔', s.sticky);
              await pg.evaluate(() => document.querySelector('.sticky .btn').click()); await pg.waitForTimeout(900); s = await state(pg); const c = await cartJs(pg);
              await pg.screenshot({ path: `${OUT}/${vp}-sticky-noscent-tap.png` }).catch(() => {});
              ck(`${vp}-sticky-noscent`, 'sticky bar with no scent: scrolls to the picker, outlines it, toast, nothing added', s.nudge && s.toast.some((t) => /Pick your free scent first/.test(t)) && s.pickerInView && c.n === cart0.n && !s.drawerOpen, { nudge: s.nudge, toast: s.toast, toastVisible: s.toastVisible, inView: s.pickerInView, cartN: c.n });
              await pg.waitForTimeout(2500);
            } else ck(`${vp}-sticky-noscent`, 'sticky bar appears after scrolling past the buy box', false, s.stickyShown);
            /* every scent */
            for (let i = 0; i < 7; i++) {
              const f = SCENTS[i]; await tap(pg, '#buybox .picker.e4 .pick', i); await pg.waitForTimeout(300); s = await state(pg);
              const bar = s.bar || '';
              const ok = s.on.length === 1 && s.on[0] === f.name && s.checked === 1 && bar.includes(f.name + ' · ' + f.intention) && bar.toLowerCase().includes(f.strength) && bar.includes('Smells like: ' + f.smells) && bar.includes('Notes: ' + f.notes) && s.emoji === f.emoji;
              ck(`${vp}-scent-${i + 1}`, `tile ${i + 1} ${f.name}: selected alone, bar = name · intention · strength, smells like, notes`, ok, { on: s.on, checked: s.checked, bar, emoji: s.emoji });
              if (i === 5) { const el = await pg.$('#buybox .e4-bar'); if (el) await el.screenshot({ path: `${OUT}/${vp}-bar-wildwood.png` }).catch(() => {}); }
            }
            await tap(pg, '#buybox .picker.e4 .pick', 2); await pg.waitForTimeout(250); await tap(pg, '#buybox .picker.e4 .pick', 0); await pg.waitForTimeout(300); s = await state(pg);
            ck(`${vp}-swap`, 'tapping another scent swaps it (one free scent, single select)', s.on.length === 1 && s.on[0] === SCENTS[0].name, s.on);
            ck(`${vp}-btn-scent`, 'Add to cart still shows the price with a scent picked', s.btn === 'ADD TO CART — $129.95 ➔', s.btn);
            ck(`${vp}-imgs`, 'all buy box images loaded (kit photos, 7 scent tiles, plan)', s.imgsBad === 0, s.imgsBad);
            const bb = await pg.$('#buybox'); if (bb) await bb.screenshot({ path: `${OUT}/${vp}-buybox.png` }).catch(() => {});
            ck(`${vp}-errors`, 'no JavaScript or console errors', errs.length === 0, errs.slice(0, 5));
            await ctx.close();
          };
          const cartFlow = async (name, acts, exp) => {
            const { ctx, pg, errs } = await open(true);
            for (const [t, i] of acts) { if (t === 'tier') await tap(pg, '.fq.dkt', i); else if (t === 'scent') await tap(pg, '#buybox .picker.e4 .pick', i); else if (t === 'one') await tap(pg, '.rf2 .fq-one'); else if (t === 'freq') await tap(pg, '.fq:not(.dkt)', i); await pg.waitForTimeout(400); }
            const before = await state(pg);
            await tap(pg, '#buybox .btn.atc'); await pg.waitForTimeout(4500);
            const s = await state(pg); const c = await cartJs(pg);
            const dtext = await pg.evaluate(() => { const d = document.getElementById('cart-drawer'); return d ? (d.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 260) : null; });
            await pg.screenshot({ path: `${OUT}/cart-${name}.png` }).catch(() => {});
            const match = c.items.length === exp.lines.length && c.total === exp.total && exp.lines.every((e) => c.items.some((l) => l.v === e.v && l.q === e.q && l.price === e.price && l.line === e.line && l.plan === e.plan));
            ck(`cart-${name}`, exp.name, before.btn === exp.btn && s.drawerOpen && pg.url().startsWith(URL_) && match && errs.length === 0, { btn: before.btn, landed: pg.url(), drawer: s.drawerOpen, total: c.total, lines: c.items, drawerText: dtext, errs });
            await ctx.close();
          };
          await run('phone');
          await run('desktop');
          await cartFlow('sub30-2d', [['scent', 2]], { btn: 'ADD TO CART — $129.95 ➔', total: 129.95, name: 'cart: 2 diffusers + Chilled Citrus on the 30-day refill → drawer opens, kit $129.95 + scent $0.00 on "Every 30 days", total $129.95', lines: [{ v: TIERS[1].v, q: 1, price: 129.95, line: 129.95, plan: null }, { v: SCENTS[2].v, q: 1, price: 0, line: 0, plan: 'Every 30 days' }] });
          await cartFlow('one-3d', [['tier', 2], ['scent', 5], ['one']], { btn: 'ADD TO CART — $189.95 ➔', total: 189.95, name: 'cart: 3 diffusers + Wildwood Mystique, no subscription → drawer opens, kit $189.95 + scent $39.95 made free by the kits discount, total $189.95', lines: [{ v: TIERS[2].v, q: 1, price: 189.95, line: 189.95, plan: null }, { v: SCENTS[5].v, q: 1, price: 39.95, line: 0, plan: null }] });
          await b.close();
          const pass = checks.filter((c) => c.ok).length;
          const md = [`# Kits page QA ${stamp}`, '', `${URL_}`, '', `${pass}/${checks.length} checks passed.`, '', '| # | check | result | details |', '|---|---|---|---|', ...checks.map((c) => `| ${c.id} | ${c.name} | ${c.ok ? 'PASS' : 'FAIL'} | ${JSON.stringify(c.got).replace(/\|/g, '\\|').slice(0, 400)} |`)].join('\n') + '\n';
          fs.writeFileSync(`${OUT}/report.md`, md); fs.writeFileSync(`${OUT}/report.json`, JSON.stringify({ stamp, url: URL_, pass, total: checks.length, checks }, null, 1));
          console.log(`\n${pass}/${checks.length} checks passed → ${OUT}/report.md`);
          EOF
          node qa.mjs
      - name: Commit
        if: always()
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          git commit -m "qa-kits: live kits page QA" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
