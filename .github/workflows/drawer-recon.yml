name: drawer-recon
# run 180 — verify v3s2: hero video (src set post-idle, muted/playsinline attrs, playing in Chromium w/ codecs), tier price 21.6px, note 15.5px; also WebKit (iPhone 14) emulation for the video
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium webkit
      - name: Live verify
        run: |
          mkdir -p lp-factory/pages/kits-lp/live
          cat > r180.mjs <<'EOF2'
          import { chromium, webkit, devices } from 'playwright';
          const check = async (name, browser, ctxOpts) => {
            const b = await browser.launch();
            const ctx = await b.newContext(ctxOpts);
            const pg = await ctx.newPage();
            const errs = []; pg.on('pageerror', e => errs.push(e.message.slice(0, 160)));
            await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await pg.waitForSelector('.tiers', { timeout: 60000 });
            const t1 = await pg.evaluate(() => { const v = document.querySelector('.gal video'); return { srcEarly: v ? v.getAttribute('src') : 'novideo' }; });
            await pg.waitForTimeout(7000);
            const st = await pg.evaluate(() => { const v = document.querySelector('.gal video'); return { key: document.documentElement.innerHTML.includes('v3s2-7f512c5'), src: v ? (v.getAttribute('src') || '').slice(-32) : null, muted: v && v.hasAttribute('muted'), pi: v && v.hasAttribute('playsinline'), paused: v && v.paused, rs: v && v.readyState, t: v && Math.round(v.currentTime * 10) / 10, price: getComputedStyle(document.querySelector('.tier-price b')).fontSize, note: getComputedStyle(document.querySelector('.tier-note p')).fontSize, secs: document.querySelectorAll('#root > div[id^=sec-]').length }; });
            console.log(name + ' ' + JSON.stringify({ ...t1, ...st, errs }));
            await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3s2-' + name + '.png' });
            await b.close();
          };
          await check('chromium', chromium, { viewport: { width: 390, height: 844 } });
          await check('webkit-iphone', webkit, { ...devices['iPhone 14'] });
          EOF2
          node r180.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/v3s2-*.png
          git commit -m "r180: v3s2 live screenshots" || exit 0
          git push
