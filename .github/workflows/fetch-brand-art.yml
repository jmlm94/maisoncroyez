name: fetch-brand-art
# Downloads generated pictures for the rebrand into the folder named in DEST (board/img for the board, mockups/img for the pack mockups) as WebP
# (the session container cannot reach the image host). One "name url" pair per line in LIST. Edit the list and push to run. [run 1: the nine first pictures] [run 2: woman-silver, added after the Hanni reference] [run 3: the first five pack mockups, into mockups/img]
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/fetch-brand-art.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEST: lp-factory/brand/rebrand-2026/mockups/img
      LIST: |
        family https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261115_221107_d1a0410a-ce9a-433b-8470-8387652be7bd.png
        soak https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261115_221108_b82209a8-f825-4397-969b-e1fe3620f3ba.png
        steamers https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261115_221109_19acb2e0-5579-40f4-9e90-78978d26dd41.png
        spray https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261115_221109_b15b2dc7-29a7-40a2-b525-4aad68785e9f.png
        dusk https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261115_221107_8dd99b21-c869-44c9-9249-f1c8f1da4058.png
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch and convert
        run: |
          pip install -q pillow
          D="$DEST"
          mkdir -p "$D" /tmp/raw
          echo "$LIST" | while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL -A "Mozilla/5.0" --max-time 120 -o "/tmp/raw/$name.png" -w "%{http_code}" "$url" || true)
            echo "$name http $code $(wc -c < "/tmp/raw/$name.png" 2>/dev/null) bytes $(file -b "/tmp/raw/$name.png" | cut -c1-60)"
          done
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          D=os.environ['DEST']
          for f in sorted(glob.glob('/tmp/raw/*.png')):
              try:
                  im=Image.open(f).convert('RGB')
              except Exception as e:
                  print('skip',f,e); continue
              im.thumbnail((2000,2000), Image.LANCZOS)
              out=os.path.join(D, os.path.basename(f)[:-4]+'.webp')
              im.save(out,'WEBP',quality=84,method=6)
              print(out, im.size, os.path.getsize(out))
          PY
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          git commit -m "rebrand board: fetched the generated reference pictures" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && break || sleep 3; done
