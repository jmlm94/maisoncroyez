name: drawer-recon
# run 83 — homepage buttons -> build-your-kit-2: origin gate + live DOM probe
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-home-app.js'
          for i in $(seq 1 24); do
            K="oc$RANDOM$RANDOM"
            BODY=$(curl -sS "$B?v=$K")
            N2=$(printf %s "$BODY" | grep -o "build-your-kit-2" | wc -l)
            FD=$(printf %s "$BODY" | grep -o "pages/free-diffuser" | wc -l)
            echo "try$i v2links=$N2 freediff=$FD len=${#BODY}"
            if [ "$N2" -ge 2 ] && [ "$FD" -eq 0 ]; then echo "ORIGIN_FRESH"; break; fi
            sleep 10
          done
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:412,height:823}});
          const errs=[];p.on('pageerror',e=>errs.push(String(e).slice(0,100)));
          await p.goto('https://maisoncroyez.com/?utm_campaign=hm83',{waitUntil:'load',timeout:90000});
          await p.waitForTimeout(6000);
          const r=await p.evaluate(()=>{
            const out=[];
            document.querySelectorAll('a[href]').forEach(a=>{
              const t=(a.textContent||'').trim().replace(/\s+/g,' ');
              if(/claim/i.test(t)) out.push({label:t.slice(0,40),href:a.getAttribute('href')});
            });
            return out;});
          console.log('HOME83 '+JSON.stringify({buttons:r,errs}));
          await b.close();})();
          EOS
