name: drawer-recon
# run 176 — live cart probe: 3 diffusers + 3 included scents via the page ATC (expect 12995, 3 scent lines at 0)
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Live verify
        run: |
          mkdir -p lp-factory/pages/kits-lp/live
          cat > r176.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 } });
          const pg = await ctx.newPage();
          const errs = [];
          pg.on('pageerror', e => errs.push(e.message.slice(0, 200)));
          await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await pg.waitForSelector('.tiers', { timeout: 60000 });
          await pg.waitForTimeout(4000);
          const readCart = () => pg.evaluate(async () => { const r = await fetch('/cart.js', { headers: { 'Accept': 'application/json' } }); const t = await r.text(); try { const c = JSON.parse(t); return { status: r.status, total: c.total_price, disc: c.total_discount, lines: c.items.map(i => ({ v: i.variant_id, q: i.quantity, plan: i.selling_plan_allocation ? i.selling_plan_allocation.selling_plan.id : null, price: i.price, final_line: i.final_line_price, d: (i.line_level_discount_allocations || []).map(d => [d.discount_application.title, d.amount]) })) }; } catch (e) { return { status: r.status, body: t.slice(0, 100) }; } });
          await pg.locator('.tier').nth(2).click(); await pg.waitForTimeout(1000);
          const t3 = await pg.evaluate(() => ({ titles: [...document.querySelectorAll('.buybox .picker-title')].map(e => e.textContent.trim()), picked: document.querySelectorAll('.pick.compact.on').length, btn: (document.querySelector('.btn.atc') || {}).innerText, france: document.body.innerText.includes('France') }));
          console.log('T3 ' + JSON.stringify(t3));
          await pg.locator('.btn.atc').scrollIntoViewIfNeeded(); await pg.waitForTimeout(2500);
          await pg.locator('.btn.atc').click(); await pg.waitForTimeout(8000);
          console.log('CART 3D one-time ' + JSON.stringify(await readCart()));
          await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3b-live-cart-3d.png' });
          await pg.evaluate(() => fetch('/cart/clear.js', { method: 'POST' })).catch(() => {});
          console.log('ERRORS ' + JSON.stringify(errs.slice(0, 6)));
          await b.close();
          EOF2
          node r176.mjs
      - name: Commit screenshots
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/v3b-live-*.png
          git commit -m "r176: 3-diffuser live cart screenshot" || exit 0
          git push
