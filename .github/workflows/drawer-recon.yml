name: drawer-recon
# run 93 — origin gate: verify new mc-kits files on CDN
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          R=$RANDOM$RANDOM
          curl -sSL "$B/mc-kits-app.js?v=oc$R" -o /tmp/app.js
          curl -sSL "$B/mc-kits.css?v=oc$R" -o /tmp/app.css
          echo "APP bytes: $(wc -c < /tmp/app.js)"
          echo "CSS bytes: $(wc -c < /tmp/app.css)"
          echo "m_title: $(grep -o 'Six-Month Transformation Program' /tmp/app.js | wc -l)"
          echo "m_ritualvar: $(grep -o '45728132202605' /tmp/app.js | wc -l)"
          echo "m_fbq: $(grep -o 'AddToCart' /tmp/app.js | wc -l)"
          echo "m_prelude: $(grep -o 'mc-kits-root' /tmp/app.js | wc -l)"
          echo "m_plan: $(grep -o 'Renew & Save (15% off next refill)' /tmp/app.js | wc -l)"
          echo "m_css1: $(grep -o 'gm-oneline' /tmp/app.css | wc -l)"
          echo "m_css2: $(grep -o 'kit-gift' /tmp/app.css | wc -l)"
          echo "m_cssfont: $(grep -o 'mc-lp-f-unna-700' /tmp/app.css | wc -l)"
