name: drawer-recon
# run 128 — gate tier-grid files
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          for i in 1 2 3 4 5 6 7 8; do
            K="og$RANDOM$RANDOM"
            curl -sSL "$B/mc-6mp-app.js?v=$K" -o a.js
            curl -sSL "$B/mc-6mp.css?v=$K" -o c.css
            AG=$(grep -o -F 'kg-card' a.js | wc -l)
            AB=$(grep -o -F 'SUPPLY PER DIFFUSER' a.js | wc -l)
            OLDROW=$(grep -o -F 'kit-row' a.js | wc -l)
            CG=$(grep -o -F '.kitgrid' c.css | wc -l)
            echo "R128 try$i kgCard=$AG banner=$AB oldRow=$OLDROW cssGrid=$CG appBytes=$(wc -c < a.js) cssBytes=$(wc -c < c.css)"
            if [ "$AG" -ge 1 ] && [ "$AB" -ge 1 ] && [ "$CG" -ge 1 ]; then echo "R128 PROPAGATED"; exit 0; fi
            sleep 10
          done
          echo "R128 NOT PROPAGATED"
