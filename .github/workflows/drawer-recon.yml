name: drawer-recon
# run 84 — post-flip homepage verify: CTAs -> build-your-kit-2 + copy sweep live
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:412,height:823}});
          const errs=[];p.on('pageerror',e=>errs.push(String(e).slice(0,100)));
          await p.goto('https://maisoncroyez.com/?utm_campaign=hm84',{waitUntil:'load',timeout:90000});
          await p.waitForTimeout(6000);
          const r=await p.evaluate(()=>{
            const btns=[];
            document.querySelectorAll('a[href]').forEach(a=>{
              const t=(a.textContent||'').trim().replace(/\s+/g,' ');
              if(/claim|build my kit/i.test(t)) btns.push({label:t.slice(0,40),href:a.getAttribute('href')});
            });
            const body=document.body.textContent;
            return {btns,
              freeDiffuserMentions:(body.match(/free\s*diffuser/gi)||[]).length,
              freeScentLine:body.indexOf('A FREE scent with every diffuser you pick')>-1,
              chip:body.indexOf('Free scents included')>-1,
              trust:body.indexOf('30-day money-back')>-1&&body.indexOf('Cancel anytime')===-1,
              sevsub:body.indexOf('One payment, no subscription, everything in the box is yours forever')>-1};});
          console.log('HOME84 '+JSON.stringify({r,errs}));
          await b.close();})();
          EOS
