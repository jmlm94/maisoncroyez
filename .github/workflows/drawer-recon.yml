name: drawer-recon
# run 197 — verify v3s18 live: zero 45-day text anywhere (load + after picking 2 scents, incl. "from day 45"), 30-day copy present, 7 x 100ml badges
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Verify
        run: |
          mkdir -p lp-factory/pages/kits-lp/live
          cat > r197.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const KEY = process.env.KEY;
          const b = await chromium.launch();
          const out = {};
          for (const [name, vp] of [['mobile', { width: 390, height: 844 }], ['desktop', { width: 1366, height: 900 }]]) {
            const pg = await (await b.newContext({ viewport: vp })).newPage();
            await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await pg.waitForSelector('.pick.compact', { timeout: 60000 }); await pg.waitForTimeout(3500);
            // open every FAQ item so its text is in the DOM/innerText
            for (const q of await pg.locator('.faq-q, .faq summary, details summary, [class*=faq] button').all()) { try { await q.click({ timeout: 800 }); } catch (e) {} }
            await pg.waitForTimeout(400);
            out[name] = await pg.evaluate((k) => {
              const txt = document.getElementById('root').innerText;
              const ctx = (re) => [...txt.matchAll(re)].map(m => txt.slice(Math.max(0, m.index - 50), m.index + 40).replace(/\s+/g, ' '));
              return { key: document.documentElement.innerHTML.includes(k), src45: (document.getElementById('root').innerHTML.match(/45[ -]day|every 45|in 45 days/gi) || []).length, ctx45: ctx(/45[ -]day|every 45|in 45 days/gi), ctx30: ctx(/30[ -]day|every 30|in 30 days/gi), badges: document.querySelectorAll('.pick-vol').length, picks: document.querySelectorAll('.pick.compact').length, rows: [...document.querySelectorAll('.pick-introw')].map(r => { const i = r.querySelector('.pick-int').getBoundingClientRect(), m = r.querySelector('.pick-vol').getBoundingClientRect(); return { int: r.querySelector('.pick-int').textContent, badgeText: r.querySelector('.pick-vol').textContent, h: Math.round(m.height), gap: Math.round(m.left - i.right), lastLine: Math.abs(i.bottom - m.bottom) < 10 }; }), badgeCss: (() => { const e = document.querySelector('.pick-vol'); const c = getComputedStyle(e); return { display: c.display, fontSize: c.fontSize, border: c.borderTopWidth, radius: c.borderTopLeftRadius }; })() };
            }, KEY);
            await pg.locator('.pick.compact').first().scrollIntoViewIfNeeded(); await pg.waitForTimeout(400);
            await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3s18-picker-' + name + '.png' });
            // pick 2 scents on the default (2D) tier to reveal step 3 copy
            const cards = pg.locator('.pick.compact'); await cards.nth(0).click(); await pg.waitForTimeout(300); await cards.nth(1).click(); await pg.waitForTimeout(800);
            const s3 = pg.locator('.plan-card, .plansel-title, .decline').first();
            try { await s3.scrollIntoViewIfNeeded(); } catch (e) {}
            await pg.waitForTimeout(400);
            await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3s18-step3-' + name + '.png' });
            out[name].after45 = await pg.evaluate(() => { const t = document.getElementById('root').innerText; return [...t.matchAll(/45[ -]day|every 45|in 45 days|Day 45|Day 38|day 45/gi)].map(m => t.slice(Math.max(0, m.index - 50), m.index + 40).replace(/\s+/g, ' ')); }); out[name].after30 = await pg.evaluate(() => { const t = document.getElementById('root').innerText; return [...t.matchAll(/30[ -]day|every 30|in 30 days|Day 30|Day 23/gi)].map(m => t.slice(Math.max(0, m.index - 50), m.index + 40).replace(/\s+/g, ' ')); });
            await pg.context().close();
          }
          console.log('V3S16 ' + JSON.stringify(out, null, 1));
          await b.close();
          EOF2
          KEY="${KEY}" node r197.mjs
        env:
          KEY: v3s18-4659d07
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/
          git commit -m "r197: v3s18 picker/step3 screenshots" || exit 0
          git pull --rebase -q origin claude/maison-diffuser-perf-fixes-f45ggl || true
          git push
