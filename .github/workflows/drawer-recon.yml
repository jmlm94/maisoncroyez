name: drawer-recon
# run 57 — ground truth: served css bytes + desktop screenshot + computed styles + HTML inline-block check
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files'
          D=lp-factory/pages/kit-builder/verify
          mkdir -p $D
          # 1. served css at current kb9/kb10 hour keys + random key
          for K in "kb9-$(date -u +%Y%m%d%H)" "kb10-$(date -u +%Y%m%d%H)" "oc$RANDOM$RANDOM"; do
            curl -fsSL "$B/mc-kit.css?v=$K" -o "$D/served-css-$K.css" || true
            echo "$K: $(wc -c < $D/served-css-$K.css) bytes, guar3margin=$(grep -c '26px 0 8px' $D/served-css-$K.css || true), mwho=$(grep -c 'mwho' $D/served-css-$K.css || true)"
          done
          # 2. page HTML: inline spacing block present? which key?
          H=$(curl -fsSL 'https://maisoncroyez.com/pages/build-your-kit')
          echo "$H" | grep -o "kb[0-9]*-" | head -1 > $D/html-key.txt
          echo "$H" | grep -c "kb9 spacing (inline" >> $D/html-key.txt || true
          cat $D/html-key.txt
          # 3. desktop browser probe + screenshot
          node - <<'EOS' > $D/desktop-probe.txt
          (async()=>{
          const { chromium } = require('playwright');
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:1280,height:900} });
          await page.goto('https://maisoncroyez.com/pages/build-your-kit',{waitUntil:'load',timeout:90000});
          await page.waitForTimeout(7000);
          const t = await page.evaluate(()=>{
            const gs=(s,p)=>{const e=document.querySelector(s);return e?getComputedStyle(e)[p]:null};
            const sheets=[...document.styleSheets].map(s=>{try{return {href:(s.href||'inline').slice(-60), rules:s.cssRules.length}}catch(e){return {href:(s.href||'inline').slice(-60), rules:'blocked'}}});
            return {
              key:(document.querySelector('link[href*="mc-kit.css"]')||{}).href,
              guar3MT: gs('.guar3','marginTop'), mwhoDisplay: gs('.mwho','display'),
              reservedMB: gs('.reserved','marginBottom'), kbgalMB: gs('.kbgal','marginBottom'),
              minirevBorder: gs('.minirev','borderTopWidth'),
              sheets
            };
          });
          console.log(JSON.stringify(t,null,1));
          window.sc = 1;
          await page.evaluate(()=>{document.querySelectorAll('.plan')[2]?.click(); window.go&&window.go(3);});
          await page.waitForTimeout(800);
          await page.screenshot({path:'lp-factory/pages/kit-builder/verify/desktop-s3.png', fullPage:false});
          await b.close();
          })();
          EOS
          cat $D/desktop-probe.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kit-builder/verify
          git commit -m "kb9 ground-truth diagnostics r57 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
