name: drawer-recon
# run 90 — fetch brand woff2 fonts for artifact embed
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit
        run: |
          mkdir -p lp-factory/pages/kits-lp/fonts
          for f in unna-400 unna-400i unna-700 unna-700i outfit-400 outfit-700 bvp-400 bvp-500 bvp-600; do
            curl -sSL "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-lp-f-$f.woff2?v=1784231284" -o /tmp/$f.woff2
            file /tmp/$f.woff2
            base64 -w0 /tmp/$f.woff2 > lp-factory/pages/kits-lp/fonts/$f.b64
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/fonts
          git commit -m "recon r90: brand fonts base64 for artifact embed"
          git push
