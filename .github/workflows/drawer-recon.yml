name: drawer-recon
# run 86 — sitewide crawl: every link/button to build-your-kit (v1) and build-your-kit-2
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl
        run: |
          npm i -s playwright@1.56.1 fast-xml-parser@4 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const { XMLParser } = require('fast-xml-parser');
          const parser=new XMLParser();
          async function fetchText(u){const r=await fetch(u);return r.text();}
          // collect URLs from sitemaps
          const root=parser.parse(await fetchText('https://maisoncroyez.com/sitemap.xml'));
          const maps=[].concat(root.sitemapindex?.sitemap||[]).map(s=>s.loc);
          let urls=[];
          for(const m of maps){
            const x=parser.parse(await fetchText(m));
            const us=[].concat(x.urlset?.url||[]).map(u=>u.loc).filter(Boolean);
            urls=urls.concat(us);
          }
          const pages=urls.filter(u=>/\/pages\//.test(u));
          const colls=urls.filter(u=>/\/collections\//.test(u));
          const blogs=urls.filter(u=>/\/blogs\//.test(u)).slice(0,10);
          const prods=urls.filter(u=>/\/products\//.test(u)).slice(0,20);
          const targets=['https://maisoncroyez.com/'].concat(pages,colls,blogs,prods);
          console.log('CRAWL_SET pages='+pages.length+' colls='+colls.length+' blogs='+blogs.length+' prods(sampled)='+prods.length+' total='+targets.length);
          const b=await chromium.launch();const c=await b.newContext({viewport:{width:412,height:900}});
          const p=await c.newPage();
          const hits=[];
          for(const u of targets){
            try{
              await p.goto(u+(u.includes('?')?'&':'?')+'cr86=1',{waitUntil:'load',timeout:45000});
              await p.waitForTimeout(3500);
              const found=await p.evaluate(()=>{
                const out=[];
                document.querySelectorAll('a[href]').forEach(a=>{
                  const h=a.getAttribute('href')||'';
                  if(h.indexOf('build-your-kit')>-1){
                    const cs=getComputedStyle(a);
                    out.push({label:(a.textContent||'').trim().replace(/\s+/g,' ').slice(0,50),
                      href:h.slice(0,90),
                      vis:cs.display!=='none'&&cs.visibility!=='hidden',
                      where:(a.closest('.shopify-section')||{}).id||(a.closest('#root')?'app-root':'')});
                  }});
                // also raw string scan for JS-driven navigations
                const raw=document.documentElement.innerHTML;
                const jsNav=(raw.match(/(location|window\.open)[^;{]{0,40}build-your-kit(?!-2)/g)||[]).length;
                return {out,jsNav};});
              for(const f of found.out) hits.push(Object.assign({page:u.replace('https://maisoncroyez.com','')},f));
              if(found.jsNav) hits.push({page:u.replace('https://maisoncroyez.com',''),label:'[JS navigation]',href:'build-your-kit (in script)',vis:true,where:'script'});
            }catch(e){console.log('SKIP '+u+' '+String(e).slice(0,60));}
          }
          const v1=hits.filter(h=>!/build-your-kit-2/.test(h.href));
          const v2=hits.filter(h=>/build-your-kit-2/.test(h.href));
          console.log('V1LINKS '+JSON.stringify(v1,null,1));
          console.log('V2LINKS '+JSON.stringify(v2,null,1));
          await b.close();})();
          EOS
