name: drawer-recon
# run 219 — FULL FUNNEL QA after v3s25 (86% stat on step 3, per-day cost line). 2D/3D × plan/one-time. Discount check now = subtotal equals total.
#           2D phone, 3D desktop, 2D desktop, 1D phone. Real carts, real checkout page, no order placed.
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Funnel
        run: |
          mkdir -p lp-factory/pages/kits-lp/recon/r219
          cat > r219.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const OUT = 'lp-factory/pages/kits-lp/recon/r219/';
          const URL = 'https://maisoncroyez.com/pages/six-month-program';
          const b = await chromium.launch();
          const R = []; const ok = (n, c, i = '') => R.push({ n, c: !!c, i: String(i).replace(/\s+/g, ' ').slice(0, 240) });
          const PATHS = [
            { id: '2D-phone-plan', tier: 2, picks: [0, 6], total: 89.95, scents: 2, desktop: false },
            { id: '2D-desktop-onetime', tier: 2, picks: [3, 5], total: 189.85, planTotal: 89.95, scents: 2, desktop: true, one: true },
            { id: '3D-desktop-plan', tier: 3, picks: [1, 2, 4], total: 139.95, scents: 3, desktop: true },
            { id: '3D-phone-onetime', tier: 3, picks: [0, 4, 6], total: 289.80, planTotal: 139.95, scents: 3, desktop: false, one: true },
          ];
          for (const P of PATHS) {
            const vp = P.desktop ? { width: 1366, height: 900 } : { width: 390, height: 844 };
            const ctx = await b.newContext({ viewport: vp, deviceScaleFactor: P.desktop ? 1 : 2 }); const pg = await ctx.newPage();
            const errs = []; pg.on('pageerror', (e) => errs.push(e.message));
            const net = []; pg.on('response', (r) => { if (/\/cart(\/add)?\.js|\/cart\?section/.test(r.url())) net.push(r.request().method() + ' ' + r.url().replace(/^https?:\/\/[^/]+/, '').slice(0, 60) + ' -> ' + r.status()); });
            const T = async (s) => (await pg.locator(s).first().innerText()).replace(/\s+/g, ' ').trim();
            try {
              const t0 = Date.now();
              await pg.goto(URL, { waitUntil: 'domcontentloaded', timeout: 90000 });
              await pg.waitForSelector('#buybox .tiers', { timeout: 60000 }); const tBuy = Date.now() - t0; await pg.waitForTimeout(2000);
              const key = await pg.evaluate(() => { const s = [...document.scripts].find((x) => /mc-v3-app\.js/.test(x.src)); return s ? s.src.split('v=')[1] : 'none'; });
              ok(`${P.id} page version v3s25, buy box in ${tBuy}ms`, /v3s25/.test(key), key);
              ok(`${P.id} no overflow s1`, await pg.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1));
              ok(`${P.id} kits + prices`, /79\.95/.test(await T('#buybox .tier:nth-child(1)')) && /89\.95/.test(await T('#buybox .tier:nth-child(2)')) && /139\.95/.test(await T('#buybox .tier:nth-child(3)')));
              await pg.click(`#buybox .tier:nth-child(${P.tier})`); await pg.waitForTimeout(300);
              if (P.tier === 1) {
                ok(`${P.id} step-1 button = add to cart $79.95`, /ADD TO CART — \$79\.95/.test(await T('#buybox .step-next')), await T('#buybox .step-next'));
                await pg.evaluate(() => document.querySelector('#buybox .step-next').scrollIntoView({ block: 'center' })); await pg.locator('#buybox .step-next').click();
              } else {
                ok(`${P.id} step-1 button = pick scents + offer line`, /PICK YOUR FREE SCENTS/i.test(await T('#buybox .step-next')) && /4[24]% OFF/.test(await T('#buybox .step-next')));
                await pg.click('#buybox .step-next'); await pg.waitForTimeout(500);
                ok(`${P.id} step 2 asks ${P.scents}, long-form hidden, NO gift note`, new RegExp(`Pick your ${P.scents} included`).test(await T('#buybox .step-title')) && (await pg.$$eval('[id^=sec-]', (a) => a.length)) === 1 && !(await pg.$('#buybox .gift-obj')) && !/mystery gift/i.test(await T('#buybox')));
                const btnBefore = await T('#buybox .navrow .btn.atc');
                const c = pg.locator('#buybox .pick.compact');
                for (const k of P.picks) { if ((await c.nth(k).locator('.pick-qty b').innerText()) !== '0') await c.nth(k).locator('.pick-qty button:last-child').click(); else await c.nth(k).click(); await pg.waitForTimeout(150); }
                ok(`${P.id} ${P.scents}/${P.scents} chosen, button unlocks`, new RegExp(`${P.scents}/${P.scents}`).test(await T('#buybox .pick-count')) && /PICK/i.test(btnBefore) && /REVIEW MY KIT/i.test(await T('#buybox .navrow .btn.atc')), await T('#buybox .pick-count'));
                ok(`${P.id} no overflow s2`, await pg.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1));
                await pg.click('#buybox .navrow .btn.atc'); await pg.waitForTimeout(600);
                ok(`${P.id} review total + saving`, new RegExp(`You only pay: \\$${String(P.planTotal || P.total).replace('.', '\\.')}`).test(await T('#buybox .kr-total')) && /saving \$(170|250) today!/.test(await T('#buybox .kr-save')), (await T('#buybox .kr-total')) + ' | ' + (await T('#buybox .kr-save')));
                const plan = await pg.evaluate(() => ({ old: document.querySelectorAll('#buybox .decline, #buybox .modes, #buybox .mode, #buybox .plan-perks, #buybox .gift-obj').length, card: !!document.querySelector('#buybox .plan-card.plan-v1'), checked: (document.querySelector('#buybox .plan-card.plan-v1') || {}).getAttribute ? document.querySelector('#buybox .plan-card.plan-v1').getAttribute('aria-checked') : null, label: (document.querySelector('#buybox .plan-opt-l') || {}).innerText || '', q: (document.querySelector('#buybox .plan-q') || {}).innerText || '', why: [...document.querySelectorAll('#buybox .plan-why')].map((e) => e.innerText).join(' | '), one: (document.querySelector('#buybox .onetime') || {}).innerText || '', oneOn: !!document.querySelector('#buybox .onetime.on') }));
                const oneTotal = (P.one ? P.total : (P.planTotal || P.total) + P.scents * 49.95).toFixed(2);
                ok(`${P.id} plan card: selectable, owner copy, one-time row $${oneTotal}`, plan.old === 0 && plan.card && plan.checked === 'true' && /Scents auto-refill every 30 days/.test(plan.label) && new RegExp(`This is how we fit \\$(260|390) of value into \\$${String(P.planTotal || P.total).replace('.', '\\.')}:`).test(plan.q) && /86% stay after 6\+ months/.test(plan.why) && /\$1\.33 a day per room\. Candles run about \$6\.85 a day/.test(plan.why) && new RegExp(`Every 30 days, ${P.scents} fresh scents`).test(plan.why) && /Pause, swap and cancel anytime/.test(plan.why) && /we pay for the return, you.re free/.test(plan.why) && /Don.t want refills\?/.test(plan.one) && plan.one.includes('$' + oneTotal) && !plan.oneOn, JSON.stringify(plan).slice(0, 400));
                if (P.one) {
                  await pg.click('#buybox .onetime'); await pg.waitForTimeout(400);
                  const after = await pg.evaluate(() => ({ oneOn: !!document.querySelector('#buybox .onetime.on'), planChecked: document.querySelector('#buybox .plan-card.plan-v1').getAttribute('aria-checked'), total: document.querySelector('#buybox .kr-total').innerText, rows: [...document.querySelectorAll('#buybox .kr-row .kr-pr')].map((e) => e.innerText.replace(/\s+/g, ' ').trim()), save: (document.querySelector('#buybox .kr-save') || {}).innerText || '', btn: document.querySelector('#buybox .btn.atc').innerText.replace(/\s+/g, ' ') }));
                  ok(`${P.id} one-time selected: total $${P.total}, scents at $49.95, button + one-time line`, after.oneOn && after.planChecked === 'false' && after.total.includes('$' + P.total) && after.rows.filter((r) => r === '$49.95').length === P.scents && new RegExp(`ADD TO CART — \\$${String(P.total).replace('.', '\\.')}`).test(after.btn) && /ONE-TIME PAYMENT/.test(after.btn) && /saving \$(70|100)/.test(after.save), JSON.stringify(after).slice(0, 300));
                }
                ok(`${P.id} carousel 6 CDN photos + 5 FAQ`, await pg.evaluate(() => [...document.querySelectorAll('#buybox .rv6-card img')].length === 6 && document.querySelectorAll('#buybox .acc.faq .qa').length === 5));
                ok(`${P.id} ATC button + offer line`, new RegExp(`ADD TO CART — \\$${String(P.total).replace('.', '\\.')}`).test(await T('#buybox .btn.atc')) && (P.one ? /ONE-TIME PAYMENT/ : /4[24]% OFF/).test(await T('#buybox .btn.atc')));
                ok(`${P.id} no overflow s3`, await pg.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1));
                await pg.evaluate(() => document.querySelector('#buybox .btn.atc').scrollIntoView({ block: 'center' })); await pg.locator('#buybox .btn.atc').click();
              }
              await pg.waitForTimeout(5000);
              const dr = await pg.evaluate(() => { const d = document.getElementById('cart-drawer'); if (!d) return null; return { lines: [...d.querySelectorAll('.line-item')].map((li) => ({ t: ((li.querySelector('a.bold') || {}).textContent || '').trim().slice(0, 40), q: ((li.querySelector('.mc-qty') || {}).innerText || ''), v: ((li.querySelector('.mc-var') || {}).innerText || ''), price: (li.innerText.match(/\$[\d.,]+/g) || []).join(' ') })), total: (d.innerText.match(/Today's total:\s*\$[\d.,]+/) || [''])[0] }; });
              const scentQty = dr ? dr.lines.filter((l) => !/Special Kits/.test(l.t)).reduce((s, l) => s + (parseInt((l.q.match(/×(\d+)/) || [])[1] || '0', 10)), 0) : -1;
              const kit = dr && dr.lines.find((l) => /Special Kits/.test(l.t));
              const toast = await pg.evaluate(() => ((document.querySelector('#buybox .toast, #buybox [class*=toast]') || {}).innerText || ''));
              ok(`${P.id} drawer: kit variant + ${P.scents} scents at ${P.one ? '$49.95' : '$0'}, ×N pills, total $${P.total}`, kit && scentQty === P.scents && dr.lines.filter((l) => !/Special Kits/.test(l.t)).every((l) => (P.one ? /\$49\.95/ : /\$0\.00/).test(l.price) && (P.one ? !/\$0\.00/.test(l.price) : true)) && dr.total.includes('$' + P.total) && (P.tier === 1 ? /1 Diffuser/.test(kit.v) : new RegExp(`${P.tier} Diffusers \\+ ${P.scents} Scents`).test(kit.v)), JSON.stringify(dr).slice(0, 300) + ' NET=' + JSON.stringify(net) + ' TOAST=' + JSON.stringify(toast));
              await pg.screenshot({ path: OUT + `${P.id}-drawer.png` });
              await pg.locator('#cart-drawer form.buy-buttons button, #cart-drawer form.buy-buttons .btn').first().click();
              await pg.waitForURL(/checkouts\//, { timeout: 60000 }); await pg.waitForLoadState('domcontentloaded'); await pg.waitForTimeout(6000);
              const sumBtn = pg.locator('button:has-text("order summary"), button[aria-controls*="order-summary"]').first();
              if (await sumBtn.count()) { try { await sumBtn.click({ timeout: 3000 }); await pg.waitForTimeout(1200); } catch (e) {} }
              const txt = await pg.evaluate(() => document.body.innerText.replace(/\s+/g, ' '));
              const money = (label) => { const m = txt.match(new RegExp(label + '\\s*(?:USD)?\\s*\\$([\\d,]+\\.\\d\\d)', 'i')); return m ? parseFloat(m[1].replace(',', '')) : null; };
              const total = money('Total'), subtotal = money('Subtotal(?: · \\d+ items?)?');
              ok(`${P.id} checkout total $${P.total}`, total === P.total, `total=${total} subtotal=${subtotal}`);
              if (P.scents && P.one) {
                ok(`${P.id} checkout: one-time, no plan, no discount`, !/Every 30 days/.test(txt) && !/First payment/.test(txt) && !/recurring/i.test(txt) && !/Founder/i.test(txt) && total === subtotal && total === P.total, `plan mentions=${(txt.match(/Every 30 days/g) || []).length} total=${total} subtotal=${subtotal}`);
                ok(`${P.id} checkout kit line`, new RegExp(`${P.tier} Diffusers \\+ ${P.scents} Scents`).test(txt));
              } else if (P.scents) {
                const plans = (txt.match(/Every 30 days/g) || []).length; const firstZero = (txt.match(/First payment \$0\.00/g) || []).length;
                ok(`${P.id} checkout: scents on the 30-day plan, first payment $0`, plans >= 1 && firstZero >= 1, `"Every 30 days"×${plans}, "First payment $0.00"×${firstZero}, recurring notice=${/recurring charge/i.test(txt)}`);
                ok(`${P.id} checkout kit line`, new RegExp(`${P.tier} Diffusers \\+ ${P.scents} Scents`).test(txt));
              } else ok(`${P.id} checkout kit line`, /1 Diffuser/.test(txt) && !/Every 30 days/.test(txt));
              ok(`${P.id} checkout express pay present`, /shop|Google Pay|G Pay/i.test(txt));
              await pg.screenshot({ path: OUT + `${P.id}-checkout.png` });
              ok(`${P.id} no JS errors`, errs.length === 0, errs.join(' | '));
            } catch (e) { ok(`${P.id} crashed`, false, e.message); await pg.screenshot({ path: OUT + `${P.id}-crash.png` }).catch(() => {}); }
            await ctx.close(); await new Promise((r) => setTimeout(r, 15000));
          }
          await b.close();
          for (const r of R) console.log((r.c ? 'PASS' : 'FAIL') + '  ' + r.n + (r.i ? '  —  ' + r.i : ''));
          console.log(`RESULT ${R.filter((r) => r.c).length}/${R.length}`);
          EOF2
          node r219.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/recon/r219
          git commit -m "r219: funnel QA after v3s25" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
