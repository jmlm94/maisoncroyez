name: drawer-recon
# run 168 — final verify: gap ~4px with h1+.featbs override (v=ic4)
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Live verify
        run: |
          cat > r168.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 } });
          const pg = await ctx.newPage();
          const errs = [];
          pg.on('pageerror', e => errs.push(e.message));
          await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await pg.waitForSelector('.offhero', { timeout: 60000 });
          await pg.waitForTimeout(4000);
          const dbg = await pg.evaluate(() => {
            const h1 = document.querySelector('.buybox h1');
            const fb = document.querySelector('.featbs');
            const bb = document.querySelector('.buybox');
            const cs = (el) => { const c = getComputedStyle(el); return { mb: c.marginBottom, mt: c.marginTop, pb: c.paddingBottom, pt: c.paddingTop, disp: c.display, gap: c.rowGap, lh: c.lineHeight, fs: c.fontSize }; };
            return {
              h1: cs(h1), fb: cs(fb), bb: cs(bb),
              h1Next: h1.nextElementSibling ? h1.nextElementSibling.className : null,
              between: (() => { const out = []; let n = h1.nextElementSibling; while (n && n !== fb) { out.push([n.className, Math.round(n.getBoundingClientRect().height)]); n = n.nextElementSibling; } return out; })(),
              h1Rect: h1.getBoundingClientRect().toJSON(), fbRect: fb.getBoundingClientRect().toJSON(),
              cssHasReset: [...document.styleSheets].some(s => { try { return [...s.cssRules].some(r => r.cssText && r.cssText.includes('.buybox h1') && r.cssText.includes('important')); } catch(e) { return false; } }),
            };
          });
          console.log('R167-DBG ' + JSON.stringify(dbg));
          const chk = await pg.evaluate(() => {
            const pres = [...document.querySelectorAll('#mc-prehero')];
            const v = document.querySelector('.gal video');
            const h1 = document.querySelector('.buybox h1');
            const fb = document.querySelector('.featbs');
            const oa = document.querySelector('.optout a');
            const oaCS = oa ? getComputedStyle(oa) : null;
            return {
              key: document.documentElement.innerHTML.includes('ic4-48ec907'),
              preheroCount: pres.length,
              preheroHidden: pres.map(p => getComputedStyle(p).display === 'none'),
              video: v ? { playing: !v.paused && v.videoWidth > 0, poster: v.getAttribute('poster'), w: Math.round(v.getBoundingClientRect().width), galImgs: document.querySelectorAll('.gal img').length } : null,
              h1ToBadgesGap: fb && h1 ? Math.round(fb.getBoundingClientRect().top - h1.getBoundingClientRect().bottom) : null,
              optout: oaCS ? { deco: oaCS.textDecorationLine, borderBottom: oaCS.borderBottomStyle + ' ' + oaCS.borderBottomWidth, boxShadow: oaCS.boxShadow, bgImage: oaCS.backgroundImage } : null,
              hscroll: document.documentElement.scrollWidth - window.innerWidth,
            };
          });
          console.log('R165 ' + JSON.stringify(chk));
          await pg.evaluate(() => window.scrollTo(0, 0));
          await pg.waitForTimeout(800);
          await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/ic4-live-top.png' });
          const oa = pg.locator('.optout');
          await oa.scrollIntoViewIfNeeded(); await pg.waitForTimeout(500);
          await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/ic4-live-optout.png' });
          console.log('ERRORS ' + JSON.stringify(errs.slice(0, 5)));
          await b.close();
          EOF
          node r168.mjs
      - name: Commit screenshots
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/ic4-live-top.png lp-factory/pages/kits-lp/live/ic4-live-optout.png
          git commit -m "r168: IC polish live screenshots" || exit 0
          git push
