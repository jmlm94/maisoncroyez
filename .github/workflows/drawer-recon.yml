name: drawer-recon
# run 120 — re-gate typography css with minifier-tolerant patterns
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          K="og$RANDOM$RANDOM"
          curl -sSL "$B/mc-6mp.css?v=$K" -o c.css
          echo "R120 bytes=$(wc -c < c.css)"
          echo "R120 rootH1: $(grep -o '#root h1{[^}]*}' c.css | head -1)"
          echo "R120 rootBase: $(grep -o '#root{[^}]*}' c.css | head -2 | tr '\n' ' ')"
          echo "R120 inheritBlanket: $(grep -o -F '#root p,#root span' c.css | wc -l)"
