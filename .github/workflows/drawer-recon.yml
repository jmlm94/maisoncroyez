name: drawer-recon
# run 24 — verify homepage redesign on unpublished theme preview (theme 149057536109)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify homepage preview
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > verify.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const URL='https://maisoncroyez.com/?preview_theme_id=149057536109';
          async function run(label,w,h,dsf){
            const page = await b.newPage({ viewport:{width:w,height:h}, deviceScaleFactor:dsf });
            const errs=[]; page.on('pageerror',e=>errs.push(String(e).slice(0,200)));
            await page.goto(URL+'&cb='+Date.now(),{waitUntil:'load',timeout:90000});
            await page.waitForTimeout(9000);
            await page.evaluate(async()=>{ window.scrollTo(0,document.body.scrollHeight); await new Promise(r=>setTimeout(r,2000)); window.scrollTo(0,0); await new Promise(r=>setTimeout(r,800)); });
            await page.waitForTimeout(1500);
            const p = await page.evaluate(()=>{
              const t=(document.getElementById('root')||{innerText:''}).innerText;
              const q=s=>document.querySelector(s);
              const links=[...document.querySelectorAll('#root a.btn')].map(a=>a.getAttribute('href'));
              return {
                rootH: q('#root')?q('#root').getBoundingClientRect().height:0,
                sections: document.querySelectorAll('#root section').length,
                heroTitle: /Attract what you want/.test(t),
                dollarHook: /\$1,000\/night hotel/.test(t) && /\$1\.33 a day/.test(t),
                heroCta: /Claim Your Free Diffuser/.test(t),
                chips: document.querySelectorAll('#root .chip').length,
                ftiles: document.querySelectorAll('#root .ftile').length,
                trophy: /Golden Blossom Harmony 🏆/.test(t),
                manifesting: /whatever you’re manifesting/.test(t),
                statLine: /2,500\+ guests/.test(t) && /what’s that smell/.test(t),
                mclose: /We bottle the rest/.test(t),
                buyLogos: document.querySelectorAll('#root .blogo svg').length,
                testiFeat: !!q('#root .tfeat'),
                snaps: document.querySelectorAll('#root .snap').length,
                linkKit: links.filter(x=>x&&x.includes('/pages/build-your-kit')).length,
                linkFD: links.some(x=>x&&x.includes('/pages/free-diffuser')),
                linkDiff: links.some(x=>x&&x.includes('/products/diffuser-scents')),
                linkFrag: links.some(x=>x&&x.includes('/collections/power-fragrances')),
                imgsBroken: [...document.querySelectorAll('#root img')].filter(i=>i.complete&&!i.naturalWidth).length,
                noOverflow: document.documentElement.scrollWidth<=document.documentElement.clientWidth+2,
                themeHeader: !!document.querySelector('header, [id*="header"]'),
                themeFooter: !!document.querySelector('footer, [id*="footer"]')
              };
            });
            console.log('=== '+label+' === '+JSON.stringify(p));
            console.log('errors('+errs.length+'): '+errs.slice(0,3).join(' | '));
            await page.screenshot({ path:'preview-'+label+'.png', fullPage:true });
            const checks={
              rendered:p.rootH>3000, sections8:p.sections===8, heroTitle:p.heroTitle, dollarHook:p.dollarHook,
              heroCta:p.heroCta, chips3:p.chips===3, ftiles7:p.ftiles===7, trophy:p.trophy,
              manifesting:p.manifesting, statLine:p.statLine, mclose:p.mclose, buyLogos2:p.buyLogos===2,
              testiFeat:p.testiFeat, snaps3:p.snaps===3, linkKit3:p.linkKit>=3, linkFD:p.linkFD,
              linkDiff:p.linkDiff, linkFrag:p.linkFrag, imgsOk:p.imgsBroken===0, noOverflow:p.noOverflow,
              themeHeader:p.themeHeader, themeFooter:p.themeFooter, noJsErrors:errs.length===0
            };
            console.log('=== VERDICT '+label+' ===');
            Object.entries(checks).forEach(([k,v])=>console.log((v?'PASS':'FAIL')+' '+k));
            await page.close();
          }
          await run('desktop',1440,900,1);
          await run('mobile',390,844,2);
          await b.close();
          EOS
          node verify.mjs 2>&1 | tee preview-verify.txt
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/pages/home/verify
          mv preview-verify.txt preview-desktop.png preview-mobile.png lp-factory/pages/home/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/home/verify
          git commit -m "homepage preview verify (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
