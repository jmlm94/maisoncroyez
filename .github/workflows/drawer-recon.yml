name: drawer-recon
# run 30 — DIAGNOSTIC: what do cart endpoints return under preview_theme_id?
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sitewide drawer
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > verify.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const PV='preview_theme_id=149076607085';
          const page = await b.newPage({ viewport:{width:390,height:844} });
          page.on('console',m=>{ if(m.type()==='error') console.log('CONSOLE: '+m.text().slice(0,180)); });
          await page.goto('https://maisoncroyez.com/?'+PV+'&cb='+Date.now(),{waitUntil:'load',timeout:90000});
          await page.waitForTimeout(6000);
          const d1=await page.evaluate(async()=>{
            const out={};
            out.cookies=document.cookie.split(';').map(c=>c.trim().split('=')[0]).filter(n=>/preview|theme/i.test(n));
            const clr=await fetch('/cart/clear.js',{method:'POST'}); out.clearStatus=clr.status; out.clearCT=clr.headers.get('content-type');
            const add=await fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({items:[{id:45511812284525,quantity:1}]})});
            out.addStatus=add.status; out.addCT=add.headers.get('content-type');
            out.addBody=(await add.text()).slice(0,120);
            const c=await fetch('/cart.js'); out.cartCT=c.headers.get('content-type');
            const ctxt=await c.text(); out.cartBody=ctxt.slice(0,150);
            try{ out.itemCount=JSON.parse(ctxt).items.length; }catch(e){ out.itemCount='PARSE FAIL'; }
            return out;
          });
          console.log('=== CART API UNDER PREVIEW === '+JSON.stringify(d1,null,1));
          await page.evaluate(()=>{ document.dispatchEvent(new CustomEvent('cart:refresh')); const d=document.getElementById('cart-drawer'); if(d&&d.show)d.show(); });
          await page.waitForTimeout(5000);
          const d2=await page.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            return { open:d?d.hasAttribute('open'):false,
              htmlLen:d?d.innerHTML.length:0,
              hasTop:!!(d&&d.querySelector('.cart-drawer__top')),
              topHtml:d&&d.querySelector('.cart-drawer__top')?d.querySelector('.cart-drawer__top').innerHTML.slice(0,200):'',
              firstKids:d?[...d.children].map(c=>c.tagName+'.'+(c.className||'').toString().slice(0,30)).slice(0,8):[] };
          });
          console.log('=== DRAWER DOM === '+JSON.stringify(d2,null,1));
          await page.screenshot({ path:'drawer-home.png' });
          // try the header cart button instead
          await page.evaluate(()=>window.scrollTo(0,0));
          try { await page.click('a[href="/cart"], [aria-controls="cart-drawer"], .header__cart, [data-action*="cart"]', {timeout:3000}); } catch(e) { console.log('cart btn click failed: '+String(e).slice(0,80)); }
          await page.waitForTimeout(3000);
          const d3=await page.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            return { open:d?d.hasAttribute('open'):false, hasTop:!!(d&&d.querySelector('.cart-drawer__top')),
              title:(d&&d.querySelector('.cart-drawer__top p.h5')||{}).textContent||'none' };
          });
          console.log('=== AFTER HEADER CLICK === '+JSON.stringify(d3));
          await page.screenshot({ path:'drawer-lp.png' });
          await page.evaluate(async()=>{ await fetch('/cart/clear.js',{method:'POST'}); });
          await b.close();
          EOS
          node verify.mjs 2>&1 | tee drawer-verify.txt
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/sitewide-drawer/verify
          mv drawer-verify.txt drawer-home.png drawer-lp.png lp-factory/sitewide-drawer/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/sitewide-drawer
          git commit -m "sitewide drawer diag r30 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
