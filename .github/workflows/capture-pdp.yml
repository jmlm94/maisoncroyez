name: capture-pdp
# Reference capture: full-page screenshots (mobile + desktop) and rendered HTML
# of the live PDP, committed to the repo for the pdp rebuild.
on:
  push:
    branches: [claude/maison-landing-page-iyikm5]
    paths: ['.github/workflows/capture-pdp.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture PDP
        run: |
          URL="https://maisoncroyez.com/products/diffuser-scents?cb=$(date +%s)"
          mkdir -p ref
          curl -sSL --max-time 30 -o ref/pdp-rendered.html "$URL"
          npx -y playwright@1.56.1 install --with-deps chromium > /dev/null 2>&1
          npx -y playwright@1.56.1 screenshot --viewport-size=390,844 --full-page --wait-for-timeout=12000 "$URL" ref/pdp-mobile.png
          npx -y playwright@1.56.1 screenshot --viewport-size=1280,900 --full-page --wait-for-timeout=12000 "$URL" ref/pdp-desktop.png
          ls -la ref/
      - name: Commit
        run: |
          mkdir -p lp-factory/pages/pdp-diffuser/reference
          mv ref/* lp-factory/pages/pdp-diffuser/reference/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-diffuser/reference
          git commit -m "Capture live PDP reference (mobile+desktop shots, rendered HTML)"
          git push
