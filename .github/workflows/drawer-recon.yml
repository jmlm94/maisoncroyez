name: drawer-recon
# run 145 — live verify: no-From price, badge removed, tier cards equalized (key p6m16)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          await p.goto('https://maisoncroyez.com/pages/six-month-program?utm_campaign=diag145',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(9000);
          const d=await p.evaluate(()=>{
            const q=s=>document.querySelector(s);
            const cards=[...document.querySelectorAll('.kg-card')].map(c=>Math.round(c.getBoundingClientRect().height));
            const pills=[...document.querySelectorAll('.kg-day')].map(e=>Math.round(e.getBoundingClientRect().bottom));
            return {price:(q('.price-row .price')||q('.price')||{}).textContent,
              badge:!!q('.supply-banner'), extra:(q('.supply-extra')||{}).textContent,
              cardHeights:cards, pillBottoms:pills, key16:!!q('script[src*="p6m16"]'),
              grid:!!q('.kitgrid'), rows:document.querySelectorAll('.pick-row').length};});
          console.log('R145 '+JSON.stringify(d)+' errs='+JSON.stringify(errs));
          await p.evaluate(()=>{const e=document.querySelector('.plansel-title'); if(e) e.scrollIntoView();});
          await p.waitForTimeout(700);
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-tiers.png'});
          await b.close();})();
          EOS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live
          git commit -m "recon r145: verify card tweaks live" || echo "no changes"
          git push || echo "no push"
