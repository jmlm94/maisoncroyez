name: drawer-recon
# run 98 — live verify kx4 (no subscription toggle)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[];p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          let cartAdd=null;p.on('response',async r=>{if(r.url().indexOf('/cart/add.js')>-1)cartAdd=r.status();});
          await p.goto('https://maisoncroyez.com/products/maison-croyez-manifestation-specia-bundles?utm_campaign=kx98',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(10000);
          const r1=await p.evaluate(()=>({
            rootMounted: !!document.querySelector('#root') && document.querySelector('#root').children.length>0,
            togGone: !document.querySelector('.modes') && document.body.textContent.indexOf('if you subscribe')===-1,
            renewGone: document.body.textContent.indexOf('Renews automatically')===-1,
            tiers: document.querySelectorAll('.kitcard').length,
            atc: (document.querySelector('.btn.atc')||{textContent:''}).textContent.trim().replace(/\s+/g,' ').slice(0,55),
            overflow: document.documentElement.scrollWidth-document.documentElement.clientWidth,
          }));
          await p.evaluate(()=>{const e=document.querySelector('.btn.atc'); if(e) e.click();});
          await p.waitForTimeout(5000);
          const drawer=await p.evaluate(()=>{const d=document.getElementById('cart-drawer');return d?(d.hasAttribute('open')||getComputedStyle(d).display!=='none'):null;});
          console.log('R98 '+JSON.stringify({...r1, cartAdd, drawer, errs}));
          await b.close();})();
          EOS
