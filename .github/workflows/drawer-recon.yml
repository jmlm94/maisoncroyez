name: drawer-recon
# run 163 — minify-tolerant gate + final cart validation (membership $89.95 total, one-time no freebies)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate (minify-tolerant)
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          curl -s "$B/mc-ic-app.js?v=og$RANDOM$RANDOM" -o /tmp/app.js
          curl -s "$B/mc-ic.css?v=og$RANDOM$RANDOM" -o /tmp/ic.css
          echo "appBytes=$(wc -c < /tmp/app.js) cssBytes=$(wc -c < /tmp/ic.css)"
          echo "plan=$(grep -c 'selling_plan:CART.sellingPlan\|selling_plan: CART.sellingPlan' /tmp/app.js || true)"
          echo "icvar=$(grep -c '45771775639661' /tmp/app.js || true)"
          echo "claim=$(grep -c 'CLAIM MY FREE DIFFUSER' /tmp/app.js || true)"
          echo "vid=$(grep -c 'mc-hero-loop-780.mp4' /tmp/app.js || true)"
          echo "hardening=$(grep -c '#root .offhero{display:flex' /tmp/ic.css || true)"
          echo "portalcss=$(grep -c '.portal-btns{' /tmp/ic.css || true)"
      - name: Final cart validation
        run: |
          echo "--- MEMBERSHIP: 2 sub scents + \$0 diffuser (expect total 8995) ---"
          J=/tmp/j1; curl -s -c $J -o /dev/null "https://maisoncroyez.com/"
          curl -s -b $J -c $J -X POST "https://maisoncroyez.com/cart/add.js" -H "Content-Type: application/json" \
            -d '{"items":[{"id":41212020457581,"quantity":1,"selling_plan":2661875821},{"id":41212018655341,"quantity":1,"selling_plan":2661875821},{"id":45771775639661,"quantity":1}]}' -o /tmp/addresp.json -w "add=%{http_code}\n"
          head -c 200 /tmp/addresp.json; echo
          curl -s -b $J "https://maisoncroyez.com/cart.js" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("total", d["total_price"]); [print(i["id"], i["final_line_price"], "plan" if i.get("selling_plan_allocation") else "one-time") for i in d["items"]]'
          curl -s -b $J -X POST "https://maisoncroyez.com/cart/clear.js" -o /dev/null
          echo "--- ONE-TIME: diffuser + 1 scent (expect 8995 + 4995, no freebies) ---"
          K=/tmp/j2; curl -s -c $K -o /dev/null "https://maisoncroyez.com/"
          curl -s -b $K -c $K -X POST "https://maisoncroyez.com/cart/add.js" -H "Content-Type: application/json" \
            -d '{"items":[{"id":45450822778989,"quantity":1},{"id":41212020457581,"quantity":1}]}' -o /dev/null
          curl -s -b $K "https://maisoncroyez.com/cart.js" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("total", d["total_price"]); [print(i["id"], i["final_line_price"]) for i in d["items"]]'
          curl -s -b $K -X POST "https://maisoncroyez.com/cart/clear.js" -o /dev/null
          echo done
