name: drawer-recon
# run 37b — gallery geometry probe: why is the React hero 12px taller than square? (LCP candidate sizing)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gallery probe
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS' > gal-probe.txt
          (async()=>{
          const { chromium } = require('playwright');
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:412,height:823}, deviceScaleFactor:1.75 });
          await page.goto('https://maisoncroyez.com/pages/free-diffuser?utm_source=instagram&utm_medium=bio&utm_campaign=perf_test',{waitUntil:'load',timeout:90000});
          await page.waitForTimeout(10000);
          const out = await page.evaluate(()=>{
            const L=[];
            const track=document.querySelector('.gal-track');
            const cs=getComputedStyle(track);
            L.push('track rect='+JSON.stringify(track.getBoundingClientRect()));
            L.push('track offsetH='+track.offsetHeight+' clientH='+track.clientHeight+' scrollH='+track.scrollHeight+' (offset-client='+(track.offsetHeight-track.clientHeight)+')');
            L.push('track alignItems='+cs.alignItems+' scrollbarWidth='+cs.scrollbarWidth+' overflowX='+cs.overflowX);
            document.querySelectorAll('.gal-slide').forEach((s,i)=>{ if(i<3){
              const r=s.getBoundingClientRect(); const img=s.querySelector('img');
              const ir=img?img.getBoundingClientRect():null;
              L.push('slide'+i+' '+Math.round(r.width)+'x'+Math.round(r.height)+' img='+(ir?Math.round(ir.width)+'x'+Math.round(ir.height):'-')+' imgPos='+(img?getComputedStyle(img).position:'-'));
            }});
            // LCP + CLS buffered
            return new Promise(res=>{
              let lcp=null, cls=0, srcs=[];
              new PerformanceObserver(l=>{ const e=l.getEntries(); if(e.length) lcp=e[e.length-1]; }).observe({type:'largest-contentful-paint',buffered:true});
              new PerformanceObserver(l=>{ l.getEntries().forEach(e=>{ if(!e.hadRecentInput){ cls+=e.value; if(e.value>0.01) srcs.push(Math.round(e.startTime)+'ms +'+e.value.toFixed(4)+' '+(e.sources||[]).map(s=>s.node&&s.node.className||s.node&&s.node.tagName||'?').join(',')); } }); }).observe({type:'layout-shift',buffered:true});
              setTimeout(()=>{
                if(lcp) L.push('LCP entry: '+Math.round(lcp.startTime)+'ms size='+lcp.size+' el='+(lcp.element?lcp.element.tagName+'.'+lcp.element.className:'?')+' url='+String(lcp.url).split('/').pop().slice(0,60));
                L.push('CLS buffered total='+cls.toFixed(4)); srcs.forEach(s=>L.push('  shift: '+s));
                res(L);
              },1500);
            });
          });
          out.forEach(l=>console.log(l));
          // candidate A: align-items flex-start on track
          const A = await page.evaluate(()=>{ const t=document.querySelector('.gal-track'); t.style.alignItems='flex-start';
            const img=document.querySelector('.gal-slide img'); const r=img.getBoundingClientRect();
            const out='A(flex-start): hero img '+Math.round(r.width)+'x'+Math.round(r.height); t.style.alignItems=''; return out; });
          console.log(A);
          // candidate B/C: inject static markup (1 slide vs 2 slides) with live CSS applied
          const BC = await page.evaluate(()=>{
            const mk=(n)=>{ const d=document.createElement('div');
              d.innerHTML='<section class="section pdp-buy"><div class="wrap"><div class="gal"><div class="gal-track">'+
                Array.from({length:n},()=>'<div class="gal-slide ph sq"><img class="simg" src="https://cdn.shopify.com/s/files/1/0020/3636/7469/files/Diseno_sin_titulo_92.png?v=1783904283&width=900" alt="x" style="display:block;width:100%;aspect-ratio:1/1;object-fit:cover"></div>').join('')+
                '</div></div></div></section>';
              document.body.appendChild(d);
              const r=d.querySelector('img').getBoundingClientRect();
              const t=d.querySelector('.gal-track');
              const res=Math.round(r.width)+'x'+Math.round(r.height)+' trackH='+Math.round(t.getBoundingClientRect().height);
              d.remove(); return res; };
            return ['B(static 1 slide): '+mk(1), 'C(static 2 slides): '+mk(2)];
          });
          BC.forEach(l=>console.log(l));
          await b.close();
          })();
          EOS
          cat gal-probe.txt
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mv gal-probe.txt lp-factory/pages/pdp-free-diffuser/perf2/gal-probe.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-free-diffuser/perf2
          git commit -m "LP gallery geometry probe r37b (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
