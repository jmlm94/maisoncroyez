name: drawer-recon
# run 23 — fetch Amazon + TikTok brand logo SVGs for homepage mock
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download logos
        run: |
          mkdir -p logos
          curl -sL https://cdn.jsdelivr.net/npm/simple-icons@13/icons/amazon.svg -o logos/amazon.svg
          curl -sL https://cdn.jsdelivr.net/npm/simple-icons@13/icons/tiktok.svg -o logos/tiktok.svg
          ls -la logos; head -c 300 logos/amazon.svg; echo; head -c 300 logos/tiktok.svg
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/recon-home/logos
          mv logos/* lp-factory/recon-home/logos/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/recon-home
          git commit -m "brand logos (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
