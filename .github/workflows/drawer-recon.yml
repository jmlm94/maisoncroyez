name: drawer-recon
# run 204 — Lighthouse baseline of the LIVE /pages/six-month-program (mobile + desktop) before the three-step version ships
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm i lighthouse@12.2.1 chrome-launcher@1.1.2
      - name: Lighthouse
        run: |
          mkdir -p lp-factory/pages/kits-lp/recon/r204
          for form in mobile desktop; do
            EXTRA=""; [ "$form" = desktop ] && EXTRA="--preset=desktop"
            npx lighthouse "https://maisoncroyez.com/pages/six-month-program" --quiet --only-categories=performance,accessibility,best-practices --output=json --output-path=lp-factory/pages/kits-lp/recon/r204/live-$form.json --chrome-flags="--headless=new --no-sandbox" $EXTRA
            node -e '
              const r=require("./lp-factory/pages/kits-lp/recon/r204/live-'"$form"'.json"); const a=r.audits; const ms=k=>Math.round(a[k].numericValue);
              console.log("LH '"$form"'", "perf", Math.round(r.categories.performance.score*100), "a11y", Math.round(r.categories.accessibility.score*100), "bp", Math.round(r.categories["best-practices"].score*100));
              console.log("  FCP", ms("first-contentful-paint"), "LCP", ms("largest-contentful-paint"), "TBT", ms("total-blocking-time"), "CLS", a["cumulative-layout-shift"].numericValue.toFixed(3), "SI", ms("speed-index"), "TTI", ms("interactive"));
              console.log("  LCP element:", (a["largest-contentful-paint-element"].details?.items?.[0]?.items?.[0]?.node?.snippet||"").slice(0,120));
              console.log("  transfer KB", Math.round(a["total-byte-weight"].numericValue/1024), "| requests", a["network-requests"].details.items.length, "| bootup ms", ms("bootup-time"), "| mainthread ms", ms("mainthread-work-breakdown"), "| dom", ms("dom-size"));
              const big=a["network-requests"].details.items.filter(i=>i.transferSize>60000).sort((x,y)=>y.transferSize-x.transferSize).slice(0,8).map(i=>Math.round(i.transferSize/1024)+"KB "+i.url.replace(/^https?:\/\/[^/]+/,"").slice(0,70)); console.log("  biggest:", big.join(" || "));
              const opp=Object.values(a).filter(x=>x.details&&x.details.type==="opportunity"&&x.numericValue>150).sort((x,y)=>y.numericValue-x.numericValue).slice(0,6).map(x=>x.title+" ("+Math.round(x.numericValue)+"ms)"); console.log("  opportunities:", opp.join("; ")||"none");
            '
          done
          rm -f lp-factory/pages/kits-lp/recon/r204/*.json
