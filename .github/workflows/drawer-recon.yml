name: drawer-recon
# run 115 — gate margin-fix css, then (post key flip in r116) verify
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          for i in 1 2 3 4 5 6 7 8; do
            K="og$RANDOM$RANDOM"
            curl -sSL "$B/mc-6mp.css?v=$K" -o c.css
            M=$(grep -o -F 'padding:11px 15px;margin-bottom:10px' c.css | wc -l)
            P=$(grep -o -F 'padding:11px 15px 21px' c.css | wc -l)
            echo "R115 try$i bytes=$(wc -c < c.css) marginRule=$M oldPad=$P"
            if [ "$M" -ge 1 ] && [ "$P" -eq 0 ]; then echo "R115 PROPAGATED"; exit 0; fi
            sleep 10
          done
          echo "R115 NOT PROPAGATED"
