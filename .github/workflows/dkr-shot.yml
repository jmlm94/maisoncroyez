name: dkr-shot
# The rebranded diffuser kits page on the hidden test page: screenshots on a phone and a desktop, page errors, and the
# cart the page builds for 1 / 2 / 3 diffusers (read from /cart.js, then emptied). No order is placed.
# run note 18: rounds 20 + 21 live (key dkr18-tiles); tile sizes of step 2 and of the seven scents grid
# run note 17: the buy-box test presses the main button (the sticky one only scrolls since round 19)
# run note 16: round 19 live (key dkr17-buildkit): sticky Build my kit scrolls to step 1, main button straight to checkout
# run note 15: round 18 live (key dkr16-stick): sticky pill, straight to checkout from the sticky button with nothing picked
# run note 14: refills wired (first delivery free, then $29.95); the real button with and without refills
# run note 13: after the 23 / 34.5 px headline and the centered badges went live (key dkr14-h1d)
# run note 12: after the 20% smaller headline went live (key dkr11-h1b)
# run note 11: after rounds 16 + 17 went live (key dkr10-h1); also the bottom of the page
# run note 10: after the entry-keys photo went live (key dkr7-shoot19)
# run note 9: after the gallery swap to the shoot-photo pictures (key dkr6-g2shoot)
# run note 8: three QA tests (owner 2026-11-22): the page, the buy box for 1 / 2 / 3 diffusers, the real button once
# run note 7: key dkr4-cf380c4
# run note 6: do our files also answer on the shop's own domain (/cdn/shop/files/)?
# run note 5: after the speed pass (key dkr3-615d462), cart part off
# run note 4: log what the cart requests answer
# run note 3: cart ids read from store/ids.json
# run note 2: our own top bar, the theme's announcement bar hidden, sticky button centered
on:
  workflow_dispatch:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/dkr-shot.yml']
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: https://maisoncroyez.com/pages/diffuser-kits-2
      OUT: lp-factory/pages/diffuser-kits-rebrand/store/shots
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Shoot and check
        run: |
          mkdir -p "$OUT"
          cat > shot.js <<'EOF'
          const { chromium } = require('playwright'); const fs = require('fs');
          const URL = process.env.URL, OUT = process.env.OUT; const IDS = JSON.parse(fs.readFileSync('lp-factory/pages/diffuser-kits-rebrand/store/ids.json', 'utf8'));
          const log = { url: URL, at: new Date().toISOString(), views: {} };
          const PRICE = { 1: 89, 2: 159, 3: 239 };
          (async () => {
            const br = await chromium.launch();
            for (const [n, w, h, mobile] of [['phone', 390, 844, true], ['tablet', 820, 1180, true], ['desktop', 1440, 900, false]]) {
              const ctx = await br.newContext({ viewport: { width: w, height: h }, isMobile: mobile, hasTouch: mobile, deviceScaleFactor: mobile ? 2 : 1,
                userAgent: n === 'phone' ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1' : undefined });
              const pg = await ctx.newPage(); const errs = [];
              pg.on('pageerror', (e) => errs.push('ERR ' + String(e.message).slice(0, 160)));
              pg.on('requestfailed', (r) => { if (/mc-dkr/.test(r.url())) errs.push('FAIL ' + r.url().split('/').pop()); });
              const v = log.views[n] = { errs }; const q = (f, a) => pg.evaluate(f, a);
              const res = await pg.goto(URL, { waitUntil: 'load', timeout: 60000 }); v.status = res.status();
              await pg.waitForTimeout(3500);
              /* ---- test 1: the page itself ---- */
              v.t1 = await q(async () => { const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)]; const m = $('#mcr'); if (!m || !$('#cta')) return { rendered: false };
                $$('#mcr img[loading=lazy]').forEach((i) => i.loading = 'eager'); await Promise.all($$('#mcr img').map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; setTimeout(r, 9000); })));
                const tr = $('#track'); $('#g-next').click(); await new Promise((r) => setTimeout(r, 900)); const slideAfterNext = Math.round(tr.scrollLeft / tr.clientWidth); tr.scrollTo({ left: 0 });
                const d = $$('main section:last-of-type .faq details')[1]; d.querySelector('summary').click(); const faqOpens = d.open;
                return { rendered: true, h1: $('#mcr h1').innerText.replace(/\s+/g, ' '), font: getComputedStyle($('#mcr h1')).fontFamily.slice(0, 9), fontsLoaded: [...document.fonts].filter((f) => f.status === 'loaded').length,
                  sections: $$('#mcr main section h2').map((x) => x.innerText.replace(/\s+/g, ' ').slice(0, 42)), imgs: $$('#mcr img').length, broken: $$('#mcr img').filter((i) => !i.naturalWidth).map((i) => i.src.split('/').pop()),
                  slides: $$('#track .slide').length, slideAfterNext, faq: $$('main section:last-of-type .faq details').length, faqOpens, reviews: $$('#quotes .q').length, scentRows: $$('#scents .row').length, ugc: $$('.ugc-t img').length,
                  themeBar: $$('.shopify-section--announcement-bar').map((e) => getComputedStyle(e).display).join(','), themeHeader: !!$('.shopify-section--header'), themeTitle: (() => { const t = $('.page > h1'); return t ? getComputedStyle(t).display : 'none'; })(),
                  overflowX: document.documentElement.scrollWidth - innerWidth, stick: (() => { const r = $('#stick').getBoundingClientRect(); return [Math.round(innerHeight - r.bottom), Math.round(r.height)]; })(), step3Hidden: $('#step3').hidden, tiles: [...new Set([...document.querySelectorAll('#scents > *')].map((t) => Math.round(t.getBoundingClientRect().width) + 'x' + Math.round(t.getBoundingClientRect().height)))].join(' '), smini: [...new Set([...document.querySelectorAll('.smini > *')].map((t) => Math.round(t.getBoundingClientRect().width) + 'x' + Math.round(t.getBoundingClientRect().height)))].join(' '), preview: /Preview/i.test(m.innerText) }; });
              await pg.screenshot({ path: `${OUT}/${n}-top.png` });
          v.foot = await q(async () => { scrollTo(0, document.documentElement.scrollHeight); await new Promise((r) => setTimeout(r, 1500)); const m = document.querySelector('#mcr').getBoundingClientRect(), f = document.querySelector('.shopify-section--footer, footer'); return { gapToFooter: f ? Math.round(f.getBoundingClientRect().top - m.bottom) : null, footer: !!f, h1: getComputedStyle(document.querySelector('#mcr h1')).fontSize, ml: document.querySelectorAll('#scents .ml').length, eyebrow: !!document.querySelector('#mcr .eyebrow'), each1InGrid: !!document.querySelector('#scents > #each1') }; });
          await pg.screenshot({ path: `${OUT}/${n}-bottom.png` }); await q(() => scrollTo(0, 0)); await pg.waitForTimeout(400);
              if (v.t1.rendered) {
                await pg.screenshot({ path: `${OUT}/${n}-full.jpg`, fullPage: true, type: 'jpeg', quality: 60 });
                /* ---- test 2: the buy box. Cart requests are answered here, not by the store, so every kit size can be read. ---- */
                let sent = null, wentTo = null;
                await pg.route('**/cart.js', (r) => r.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
                await pg.route('**/cart/update.js', (r) => r.fulfill({ contentType: 'application/json', body: '{}' }));
                await pg.route('**/cart/add.js', (r) => { sent = JSON.parse(r.request().postData()); r.fulfill({ contentType: 'application/json', body: '{"items":[]}' }); });
                await pg.route('**/checkout', (r) => { wentTo = 'checkout'; r.fulfill({ contentType: 'text/html', body: '<html><body>checkout stub</body></html>' }); });
                v.t2 = [];
                for (const d of [1, 2, 3]) {
                  if (!/diffuser-kits-2/.test(pg.url())) { await pg.goto(URL, { waitUntil: 'load' }); await pg.waitForTimeout(2500); }
                  sent = null; wentTo = null;
                  const r = await q(async (d) => { const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)]; const T = (e) => e.innerText.replace(/\s+/g, ' ');
                    $(`#diffs .cardb[data-n="${d}"]`).click(); $$('#scents .row .dec').forEach((b) => { while (!b.disabled) b.click(); });
                    const before = [T($('#cta')), $('#cta').disabled, T($('#stick-go'))]; const rows = $$('#scents .row');
                    for (let i = 0; i < d; i++) rows[i === 2 ? 0 : i * 3].querySelector('.inc').click();   /* golden, euphoric, then golden again */
                    const full = rows.every((x) => x.querySelector('.inc').disabled);
                    return { before, after: [T($('#cta')), $('#cta').disabled, T($('#stick-go')), T($('#count'))], full, charge: $('#charge').textContent.slice(0, 90) }; }, d);
                  await q(() => document.querySelector('#cta').click()); await pg.waitForTimeout(1600);
                  const want = [{ id: IDS.kit[d], quantity: 1 }].concat(d === 1 ? [{ id: IDS.scent.golden, quantity: 1 }] : d === 2 ? [{ id: IDS.scent.golden, quantity: 1 }, { id: IDS.scent.euphoric, quantity: 1 }] : [{ id: IDS.scent.golden, quantity: 2 }, { id: IDS.scent.euphoric, quantity: 1 }]);
                  if (IDS.plans) want.slice(1).forEach((x) => { x.selling_plan = IDS.plans[30]; }); const got = sent && sent.items ? sent.items : null; const key = (a) => JSON.stringify((a || []).map((x) => [x.id, x.quantity, x.selling_plan || 0]).sort());
                  v.t2.push({ kit: d, ...r, priceOk: r.after[0].includes('$' + PRICE[d]), sentOk: key(got) === key(want), sent: got, wentTo });
                }
                await pg.unrouteAll({ behavior: 'ignoreErrors' });
                /* ---- test 3 (phone only): the real store, the real button: 2 diffusers + best sellers, first with no refills, then with refills every 30 days ---- */
                if (n === 'phone') {
                  const answers = []; pg.on('response', (r) => { if (/\/cart(\.js|\/add\.js|\/update\.js)/.test(r.url())) answers.push(r.url().split('/').slice(3).join('/').split('?')[0] + ' ' + r.status()); });
                  for (const [key, f, shot] of [['t3', 0, 'phone-checkout.png'], ['t3sub', 30, 'phone-checkout-sub.png']]) {
                    if (f && !IDS.plans) continue;
                    answers.length = 0;
                    await pg.goto(URL, { waitUntil: 'load' }); await pg.waitForTimeout(6000);
                    v[key + 'page'] = await q((f) => { document.querySelector('#diffs .cardb[data-n="2"]').click(); if (f) document.querySelector('#each1').click(); const b = document.querySelector('#freqs .qtyb[data-f="' + f + '"]'); if (b && !document.querySelector('#step3').hidden) b.click(); return { step3Hidden: document.querySelector('#step3').hidden, freq: (document.querySelector('#freqs .qtyb[aria-pressed="true"]') || {}).dataset ? document.querySelector('#freqs .qtyb[aria-pressed="true"]').dataset.f : null, cta: document.querySelector('#cta').innerText.replace(/\s+/g, ' '), charge: document.querySelector('#charge').textContent, steps: [...document.querySelectorAll('.step-h .lab')].map((x) => x.innerText) }; }, f);
                    await pg.waitForTimeout(1500);
                    v[key + 'stick'] = await q(async () => { const g = document.querySelector('#stick-go'), r = g.getBoundingClientRect(); scrollTo(0, document.documentElement.scrollHeight * 0.6); await new Promise((x) => setTimeout(x, 600)); const url0 = location.href; g.click(); await new Promise((x) => setTimeout(x, 1500)); const s1 = document.querySelector('#step1'); const tapped = { step1Top: s1 ? Math.round(s1.getBoundingClientRect().top) : null, sameUrl: location.href === url0 }; scrollTo(0, 0); return { tapped, text: g.innerText, left: Math.round(r.left), right: Math.round(innerWidth - r.right), bottom: Math.round(innerHeight - r.bottom), h: Math.round(r.height), radius: getComputedStyle(g).borderRadius, bar: document.querySelector('#mcr .bar').innerText, dots: document.querySelector('#mcr').innerText.includes('\u00b7') }; });
                    await q(() => document.querySelector('#cta').click());
                    try { await pg.waitForURL(/checkout/, { timeout: 25000 }); await pg.waitForTimeout(6000); v[key] = { reached: true, url: pg.url().split('?')[0].replace(/\/cn\/.*/, '/cn/...'), answers: answers.slice(), text: (await q(() => document.body.innerText.replace(/\s+/g, ' ').slice(0, 900))) }; }
                    catch (e) { v[key] = { reached: false, url: pg.url(), answers: answers.slice(), toast: await q(() => (document.querySelector('#toast') || {}).innerText || '') }; }
                    await pg.screenshot({ path: `${OUT}/${shot}` });
                  }
                }
              }
              await ctx.close();
            }
            await br.close(); fs.writeFileSync(`${OUT}/result.json`, JSON.stringify(log, null, 1)); console.log(JSON.stringify(log, null, 1));
          })().catch((e) => { fs.writeFileSync(`${process.env.OUT}/result.json`, JSON.stringify({ fatal: String(e), log })); console.error(e); process.exit(0); });
          EOF
          node shot.js
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          git commit -m "dkr-shot: the test page" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
