name: drawer-recon
# run 51 — relay the Official Sample Booklet render into the repo
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch booklet
        run: |
          mkdir -p lp-factory/pages/pdp-kits-lp/assets
          curl -fsSL "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/15_4c9e6b44-6d32-41cf-942f-1fb76fa84250.png?v=1786843812&width=220" -o lp-factory/pages/pdp-kits-lp/assets/booklet-220.png
          ls -la lp-factory/pages/pdp-kits-lp/assets/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-kits-lp/assets
          git commit -m "booklet render relay (bot)"
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
