name: paint-trace
# Paint timeline of the LIVE kits page: first paint, pre-hero, theme header, theme.css (mc-tcss), app mount, first-tap latency (step 1 → step 2) with long tasks, top resources by weight; CDP throttling (1.6 Mbps / 150 ms RTT / 4x CPU) on a phone, the same with third-party scripts blocked, unthrottled phone and desktop. Edit this line and push to run. Run 2 (2026-10-22 22:3x UTC): ticks start at document creation (v1 started them at DOMContentLoaded, so its marks were wrong).
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/paint-trace.yml']
permissions:
  contents: write
concurrency: paint-trace
env:
  URL: https://maisoncroyez.com/pages/diffuser-kits
  OUT: lp-factory/pages/diffuser-kits/perf
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.49.0 && npx playwright install --with-deps chromium
      - name: Trace
        run: |
          mkdir -p "$OUT"
          cat > trace.mjs <<'EOF2'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const URL0 = process.env.URL, OUT = process.env.OUT;
          const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 13) + 'Z';
          const b = await chromium.launch();
          const out = [];
          const RUNS = [{ id: 'phone-slow-1', m: true, slow: true }, { id: 'phone-slow-2', m: true, slow: true }, { id: 'phone-slow-no3p', m: true, slow: true, no3p: true }, { id: 'phone-fast', m: true, slow: false }, { id: 'desktop', m: false, slow: false }];
          const THIRD = /connect\.facebook\.net|facebook\.com\/tr|clarity\.ms|klaviyo\.com|postscript\.io|gorgias|9gtb\.com|subi\.co|jointrybe|bing\.com|googletagmanager|google-analytics|doubleclick|tiktok|hotjar/;
          for (const R of RUNS) {
            const ctx = await b.newContext(R.m ? { viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1' } : { viewport: { width: 1366, height: 900 } });
            const pg = await ctx.newPage();
            const cdp = await ctx.newCDPSession(pg);
            await cdp.send('Network.enable');
            if (R.no3p) await pg.route((u) => THIRD.test(u.href), (route) => route.abort());
            if (R.slow) { await cdp.send('Network.emulateNetworkConditions', { offline: false, latency: 150, downloadThroughput: 1.6 * 1024 * 1024 / 8, uploadThroughput: 750 * 1024 / 8 }); await cdp.send('Emulation.setCPUThrottlingRate', { rate: 4 }); }
            await pg.addInitScript(() => {
              window.__lcp = []; window.__marks = {};
              const desc = (el) => el ? el.tagName + (el.id ? '#' + el.id : '') + (el.className && typeof el.className === 'string' ? '.' + el.className.trim().replace(/\s+/g, '.').slice(0, 40) : '') : null;
              try { new PerformanceObserver((l) => { for (const e of l.getEntries()) window.__lcp.push({ render: Math.round(e.renderTime || 0), load: Math.round(e.loadTime || 0), size: e.size, el: desc(e.element), url: (e.url || '').slice(0, 60) }); }).observe({ type: 'largest-contentful-paint', buffered: true }); } catch (e) {}
              try { new PerformanceObserver((l) => { for (const e of l.getEntries()) window.__marks[e.name] = Math.round(e.startTime); }).observe({ type: 'paint', buffered: true }); } catch (e) {}
              try { window.__cls = 0; new PerformanceObserver((l) => { for (const e of l.getEntries()) if (!e.hadRecentInput) window.__cls += e.value; }).observe({ type: 'layout-shift', buffered: true }); } catch (e) {}
              const now = () => Math.round(performance.now());
              const tick = () => {
                const M = window.__marks;
                if (!M.tcss && document.documentElement.classList.contains('mc-tcss')) M.tcss = now();
                const p = document.getElementById('mc-prehero');
                if (p && !M.prehero) M.prehero = now();
                if (p && !M.preheroVisible) { const cs = getComputedStyle(p); if (cs.display !== 'none' && cs.visibility !== 'hidden' && p.getBoundingClientRect().height > 0) M.preheroVisible = now(); }
                if (p && !M.prehide && getComputedStyle(p).display === 'none') M.prehide = now();
                const im = document.getElementById('mc-hero-p'); if (im && im.complete && !M.preImgComplete) M.preImgComplete = now();
                const h = document.querySelector('.shopify-section--header'); if (h && !M.headerVisible && getComputedStyle(h).display !== 'none' && h.getBoundingClientRect().height > 0) M.headerVisible = now();
                const r = document.getElementById('root'); if (r && r.children.length && !M.appMount) M.appMount = now();
                if (!M.buybox && document.querySelector('#buybox .btn')) M.buybox = now();
                if (!M.heroImg) { const hi = document.querySelector('#root .hero img, #root img.hs-img, #root .hs img'); if (hi && hi.complete && hi.naturalWidth > 0) M.heroImg = now(); }
              };
              window.__lt = []; try { new PerformanceObserver((l) => { for (const e of l.getEntries()) window.__lt.push([Math.round(e.startTime), Math.round(e.duration)]); }).observe({ type: 'longtask', buffered: true }); } catch (e) {}
              const start = () => { if (!document.documentElement) return setTimeout(start, 5); tick(); try { new MutationObserver(tick).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] }); } catch (e) {} setInterval(tick, 30); };
              start();
            });
            const navStart = Date.now();
            try { await pg.goto(URL0, { waitUntil: 'commit', timeout: 120000 }); } catch (e) { console.log('goto', e.message); }
            let tap = null;
            try {
              await pg.waitForSelector('#buybox .btn.atc', { timeout: R.slow ? 20000 : 10000 });
              await pg.waitForTimeout(800);
              const t0 = await pg.evaluate(() => Math.round(performance.now()));
              await pg.tap('#buybox .btn.atc');
              const t1 = await pg.evaluate(() => Math.round(performance.now()));
              let found = null; for (let i = 0; i < 160; i++) { const ok = await pg.evaluate(() => !!document.querySelector('#buybox .pick.e4t, #buybox .picker .pick')); if (ok) { found = await pg.evaluate(() => Math.round(performance.now())); break; } await pg.waitForTimeout(25); }
              await pg.waitForTimeout(2500);
              const after = await pg.evaluate((t0) => ({ lt: (window.__lt || []).filter((x) => x[0] >= t0 - 50 && x[0] < t0 + 3000), imgs: [...document.querySelectorAll('#buybox .pick.e4t img, #buybox .picker img')].map((i) => i.complete && i.naturalWidth > 0).filter(Boolean).length, tiles: document.querySelectorAll('#buybox .pick.e4t, #buybox .picker .pick').length }), t0);
              tap = { at: t0, handled: t1 - t0, step2: found ? found - t0 : null, longTasksAfter: after.lt, tiles: after.tiles, tileImgsLoaded: after.imgs };
            } catch (e) { tap = { error: e.message.slice(0, 120) }; }
            await pg.waitForTimeout(R.slow ? 4000 : 2000);
            await pg.mouse.click(5, 5); await pg.waitForTimeout(400);
            const r = await pg.evaluate(() => {
              const res = performance.getEntriesByType('resource').filter((e) => /theme\.css|theme\.js|mc-dk|mc-lp-vendor|mc-lp-diffuser|mc-hero|mc-dk-hero|fbevents|clarity|wpm|klaviyo|subi|vendor\.js|\/cdn\/shop\/t\//.test(e.name)).map((e) => ({ n: e.name.replace(/^https?:\/\/[^/]+/, '').split('?')[0].slice(-48), start: Math.round(e.startTime), end: Math.round(e.responseEnd), kb: Math.round((e.transferSize || e.encodedBodySize || 0) / 1024), blocking: e.renderBlockingStatus || '' })).sort((a, b) => a.end - b.end);
              const nav = performance.getEntriesByType('navigation')[0];
              const hdr = document.querySelector('.shopify-section--header'); const ann = document.querySelector('.shopify-section--announcement-bar');
              const top = performance.getEntriesByType('resource').map((e) => ({ n: e.name.replace(/^https?:\/\//, '').split('?')[0].slice(-60), kb: Math.round((e.transferSize || 0) / 1024), start: Math.round(e.startTime), end: Math.round(e.responseEnd), t: e.initiatorType })).sort((a, b) => b.kb - a.kb).slice(0, 25);
              return { top, longTasks: (window.__lt || []).slice(0, 60), lcp: window.__lcp, marks: window.__marks, cls: Math.round((window.__cls || 0) * 1000) / 1000, nav: nav ? { ttfb: Math.round(nav.responseStart), dcl: Math.round(nav.domContentLoadedEventEnd), load: Math.round(nav.loadEventEnd), htmlKb: Math.round((nav.transferSize || 0) / 1024) } : null, res, header: { ann: ann ? Math.round(ann.getBoundingClientRect().height) : null, hdr: hdr ? Math.round(hdr.getBoundingClientRect().height) : null }, resCount: performance.getEntriesByType('resource').length, resKb: Math.round(performance.getEntriesByType('resource').reduce((a, e) => a + (e.transferSize || 0), 0) / 1024) };
            });
            r.id = R.id; r.tap = tap; out.push(r);
            console.log('==', R.id, JSON.stringify(r.nav), 'cls', r.cls, 'marks', JSON.stringify(r.marks), 'header', JSON.stringify(r.header), 'resources', r.resCount, r.resKb + ' KB');
            console.log('  tap', JSON.stringify(r.tap)); console.log('  longTasks', JSON.stringify(r.longTasks)); for (const x of r.top) console.log('  top', JSON.stringify(x));
            for (const c of r.lcp) console.log('  LCP candidate', JSON.stringify(c));
            for (const x of r.res) console.log('  res', JSON.stringify(x));
            await ctx.close();
          }
          await b.close();
          fs.writeFileSync(`${OUT}/paint-${stamp}.json`, JSON.stringify(out, null, 1));
          EOF2
          node trace.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"; git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          git commit -m "perf: paint timeline of the live kits page" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
