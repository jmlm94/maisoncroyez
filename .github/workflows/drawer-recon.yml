name: drawer-recon
# run 92 — fetch vendor+assets for deploy
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          mkdir -p lp-factory/pages/kits-lp/live
          curl -sSL "$B/mc-lp-diffuser-assets.js?v=1783553191" -o lp-factory/pages/kits-lp/live/mc-lp-diffuser-assets.js
          ls -la lp-factory/pages/kits-lp/live/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live
          git commit -m "recon r92: diffuser assets map"
          git push
