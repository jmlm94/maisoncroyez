name: drawer-recon
# run 155 — origin gate polish round: 100ml pill, pick-count size, spacing rules
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          curl -s "$B/mc-6mp-app.js?v=og$RANDOM$RANDOM" -o /tmp/app.js
          curl -s "$B/mc-6mp.css?v=og$RANDOM$RANDOM" -o /tmp/k.css
          echo "appBytes=$(wc -c < /tmp/app.js)"
          echo "ml=$(grep -c 'pick-ml' /tmp/app.js || true)"
          echo "guard=$(grep -c '__MC_KX_APP__' /tmp/app.js)"
          echo "cssMl=$(grep -c 'pick-ml' /tmp/k.css || true)"
          echo "gap38=$(grep -c 'margin-top:38px' /tmp/k.css || true)"
          echo "neg4=$(grep -c 'margin-top:-4px' /tmp/k.css || true)"
          echo "cnt=$(grep -c 'font-size:1.02rem' /tmp/k.css || true)"
