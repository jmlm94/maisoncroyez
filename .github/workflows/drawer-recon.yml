name: drawer-recon
# run 121 — live verify brand fonts everywhere (key p6m8)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          await p.goto('https://maisoncroyez.com/pages/six-month-program?utm_campaign=diag121',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(9000);
          await p.evaluate(()=>document.fonts.ready);
          const d=await p.evaluate(()=>{
            const ff=s=>{const e=document.querySelector(s);return e?getComputedStyle(e).fontFamily.slice(0,24):null;};
            const fw=s=>{const e=document.querySelector(s);return e?getComputedStyle(e).fontWeight:null;};
            const lh=s=>{const e=document.querySelector(s);return e?getComputedStyle(e).lineHeight:null;};
            return {h1:ff('.pdp-buy h1'), h1w:fw('.pdp-buy h1'), h1lh:lh('.pdp-buy h1'),
              h2:ff('h2'), base:ff('#root'), kitPrice:ff('.kit-price'), planName:ff('.plan-name'),
              para:ff('.pick-desc')||ff('#root p')};});
          console.log('R121 '+JSON.stringify(d)+' errs='+JSON.stringify(errs));
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-390.png', fullPage:false});
          await p.evaluate(()=>{const e=document.querySelector('h1'); if(e) e.scrollIntoView({block:'center'});});
          await p.waitForTimeout(600);
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-hero2.png'});
          await p.evaluate(()=>{const hs=[...document.querySelectorAll('h2')]; if(hs[1]) hs[1].scrollIntoView();});
          await new Promise(r=>setTimeout(r,900));
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-belowfold.png'});
          await b.close();})();
          EOS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live
          git commit -m "recon r121: brand fonts live verify" || echo "no changes"
          git push || echo "no push"
