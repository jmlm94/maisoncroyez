name: drawer-recon
# run 138 — origin gate: confirm mc-lp-vendor.js now serves the slim preact bundle
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          U="https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-lp-vendor.js?v=og$RANDOM$RANDOM"
          curl -s "$U" -o /tmp/v.js
          echo "bytes=$(wc -c < /tmp/v.js)"
          echo "preact=$(grep -c 'preactHooks' /tmp/v.js || true)"
          echo "shim=$(grep -c 'createRoot' /tmp/v.js || true)"
          echo "react=$(grep -c 'react.production' /tmp/v.js || true)"
          gzip -c /tmp/v.js | wc -c
