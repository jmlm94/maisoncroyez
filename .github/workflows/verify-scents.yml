name: verify-scents
# run: 2 — templateSuffix -> collection-landing-page (default collection.json was the same Instant section; banner renders description)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/verify-scents.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scents PDP
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > check.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          const errs=[];
          page.on('pageerror', e=>errs.push('PAGEERROR: '+String(e).slice(0,200)));
          let fresh=false;
          for(let a=0;a<8;a++){
            const nav=await page.goto('https://maisoncroyez.com/collections/power-fragrances?cb='+Date.now(),{waitUntil:'load',timeout:60000});
            console.log('goto '+(a+1)+': '+(nav?nav.status():'?'));
            if(nav && nav.status()===200){
              await page.waitForTimeout(8000);
              fresh=await page.evaluate(()=>!!document.getElementById('mc-scents-root'));
              console.log('mc-scents-root present: '+fresh);
              if(fresh) break;
            }
            await page.waitForTimeout(60000);
          }
          const audit=await page.evaluate(()=>{
            const r=document.getElementById('mc-scents-root');
            if(!r) return {found:false};
            const t=document.body.innerText;
            return {
              found:true,
              h1:(r.querySelector('h1')||{}).innerText||'MISSING',
              picks:r.querySelectorAll('.picker .pick').length,
              usps:r.querySelectorAll('.usp').length,
              subPlanVisible:(()=>{const p=r.querySelector('#sx-subplan');return p?getComputedStyle(p).display!=='none':false;})(),
              price:(r.querySelector('#sx-price')||{}).innerText||'?',
              atcLabel:(r.querySelector('#sx-atclabel')||{}).innerText||'MISSING',
              chapters:r.querySelectorAll('.icard').length,
              flatImgs:[...r.querySelectorAll('.icard img')].filter(i=>/mc-scents-flat/.test(i.currentSrc||i.src)).length,
              sections:{oils:!!r.querySelector('.oils'), sig:!!r.querySelector('.sig'), revs:r.querySelectorAll('.rev').length, faq:r.querySelectorAll('.qa').length, ctabreak:!!r.querySelector('.ctabreak')},
              rootVisible:(()=>{const rc=r.getBoundingClientRect();return rc.height>2000&&getComputedStyle(r).display!=='none';})(),
              noOldGrid:!/Shop Now/.test(t),
              noStaleAnnouncement:!/Just pick the scent|The diffuser is free/i.test(t),
              overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth+2
            };
          });
          console.log('=== AUDIT ==='); console.log(JSON.stringify(audit,null,1));
          await page.screenshot({ path:'scents-live-full.png', fullPage:true });
          const grab=async()=>page.evaluate(async()=>{
            for(let a=0;a<6;a++){
              const r=await fetch('/cart.js'); const txt=await r.text();
              try{ const j=JSON.parse(txt); return {total:j.total_price/100, n:j.items.length, plan:j.items.some(i=>i.selling_plan_allocation), title:(j.items[0]||{}).variant_title||''}; }
              catch(e){ await new Promise(res=>setTimeout(res,4000)); }
            }
            return {total:-1, gated:true};
          });
          // image swap probe: pick Midnight Sensation
          await page.evaluate(()=>{[...document.querySelectorAll('#mc-scents-root .picker .pick')].find(p=>p.getAttribute('data-key')==='midnight').click();});
          await page.waitForTimeout(600);
          const imgMid=await page.evaluate(()=>(document.querySelector('#sx-mainimg')||{}).src||'');
          console.log('=== IMG AFTER MIDNIGHT PICK === '+imgMid.split('/').pop().slice(0,40));
          // one-time ATC (plan hidden while PLAN_ID=0)
          await page.evaluate(()=>{document.querySelector('#sx-atc').scrollIntoView({block:'center'})});
          await page.waitForTimeout(400);
          await page.click('#sx-atc');
          await page.waitForTimeout(7000);
          const cart=await grab();
          const drawer=await page.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            if(!d) return {found:false};
            const cs=getComputedStyle(d);
            return {found:true, open:d.hasAttribute('open')||cs.visibility==='visible',
              standard:!d.querySelector('.mc-shipbar')&&!d.querySelector('.mc-testi')&&!d.querySelector('.mc-trust')};
          });
          console.log('=== CART (expect 49.95 one-time Midnight, no plan) === '+JSON.stringify(cart));
          console.log('=== DRAWER === '+JSON.stringify(drawer));
          await page.screenshot({ path:'scents-drawer.png' });
          await page.evaluate(async()=>{ await fetch('/cart/clear.js',{method:'POST'}); });
          const checks={
            fresh, rootVisible:audit.rootVisible,
            title:/Manifestation & Attraction/.test(audit.h1)&&/100ml/.test(audit.h1),
            sevenPicks:audit.picks===7,
            usps3:audit.usps===3,
            subHiddenUntilPlan:!audit.subPlanVisible,
            oneTimePrice:audit.price==='$49.95',
            sevenChapters:audit.chapters===7,
            flatLays:audit.flatImgs===7,
            allSections:audit.sections.oils&&audit.sections.sig&&audit.sections.revs===2&&audit.sections.faq===4&&audit.sections.ctabreak,
            imgSwap:/mc-lp-d-frag7/.test(imgMid),
            noOldGrid:audit.noOldGrid,
            noStaleAnnouncement:audit.noStaleAnnouncement,
            noOverflow:!audit.overflowX,
            cartOneTime:cart.total===49.95&&!cart.plan&&/Midnight/.test(cart.title),
            drawerOpened:drawer.found&&drawer.open,
            drawerStandard:drawer.standard
          };
          console.log('=== VERDICT ===');
          Object.entries(checks).forEach(([k,v])=>console.log((v?'PASS':'FAIL')+' '+k));
          console.log('=== PAGE ERRORS ('+errs.length+') ==='); errs.slice(0,10).forEach(e=>console.log(' - '+e));
          await b.close();
          EOS
          node check.mjs 2>&1 | tee scents-verify-log.txt
      - name: Commit results
        if: always()
        run: |
          mkdir -p lp-factory/pages/pdp-scents/verify
          mv scents-live-full.png scents-drawer.png scents-verify-log.txt lp-factory/pages/pdp-scents/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-scents/verify
          git commit -m "verify-scents run 2: collection-landing-page template" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
