name: drawer-recon
# run 80 — kb19 live verify: compliments copy + flow sanity
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:412,height:823}});
          const errs=[];p.on('pageerror',e=>errs.push(String(e).slice(0,100)));
          await p.goto('https://maisoncroyez.com/pages/build-your-kit?utm_source=instagram&utm_medium=bio&utm_campaign=cp80',{waitUntil:'load',timeout:90000});
          await p.waitForTimeout(4000);
          const r=await p.evaluate(()=>({appKey:((document.querySelector('script[src*=\"mc-kit-app\"]')||{}).src||'').split('v=')[1],
            compliments:(document.querySelector('.compliments')||{}).textContent,
            cta:((document.querySelector('#s3 .navrow .btn:not(.secondary)')||{}).textContent||'').trim(),
            plans:document.querySelectorAll('.plan').length}));
          console.log('KB19 '+JSON.stringify({r,errs}));
          await b.close();})();
          EOS
