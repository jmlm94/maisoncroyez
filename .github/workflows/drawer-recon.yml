name: drawer-recon
# run 156 — live verify polish round (key p6m20) + announcement-bar revert check post-01:00Z flip
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          await p.goto('https://maisoncroyez.com/pages/six-month-program?utm_campaign=diag156',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(9000);
          const d=await p.evaluate(()=>{
            const q=s=>document.querySelector(s);
            const h1=q('.buybox h1'), rit=q('.ritual-incl');
            const grid=q('.kitgrid');
            const t2=[...document.querySelectorAll('.picker-title')].find(e=>/Your scents/.test(e.textContent));
            const cnt=q('.pick-count');
            const bannerSec=q('.shopify-section--announcement-bar');
            return {ml:document.querySelectorAll('.pick-ml').length,
              mlTxt:(q('.pick-ml')||{}).textContent,
              cntSize:cnt?getComputedStyle(cnt).fontSize:null,
              h1ToRitual:h1&&rit?Math.round(rit.getBoundingClientRect().top-h1.getBoundingClientRect().bottom):null,
              gridToTitle:grid&&t2?Math.round(t2.getBoundingClientRect().top-grid.getBoundingClientRect().bottom):null,
              key20:!!q('script[src*="p6m20"]'),
              annBarWow:bannerSec?/WOW/.test(bannerSec.textContent):null,
              annStyleTag:!!document.getElementById('mc-banner-style')};});
          console.log('R156 '+JSON.stringify(d)+' errs='+JSON.stringify(errs));
          await p.evaluate(()=>{const e=document.querySelector('.pick-count'); if(e) e.scrollIntoView({block:'start'});});
          await p.waitForTimeout(600);
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/final-scents.png'});
          await b.close();})();
          EOS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live
          git commit -m "recon r156: polish round live verify" || echo "no changes"
          git push || echo "no push"
