name: drawer-recon
# run 144 — origin gate: no-From price, supply badge removed, kg-compare bottom-anchor
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          curl -s "$B/mc-6mp-app.js?v=og$RANDOM$RANDOM" -o /tmp/app.js
          curl -s "$B/mc-6mp.css?v=og$RANDOM$RANDOM" -o /tmp/kits.css
          echo "appBytes=$(wc -c < /tmp/app.js)"
          echo "noFrom=$(grep -c 'From..b..199' /tmp/app.js || true)"
          echo "badge=$(grep -c 'SUPPLY PER DIFFUSER' /tmp/app.js || true)"
          echo "extra=$(grep -c 'Extra Mystery Scent' /tmp/app.js)"
          echo "guard=$(grep -c '__MC_KX_APP__' /tmp/app.js)"
          echo "cssBytes=$(wc -c < /tmp/kits.css)"
          echo "anchor=$(grep -c 'margin-top:auto;padding-top:6px' /tmp/kits.css || true)"
          echo "hardening=$(grep -c 'font-family:inherit' /tmp/kits.css || true)"
