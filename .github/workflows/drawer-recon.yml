name: drawer-recon
# run 97 — pixel diagnosis on product page
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const reqs=[];p.on('request',r=>{const u=r.url();if(/facebook|fbevents|connect\.facebook/.test(u))reqs.push(u.slice(0,110));});
          await p.goto('https://maisoncroyez.com/products/maison-croyez-manifestation-specia-bundles?utm_campaign=kx97',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(10000);
          const d=await p.evaluate(()=>({
            fbqType: typeof window.fbq,
            fbqLoaded: window.fbq ? !!window.fbq.loaded : null,
            fbqQueueLen: window.fbq && window.fbq.queue ? window.fbq.queue.length : null,
            trekkie: typeof window.ShopifyAnalytics,
            privacyApi: typeof window.Shopify !== 'undefined' && !!(window.Shopify.customerPrivacy),
            marketingAllowed: (window.Shopify && window.Shopify.customerPrivacy && window.Shopify.customerPrivacy.marketingAllowed) ? window.Shopify.customerPrivacy.marketingAllowed() : 'n/a',
            analyticsAllowed: (window.Shopify && window.Shopify.customerPrivacy && window.Shopify.customerPrivacy.analyticsProcessingAllowed) ? window.Shopify.customerPrivacy.analyticsProcessingAllowed() : 'n/a',
            saleOfDataRegion: (window.Shopify && window.Shopify.customerPrivacy && window.Shopify.customerPrivacy.saleOfDataRegion !== undefined) ? window.Shopify.customerPrivacy.saleOfDataRegion : 'n/a',
            mcGuard: !!window.__MC_KX_APP__,
          }));
          console.log('R97 '+JSON.stringify({d, fbRequests: reqs.slice(0,6), nReqs: reqs.length}));
          await b.close();})();
          EOS
