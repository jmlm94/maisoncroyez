name: drawer-recon
# run 132 — probe hero image CDN variants (size/type) to pick lightest for LCP
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files/Diseno_sin_titulo_92.png"
          for Q in "width=900" "width=780" "width=660" "width=780&format=pjpg" "width=780&crop=center" ; do
            echo "--- $Q (accept webp/avif) ---"
            curl -s -o /tmp/img -w "http=%{http_code} bytes=%{size_download} type=%{content_type}\n" -H "Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8" -H "Accept-Encoding: gzip, deflate, br" "$B?v=1783904283&$Q"
            echo "--- $Q (accept png only) ---"
            curl -s -o /tmp/img -w "http=%{http_code} bytes=%{size_download} type=%{content_type}\n" -H "Accept: image/png" "$B?v=1783904283&$Q"
          done
