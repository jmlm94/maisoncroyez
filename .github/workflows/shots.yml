name: shots
# v2: phone screenshots of the live /pages/free-diffusers (fd7) + the cart drawer exactly as a visitor gets it (page pins the drawer build).
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/shots.yml']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.49.0 && npx playwright install --with-deps chromium
      - name: Shoot
        run: |
          mkdir -p lp-factory/pages/free-diffusers/shots
          cat > shots.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const OUT = 'lp-factory/pages/free-diffusers/shots/';
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
          const pg = await ctx.newPage();
          await pg.goto('https://maisoncroyez.com/pages/free-diffusers', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await pg.waitForSelector('#buybox .tiers', { timeout: 60000 }); await pg.waitForTimeout(2500);
          await pg.screenshot({ path: OUT + '1-top.png' });
          await pg.evaluate(() => document.querySelector('#buybox .tiers').scrollIntoView({ block: 'start' })); await pg.waitForTimeout(400);
          await pg.screenshot({ path: OUT + '2-kits.png' });
          await pg.click('#buybox .tier:nth-child(2)'); await pg.waitForTimeout(200);
          await pg.evaluate(() => document.querySelector('#buybox .step-next').scrollIntoView({ block: 'center' })); await pg.locator('#buybox .step-next').click(); await pg.waitForTimeout(500);
          const c = pg.locator('#buybox .pick.compact'); await c.nth(0).click(); await pg.waitForTimeout(150); await c.nth(6).click(); await pg.waitForTimeout(300);
          await pg.click('#buybox .navrow .btn.atc'); await pg.waitForTimeout(700);
          await pg.evaluate(() => document.querySelector('#buybox .kitrev').scrollIntoView({ block: 'start' })); await pg.waitForTimeout(400);
          await pg.screenshot({ path: OUT + '3-review.png' });
          await pg.evaluate(() => document.querySelector('#buybox .plan-opts').scrollIntoView({ block: 'start' })); await pg.waitForTimeout(400);
          await pg.screenshot({ path: OUT + '4-options.png' });
          // v2: NO injection — the page body now pins mc-drawer.js?v=dr-d8b7912 itself; this run proves that on its own
          console.log('drawer scripts', JSON.stringify(await pg.evaluate(() => [...document.scripts].filter((x) => /mc-drawer/.test(x.src)).map((x) => x.src.split('?')[1]))));
          await pg.evaluate(() => document.querySelector('#buybox .btn.atc').scrollIntoView({ block: 'center' })); await pg.locator('#buybox .btn.atc').click();
          await pg.waitForTimeout(6000);
          await pg.screenshot({ path: OUT + '5-drawer.png' });
          const d = pg.locator('#cart-drawer');
          const box = await d.boundingBox();
          console.log('drawer box', JSON.stringify(box), 'scrollW', await pg.evaluate(() => { const i = document.querySelector('#cart-drawer .cart-drawer__top').parentElement; return i.scrollWidth + '/' + i.clientWidth; }));
          try { await pg.evaluate(() => { const r = document.querySelector('#cart-drawer .mc-fa'); r && r.scrollIntoView({ block: 'center' }); }); await pg.waitForTimeout(400); await pg.screenshot({ path: OUT + '6-drawer-row.png' }); } catch (e) {}
          await b.close();
          EOF2
          node shots.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"; git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/free-diffusers/shots
          git commit -m "shots: live fd7 + fresh drawer (phone)" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
