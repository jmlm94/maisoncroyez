name: verify-lp
# run: 21 — confirm advertorial CTA URL swap
on:
  push:
    branches: [claude/maison-landing-page-iyikm5]
    paths: ['.github/workflows/verify-lp.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check served advertorial app.js for new CTA URL
        run: |
          H=$(date -u +%Y%m%d%H)
          for key in "$H" "chk$(date +%s)"; do
            curl -sSL -o /tmp/a "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-lp-adv-scent-ritual-app.js?v=$key"
            NEW=$(grep -c 'pages/diffuser' /tmp/a || true)
            OLD=$(grep -c 'products/diffuser-scents' /tmp/a || true)
            echo "v=$key -> pages/diffuser=$NEW  products/diffuser-scents=$OLD  bytes=$(wc -c </tmp/a)"
          done
          echo "== live page HTML loader hour =="
          curl -sSL "https://maisoncroyez.com/pages/adv-scent-ritual?cb=$(date +%s)" | grep -o "mc-lp-adv-scent-ritual-app" | head -1
