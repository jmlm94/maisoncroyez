name: drawer-recon
# run 177 — verify the cleaned sitewide cart drawer (no mystery-scent line, no kids & pets badge, no cat clause) after an ATC on the v3 page
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Live verify
        run: |
          mkdir -p lp-factory/sitewide-drawer/verify
          cat > r177.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 } });
          const pg = await ctx.newPage();
          const errs = [];
          pg.on('pageerror', e => errs.push(e.message.slice(0, 200)));
          const drawerReq = [];
          pg.on('response', r => { if (r.url().includes('mc-drawer.js')) drawerReq.push([r.url().slice(-40), r.status(), r.headers()['content-length'] || '']); });
          await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await pg.waitForSelector('.tiers', { timeout: 60000 });
          await pg.waitForTimeout(4000);
          await pg.locator('.btn.atc').scrollIntoViewIfNeeded(); await pg.waitForTimeout(2500);
          await pg.locator('.btn.atc').click(); await pg.waitForTimeout(8000);
          const d = await pg.evaluate(() => { const dr = document.getElementById('cart-drawer'); const t = dr ? dr.innerText : ''; return { hasDrawer: !!dr, mystery: /mystery/i.test(t), kids: /kids/i.test(t), cat: /my cat/i.test(t), freeShipBadge: /Free\s*Shipping/i.test(t), attention: /Attention:/i.test(t), total: (t.match(/Today's total:\s*\$?[0-9.,]+/) || [''])[0], text: t.replace(/\s+/g, ' ').slice(0, 700) }; });
          console.log('DRAWER ' + JSON.stringify(d));
          console.log('DRAWERJS ' + JSON.stringify(drawerReq));
          await pg.screenshot({ path: 'lp-factory/sitewide-drawer/verify/drawer-clean-v3.png' });
          await pg.evaluate(() => fetch('/cart/clear.js', { method: 'POST' })).catch(() => {});
          console.log('ERRORS ' + JSON.stringify(errs.slice(0, 6)));
          await b.close();
          EOF2
          node r177.mjs
      - name: Commit screenshots
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/sitewide-drawer/verify/drawer-clean-v3.png
          git commit -m "r177: cleaned drawer live screenshot" || exit 0
          git push
