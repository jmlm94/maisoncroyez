name: ritual-shot
# Phone + desktop screenshots of the live ritual page (top of page and full page) plus the header price, key and errors. Edit this line and push to run. Run 2026-10-21 after rt21 (key rt21-d0937da): the struck header price must read $209.80 (diffuser value $89.95).
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/ritual-shot.yml']
permissions:
  contents: write
env:
  URL: https://maisoncroyez.com/pages/manifestation-ritual
  OUT: lp-factory/pages/free-diffusers/ritual/shots
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Shoot
        run: |
          mkdir -p "$OUT"
          cat > shot.mjs <<'EOF2'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const URL0 = process.env.URL, OUT = process.env.OUT; const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 13);
          const b = await chromium.launch(); const notes = [];
          for (const [vp, W, H, mobile] of [['phone', 390, 844, true], ['desktop', 1366, 900, false]]) {
            const ctx = await b.newContext(mobile ? { viewport: { width: W, height: H }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1' } : { viewport: { width: W, height: H } });
            const pg = await ctx.newPage(); const errs = []; pg.on('pageerror', (e) => errs.push(e.message.slice(0, 120)));
            await pg.goto(URL0, { waitUntil: 'load', timeout: 90000 }); await pg.waitForSelector('#buybox .hd-price', { timeout: 45000 }).catch(() => {}); await pg.waitForTimeout(1500);
            await pg.screenshot({ path: `${OUT}/${stamp}-${vp}-top.png` });
            for (let y = 0; y < 12000; y += 600) { await pg.evaluate((y) => window.scrollTo(0, y), y); await pg.waitForTimeout(120); }
            await pg.evaluate(() => window.scrollTo(0, 0)); await pg.waitForTimeout(800);
            await pg.screenshot({ path: `${OUT}/${stamp}-${vp}-full.png`, fullPage: true });
            const d = await pg.evaluate(() => { const tx = (e) => (e ? (e.innerText || '').replace(/\s+/g, ' ').trim() : null); return { key: (([...document.scripts].find((x) => /mc-rt-app\.js/.test(x.src)) || {}).src || 'none').split('v=')[1], title: document.title, h1: tx(document.querySelector('#buybox h1')), price: tx(document.querySelector('.hd-price')), struck: tx(document.querySelector('.hd-price s')), btn: tx(document.querySelector('#buybox .btn.atc')), value: [...document.querySelectorAll('#buybox *')].map((e) => e.childNodes.length === 1 && e.firstChild.nodeType === 3 ? e.textContent.trim() : '').filter((t) => /\$(199\.85|209\.80|80\b|89\.95)/.test(t)).slice(0, 8) }; });
            notes.push(`${vp} ${W}x${H}: ${JSON.stringify({ ...d, errs })}`); console.log(notes[notes.length - 1].slice(0, 4000));
            await ctx.close();
          }
          await b.close(); fs.writeFileSync(`${OUT}/${stamp}-notes.txt`, notes.join('\n'));
          EOF2
          node shot.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          git commit -m "ritual-shot: live ritual page screenshots" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
