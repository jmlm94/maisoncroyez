name: fetch-lp-assets
# Relay: fetches generated LP media past the sandbox egress allowlist.
# run: diseno-92 hero for free-diffuser gallery embed
on:
  workflow_dispatch:
  push:
    branches: [claude/maison-landing-page-iyikm5]
    paths: ['.github/workflows/fetch-lp-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch diseno-92 into gallery embeds
        run: |
          set -euo pipefail
          sudo apt-get update -yq >/dev/null && sudo apt-get install -yq imagemagick >/dev/null
          DIR=lp-factory/pages/pdp-diffuser/assets/gallery
          curl -fsSL -o /tmp/d92.png "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/Diseno_sin_titulo_92.png?v=1783904283"
          convert /tmp/d92.png -resize 900x900 -quality 82 "$DIR/Diseno_sin_titulo_92.jpg"
          ls -la "$DIR"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-diffuser/assets/gallery
          git commit -m "Gallery embed: diseno-92 hero"
          git pull --rebase origin claude/maison-landing-page-iyikm5
          git push
