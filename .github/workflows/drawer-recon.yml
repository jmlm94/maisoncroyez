name: drawer-recon
# run 253 — fd16 perf (2026-09-25): (1) the pre-hero poster is an inline WebP data URI (no CDN request; the app adopts the
#           same <img>) — check: the hero img src is data:image/webp, byte-identical (sha-256) to deploy-ready/page-body.html,
#           the video poster is the same data URI, no mc-hero-poster.jpg request; (2) shim tier C holds connect.facebook.net
#           (fbevents.js) until the first touch/scroll/key or 5 s — check: fbevents ABSENT when the buy box appears (unless that
#           took >= 4.8 s), PRESENT after the funnel clicks, PageView beacon still recorded (after the release). Everything else
#           as r253 (deferred tiers A/B, sections on scroll-near, owner step-3 rule, AddToCart x lines, InitiateCheckout).
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Wait for the page cache (one-off after the fd13 publish)
        run: sleep 120
      - name: Funnel
        run: |
          mkdir -p lp-factory/pages/free-diffusers/recon/r253
          cat > r253.mjs <<'EOF2'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import crypto from 'crypto';
