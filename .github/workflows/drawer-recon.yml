name: drawer-recon
# run 200 — confirm the CDN copy of mc-adv-ritual-app.js (fresh cache key) has no "45+" left; the-scent-story page picks it up at the next hour flip (ss19-<hour> loader key)
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CDN file with a fresh key
        run: |
          N=$(date +%s)
          curl -sS "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-adv-ritual-app.js?v=fresh-$N" -o adv.js
          echo "bytes: $(wc -c < adv.js)"
          echo "count 45+: $(grep -o '45+' adv.js | wc -l)"
          echo "count 'lasts 30+ days': $(grep -o 'lasts 30+ days' adv.js | wc -l)"
          grep -o '.\{40\}45+.\{30\}' adv.js || echo "no 45+ in CDN file"
          curl -sS "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-adv-ritual-app.js?v=ss19-$(date -u +%Y%m%d%H)" -o adv-hourkey.js
          echo "hour-key copy bytes: $(wc -c < adv-hourkey.js), 45+ count: $(grep -o '45+' adv-hourkey.js | wc -l)"
