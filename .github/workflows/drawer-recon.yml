name: drawer-recon
# run 88 — fetch intentions image for artifact embed
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit
        run: |
          curl -sSL "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-lp-intentions-v2.jpg?v=1785962123&width=900" -o /tmp/intent.jpg
          ls -la /tmp/intent.jpg
          file /tmp/intent.jpg
          mkdir -p lp-factory/pages/kits-lp
          base64 -w0 /tmp/intent.jpg > lp-factory/pages/kits-lp/intentions-v2.b64
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/intentions-v2.b64
          git commit -m "recon r88: intentions image base64 for artifact embed"
          git push
