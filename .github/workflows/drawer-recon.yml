name: drawer-recon
# run 70 — prehero LCP-candidate diagnosis: why does #kb-pre img never register as LCP?
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          D=lp-factory/pages/kit-builder/verify/qa70
          mkdir -p $D
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();
          // Context A: app JS blocked -> prehero stays; what does the browser say?
          const p=await b.newPage({viewport:{width:412,height:823}});
          await p.route('**/mc-kit-app.js*',r=>r.abort());
          await p.addInitScript(()=>{window.__lcp=[];new PerformanceObserver(l=>{for(const e of l.getEntries())window.__lcp.push({tag:e.element?e.element.tagName:null,cls:e.element?String(e.element.className).slice(0,40):null,id:e.element?e.element.id:null,pid:e.element&&e.element.parentElement?e.element.parentElement.id:null,size:e.size,t:Math.round(e.startTime)})}).observe({type:'largest-contentful-paint',buffered:true});});
          await p.goto('https://maisoncroyez.com/pages/build-your-kit?utm_source=instagram&utm_medium=bio&utm_campaign=perf70a',{waitUntil:'load',timeout:90000});
          await p.waitForTimeout(7000);
          const A=await p.evaluate(()=>{const img=document.querySelector('#kb-pre img');const cs=getComputedStyle(img);const r=img.getBoundingClientRect();
            let anc=[],el=img;while(el&&el!==document.documentElement){const s=getComputedStyle(el);
              const bad=[];if(s.transform!=='none')bad.push('transform:'+s.transform.slice(0,30));if(s.filter&&s.filter!=='none')bad.push('filter');if(s.contain&&s.contain!=='none')bad.push('contain:'+s.contain);if(s.willChange&&s.willChange!=='auto')bad.push('willChange:'+s.willChange);if(parseFloat(s.opacity)<1)bad.push('opacity:'+s.opacity);if(s.contentVisibility&&s.contentVisibility!=='visible')bad.push('cv:'+s.contentVisibility);if(s.clipPath&&s.clipPath!=='none')bad.push('clip');if(s.overflow!=='visible'&&el!==document.body)bad.push('overflow:'+s.overflow);
              if(bad.length)anc.push(el.tagName+'.'+String(el.className).slice(0,30)+'['+bad.join(',')+']');el=el.parentElement;}
            return {rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},
              opacity:cs.opacity,visibility:cs.visibility,display:cs.display,pos:cs.position,
              complete:img.complete,natW:img.naturalWidth,ancestors:anc,lcp:window.__lcp};});
          console.log('A-BLOCKED '+JSON.stringify(A));
          await p.screenshot({path:'lp-factory/pages/kit-builder/verify/qa70/blocked.png'});
          await p.close();
          // Context B: normal load; buffered LCP entries show every candidate Chrome emitted
          const q=await b.newPage({viewport:{width:412,height:823}});
          await q.addInitScript(()=>{window.__lcp=[];new PerformanceObserver(l=>{for(const e of l.getEntries())window.__lcp.push({tag:e.element?e.element.tagName:null,cls:e.element?String(e.element.className).slice(0,40):null,pid:e.element&&e.element.parentElement?e.element.parentElement.id:null,size:e.size,t:Math.round(e.startTime)})}).observe({type:'largest-contentful-paint',buffered:true});});
          await q.goto('https://maisoncroyez.com/pages/build-your-kit?utm_source=instagram&utm_medium=bio&utm_campaign=perf70b',{waitUntil:'load',timeout:90000});
          await q.waitForTimeout(6000);
          const B=await q.evaluate(()=>window.__lcp);
          console.log('B-NORMAL '+JSON.stringify(B));
          await b.close();})();
          EOS
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kit-builder/verify
          git commit -m "kb16 prehero diagnosis r70 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
