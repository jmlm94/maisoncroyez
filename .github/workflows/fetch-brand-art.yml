name: fetch-brand-art
# Downloads generated pictures for the rebrand into the folder named in DEST (board/img for the board, mockups/img for the pack mockups) as WebP
# (the session container cannot reach the image host). One "name url" pair per line in LIST. Edit the list and push to run. [run 1: the nine first pictures] [run 2: woman-silver, added after the Hanni reference] [run 3: the first five pack mockups, into mockups/img] [run 4: row 2 of the pack mockups] [run 5: gallery pictures for the bath soak PDP preview, into lp-factory/pages/bath-soak/img] [run 6: the real diffuser in the new look, for the kits preview, into lp-factory/pages/diffuser-kits-rebrand/img] [run 7: the 9 / 18 / 24-month variant pictures for the supply product, into lp-factory/pages/supply/img/variants] [run 8: the three scent cards of the bath soak PDP preview (ingredient + pouch + salts), into lp-factory/pages/bath-soak/img]
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/fetch-brand-art.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEST: lp-factory/pages/bath-soak/img
      LIST: |
        scent-unwind https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261118_204132_46977c45-8adf-4659-a2a6-676738fc3a95.png
        scent-be-here https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261118_204132_87c3806e-1f52-4caa-b494-9644880b7aea.png
        scent-drift-off https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261118_204133_afd99319-f60c-49ee-a7b8-8218f0f157a4.png
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch and convert
        run: |
          pip install -q pillow
          D="$DEST"
          mkdir -p "$D" /tmp/raw
          echo "$LIST" | while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL -A "Mozilla/5.0" --max-time 120 -o "/tmp/raw/$name.png" -w "%{http_code}" "$url" || true)
            echo "$name http $code $(wc -c < "/tmp/raw/$name.png" 2>/dev/null) bytes $(file -b "/tmp/raw/$name.png" | cut -c1-60)"
          done
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          D=os.environ['DEST']
          for f in sorted(glob.glob('/tmp/raw/*.png')):
              try:
                  im=Image.open(f).convert('RGB')
              except Exception as e:
                  print('skip',f,e); continue
              im.thumbnail((2000,2000), Image.LANCZOS)
              out=os.path.join(D, os.path.basename(f)[:-4]+'.webp')
              im.save(out,'WEBP',quality=84,method=6)
              print(out, im.size, os.path.getsize(out))
          PY
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          git commit -m "rebrand board: fetched the generated reference pictures" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && break || sleep 3; done
