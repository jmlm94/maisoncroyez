name: drawer-recon
# run 81 — V2 kit-builder origin gate: new files mc-kit2-app.js / mc-kit2.css
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate
        run: |
          BASE='https://cdn.shopify.com/s/files/1/0020/3636/7469/files'
          for i in $(seq 1 24); do
            K="oc$RANDOM$RANDOM"
            APP=$(curl -sS "$BASE/mc-kit2-app.js?v=$K")
            CSS=$(curl -sS "$BASE/mc-kit2.css?v=$K")
            A1=$(printf %s "$APP" | grep -o "Add to cart" | wc -l)
            A2=$(printf %s "$APP" | grep -o "Free scents" | wc -l)
            A3=$(printf %s "$APP" | grep -o "45644596969581" | wc -l)
            C1=$(printf %s "$CSS" | grep -o "plan-gift" | wc -l)
            C2=$(printf %s "$CSS" | grep -o "addon-row" | wc -l)
            C3=$(printf %s "$CSS" | grep -o "important" | wc -l)
            echo "try$i app[$A1/$A2/$A3 len${#APP}] css[$C1/$C2/$C3 len${#CSS}]"
            if [ "$A1" -ge 3 ] && [ "$A2" -ge 1 ] && [ "$A3" -ge 1 ] && [ "$C1" -ge 2 ] && [ "$C2" -ge 2 ] && [ "$C3" -ge 200 ]; then echo "ORIGIN_FRESH"; exit 0; fi
            sleep 10
          done
          echo "ORIGIN_STALE"; exit 1
