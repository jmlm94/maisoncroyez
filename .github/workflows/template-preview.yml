name: template-preview
# Screenshots of live products rendered with alternate theme templates via ?view=. Edit this line and push to run. Run 1.
on:
  workflow_dispatch:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/template-preview.yml']
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUT: lp-factory/theme/instant-removal/previews
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Shoot
        run: |
          mkdir -p "$OUT"
          cat > shot.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const OUT = process.env.OUT;
          const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 13);
          const D = 'https://maisoncroyez.com/products/maison-croyez-home-scent-diffuser', S = 'https://maisoncroyez.com/products/chilled-citrus-for-relaxation-and-concentration-100ml', K = 'https://maisoncroyez.com/products/diffuser-scents', C = 'https://maisoncroyez.com/collections/all';
          const targets = [
            ['diffuser-live', D], ['diffuser-backup', D + '?view=instant-backup-product'], ['diffuser-2026-mcdiffuser', D + '?view=2026-mcdiffuser'], ['diffuser-diffuser-new', D + '?view=diffuser-new'], ['diffuser-diffuser', D + '?view=diffuser'],
            ['scent-live', S], ['scent-backup', S + '?view=instant-backup-product'], ['scent-fragrances_template', S + '?view=fragrances_template'], ['scent-2025-template', S + '?view=2025-template'], ['scent-fragrances-offer', S + '?view=fragrances-offer'],
            ['kits-live', K], ['kits-backup', K + '?view=instant-backup-product'],
            ['collection-live', C], ['collection-backup', C + '?view=instant-backup-collection'],
          ];
          const b = await chromium.launch(); const notes = [];
          for (const [name, url] of targets) {
            for (const [W, H, dev, mobile] of [[390, 844, 'phone', true], [1366, 900, 'desktop', false]]) {
              const ctx = await b.newContext({ viewport: { width: W, height: H }, deviceScaleFactor: mobile ? 2 : 1, isMobile: mobile, hasTouch: mobile, userAgent: mobile ? 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36' : undefined });
              const pg = await ctx.newPage(); const errs = []; pg.on('pageerror', (e) => errs.push(e.message.slice(0, 80)));
              let status = 0; try { const r = await pg.goto(url, { waitUntil: 'load', timeout: 60000 }); status = r ? r.status() : 0; } catch (e) { notes.push(`${name} ${dev}: goto failed ${e.message.slice(0, 80)}`); await ctx.close(); continue; }
              await pg.waitForTimeout(3000);
              const d = await pg.evaluate(() => ({ title: document.title, instant: document.querySelectorAll('[class*="instant"], .__instant').length, sections: [...document.querySelectorAll('main .shopify-section, #main .shopify-section, .shopify-section')].map((s) => (s.id || '').replace(/^shopify-section-/, '').replace(/^template--\d+__/, '').slice(0, 40)).slice(0, 20), h1: ((document.querySelector('h1') || {}).innerText || '').slice(0, 80), price: ((document.querySelector('.price, [class*="price"]') || {}).innerText || '').replace(/\s+/g, ' ').slice(0, 60), atc: [...document.querySelectorAll('button[name="add"], button[type="submit"]')].map((e) => e.innerText.replace(/\s+/g, ' ').slice(0, 40)).slice(0, 3), video: document.querySelectorAll('video').length, forms: document.querySelectorAll('form[action*="/cart/add"]').length, subi: !!document.querySelector('[class*="subify"], [class*="subi"], [id*="subify"]'), bodyH: document.body.scrollHeight }));
              await pg.screenshot({ path: `${OUT}/${stamp}-${name}-${dev}-top.png` });
              if (dev === 'phone') await pg.screenshot({ path: `${OUT}/${stamp}-${name}-${dev}-full.png`, fullPage: true });
              notes.push(`${name} ${dev} [${status}] ${url}: ${JSON.stringify({ ...d, errs })}`);
              await ctx.close();
            }
          }
          await b.close();
          const fs = await import('fs'); fs.writeFileSync(`${OUT}/${stamp}-notes.txt`, notes.join('\n') + '\n'); console.log(notes.join('\n'));
          EOF2
          node shot.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          git commit -m "template-preview: alternate product/collection templates" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
