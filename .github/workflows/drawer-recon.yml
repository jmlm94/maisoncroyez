name: drawer-recon
# run 150 — diagnose tier-card height mismatch at desktop width (key p6m17)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();
          for (const w of [1280, 390]){
            const p=await b.newPage({viewport:{width:w,height:900}});
            const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,100)));
            await p.goto('https://maisoncroyez.com/pages/six-month-program?utm_campaign=diag150w'+w,{waitUntil:'domcontentloaded',timeout:90000});
            await p.waitForTimeout(9000);
            const d=await p.evaluate(()=>{
              const g=document.querySelector('.kitgrid');
              const gcs=g?getComputedStyle(g):null;
              const cards=[...document.querySelectorAll('.kg-card')].map(c=>{
                const r=c.getBoundingClientRect(); const cs=getComputedStyle(c);
                return {top:Math.round(r.top),h:Math.round(r.height),
                  mt:cs.marginTop,mb:cs.marginBottom,alignSelf:cs.alignSelf,transform:cs.transform!=='none'};});
              return {grid:gcs?{display:gcs.display,alignItems:gcs.alignItems,cols:gcs.gridTemplateColumns.split(' ').length}:null,
                cards, pill:!!document.querySelector('.supply-badge'), key17:!!document.querySelector('script[src*="p6m17"]')};});
            console.log('R150_W'+w+' '+JSON.stringify(d)+' errs='+JSON.stringify(errs));
            if(w===1280){
              await p.evaluate(()=>{const e=document.querySelector('.plansel-title'); if(e) e.scrollIntoView({block:'start'});});
              await p.waitForTimeout(600);
              await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-desktop-cards.png'});
            }
            await p.close();
          }
          await b.close();})();
          EOS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live
          git commit -m "recon r150: desktop card diag" || echo "no changes"
          git push || echo "no push"
