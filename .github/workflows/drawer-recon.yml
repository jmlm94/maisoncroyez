name: drawer-recon
# run 182 — wait for the 21:00 UTC hm3 flip, then verify the new home hero live (rating line, no bullets/strip, CTA) + fold screenshots
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Wait for hour flip
        run: |
          now=$(date -u +%s); target=$(date -u -d "$(date -u +%Y-%m-%dT21:00:45Z)" +%s)
          if [ "$now" -lt "$target" ]; then echo "sleeping $((target-now))s"; sleep $((target-now)); fi
          date -u
      - name: Verify
        run: |
          mkdir -p lp-factory/pages/home/verify
          cat > r182.mjs <<'EOF2'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const b = await chromium.launch();
          const out = {};
          for (const [name, vp] of [['mobile', { width: 390, height: 844 }], ['desktop', { width: 1366, height: 900 }]]) {
            const ctx = await b.newContext({ viewport: vp });
            const pg = await ctx.newPage();
            const errs = []; const scripts = [];
            pg.on('pageerror', e => errs.push(e.message.slice(0, 160)));
            pg.on('response', r => { if (/mc-home/.test(r.url())) scripts.push([r.status(), r.url().slice(-40)]); });
            await pg.goto('https://maisoncroyez.com/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await pg.waitForTimeout(3500);
            const info = await pg.evaluate(() => {
              const hero = document.querySelector('#root .hero');
              const q = s => hero && hero.querySelector(s);
              return {
                heroText: hero ? hero.innerText.slice(0, 400) : null,
                rating: q('.hrating') ? q('.hrating').innerText : null,
                bullets: hero ? hero.querySelectorAll('.hchecks, .hchecks li, .trust-strip').length : null,
                cta: q('a.btn') ? [q('a.btn').innerText.trim(), q('a.btn').getAttribute('href')] : null,
                heroH: hero ? Math.round(hero.getBoundingClientRect().height) : null,
                heroImgOk: q('img') ? q('img').naturalWidth > 0 : null,
                card1: (document.querySelector('#root .ritual, #root .cards, #root .paths') || document.body).innerText.match(/Founder.s Offer[^\n]*/g),
                stale: (document.getElementById('root') || document.body).innerText.match(/Six-Month Program|mystery|6-Month Money|\$199|2,500\+|4\.9\/5/gi)
              };
            });
            out[name] = { ...info, errs, scripts };
            await pg.screenshot({ path: 'lp-factory/pages/home/verify/home-fold-' + name + '.png' });
            await pg.screenshot({ path: 'lp-factory/pages/home/verify/home-live-' + name + '.png', fullPage: true });
            fs.writeFileSync('lp-factory/pages/home/verify/home-text-' + name + '.txt', await pg.evaluate(() => (document.querySelector('main') || document.body).innerText));
            await ctx.close();
          }
          console.log('HOME ' + JSON.stringify(out, null, 1));
          await b.close();
          EOF2
          node r182.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/home/verify/
          git commit -m "r182: home hero live verify artifacts" || exit 0
          git push
