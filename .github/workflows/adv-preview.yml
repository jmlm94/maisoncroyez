name: adv-preview
# Preview of the Candle Swap advertorial inside the real Maison Croyez theme before it is a live page: opens a plain store page, swaps its body for lp-factory/pages/adv-kits/shopify/page-body.html, then saves phone + desktop screenshots and DOM checks to shopify/preview/. Once the page is live, set URL to it and leave INJECT empty. Edit this line and push to run. [run 2: live page]
on:
  workflow_dispatch:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/adv-preview.yml']
permissions:
  contents: write
concurrency: adv-preview
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUT: lp-factory/pages/adv-kits/shopify/preview
      BODY: lp-factory/pages/adv-kits/shopify/page-body.html
      URL: 'https://maisoncroyez.com/pages/indoor-air-alerts'
      INJECT: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Shoot
        run: |
          mkdir -p "$OUT"
          cat > shot.mjs <<'EOS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const OUT = process.env.OUT, INJECT = process.env.INJECT === 'yes';
          const BODY = fs.readFileSync(process.env.BODY, 'utf8');
          const HOSTS = process.env.URL ? [process.env.URL] : ['/pages/contact', '/pages/about-us', '/pages/about', '/pages/faq', '/pages/faqs', '/pages/the-scent-story'].map(p => 'https://maisoncroyez.com' + p);
          const b = await chromium.launch();
          const report = { when: new Date().toISOString(), inject: INJECT, runs: [] };
          for (const [label, vp, mobile] of [['phone', { width: 390, height: 844 }, true], ['small', { width: 360, height: 640 }, true], ['desktop', { width: 1280, height: 900 }, false]]) {
            const ctx = await b.newContext({ viewport: vp, deviceScaleFactor: 2, isMobile: mobile, hasTouch: mobile,
              userAgent: mobile ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1' : undefined });
            const pg = await ctx.newPage();
            const errs = [];
            pg.on('pageerror', e => errs.push(String(e).slice(0, 200)));
            const r = { label, host: null, errs };
            for (const u of HOSTS) {
              let ok = false;
              for (let a = 0; a < 3 && !ok; a++) {
                const resp = await pg.goto(u + (u.includes('?') ? '&' : '?') + 'cb=' + Date.now(), { waitUntil: 'load', timeout: 60000 }).catch(e => null);
                const st = resp ? resp.status() : 0;
                if (st === 404) break;
                ok = st === 200 && await pg.$('.shopify-section--main-page .page');
                if (!ok) await pg.waitForTimeout(20000);
              }
              if (ok) { r.host = u; break; }
            }
            if (!r.host) { r.fail = 'no page loaded'; report.runs.push(r); await ctx.close(); continue; }
            if (INJECT) {
              await pg.evaluate((html) => {
                const page = document.querySelector('.shopify-section--main-page .page');
                let prose = page.querySelector('.prose');
                if (!prose) { prose = document.createElement('div'); prose.className = 'prose'; page.appendChild(prose); }
                [...page.children].forEach(c => { if (c !== prose && c.tagName !== 'H1') c.remove(); });
                prose.innerHTML = html;
                prose.querySelectorAll('script').forEach(s => { const n = document.createElement('script'); n.textContent = s.textContent; s.replaceWith(n); });
              }, BODY);
            }
            await pg.waitForTimeout(2500);
            await pg.addStyleTag({ content: 'html{scroll-behavior:auto !important}' });
            await pg.evaluate(async () => { for (let y = 0; y < document.body.scrollHeight; y += 500) { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 250)); } });
            await pg.evaluate(async () => { const t = Date.now(); while (Date.now() - t < 15000 && [...document.images].some(i => !i.complete)) await new Promise(r => setTimeout(r, 250)); window.scrollTo(0, 0); });
            await pg.waitForTimeout(1500);
            await pg.evaluate(() => document.fonts && document.fonts.ready);
            r.audit = await pg.evaluate(() => {
              const vis = el => !!el && getComputedStyle(el).display !== 'none' && el.getBoundingClientRect().height > 0;
              const root = document.getElementById('mcadv');
              const imgs = [...(root ? root.querySelectorAll('img') : [])];
              const h1 = root && root.querySelector('h1');
              const cs = h1 ? getComputedStyle(h1) : {};
              return {
                mounted: !!root,
                themeHeaderVisible: [...document.querySelectorAll('.shopify-section-group-header-group')].some(vis),
                themeFooterVisible: [...document.querySelectorAll('.shopify-section-group-footer-group')].some(vis),
                themeTitleVisible: vis(document.querySelector('.shopify-section--main-page .page > h1')),
                mcadvTop: root ? Math.round(root.getBoundingClientRect().top + scrollY) : null,
                mcadvLeft: root ? Math.round(root.getBoundingClientRect().left) : null,
                mcadvWidth: root ? Math.round(root.getBoundingClientRect().width) : null,
                overflowX: document.documentElement.scrollWidth > innerWidth,
                h1: h1 ? h1.innerText : 'MISSING',
                h1Font: cs.fontFamily, h1Size: cs.fontSize, h1Transform: cs.textTransform,
                serifLoaded: document.fonts.check('700 20px "Source Serif 4"'), sansLoaded: document.fonts.check('800 15px "Libre Franklin"'),
                imgs: imgs.length, broken: imgs.filter(i => !i.complete || !i.naturalWidth).map(i => i.src.split('/').pop()),
                ctas: [...(root ? root.querySelectorAll('a.btn') : [])].map(a => a.getAttribute('href')),
                alerts: root ? root.querySelectorAll('.alert').length : 0,
                pageHeight: document.body.scrollHeight,
              };
            });
            // sticky bar: hidden at the top, on after alert 1, off on the offer
            r.bar = await pg.evaluate(async () => {
              const bar = document.getElementById('bar'); if (!bar) return 'missing';
              const at = async (y) => { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 400)); return bar.classList.contains('on'); };
              const a1 = document.getElementById('alert-1'), of = document.getElementById('offer');
              const top = await at(0), mid = await at(a1.getBoundingClientRect().top + scrollY + 200), off = await at(of.getBoundingClientRect().top + scrollY - 100);
              window.scrollTo(0, 0); await new Promise(r => setTimeout(r, 400));
              return { top, mid, onOffer: off, shown: getComputedStyle(bar).display !== 'none' };
            });
            r.loadMs = await pg.evaluate(() => { const n = performance.getEntriesByType('navigation')[0]; return n ? { dcl: Math.round(n.domContentLoadedEventEnd), load: Math.round(n.loadEventEnd) } : null; });
            await pg.screenshot({ path: `${OUT}/${label}-fold.png` });
            await pg.screenshot({ path: `${OUT}/${label}-full.png`, fullPage: true });
            if (label === 'phone') {
              // the offer button should take a shopper to the kits page
              await Promise.all([pg.waitForURL(/diffuser-kits/, { timeout: 30000 }).catch(() => null), pg.click('#offer a.btn')]);
              r.ctaLandsOn = pg.url().split('?')[0];
            }
            report.runs.push(r);
            await ctx.close();
          }
          await b.close();
          fs.writeFileSync(`${OUT}/report.json`, JSON.stringify(report, null, 1));
          console.log(JSON.stringify(report, null, 1));
          EOS
          node shot.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          git commit -m "adv-preview: Candle Swap screenshots" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
