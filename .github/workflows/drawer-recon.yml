name: drawer-recon
# run 160 — live verify p6m22: pill clear of smells text, insets, h1 gap, screenshot
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Verify
        run: |
          cat > r160.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const pg = await b.newPage({ viewport: { width: 390, height: 844 } });
          await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await pg.waitForSelector('.kitgrid', { timeout: 60000 });
          await pg.waitForSelector('.pick-ml', { timeout: 60000 });
          await pg.waitForTimeout(2500);
          const data = await pg.evaluate(() => {
            const out = {};
            out.key22 = document.documentElement.innerHTML.includes('p6m22-21b8371');
            const picks = [...document.querySelectorAll('.pick')];
            out.mlCount = document.querySelectorAll('.pick-ml').length;
            out.cards = picks.slice(0, 8).map(p => {
              const ml = p.querySelector('.pick-ml');
              const sm = p.querySelector('.pick-smells');
              if (!ml || !sm) return null;
              const mr = ml.getBoundingClientRect(), pr = p.getBoundingClientRect();
              const rng = document.createRange(); rng.selectNodeContents(sm);
              let maxRight = 0;
              [...rng.getClientRects()].forEach(r => {
                if (!(r.bottom <= mr.top || r.top >= mr.bottom)) maxRight = Math.max(maxRight, r.right);
              });
              return { insetR: Math.round(pr.right - mr.right), insetB: Math.round(pr.bottom - mr.bottom),
                       gap: maxRight ? Math.round(mr.left - maxRight) : null,
                       clear: !maxRight || maxRight <= mr.left };
            });
            const h1 = document.querySelector('.buybox h1');
            const rit = document.querySelector('.buybox .ritual-incl');
            out.h1ToRitual = (h1 && rit) ? Math.round(rit.getBoundingClientRect().top - h1.getBoundingClientRect().bottom) : null;
            return out;
          });
          console.log('R160 ' + JSON.stringify(data));
          const first = pg.locator('.pick').first();
          await first.scrollIntoViewIfNeeded();
          await pg.waitForTimeout(500);
          const rects = await pg.evaluate(() => [...document.querySelectorAll('.pick')].slice(0, 3).map(p => {
            const r = p.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height };
          }));
          const x0 = Math.max(0, Math.min(...rects.map(r => r.x)) - 6);
          const y0 = Math.max(0, Math.min(...rects.map(r => r.y)) - 6);
          const x1 = Math.min(390, Math.max(...rects.map(r => r.x + r.w)) + 6);
          const y1 = Math.min(844, Math.max(...rects.map(r => r.y + r.h)) + 6);
          await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/final-pill-clear.png', clip: { x: x0, y: y0, width: x1 - x0, height: y1 - y0 } });
          await b.close();
          EOF
          node r160.mjs
      - name: Commit screenshot
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/final-pill-clear.png
          git commit -m "r160: live screenshot pill clear (p6m22)"
          git push
