name: drawer-recon
# run 153 — origin gate: price line removed entirely, green banner restored, pill gone
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          curl -s "$B/mc-6mp-app.js?v=og$RANDOM$RANDOM" -o /tmp/app.js
          curl -s "$B/mc-6mp.css?v=og$RANDOM$RANDOM" -o /tmp/k.css
          echo "appBytes=$(wc -c < /tmp/app.js)"
          echo "priceLine=$(grep -c '49.75/mo with' /tmp/app.js || true)"
          echo "greenBanner=$(grep -c 'SUPPLY PER DIFFUSER' /tmp/app.js || true)"
          echo "blackPill=$(grep -c 'supply-badge' /tmp/app.js || true)"
          echo "guard=$(grep -c '__MC_KX_APP__' /tmp/app.js)"
          echo "cssGap9=$(grep -c 'margin-top:9px' /tmp/k.css || true)"
          echo "marginRule=$(grep -c 'kitgrid>.kg-card' /tmp/k.css || true)"
