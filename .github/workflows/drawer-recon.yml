name: drawer-recon
# run 147 — confirm storefront HTML serves key p6m16 (fresh + no query param)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          curl -s "https://maisoncroyez.com/pages/six-month-program" -o /tmp/p.html
          echo "bytes=$(wc -c < /tmp/p.html)"
          echo "key16=$(grep -c 'p6m16-991ea6e' /tmp/p.html || true)"
          echo "key15=$(grep -c 'p6m15' /tmp/p.html || true)"
          curl -s "https://maisoncroyez.com/pages/six-month-program?nc=$RANDOM" -o /tmp/p2.html
          echo "key16_fresh=$(grep -c 'p6m16-991ea6e' /tmp/p2.html || true)"
