name: qa-kits-2
# round 2 (2026-11-08, owner's artifact comments): no pill, coverage badges on the diffuser cards, no "Where it goes" block, no bottle-life / badges / IFRA block, the scents as a list, no summary block (checks below updated).
# The working copy /pages/diffuser-kits-2 (lp-factory/pages/diffuser-kits-2), k2 one-page offer (2026-11-08, owner): Step 1 diffusers
# (1 / 2 / 3 at $89.95 / $129.95 / $189.95, struck value + saving), Step 2 scents (quantity strip $39.95 / $29.95 each from 2 / $24.95
# each from 3, "Each scent lasts 15+ days", smell label above the strength on every tile, + / − up to 7), Step 3 refills (Subscribe =
# 25% off every refill | One-time payment, 30 / 60 / 90), the summary (diffusers + scents at the quantity price, value line, Due today,
# refill sentence), "CHECKOUT · $X". Then two real checkouts: one-time 2 diffusers + 3 scents (→ /discount/3SCENTS → checkout $204.80:
# $129.95 + 3 × $24.95) and Subscribe 1 diffuser + 2 scents every 30 days (→ /discount/2SCENTS → checkout; the scents also carry the
# 04/10 plan's $10 off until the owner's new Subi group exists: 2 × $19.95 + $89.95 = $129.85). The store's "100% ON US" announcement
# bar must be hidden on this page. Edit this line and push to run. [k2 run 1: key dk2b-3deef01, 29/30 — the one miss was the harness expecting $39.95 on the plan lines; cart.js reports the plan-adjusted $29.95] [k2 run 2: 29/30 again — 39.95 − 10 is not === 29.95 in floating point] [k2 run 3]
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/qa-kits-2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: qa-kits-2
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      URL: https://maisoncroyez.com/pages/diffuser-kits-2
      OUT: lp-factory/pages/diffuser-kits-2/qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Gate (the copy must be on a k2 build)
        id: gate
        run: |
          curl -sSL -A "Mozilla/5.0" "$URL?cb=$(date +%s)" -o live.html || true
          KEY=$(grep -o "var v='[^']*'" live.html | head -1 | cut -d"'" -f2)
          echo "live key: $KEY"
          if [[ "$KEY" == dk2* ]]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; echo "the copy is not on a dk2 key — skipping"; fi
      - name: Kits 2 QA
        if: steps.gate.outputs.run == 'yes'
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const URL_ = process.env.URL, stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 13), OUT = `${process.env.OUT}/${stamp}`;
          fs.mkdirSync(OUT, { recursive: true });
          const SCENTS = [
            { key: 'love', name: 'Golden Blossom Harmony', v: 41212020457581, smell: 'HONEY FLORAL' }, { key: 'abundance', name: 'Crisp Citrus Scape', v: 41212018655341, smell: 'FRESH CITRUS' }, { key: 'focus', name: 'Chilled Citrus', v: 41212021506157, smell: 'LAVENDER' },
            { key: 'ideas', name: 'Honey Nectar', v: 41212021342317, smell: 'MILK & HONEY' }, { key: 'energy', name: 'Euphoric Bloom', v: 41212020752493, smell: 'PEACH & TEA' }, { key: 'purify', name: 'Wildwood Mystique', v: 41212021669997, smell: 'PINE FOREST' }, { key: 'midnight', name: 'Midnight Sensation', v: 41212019933293, smell: 'FLORAL MUSK' },
          ];
          const DIFF = [{ n: 1, v: 67973611290733, p: 89.95, was: 89.95 }, { n: 2, v: 67973611323501, p: 129.95, was: 179.90 }, { n: 3, v: 67973611356269, p: 189.95, was: 269.85 }]; /* product 15430881673325 */
          const LP = 39.95, T2 = 29.95, T3 = 24.95, PLAN_OFF = 10; /* the 04/10 plans take $10 off until the owner's new Subi group exists */
          const checks = [];
          const ck = (id, name, ok, got) => { checks.push({ id, name, ok: !!ok, got }); console.log((ok ? 'PASS' : 'FAIL') + ' ' + id + ' — ' + name + (ok ? '' : ' => ' + JSON.stringify(got).slice(0, 700))); };
          const UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1';
          const noise = (e) => /console: (Refused to frame 'https:\/\/shop\.app\/'|Failed to load resource: the server responded with a status of 403)/.test(e);
          const b = await chromium.launch();
          const open = async (mobile) => {
            const ctx = await b.newContext(mobile ? { viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, userAgent: UA } : { viewport: { width: 1366, height: 900 }, deviceScaleFactor: 1 });
            const pg = await ctx.newPage(); const errs = [];
            pg.on('pageerror', (e) => errs.push('pageerror: ' + e.message.slice(0, 160))); pg.on('console', (m) => { if (m.type() === 'error') errs.push('console: ' + m.text().slice(0, 160)); });
            await pg.goto(URL_ + '?cb=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 90000 });
            await pg.waitForSelector('#buybox .k2-tiers', { timeout: 60000 }); await pg.waitForTimeout(2500);
            return { ctx, pg, errs };
          };
          const tap = (pg, q, i = 0) => pg.evaluate(([q, i]) => { const e = document.querySelectorAll(q)[i]; if (!e) return false; e.scrollIntoView({ block: 'center' }); e.click(); return true; }, [q, i]);
          const addScent = async (pg, k) => { await pg.evaluate((k) => { const bt = document.querySelectorAll('#buybox .picker .pick')[k].querySelector('.e4-step button[aria-label^="Add one"]'); bt.scrollIntoView({ block: 'center' }); bt.click(); }, k); await pg.waitForTimeout(200); };
          const state = (pg) => pg.evaluate(() => { const tx = (e) => (e ? (e.innerText || e.textContent || '').replace(/\s+/g, ' ').trim() : null); const r = (q) => { const e = document.querySelector(q); if (!e) return null; const b = e.getBoundingClientRect(); return { top: Math.round(b.top), bottom: Math.round(b.bottom) }; }; return {
            key: ((document.querySelector('script[src*="mc-dk2-app.js"]') || { src: '' }).src.split('?v=')[1] || null), vw: innerWidth, vh: innerHeight, sw: document.documentElement.scrollWidth,
            pill: tx(document.querySelector('#buybox .dk-freebar')), h1: tx(document.querySelector('#buybox h1')),
            tiers: [...document.querySelectorAll('#buybox .k2-tier')].map((e) => tx(e) + (e.classList.contains('on') ? ' [ON]' : '')), eyebrows: [...document.querySelectorAll('#buybox .step-eyebrow')].map(tx),
            strip: [...document.querySelectorAll('#buybox .k2-strip-t')].map((e) => tx(e) + (e.classList.contains('on') ? ' [ON]' : '')), pickPill: tx(document.querySelector('#buybox .pick-pill')), life: tx(document.querySelector('#buybox .s2-life')), badges: [...document.querySelectorAll('#buybox .s2-b')].map(tx), ifra: tx(document.querySelector('#buybox .s2-ifra')),
            listView: (() => { const p = document.querySelector('#buybox .picker'); if (!p) return false; const w = p.getBoundingClientRect().width; const r = [...p.querySelectorAll('.pick')]; return r.length > 0 && r.every((e) => e.getBoundingClientRect().width > w * 0.9); })(), tiles: [...document.querySelectorAll('#buybox .picker .pick')].map((e) => ({ name: tx(e.querySelector('.e4-name')), smell: tx(e.querySelector('.k2-smell')), str: tx(e.querySelector('.e4-str')), q: tx(e.querySelector('.e4-step b')), on: e.classList.contains('on') })), smellAboveStrength: [...document.querySelectorAll('#buybox .picker .pick')].every((e) => { const s = e.querySelector('.k2-smell'), t = e.querySelector('.e4-str'); return s && t && s.getBoundingClientRect().top < t.getBoundingClientRect().top; }),
            plan2: [...document.querySelectorAll('#buybox .plan2-opt')].map((e) => tx(e) + (e.classList.contains('on') ? ' [ON]' : '')), freqs: [...document.querySelectorAll('#buybox .rf3-opt')].map(tx), freqOn: tx(document.querySelector('#buybox .rf3-opt.on')),
            rows: [...document.querySelectorAll('#buybox .k2-rev .kr-row')].map(tx), value: tx(document.querySelector('#buybox .s9-value')), due: tx(document.querySelector('#buybox .s9-due')), expl: tx(document.querySelector('#buybox .t9s-expl')), note: tx(document.querySelector('#buybox .k2-testnote')), btn: tx(document.querySelector('#buybox .btn.atc')), btnDisabled: !!(document.querySelector('#buybox .btn.atc') || {}).disabled,
            sticky: tx(document.querySelector('.sticky .btn')), stickyShown: (() => { const e = document.querySelector('.sticky'); return e ? (getComputedStyle(e).display !== 'none' && e.classList.contains('show')) : null; })(),
            ann: (() => { const g = document.querySelector('.shopify-section-group-header-group'); if (!g) return null; const el = [...g.querySelectorAll('*')].find((e) => e.children.length === 0 && /100% ON US/i.test(e.textContent || '')); if (!el) return 'absent'; const sec = el.closest('.shopify-section') || el; return getComputedStyle(sec).display === 'none' ? 'hidden' : 'VISIBLE'; })(),
            drawerOpen: (() => { const d = document.getElementById('cart-drawer'); return d ? (d.hasAttribute('open') || !!d.open) : null; })(),
          }; });
          const cartJs = (pg) => pg.evaluate(async () => { let c; try { c = await (await fetch('/cart.js')).json(); } catch (e) { return { n: null, total: null, items: [], err: String(e).slice(0, 80) }; } return { n: c.item_count, total: c.total_price / 100, items: c.items.map((i) => ({ v: i.variant_id, t: i.product_title + (i.variant_title && i.variant_title !== 'Default Title' ? ' / ' + i.variant_title : ''), q: i.quantity, price: i.price / 100, line: i.final_line_price / 100, plan: i.selling_plan_allocation ? i.selling_plan_allocation.selling_plan.name : null, disc: (i.line_level_discount_allocations || []).map((d) => d.discount_application.title + ' -' + d.amount / 100) })) }; });

          const run = async (vp) => {
            const mobile = vp === 'phone'; const { ctx, pg, errs } = await open(mobile);
            let s = await state(pg);
            ck(`${vp}-mount`, 'the k2 page renders: key dk2b-*, no pill, the title, Steps 1–3 all on one page, no horizontal overflow', /^dk2b-/.test(s.key || '') && !s.pill && /Maison Croyez Home Diffuser/.test(s.h1 || '') && s.eyebrows.length === 3 && s.sw <= s.vw + 1, { key: s.key, pill: s.pill, eyebrows: s.eyebrows, sw: s.sw, vw: s.vw });
            ck(`${vp}-ann`, 'the store\'s "100% ON US" announcement bar is hidden on this page', s.ann === 'hidden' || s.ann === 'absent', { ann: s.ann });
            ck(`${vp}-tiers`, 'Step 1: 1 Diffuser $89.95 · 2 Diffusers $129.95 (Most popular, selected, ~~$179.90~~ Save $49.95) · 3 Diffusers $189.95 (Best value, ~~$269.85~~ Save $79.90), each with its coverage badge', s.tiers.length === 3 && s.tiers.every((t) => /sq ft coverage/i.test(t)) && /600 sq ft/i.test(s.tiers[0]) && /1,200 sq ft/i.test(s.tiers[1]) && /1,800 sq ft/i.test(s.tiers[2]) && /1 Diffuser \$89\.95/.test(s.tiers[0]) && /MOST POPULAR 2 Diffusers \$129\.95 \$179\.90 Save \$49\.95.*\[ON\]$/.test(s.tiers[1]) && /BEST VALUE 3 Diffusers \$189\.95 \$269\.85 Save \$79\.90/.test(s.tiers[2]), { tiers: s.tiers });
            ck(`${vp}-scents-head`, 'Step 2: quantity strip 1 scent $39.95 (on) · 2 scents $29.95 each · 3+ scents $24.95 each, "0 picked", no bottle-life line / badges / IFRA (removed 11-08)', s.strip.length === 3 && /^1 scent \$39\.95 \[ON\]$/.test(s.strip[0]) && /^2 scents \$29\.95 each$/.test(s.strip[1]) && /^3\+ scents \$24\.95 each$/.test(s.strip[2]) && /^0 picked$/i.test(s.pickPill || '') && !s.life && s.badges.length === 0 && !s.ifra, { strip: s.strip, pickPill: s.pickPill, life: s.life, badges: s.badges, ifra: s.ifra });
            ck(`${vp}-tiles`, 'the seven scents as a list (one full-width row each), the smell label above the strength (HONEY FLORAL, FRESH CITRUS, LAVENDER, MILK & HONEY, PEACH & TEA, PINE FOREST, FLORAL MUSK)', s.tiles.length === 7 && s.listView && s.smellAboveStrength && SCENTS.every((f, i) => s.tiles[i] && s.tiles[i].name === f.name && (s.tiles[i].smell || '').toUpperCase() === f.smell && s.tiles[i].str) && s.tiles.every((t) => t.q === '0'), { tiles: s.tiles, above: s.smellAboveStrength, listView: s.listView });
            ck(`${vp}-refills-0`, 'Step 3: Subscribe (25% off refills, selected, "$39.95/scent today, $29.96 on every refill") · One-time payment ($39.95/scent); 60 / 30 (Most popular, selected) / 90', s.plan2.length === 2 && /^25% OFF REFILLS Subscribe 25% OFF every refill \$39\.95\/scent today, \$29\.96 on every refill\..*\[ON\]$/.test(s.plan2[0]) && /^One-time payment \$39\.95 \/scent Pay once\. No refills\.$/.test(s.plan2[1]) && s.freqs.length === 3 && /^30 days/.test(s.freqOn || ''), { plan2: s.plan2, freqs: s.freqs, on: s.freqOn });
            ck(`${vp}-summary-0`, 'no summary block (removed 11-08); with no scent: Due today $129.95, the button disabled ("PICK A SCENT TO CONTINUE")', s.rows.length === 0 && /\$129\.95/.test(s.due || '') && s.btnDisabled && /PICK A SCENT/.test(s.btn || ''), { rows: s.rows, due: s.due, btn: s.btn, disabled: s.btnDisabled });
            await pg.screenshot({ path: `${OUT}/${vp}-top.png` });
            /* three scents: Chilled Citrus, Wildwood Mystique, Golden Blossom Harmony */
            for (const k of [2, 5, 0]) await addScent(pg, k);
            await pg.waitForTimeout(400); s = await state(pg);
            ck(`${vp}-three`, '3 scents picked → strip "3+ scents $24.95 each" on, "3 picked · $24.95 each", value $299.75, Due today $204.80 (2 diffusers $129.95 + 3 scents × $24.95), "CHECKOUT · $204.80", the Subscribe sentence ($18.71 each, $56.13 per refill)', /3\+ scents \$24\.95 each \[ON\]/.test(s.strip[2]) && /^3 picked · \$24\.95 each$/i.test(s.pickPill || '') && /\$299\.75 of value, you pay \$204\.80 today/.test(s.value || '') && /DUE TODAY: \$204\.80 2 diffusers \$129\.95 \+ 3 scents × \$24\.95/i.test(s.due || '') && /CHECKOUT · \$204\.80/.test(s.btn || '') && !s.btnDisabled && /Subscribe: \$204\.80 today\. Then your scents renew every 30 days at \$18\.71 each \(25% off\), \$56\.13 per refill/.test(s.expl || ''), { strip: s.strip, pickPill: s.pickPill, rows: s.rows, value: s.value, due: s.due, btn: s.btn, expl: s.expl });
            ck(`${vp}-testnote`, 'the test note about the pending Subi plan shows while K2.plans is empty (informational)', true, { note: s.note });
            await tap(pg, '#buybox .plan2-opt.p2-one'); await pg.waitForTimeout(300); s = await state(pg);
            ck(`${vp}-onetime`, 'One-time payment → no frequency buttons, the one-time sentence, no test note, Due today unchanged $204.80', /One-time payment.*\[ON\]$/.test(s.plan2[1] || '') && s.freqs.length === 0 && /One-time payment: \$204\.80 today, nothing after/.test(s.expl || '') && !s.note && /\$204\.80/.test(s.due || ''), { plan2: s.plan2, freqs: s.freqs, expl: s.expl, note: s.note, due: s.due });
            await tap(pg, '#buybox .plan2-opt.p2-sub'); await pg.waitForTimeout(200);
            await tap(pg, '#buybox .k2-tier', 2); await pg.waitForTimeout(300); s = await state(pg);
            ck(`${vp}-three-diff`, '3 Diffusers selected → Due today $264.80 (3 diffusers $189.95 + 3 scents × $24.95), value $389.70, the picks kept', /BEST VALUE 3 Diffusers.*\[ON\]$/.test(s.tiers[2]) && /DUE TODAY: \$264\.80 3 diffusers \$189\.95 \+ 3 scents × \$24\.95/i.test(s.due || '') && /\$389\.70 of value/.test(s.value || '') && /^3 picked/i.test(s.pickPill || ''), { tiers: s.tiers.map((t) => t.slice(0, 40)), due: s.due, value: s.value, pickPill: s.pickPill });
            await pg.evaluate(() => { const bt = document.querySelectorAll('#buybox .picker .pick')[2].querySelector('.e4-step button[aria-label^="Remove one"]'); bt.scrollIntoView({ block: 'center' }); bt.click(); }); await pg.waitForTimeout(300); s = await state(pg);
            ck(`${vp}-two`, '− on Chilled Citrus → 2 scents: strip "2 scents $29.95 each" on, Due today $249.85 (3 diffusers $189.95 + 2 scents × $29.95)', /2 scents \$29\.95 each \[ON\]/.test(s.strip[1]) && /DUE TODAY: \$249\.85 3 diffusers \$189\.95 \+ 2 scents × \$29\.95/i.test(s.due || ''), { strip: s.strip, rows: s.rows, due: s.due });
            await pg.evaluate(() => window.scrollTo(0, 0)); await pg.waitForTimeout(400); s = await state(pg);
            ck(`${vp}-sticky`, 'back at the top the sticky bar shows "CHECKOUT · $249.85 ➔"', s.stickyShown && /CHECKOUT · \$249\.85/.test(s.sticky || ''), { sticky: s.sticky, shown: s.stickyShown });
            await pg.evaluate(() => document.querySelector('#buybox .s9-due').scrollIntoView({ block: 'center' })); await pg.waitForTimeout(400); await pg.screenshot({ path: `${OUT}/${vp}-summary.png` });
            ck(`${vp}-errors`, 'no JavaScript errors', errs.filter((e) => !noise(e)).length === 0, errs.filter((e) => !noise(e)).slice(0, 6));
            await ctx.close();
          };

          const flow = async (name, tierIdx, picks, plan, freqIdx, exp) => {
            const { ctx, pg, errs } = await open(true);
            await tap(pg, '#buybox .k2-tier', tierIdx); await pg.waitForTimeout(200);
            for (const k of picks) await addScent(pg, k);
            if (plan === 'one') await tap(pg, '#buybox .plan2-opt.p2-one'); else if (freqIdx !== 1) await tap(pg, '#buybox .rf3-opt', freqIdx);
            await pg.waitForTimeout(400);
            const before = await state(pg);
            const errsAtClick = errs.length; const addjs = []; pg.on('response', (r) => { if (/\/cart\/add\.js/.test(r.url())) addjs.push(r.status()); });
            await tap(pg, '#buybox .btn.atc');
            await pg.waitForURL(/\/checkouts?\//, { timeout: 60000 }).catch(() => {});
            await pg.waitForTimeout(9000);
            const expanded = await pg.evaluate(() => { const b = [...document.querySelectorAll('button')].find((e) => /order summary/i.test(e.innerText || '') && e.getAttribute('aria-expanded') === 'false'); if (b) { b.click(); return true; } return false; }); if (expanded) await pg.waitForTimeout(1500);
            const co = await pg.evaluate(() => ({ url: location.href.slice(0, 120), text: (document.body.innerText || '').replace(/\s+/g, ' ').trim() }));
            const c = await cartJs(pg);
            await pg.screenshot({ path: `${OUT}/checkout-${name}.png` });
            const totals = (co.text.match(/\$\d+\.\d\d/g) || []);
            const perr = errs.slice(0, errsAtClick).filter((e) => !noise(e));
            ck(`flow-${name}`, exp.name, /CHECKOUT · \$/.test(before.btn || '') && addjs.length >= 1 && addjs.every((x) => x === 200) && /\/checkouts?\//.test(co.url) && c.items.length === exp.cartLines && c.items.some((l) => l.v === exp.diffV && l.price === exp.diffP) && exp.scentV.every((v) => c.items.some((l) => l.v === v && Math.abs(l.price - (exp.plan ? LP - PLAN_OFF : LP)) < 0.005 && (exp.plan ? l.plan === exp.plan : l.plan === null))) /* cart.js reports the plan-adjusted price on a plan line */ && exp.checkoutText.every((re) => re.test(co.text)) && perr.length === 0, { btn: before.btn, due: before.due, addjs, url: co.url, cart: { total: c.total, lines: c.items }, totals: totals.slice(0, 14), code: (co.text.match(/\b[23]SCENTS\b/g) || []).slice(0, 2), sub: (co.text.match(/every \d+ days/ig) || []).slice(0, 3), errs: perr });
            await ctx.close();
          };

          await run('phone');
          await run('desktop');
          /* one-time: 2 diffusers + Chilled Citrus, Wildwood Mystique, Golden Blossom Harmony → 3SCENTS → $129.95 + 3 × $24.95 = $204.80 */
          await flow('one-2d-3s', 1, [2, 5, 0], 'one', 1, { name: 'one-time checkout: 2 diffusers $129.95 + 3 scents (code 3SCENTS: $39.95 → $24.95 each) = $204.80, no subscription', diffV: DIFF[1].v, diffP: DIFF[1].p, scentV: [SCENTS[2].v, SCENTS[5].v, SCENTS[0].v], plan: null, cartLines: 4, checkoutText: [/\$204\.80/, /3SCENTS/, /Maison Croyez Home Diffuser/] });
          /* subscribe: 1 diffuser + Honey Nectar, Euphoric Bloom every 30 days → 2SCENTS → $89.95 + 2 × ($39.95 − $10 code − $10 plan) = $129.85 */
          await flow('sub-1d-2s', 0, [3, 4], 'sub', 1, { name: 'subscribe checkout: 1 diffuser $89.95 + 2 scents every 30 days (code 2SCENTS $10 + the 04/10 plan\'s $10 = $19.95 each) = $129.85, "Every 30 days" on the scents', diffV: DIFF[0].v, diffP: DIFF[0].p, scentV: [SCENTS[3].v, SCENTS[4].v], plan: 'Every 30 days', cartLines: 3, checkoutText: [/\$129\.85/, /2SCENTS/, /every 30 days/i, /Maison Croyez Home Diffuser/] });
          await b.close();
          const pass = checks.filter((c) => c.ok).length;
          const md = [`# Kits 2 QA ${stamp} (k2 one-page offer)`, '', `${URL_}`, '', `${pass}/${checks.length} checks passed.`, '', '| # | check | result | details |', '|---|---|---|---|', ...checks.map((c) => `| ${c.id} | ${c.name} | ${c.ok ? 'PASS' : 'FAIL'} | ${JSON.stringify(c.got).replace(/\|/g, '\\|').slice(0, 500)} |`)].join('\n') + '\n';
          fs.writeFileSync(`${OUT}/report.md`, md); fs.writeFileSync(`${OUT}/report.json`, JSON.stringify({ stamp, url: URL_, pass, total: checks.length, checks }, null, 1));
          console.log(`\n${pass}/${checks.length} passed`);
          EOF
          node qa.mjs
      - name: Commit
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          git commit -m "qa-kits-2: the kits-2 copy QA" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
