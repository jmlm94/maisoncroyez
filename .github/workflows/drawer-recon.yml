name: drawer-recon
# run 175 — verify v3b live: key, no refill step on tiers 2/3, cart probe via page ATC (2D one-time -> 8995) then 1D + 1 scent on refill plan (-> 10990)
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Live verify
        run: |
          mkdir -p lp-factory/pages/kits-lp/live
          cat > r175.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 } });
          const pg = await ctx.newPage();
          const errs = [];
          pg.on('pageerror', e => errs.push(e.message.slice(0, 200)));
          await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await pg.waitForSelector('.tiers', { timeout: 60000 });
          await pg.waitForTimeout(4000);
          const readCart = () => pg.evaluate(async () => { const r = await fetch('/cart.js', { headers: { 'Accept': 'application/json' } }); const t = await r.text(); try { const c = JSON.parse(t); return { status: r.status, total: c.total_price, disc: c.total_discount, lines: c.items.map(i => ({ v: i.variant_id, q: i.quantity, plan: i.selling_plan_allocation ? i.selling_plan_allocation.selling_plan.id : null, price: i.price, final_line: i.final_line_price, d: (i.line_level_discount_allocations || []).map(d => [d.discount_application.title, d.amount]) })) }; } catch (e) { return { status: r.status, body: t.slice(0, 100) }; } });
          const chk = await pg.evaluate(() => ({ key: document.documentElement.innerHTML.includes('v3b-fbc1fdb'), titles: [...document.querySelectorAll('.buybox .picker-title')].map(e => e.textContent.trim()), modes: document.querySelectorAll('.mode').length, btn: (document.querySelector('.btn.atc') || {}).innerText, pay: !!document.querySelector('.atc-pay'), hscroll: document.documentElement.scrollWidth - window.innerWidth }));
          console.log('R175 ' + JSON.stringify(chk));
          await pg.locator('.btn.atc').scrollIntoViewIfNeeded(); await pg.waitForTimeout(2500);
          await pg.locator('.btn.atc').click(); await pg.waitForTimeout(8000);
          console.log('CART 2D one-time ' + JSON.stringify(await readCart()));
          await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3b-live-cart-2d.png' });
          await pg.keyboard.press('Escape'); await pg.waitForTimeout(1500);
          await pg.evaluate(() => fetch('/cart/clear.js', { method: 'POST' })).catch(() => {});
          await pg.waitForTimeout(6000);
          // tier 1 + one scent on the refill plan
          await pg.locator('.tier').nth(0).click(); await pg.waitForTimeout(800);
          await pg.locator('.pick.compact').nth(0).click(); await pg.waitForTimeout(800);
          const t1 = await pg.evaluate(() => ({ titles: [...document.querySelectorAll('.buybox .picker-title')].map(e => e.textContent.trim()), modes: document.querySelectorAll('.mode').length, dim: !!document.querySelector('.modes.dim'), btn: (document.querySelector('.btn.atc') || {}).innerText }));
          console.log('T1 ' + JSON.stringify(t1));
          await pg.locator('.mode.sub').click(); await pg.waitForTimeout(800);
          console.log('T1 sub btn ' + await pg.evaluate(() => (document.querySelector('.btn.atc') || {}).innerText));
          await pg.locator('.btn.atc').scrollIntoViewIfNeeded(); await pg.waitForTimeout(2500);
          await pg.locator('.btn.atc').click(); await pg.waitForTimeout(8000);
          console.log('CART 1D refill ' + JSON.stringify(await readCart()));
          await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3b-live-cart-1d.png' });
          await pg.evaluate(() => fetch('/cart/clear.js', { method: 'POST' })).catch(() => {});
          console.log('ERRORS ' + JSON.stringify(errs.slice(0, 6)));
          await b.close();
          EOF2
          node r175.mjs
      - name: Commit screenshots
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/v3b-live-*.png
          git commit -m "r175: v3b live cart screenshots" || exit 0
          git push
