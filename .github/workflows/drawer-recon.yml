name: drawer-recon
# run 73 — pixel-fix origin gate: throwaway keys only, wait until CDN origin serves fb-event bundle
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate
        run: |
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-kit-app.js'
          for i in $(seq 1 24); do
            K="oc$RANDOM$RANDOM"
            BODY=$(curl -sS "$B?v=$K")
            LEN=${#BODY}
            ATC=$(printf %s "$BODY" | grep -c "AddToCart" || true)
            IC=$(printf %s "$BODY" | grep -c "InitiateCheckout" || true)
            SC=$(printf %s "$BODY" | grep -c "Secure Checkout" || true)
            echo "try$i key=$K len=$LEN AddToCart=$ATC InitiateCheckout=$IC SecureCheckout=$SC"
            if [ "$ATC" -ge 1 ] && [ "$IC" -ge 1 ] && [ "$SC" -ge 1 ]; then echo "ORIGIN_FRESH"; exit 0; fi
            sleep 10
          done
          echo "ORIGIN_STALE"; exit 1
