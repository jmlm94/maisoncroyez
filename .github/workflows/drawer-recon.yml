name: drawer-recon
# run 22 — live free-diffuser brand audit: download served CSS/JS + computed style tokens
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit live LP branding
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > audit.mjs <<'EOS'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'fs';
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          const cssUrls = new Set(), jsUrls = new Set();
          page.on('response', r => {
            const u = r.url();
            if (/mc-lp[^/]*\.css|mc-.*\.css/.test(u)) cssUrls.add(u);
            if (/mc-lp[^/]*\.js|lp-app|mc-app/.test(u)) jsUrls.add(u);
          });
          await page.goto('https://maisoncroyez.com/pages/free-diffuser?cb='+Date.now(),{waitUntil:'load',timeout:90000});
          await page.waitForTimeout(9000);
          console.log('CSS files: '+[...cssUrls].join(' , '));
          console.log('JS files: '+[...jsUrls].join(' , '));
          // download every stylesheet the page actually applies (incl. theme + our LP css)
          const sheets = await page.evaluate(() => [...document.styleSheets].map(s=>s.href).filter(Boolean));
          console.log('Applied sheets:'); sheets.forEach(s=>console.log('  '+s));
          let i=0;
          for (const u of sheets) {
            try { const r = await page.request.get(u); const t = await r.text();
              const name = 'sheet-'+(i++)+'-'+(u.split('?')[0].split('/').pop()||'x').slice(0,50);
              writeFileSync(name, '/* '+u+' */\n'+t); console.log('saved '+name+' '+t.length+'B');
            } catch(e){ console.log('failed '+u); }
          }
          // computed tokens from the live DOM
          const tokens = await page.evaluate(() => {
            const pick = (el, props) => { if(!el) return null; const cs=getComputedStyle(el); const o={};
              props.forEach(p=>o[p]=cs.getPropertyValue(p)); return o; };
            const root = getComputedStyle(document.documentElement);
            const vars = {};
            ['--blush','--blush-soft','--rosewood','--rosewood-deep','--rosewood-tint','--cream','--ivory','--cta',
             '--ink','--ink-soft','--footer','--gold','--star','--grad-em','--grad-hero','--grad-values',
             '--grad-badge','--grad-cta','--radius','--shadow','--maxw'].forEach(v=>{ const x=root.getPropertyValue(v); if(x) vars[v]=x.trim(); });
            const q = s=>document.querySelector(s);
            return {
              vars,
              body: pick(q('#root')||document.body, ['font-family','font-size','color','background-color','line-height']),
              h1: pick(q('#root h1')||q('h1'), ['font-family','font-weight','letter-spacing','line-height','color','font-size']),
              h2: pick(q('#root h2')||q('h2'), ['font-family','font-weight','letter-spacing','color','font-size']),
              eyebrow: pick(q('#root .eyebrow'), ['font-family','font-weight','letter-spacing','text-transform','color','font-size']),
              cta: pick(q('#root .btn')||q('#root button'), ['font-family','background-color','background-image','color','border-radius','font-size','letter-spacing','text-transform']),
              fonts: [...new Set([...document.querySelectorAll('#root *')].slice(0,2500).map(e=>getComputedStyle(e).fontFamily))].slice(0,12)
            };
          });
          console.log('=== TOKENS ==='); console.log(JSON.stringify(tokens,null,1));
          await page.screenshot({ path:'lp-audit.png', fullPage:false });
          await b.close();
          EOS
          node audit.mjs 2>&1 | tee lp-audit-log.txt
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/recon-home/lp-audit
          mv lp-audit-log.txt lp-audit.png sheet-* lp-factory/recon-home/lp-audit/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/recon-home
          git commit -m "lp brand audit results (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
