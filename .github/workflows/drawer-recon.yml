name: drawer-recon
# run 75 — kb17 no-spy sanity: real fbevents, full flow, assert zero JS errors
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const c=await b.newContext({viewport:{width:412,height:823}});
          const p=await c.newPage();
          const fbreq=[];
          p.on('request',r=>{const u=r.url();if(u.indexOf('facebook.com/tr')>-1)fbreq.push(u.slice(0,160));});
          await p.route('**/checkout',r=>r.request().isNavigationRequest()?r.fulfill({status:200,contentType:'text/html',body:'BLOCKED'}):r.continue());
          const errs=[];p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          await p.goto('https://maisoncroyez.com/pages/build-your-kit?utm_source=instagram&utm_medium=bio&utm_campaign=px75',{waitUntil:'load',timeout:90000});
          await p.waitForTimeout(4000);
          await p.evaluate(()=>{
            document.querySelectorAll('.plan')[1].click(); window.go(2);
            const adds=document.querySelectorAll('.pick .add'); adds[0].click(); adds[4].click();
            window.go(3); window.joinToast();});
          await p.waitForTimeout(5000);
          const nav=p.url();
          const ev=fbreq.map(u=>{const m=u.match(/[?&]ev=([^&]+)/);return m?decodeURIComponent(m[1]):'?';});
          await p.evaluate(()=>fetch('/cart/clear.js',{method:'POST'})).catch(()=>{});
          console.log('NOSPY '+JSON.stringify({events:ev,nav:nav.slice(0,50),errs}));
          await b.close();})();
          EOS
