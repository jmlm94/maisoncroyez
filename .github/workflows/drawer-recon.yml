name: drawer-recon
# run 29 — sitewide drawer on preview theme 149076607085: title, injected elements, no script fights
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sitewide drawer
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > verify.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const PV='preview_theme_id=149076607085';
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          const errs=[]; page.on('pageerror',e=>errs.push(String(e).slice(0,200)));
          // --- 1) homepage, empty cart ---
          await page.goto('https://maisoncroyez.com/?'+PV+'&cb='+Date.now(),{waitUntil:'load',timeout:90000});
          await page.waitForTimeout(7000);
          await page.evaluate(async()=>{ await fetch('/cart/clear.js',{method:'POST'}); });
          const s0=await page.evaluate(()=>({
            loaderInstalled: !!document.querySelector('script[src*="mc-drawer.js"]'),
            drawerEl: !!document.getElementById('cart-drawer')
          }));
          console.log('=== SETUP === '+JSON.stringify(s0));
          // --- 2) add a one-time scent (no plan, no diffuser) and open drawer ---
          await page.evaluate(async()=>{
            await fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({items:[{id:45511812284525,quantity:1}]})});
            document.dispatchEvent(new CustomEvent('cart:refresh'));
            const d=document.getElementById('cart-drawer'); if(d&&d.show) d.show();
          });
          await page.waitForTimeout(4000);
          const s1=await page.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            const h=d?d.querySelector('.cart-drawer__top p.h5'):null;
            return {
              title: h?h.textContent:'NO HEADER',
              shipbar: !!d.querySelector('.mc-shipbar'),
              testi: !!d.querySelector('.mc-testi') && /Diane R\./.test(d.querySelector('.mc-testi').textContent),
              trust: !!d.querySelector('.mc-trust'),
              rmBtns: d.querySelectorAll('.mc-rm').length,
              checkoutBtn: (()=>{const f=d.querySelector('form.buy-buttons button, form.buy-buttons .btn');return f?/Secure Checkout/i.test(f.textContent):false;})(),
              noDiffuserUrgency: !/Only\s*19\s*free diffusers/i.test(d.textContent),
              flag: window.__mcDrawer===1
            };
          });
          console.log('=== ONETIME CART DRAWER === '+JSON.stringify(s1));
          await page.screenshot({ path:'drawer-home.png' });
          await page.evaluate(async()=>{ await fetch('/cart/clear.js',{method:'POST'}); });
          // --- 3) free-diffuser LP on preview theme: both scripts present, no fight ---
          const lp = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          const lperrs=[]; lp.on('pageerror',e=>lperrs.push(String(e).slice(0,200)));
          await lp.goto('https://maisoncroyez.com/pages/free-diffuser?'+PV+'&cb='+Date.now(),{waitUntil:'load',timeout:90000});
          await lp.waitForTimeout(10000);
          // add via the LP's own ATC path: use cart/add with plan (simulating circle cart)
          await lp.evaluate(async()=>{
            await fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({items:[{id:41212019933293,quantity:1,selling_plan:2627895405},{id:45450822778989,quantity:1}]})});
            document.dispatchEvent(new CustomEvent('cart:refresh'));
            const d=document.getElementById('cart-drawer'); if(d&&d.show) d.show();
          });
          await lp.waitForTimeout(5000);
          const t1=await lp.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            const h=d?d.querySelector('.cart-drawer__top p.h5'):null;
            return {title:h?h.textContent:'NO HEADER'};
          });
          await lp.waitForTimeout(4000);
          const t2=await lp.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            const h=d?d.querySelector('.cart-drawer__top p.h5'):null;
            const free=[...d.querySelectorAll('sale-price')].some(sp=>/FREE/.test(sp.textContent));
            return {title:h?h.textContent:'NO HEADER', freeLabel:free, flag:window.__mcDrawer===1};
          });
          console.log('=== LP CIRCLE DRAWER t1 === '+JSON.stringify(t1));
          console.log('=== LP CIRCLE DRAWER t2 === '+JSON.stringify(t2));
          await lp.screenshot({ path:'drawer-lp.png' });
          await lp.evaluate(async()=>{ await fetch('/cart/clear.js',{method:'POST'}); });
          const WANT='Congrats, your order is reserved! ✓';
          const checks={
            loaderInstalled:s0.loaderInstalled, drawerEl:s0.drawerEl,
            titleOneTime:s1.title===WANT,
            shipbar:s1.shipbar, testi:s1.testi, trust:s1.trust, rmBtns:s1.rmBtns>0,
            checkoutBtn:s1.checkoutBtn, noDiffuserUrgency:s1.noDiffuserUrgency, flagSet:s1.flag,
            lpTitleNew:t2.title===WANT,
            lpTitleStable:t1.title===t2.title,
            lpFreeDiffuser:t2.freeLabel,
            noJsErrors:errs.length===0 && lperrs.length===0
          };
          console.log('=== VERDICT ===');
          Object.entries(checks).forEach(([k,v])=>console.log((v?'PASS':'FAIL')+' '+k));
          console.log('home errs: '+errs.join(' | '));
          console.log('lp errs: '+lperrs.join(' | '));
          await b.close();
          EOS
          node verify.mjs 2>&1 | tee drawer-verify.txt
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/sitewide-drawer/verify
          mv drawer-verify.txt drawer-home.png drawer-lp.png lp-factory/sitewide-drawer/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/sitewide-drawer
          git commit -m "sitewide drawer verify r29 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
