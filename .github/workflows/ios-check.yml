name: ios-check
# 2026-10-28 (owner's iPhone screenshot: the kits page stuck on the pre-hero picture, nothing below): loads /pages/diffuser-kits in WebKit (iPhone 14 profile) and Chromium, with an empty cart and with a 4-line kit already in the cart, takes screenshots at 1 / 3 / 6 / 12 s, records page errors, console errors, failed requests, when mc-dk-app.js arrives and when #root mounts. Clears the cart. Edit this line and push to run. v2 (cases: webkit empty / cart4 / app request hanging, chromium slow phone; geometry of the pre-hero and the mounted hero). [run dk10b-2cb82e9]
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/ios-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps webkit chromium
      - name: Check
        run: |
          mkdir -p lp-factory/pages/diffuser-kits/ios
          cat > check.mjs <<'EOF2'
          import { webkit, chromium, devices } from 'playwright';
          import fs from 'fs';
          const OUT = 'lp-factory/pages/diffuser-kits/ios'; const res = [];
          /* block: 'hang' = every original mc-dk-app.js request hangs (only a cache-busted &r= retry gets through); slow = Chromium 4x CPU + slow 4G */
          const CASES = [
            { name: 'webkit-empty', engine: 'webkit' },
            { name: 'webkit-cart4', engine: 'webkit', prefill: true },
            { name: 'webkit-hang', engine: 'webkit', block: 'hang' },
            { name: 'chromium-slow', engine: 'chromium', slow: true },
            { name: 'webkit-fail', engine: 'webkit', block: 'fail' },
            { name: 'webkit-repeat', engine: 'webkit', repeat: true },
            { name: 'webkit-empty2', engine: 'webkit' },
            { name: 'webkit-repeat2', engine: 'webkit', repeat: true },
          ];
          const geo = () => { const g = (s) => { const e = document.querySelector(s); if (!e) return null; const r = e.getBoundingClientRect(); const cs = getComputedStyle(e); return { x: Math.round(r.x), y: Math.round(r.y + scrollY), w: Math.round(r.width), h: Math.round(r.height), fs: cs.fontSize, lh: cs.lineHeight, ff: cs.fontFamily.slice(0, 40), fw: cs.fontWeight, m: cs.margin, p: cs.padding, ls: cs.letterSpacing, color: cs.color, bg: cs.backgroundColor, br: cs.borderRadius, ta: cs.textAlign, disp: cs.display }; };
            return { vw: innerWidth, prehero: g('#mc-prehero'), preImg: g('#mc-hero-p'), preTxt: g('#mc-pre-txt'), preRetry: g('#mc-pre-retry'), hero: g('#buybox .hv-poster'), rating: g('#buybox .tb-rating'), stars: g('#buybox .stars5'), ratingB: g('#buybox .tb-rating b'), kicker: g('#buybox .dk-freebar'), h1: g('#buybox h1'), badges: g('#buybox .hs3'), badge0: g('#buybox .hs3 .hs'), buybox: g('#buybox .buybox'), main: g('main') }; };
          const browsers = {};
          for (const c of CASES) {
            const bt = c.engine === 'webkit' ? webkit : chromium;
            browsers[c.engine] = browsers[c.engine] || await bt.launch();
            const ctx = await browsers[c.engine].newContext(c.engine === 'webkit' ? { ...devices['iPhone 14'] } : { ...devices['Pixel 7'] });
            const pg = await ctx.newPage(); const t0 = Date.now();
            const r = { name: c.name, errs: [], console: [], failed: [], app: [], mountAt: null };
            pg.on('pageerror', (e) => r.errs.push(e.message.slice(0, 200)));
            pg.on('console', (m) => { if (m.type() === 'error') r.console.push(m.text().slice(0, 160)); });
            pg.on('requestfailed', (q) => { const u = q.url(); if (/maisoncroyez|cdn\.shopify/.test(u)) r.failed.push(u.slice(-80) + ' ' + ((q.failure() || {}).errorText || '')); });
            pg.on('response', (q) => { if (/mc-(dk-app|lp-vendor|lp-diffuser-assets)\.js/.test(q.url())) r.app.push({ t: Date.now() - t0, status: q.status(), url: q.url().split('/').pop().slice(0, 60) }); });
            if (c.block === 'hang') await pg.route(/mc-dk-app\.js/, (rt) => { if (/[?&]r=/.test(rt.request().url())) return rt.continue(); /* hang: never answer */ });
            if (c.block === 'fail') await pg.route(/mc-dk-app\.js/, (rt) => rt.abort()); /* every app request fails: the reload button must show at 15 s */
            if (c.slow) { const cdp = await ctx.newCDPSession(pg); await cdp.send('Emulation.setCPUThrottlingRate', { rate: 4 }); await cdp.send('Network.enable'); await cdp.send('Network.emulateNetworkConditions', { offline: false, latency: 150, downloadThroughput: 1.6 * 1024 * 1024 / 8, uploadThroughput: 750 * 1024 / 8 }); }
            if (c.prefill) {
              await pg.goto('https://maisoncroyez.com/pages/contact', { waitUntil: 'domcontentloaded', timeout: 90000 }).catch(() => {});
              r.prefillAdd = await pg.evaluate(async () => { const r = await fetch('/cart/add.js', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: [{ id: 45900240289901, quantity: 1 }, { id: 41212020457581, quantity: 1, selling_plan: 7883817069 }, { id: 41212021669997, quantity: 1, selling_plan: 7883817069 }, { id: 41212021506157, quantity: 1, selling_plan: 7883817069 }] }) }); const c = await (await fetch('/cart.js')).json(); return { status: r.status, n: c.item_count }; }).catch((e) => 'err ' + e.message);
            }
            if (c.repeat) { await pg.goto('https://maisoncroyez.com/pages/diffuser-kits', { waitUntil: 'load', timeout: 90000 }).catch(() => {}); await pg.waitForTimeout(6000); r.firstMount = await pg.evaluate(() => document.getElementById('root').children.length).catch(() => null); } /* repeat visit: everything cached, the case that froze on the owner's phone */
            const t1 = Date.now();
            await pg.goto('https://maisoncroyez.com/pages/diffuser-kits', { waitUntil: 'commit', timeout: 90000 }).catch((e) => r.errs.push('goto ' + e.message.slice(0, 80)));
            for (const s of [1, 2, 3, 5, 9, 18]) {
              await pg.waitForTimeout(Math.max(0, s * 1000 - (Date.now() - t1)));
              const st = await pg.evaluate(() => ({ rootKids: (document.getElementById('root') || {}).children ? document.getElementById('root').children.length : -1, prehero: (() => { const p = document.getElementById('mc-prehero'); return p ? getComputedStyle(p).display : 'none'; })(), h1: ((document.querySelector('#buybox h1') || {}).innerText || '').slice(0, 30) || null, scripts: [...document.scripts].filter((x) => /mc-(lp|dk)/.test(x.src)).map((x) => x.src.split('/').pop().slice(0, 60)), errs: window.__mcErrs || null })).catch((e) => ({ err: e.message.slice(0, 80) }));
              if (st.rootKids > 0 && !r.mountAt) r.mountAt = s;
              r['s' + s] = st;
              if (s === 2 || s === 18) r['geo' + s] = await pg.evaluate(geo).catch((e) => e.message.slice(0, 80));
              await pg.screenshot({ path: `${OUT}/${c.name}-${s}s.png`, timeout: 8000 }).catch(() => {});
              if (s === 18 && !c.block) { await pg.evaluate(() => { const e = document.querySelector('#buybox .hs3'); if (e) e.scrollIntoView({ block: 'center' }); }).catch(() => {}); await pg.waitForTimeout(400); await pg.locator('#buybox .hs3').screenshot({ path: `${OUT}/${c.name}-badges.png`, timeout: 8000 }).catch(() => {}); await pg.evaluate(() => scrollTo(0, 0)).catch(() => {}); }
              if (s === 18) r.retryUi = await pg.evaluate(() => ({ shown: (document.getElementById('mc-pre-retry') || {}).style ? document.getElementById('mc-pre-retry').style.display : null, err: (document.getElementById('mc-pre-err') || {}).textContent || null, sub: !!document.querySelector('.s9-sub'), badges: [...document.querySelectorAll('#buybox .hs3 .hs')].map((x) => x.textContent) })).catch(() => null);
            }
            if (c.prefill) r.cleared = await pg.evaluate(async () => (await (await fetch('/cart/clear.js', { method: 'POST' })).json()).item_count).catch(() => null);
            res.push(r); console.log(JSON.stringify(r)); await ctx.close().catch(() => {});
          }
          for (const b of Object.values(browsers)) await b.close().catch(() => {});
          fs.writeFileSync(`${OUT}/ios-check-latest.json`, JSON.stringify(res, null, 1));
          EOF2
          node check.mjs
      - name: Commit
        if: always()
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/diffuser-kits/ios
          git commit -m "ios-check: kits page in WebKit (iPhone) and Chromium" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
