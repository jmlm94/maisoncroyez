name: drawer-recon
# run 202 — where do the key sections of /pages/six-month-program sit as a % of total page height on a 390px phone (context for Clarity's 21% average scroll depth)
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Measure
        run: |
          cat > r202.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const out = {};
          for (const [name, vp] of [['mobile', { width: 390, height: 844 }], ['desktop', { width: 1366, height: 900 }]]) {
            const pg = await (await b.newContext({ viewport: vp })).newPage();
            await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await pg.waitForSelector('.tiers', { timeout: 60000 }); await pg.waitForTimeout(4000);
            out[name] = await pg.evaluate((vh) => {
              const H = document.documentElement.scrollHeight;
              const top = (el) => el ? Math.round(el.getBoundingClientRect().top + window.scrollY) : null;
              const pct = (y) => y == null ? null : Math.round(100 * y / H);
              const q = (s) => document.querySelector(s);
              const byText = (re) => [...document.querySelectorAll('h1,h2,h3,.picker-title,.plansel-title,button,summary')].find(e => re.test(e.textContent || ''));
              const marks = {
                'H1': q('#root h1'),
                'Step 1 tiers': q('.tiers'),
                'Step 2 scent picker': byText(/Pick your .* scents|2\. /i),
                'Step 3 plan': byText(/3\. |Auto-refill/i),
                'Add to cart (inline)': [...document.querySelectorAll('button')].find(b => /add to cart/i.test(b.textContent || '') && getComputedStyle(b).position !== 'fixed'),
                'Proof stats (30+ days)': byText(/PER BOTTLE/i) || [...document.querySelectorAll('*')].find(e => /30\+ DAYS/.test(e.textContent || '') && e.children.length === 0),
                'How auto-refill works': byText(/How Auto-refill/i),
                'Reviews': byText(/reviews|what customers|verified/i),
                'FAQ': byText(/Questions\?/i),
              };
              const r = { pageHeight: H, viewport: vh, firstScreenPct: Math.round(100 * vh / H), sticky: !!([...document.querySelectorAll('button,a')].find(b => /add to cart|pick .* more/i.test(b.textContent || '') && getComputedStyle(b.closest('[class]') || b).position === 'fixed')) };
              for (const [k, el] of Object.entries(marks)) r[k] = el ? { px: top(el), pct: pct(top(el)) } : null;
              // 21% line
              r['y at 21%'] = Math.round(0.21 * H);
              r['what is at 21%'] = (() => { const y = 0.21 * H; let best = null; for (const e of document.querySelectorAll('#root h1,#root h2,#root h3,#root .picker-title,#root section,#root .tiers')) { const t = e.getBoundingClientRect().top + window.scrollY; if (t <= y && (!best || t > best.t)) best = { t, txt: (e.textContent || '').trim().slice(0, 70), cls: e.className }; } return best; })();
              return r;
            }, vp.height);
            await pg.context().close();
          }
          console.log('LAYOUT ' + JSON.stringify(out, null, 1));
          await b.close();
          EOF2
          node r202.mjs
