name: drawer-recon
# run 82 — V2 page launch verify: DOM, both flows, real cart POST, pixel, drawer, prehero
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          D=lp-factory/pages/kit-builder-v2/verify/qa82
          mkdir -p $D
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const c=await b.newContext({viewport:{width:412,height:823}});
          const p=await c.newPage();
          const fb=[];
          await p.exposeFunction('__rec',a=>fb.push(a));
          await p.addInitScript(()=>{window.fbq=function(){window.__rec([].slice.call(arguments));};});
          const errs=[];p.on('pageerror',e=>errs.push(String(e).slice(0,100)));
          await p.goto('https://maisoncroyez.com/pages/build-your-kit-2?utm_source=x&utm_campaign=v2launch',{waitUntil:'load',timeout:90000});
          await p.waitForTimeout(5000);
          const dom=await p.evaluate(()=>({
            appKey:((document.querySelector('script[src*="mc-kit2-app"]')||{}).src||'').split('v=')[1],
            preCollapsed:getComputedStyle(document.getElementById('kb-pre')).display==='none',
            rootKids:document.getElementById('root').children.length,
            banner:document.querySelector('.banner').textContent.slice(0,55),
            h1subGone:!document.querySelector('.h1sub'),
            plans:document.querySelectorAll('.plan').length,
            prices:[...document.querySelectorAll('.plan-price')].map(e=>e.textContent.trim()),
            gifts:document.querySelectorAll('.plan-gift').length,
            psteps:[...document.querySelectorAll('.pstep')].map(e=>e.textContent.trim()),
            guar:document.querySelector('.guar3 .g.green b').textContent,
            overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
            cta:document.querySelector('#s1next span').textContent}));
          // plan 3 flow with 1 paid extra + REAL cart add
          const flow=await p.evaluate(()=>{
            document.querySelectorAll('.plan')[2].click(); window.goNext();
            const r={s2:document.getElementById('s2title').textContent.slice(0,60),
              pickPrice:document.querySelector('.pick-price').textContent.slice(0,45)};
            const adds=document.querySelectorAll('.pick .add'); adds[0].click(); adds[1].click(); adds[6].click();
            window.go(3);
            document.getElementById('addonchk').click();
            document.querySelectorAll('.addon-row')[3].querySelector('.add').click();
            r.due=document.getElementById('duetoday').textContent;
            r.ing=(document.querySelector('.addon-row .an i')||{}).textContent;
            window.joinToast();
            return r;});
          await p.waitForTimeout(5000);
          const cart=await p.evaluate(()=>fetch('/cart.js').then(r=>r.json()).then(c=>({count:c.item_count,total:c.total_price,
            lines:c.items.map(i=>({v:i.variant_id,q:i.quantity,price:i.price,props:i.properties}))})));
          const post=await p.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            return {drawerOpen:d&&d.hasAttribute('open'),
              btn:document.querySelector('#s3 .navrow .btn:not(.secondary)').textContent.trim()};});
          await p.evaluate(()=>{document.querySelectorAll('#cd,.livecnt').forEach(e=>e.textContent='131');});
          await p.screenshot({path:'lp-factory/pages/kit-builder-v2/verify/qa82/drawer.png'});
          await p.evaluate(()=>fetch('/cart/clear.js',{method:'POST'}));
          const cleared=await p.evaluate(()=>fetch('/cart.js').then(r=>r.json()).then(c=>c.item_count));
          // plan 1 skip flow (fresh reload)
          await p.goto('https://maisoncroyez.com/pages/build-your-kit-2?utm_source=x&utm_campaign=v2launch2',{waitUntil:'load',timeout:90000});
          await p.waitForTimeout(4000);
          const p1=await p.evaluate(()=>{
            document.querySelectorAll('.plan')[0].click();
            const label=document.querySelector('#s1next span').textContent;
            window.goNext();
            return {label,onS3:document.getElementById('s3').classList.contains('on'),
              due:document.getElementById('duetoday').textContent};});
          await p.evaluate(()=>{document.querySelectorAll('#cd,.livecnt').forEach(e=>e.textContent='131');window.go(1);window.scrollTo(0,0);});
          await p.screenshot({path:'lp-factory/pages/kit-builder-v2/verify/qa82/step1.png'});
          const atc=fb.filter(x=>x[0]==='track'&&x[1]==='AddToCart').map(x=>x[2]);
          console.log('V2LAUNCH '+JSON.stringify({dom,flow,cart,post,cleared,p1,atc,errs}));
          await b.close();})();
          EOS
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kit-builder-v2/verify
          git commit -m "v2 launch verify r82 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
