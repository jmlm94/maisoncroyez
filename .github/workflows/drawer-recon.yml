name: drawer-recon
# run 154 — live verify: no price line, green banner back, buy box screenshot (key p6m19)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          await p.goto('https://maisoncroyez.com/pages/six-month-program?utm_campaign=diag154',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(9000);
          const d=await p.evaluate(()=>{
            const q=s=>document.querySelector(s);
            return {priceLine:!!q('.price-row'), pill:!!q('.supply-badge'),
              banner:(q('.supply-banner')||{}).textContent||null,
              extra:(q('.supply-extra')||{}).textContent||null,
              grid:!!q('.kitgrid'), rows:document.querySelectorAll('.pick-row').length,
              key19:!!q('script[src*="p6m19"]')};});
          console.log('R154 '+JSON.stringify(d)+' errs='+JSON.stringify(errs));
          await p.evaluate(()=>{const e=document.querySelector('h1'); if(e) e.scrollIntoView({block:'start'});});
          await p.waitForTimeout(600);
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/final-buybox.png'});
          await b.close();})();
          EOS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live
          git commit -m "recon r154: verify price-line gone + banner back" || echo "no changes"
          git push || echo "no push"
