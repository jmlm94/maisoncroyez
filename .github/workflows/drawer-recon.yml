name: drawer-recon
# run 187 — verify v3s7 live: time from navigation to hero video playing (iPhone WebKit, 3 runs) + key check
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps webkit
      - name: Video timing
        run: |
          cat > r187.mjs <<'EOF2'
          import { webkit, devices } from 'playwright';
          const URL = 'https://maisoncroyez.com/pages/six-month-program';
          const out = [];
          for (let i = 0; i < 3; i++) {
            const b = await webkit.launch();
            const pg = await (await b.newContext({ ...devices['iPhone 13'], defaultBrowserType: undefined })).newPage();
            const errs = []; pg.on('pageerror', e => errs.push(e.message.slice(0, 120)));
            const t0 = Date.now();
            await pg.goto(URL, { waitUntil: 'commit', timeout: 90000 });
            let playingAt = null, srcAt = null, mountAt = null;
            for (let k = 0; k < 100; k++) {
              const s = await pg.evaluate(() => { const v = document.querySelector('#root video'); return v ? { src: !!(v.currentSrc || v.src), paused: v.paused, t: v.currentTime, rs: v.readyState } : null; }).catch(() => null);
              const now = Date.now() - t0;
              if (s && mountAt === null) mountAt = now;
              if (s && s.src && srcAt === null) srcAt = now;
              if (s && !s.paused && s.t > 0) { playingAt = now; break; }
              await pg.waitForTimeout(150);
            }
            const key = await pg.evaluate(() => [...document.scripts].map(s => s.src).filter(s => /mc-v3-app/.test(s)).map(s => s.split('v=')[1])[0]);
            out.push({ run: i + 1, mountMs: mountAt, srcMs: srcAt, playingMs: playingAt, key, errs });
            await b.close();
          }
          console.log('TIMING ' + JSON.stringify(out));
          EOF2
          node r187.mjs
