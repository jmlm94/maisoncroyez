name: drawer-recon
# run 107 — verify layout fix after key bump to p6m2; save stale css for forensics
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          curl -sSL "$B/mc-6mp.css?v=p6m1-472a4f6" -o lp-factory/pages/kits-lp/live/mc-6mp.stale-p6m1.css
          echo "R107A stale bytes=$(wc -c < lp-factory/pages/kits-lp/live/mc-6mp.stale-p6m1.css)"
          curl -sSL "https://maisoncroyez.com/pages/six-month-program?utm_campaign=diag107" -o page.html
          echo "R107B page key: $(grep -o "p6m[0-9]-[a-z0-9]*" page.html | sort -u | tr '\n' ' ')"
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          await p.goto('https://maisoncroyez.com/pages/six-month-program?utm_campaign=diag107b',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(9000);
          const d=await p.evaluate(()=>{
            const cs=s=>{const e=document.querySelector(s);return e?getComputedStyle(e).display:null;};
            const css=[...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.href).filter(h=>/mc-6mp/.test(h));
            return {css,kitTxt:cs('.kit-txt'),kitRow:cs('.kit-row'),kitPriceRow:cs('.kit-price-row'),pickQty:cs('.pick-qty'),pickRow:cs('.pick-row'),scentName:cs('.pick-name')};});
          console.log('R107C '+JSON.stringify(d)+' errs='+JSON.stringify(errs));
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-390.png', fullPage:false});
          await p.evaluate(()=>{const e=document.querySelector('.plansel'); if(e) e.scrollIntoView();});
          await p.waitForTimeout(600);
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-tiers.png'});
          await p.evaluate(()=>{const e=document.querySelector('.picker'); if(e) e.scrollIntoView();});
          await p.waitForTimeout(600);
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-scents.png'});
          await b.close();})();
          EOS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live
          git commit -m "recon r107: post key-bump verify + stale css forensics"
          git push
