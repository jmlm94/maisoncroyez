name: drawer-recon
# run 239 — fd11: the <video poster> is back (same &width=720 URL as the <img>, so still one request). Lighthouse on fd10
#           reported the poster-less <video>'s FIRST FRAME as the LCP element (render 8 s on the simulated phone); with a
#           poster Chrome credits the poster image instead. srcset dropped so img src == poster URL on every device.
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

