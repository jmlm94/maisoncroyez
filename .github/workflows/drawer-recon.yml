name: drawer-recon
# run 85 — locate residual free-diffuser mention on homepage
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:412,height:823}});
          await p.goto('https://maisoncroyez.com/?utm_campaign=hm85',{waitUntil:'load',timeout:90000});
          await p.waitForTimeout(6000);
          const r=await p.evaluate(()=>{
            const hits=[];
            const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
            while(w.nextNode()){const t=w.currentNode.textContent;
              if(/free\s*diffuser/i.test(t)){const el=w.currentNode.parentElement;
                const cs=getComputedStyle(el);
                hits.push({tag:el.tagName,cls:String(el.className).slice(0,60),
                  vis:cs.display!=='none'&&cs.visibility!=='hidden',
                  inRoot:!!el.closest('#root'),inDrawer:!!el.closest('#cart-drawer'),
                  section:(el.closest('.shopify-section')||{}).id||'',
                  txt:t.trim().slice(0,110)});}}
            return hits;});
          console.log('LOCATE85 '+JSON.stringify(r));
          await b.close();})();
          EOS
