name: drawer-recon
# run 126 — homepage visual survey at 390px
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Survey
        run: |
          mkdir -p lp-factory/pages/home/live
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          await p.goto('https://maisoncroyez.com/?utm_campaign=diag126',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(9000);
          const d=await p.evaluate(()=>{
            const ab=document.querySelector('.announcement-bar, [class*="announcement"]');
            return {announce: ab?ab.textContent.replace(/\s+/g,' ').trim().slice(0,140):null,
              announceHTML: ab?ab.outerHTML.slice(0,300):null};});
          console.log('R126A '+JSON.stringify(d)+' errs='+JSON.stringify(errs));
          await p.screenshot({path:'lp-factory/pages/home/live/home-top.png'});
          await p.evaluate(()=>window.scrollTo(0,700)); await p.waitForTimeout(700);
          await p.screenshot({path:'lp-factory/pages/home/live/home-hero2.png'});
          await p.evaluate(()=>{const e=document.querySelector('.pgrid'); if(e) e.scrollIntoView();}); await p.waitForTimeout(700);
          await p.screenshot({path:'lp-factory/pages/home/live/home-cards.png'});
          await p.evaluate(()=>{const e=document.querySelector('.seven .trust'); if(e) e.scrollIntoView();}); await p.waitForTimeout(700);
          await p.screenshot({path:'lp-factory/pages/home/live/home-seven.png'});
          await p.evaluate(()=>{const e=document.querySelector('.bgrid'); if(e) e.scrollIntoView();}); await p.waitForTimeout(700);
          await p.screenshot({path:'lp-factory/pages/home/live/home-buy.png'});
          await b.close();})();
          EOS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/home/live
          git commit -m "recon r126: homepage survey screenshots" || echo "no changes"
          git push || echo "no push"
