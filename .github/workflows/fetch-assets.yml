name: fetch-assets
# Downloads store CDN pictures the sandbox cannot reach (step-2 scent pictures of the kits page) into lp-factory/assets/cdn/picks, for the supply / kits previews. Edit this line and push to run. [run products-1]
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/fetch-assets.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch the pictures
        run: |
          set -e
          mkdir -p lp-factory/assets/cdn/picks
          B=https://cdn.shopify.com/s/files/1/0020/3636/7469/files
          while read -r file v; do
            [ -n "$file" ] || continue
            curl -fsSL "$B/$file?v=$v&width=320" -o "lp-factory/assets/cdn/picks/$file"
          done <<'LIST'
          golden_blossom.png 1791993010
          crisp_citruss.png 1791993011
          chilled_citrusss.png 1791993010
          honey_nectarr.png 1791993011
          euphoric_bloom.png 1791993010
          wilwood_mistiqye.png 1791993011
          midnight_sensation.png 1791993011
          LIST
          ls -la lp-factory/assets/cdn/picks
          # supply variant images generated on Higgsfield (2026-10-26) — the sandbox cannot reach cloudfront
          mkdir -p lp-factory/pages/supply/img/variants
          H=https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU
          curl -fsSL "$H/hf_20261026_192150_749c72b6-e76d-4bff-83bf-80da1827106d.png" -o lp-factory/pages/supply/img/variants/supply-6.png
          curl -fsSL "$H/hf_20261026_192151_a68b05d5-cebf-4d97-8096-7c69cd3cabc6.png" -o lp-factory/pages/supply/img/variants/supply-9.png
          curl -fsSL "$H/hf_20261026_192151_8a20efc3-d769-4c1a-b4ab-f68fbae8812a.png" -o lp-factory/pages/supply/img/variants/supply-12.png
          curl -fsSL "$H/hf_20261026_192152_cc424df4-d6d5-4b91-8319-a1211b9567df.png" -o lp-factory/pages/supply/img/variants/supply-18.png
          ls -la lp-factory/pages/supply/img/variants
          # the real scent product photos (first image of each scent product) + the seven-scents group shot, for composites and references
          mkdir -p lp-factory/assets/cdn/products
          while read -r name file; do curl -fsSL "$B/$file" -o "lp-factory/assets/cdn/products/$name.png"; done <<'LIST2'
          golden-blossom 18.png?v=1779490806
          crisp-citrus 16.png?v=1779490806
          chilled-citrus 14.png?v=1779490806
          honey-nectar 20.png?v=1779490807
          euphoric-bloom 17.png?v=1779490806
          wildwood-mystique 15.png?v=1779490806
          midnight-sensation 19.png?v=1779490806
          seven-scents 28_5262c0b2-960c-4332-99d4-c37835db64b8.png?v=1779491813
          golden-blossom-2 1_8.png?v=1779489933
          packaging-29 29_0b4ae82e-253e-48f5-b7be-d4b4ff6ca0fc.png?v=1779491812
          LIST2
          ls -la lp-factory/assets/cdn/products
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lp-factory/assets/cdn/picks lp-factory/pages/supply/img/variants lp-factory/assets/cdn/products
          git commit -m "assets: fetched pictures (picks, supply variant images)" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
