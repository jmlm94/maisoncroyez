name: drawer-recon
# run 33 — live vs drawer-preview: abar/header/fonts parity after syncing Jose's theme edits
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare chrome
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > cmp.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          async function probe(url,label,shot){
            const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
            await page.goto(url+'&cb='+Date.now(),{waitUntil:'load',timeout:90000});
            await page.waitForTimeout(8000);
            const p = await page.evaluate(()=>{
              const q=s=>document.querySelector(s);
              const abar=q('announcement-bar, .announcement-bar, [class*="announcement"]');
              const hdr=q('store-header, header, .header');
              const logo=hdr?hdr.querySelector('img'):null;
              const cs=abar?getComputedStyle(abar):null;
              const body=getComputedStyle(document.body);
              const h1=q('#root h1');
              return {
                abarText:abar?(abar.innerText||'').replace(/\s+/g,' ').trim().slice(0,80):'NONE',
                abarBg:cs?(cs.backgroundImage!=='none'?cs.backgroundImage.slice(0,90):cs.backgroundColor):'NONE',
                hdrPresent:!!hdr,
                logoSrc:logo?(logo.currentSrc||logo.src).split('/').pop().split('?')[0]:'NONE',
                logoW:logo?Math.round(logo.getBoundingClientRect().width):0,
                bodyFont:body.fontFamily.slice(0,60),
                bodyFontSize:body.fontSize,
                h1Font:h1?getComputedStyle(h1).fontFamily.slice(0,60):'n/a',
                navLinks:[...document.querySelectorAll('header a, store-header a')].map(a=>a.textContent.trim()).filter(Boolean).slice(0,8)
              };
            });
            console.log('=== '+label+' === '+JSON.stringify(p,null,1));
            await page.screenshot({ path:shot });
            await page.close();
            return p;
          }
          const live = await probe('https://maisoncroyez.com/?x=1','LIVE','chrome-live.png');
          const prev = await probe('https://maisoncroyez.com/?preview_theme_id=149076607085','PREVIEW','chrome-preview.png');
          const checks={
            abarTextSame:live.abarText===prev.abarText,
            abarBgSame:live.abarBg===prev.abarBg,
            hdrBoth:live.hdrPresent&&prev.hdrPresent,
            logoSame:live.logoSrc===prev.logoSrc,
            logoSizeSame:Math.abs(live.logoW-prev.logoW)<=2,
            bodyFontSame:live.bodyFont===prev.bodyFont,
            bodyFontSizeSame:live.bodyFontSize===prev.bodyFontSize,
            h1FontSame:live.h1Font===prev.h1Font,
            navSame:JSON.stringify(live.navLinks)===JSON.stringify(prev.navLinks)
          };
          console.log('=== VERDICT ===');
          Object.entries(checks).forEach(([k,v])=>console.log((v?'PASS':'FAIL')+' '+k));
          await b.close();
          EOS
          node cmp.mjs 2>&1 | tee chrome-cmp.txt
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/sitewide-drawer/verify
          mv chrome-cmp.txt chrome-live.png chrome-preview.png lp-factory/sitewide-drawer/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/sitewide-drawer
          git commit -m "chrome parity r33 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
