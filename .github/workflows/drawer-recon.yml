name: drawer-recon
# run 76 — kit page drawer feasibility: does #cart-drawer exist, where does it live, does it open visibly?
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          D=lp-factory/pages/kit-builder/verify/qa76
          mkdir -p $D
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:412,height:823}});
          const errs=[];p.on('pageerror',e=>errs.push(String(e).slice(0,100)));
          await p.goto('https://maisoncroyez.com/pages/build-your-kit?utm_source=instagram&utm_medium=bio&utm_campaign=dr76',{waitUntil:'load',timeout:90000});
          await p.waitForTimeout(4000);
          const info=await p.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            if(!d) return {exists:false,mcDrawer:!!window.__mcDrawer};
            let el=d,chain=[],hiddenAnc=null;
            while(el&&el!==document.documentElement){const s=getComputedStyle(el);
              if(s.display==='none'&&el!==d)hiddenAnc=el.tagName+'.'+String(el.className).slice(0,50);
              chain.push(el.tagName+(el.className?'.'+String(el.className).slice(0,40):''));el=el.parentElement;}
            return {exists:true,hasShow:typeof d.show==='function',inHeaderGroup:!!d.closest('.shopify-section-group-header-group'),
              hiddenAnc,chain:chain.slice(0,6),mcDrawer:!!window.__mcDrawer};});
          console.log('DRAWER '+JSON.stringify(info));
          // real add + open attempt
          const open=await p.evaluate(async()=>{
            const r=await fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({items:[{id:41212020457581,quantity:1,selling_plan:2627895405},{id:45450822778989,quantity:1}]})});
            if(!r.ok)return {add:r.status};
            const d=document.getElementById('cart-drawer');
            if(d&&typeof d.show==='function'){document.dispatchEvent(new CustomEvent('cart:refresh'));d.show();}
            await new Promise(res=>setTimeout(res,2500));
            const dd=document.getElementById('cart-drawer');
            const cs=dd?getComputedStyle(dd):null;
            const rect=dd?dd.getBoundingClientRect():null;
            const title=dd?(dd.querySelector('.cart-drawer__top p.h5, .cart-drawer__top .h5')||{}).textContent:null;
            const lines=dd?dd.querySelectorAll('.line-item').length:0;
            const free=dd?(dd.textContent.match(/FREE/g)||[]).length:0;
            return {add:200,open:dd&&dd.hasAttribute('open'),display:cs&&cs.display,vis:cs&&cs.visibility,
              rect:rect?{w:Math.round(rect.width),h:Math.round(rect.height),x:Math.round(rect.x)}:null,
              title:title&&title.trim().slice(0,50),lines,free};});
          console.log('OPEN '+JSON.stringify(open));
          await p.screenshot({path:'lp-factory/pages/kit-builder/verify/qa76/drawer.png'});
          await p.evaluate(()=>fetch('/cart/clear.js',{method:'POST'}));
          console.log('ERRS '+JSON.stringify(errs));
          await b.close();})();
          EOS
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kit-builder/verify
          git commit -m "kb drawer feasibility r76 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
