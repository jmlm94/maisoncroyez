name: drawer-recon
# run 172 — cart endpoint diagnostics (why /cart.js answers HTML)
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Diagnostics
        run: |
          cat > diag.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 } });
          const pg = await ctx.newPage();
          const resp = await pg.goto('https://maisoncroyez.com/cart', { waitUntil: 'domcontentloaded', timeout: 90000 });
          console.log('CARTPAGE status', resp.status(), 'url', pg.url(), 'title', await pg.title());
          await pg.waitForTimeout(1500);
          const r = await pg.evaluate(async () => {
            const out = {};
            const c1 = await fetch('/cart.js', { headers: { 'Accept': 'application/json' } });
            out.cartjs = { status: c1.status, ct: c1.headers.get('content-type'), body: (await c1.text()).slice(0, 300) };
            const c2 = await fetch('/cart/clear.js', { method: 'POST', headers: { 'Accept': 'application/json' } });
            out.clear = { status: c2.status, ct: c2.headers.get('content-type'), body: (await c2.text()).slice(0, 300) };
            const c3 = await fetch('/cart/add.js', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ items: [{ id: 45784228429933, quantity: 1 }] }) });
            out.add = { status: c3.status, ct: c3.headers.get('content-type'), body: (await c3.text()).slice(0, 300) };
            const c4 = await fetch('/cart.js?x=1', { headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' } });
            out.cartjs2 = { status: c4.status, ct: c4.headers.get('content-type'), body: (await c4.text()).slice(0, 300) };
            return out;
          });
          console.log('DIAG ' + JSON.stringify(r, null, 1));
          const r2 = await pg.goto('https://maisoncroyez.com/cart.js', { waitUntil: 'domcontentloaded', timeout: 60000 });
          console.log('GOTO cart.js status', r2.status(), 'ct', r2.headers()['content-type'], 'body', (await pg.evaluate(() => document.body.innerText)).slice(0, 400));
          await pg.evaluate(() => fetch('/cart/clear.js', { method: 'POST' })).catch(() => {});
          await b.close();
          EOF2
          node diag.mjs
