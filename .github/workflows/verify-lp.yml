name: verify-lp
# run: 18 — Lighthouse performance audit of the live PDP
on:
  push:
    branches: [claude/maison-landing-page-iyikm5]
    paths: ['.github/workflows/verify-lp.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse mobile + desktop
        run: |
          set -euo pipefail
          npm i -s lighthouse@12 > /dev/null 2>&1
          URL="https://maisoncroyez.com/pages/diffuser"
          npx lighthouse "$URL" --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance --output=json --output-path=lh-mobile.json
          npx lighthouse "$URL" --quiet --preset=desktop --chrome-flags="--headless=new --no-sandbox" --only-categories=performance --output=json --output-path=lh-desktop.json
          ls -la lh-*.json
      - name: Commit reports
        run: |
          mkdir -p lp-factory/pages/pdp-diffuser/verify
          mv lh-mobile.json lh-desktop.json lp-factory/pages/pdp-diffuser/verify/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-diffuser/verify
          git commit -m "Lighthouse reports for /pages/diffuser"
          git pull --rebase origin claude/maison-landing-page-iyikm5
          git push
