name: page-shot
# Screenshots + a few DOM checks of any page (phone / small phone / desktop, full page). Dispatch with url + out, or edit this line and push. Run 2026-10-01 22:52 UTC: ritual rt11c-aed0f0d (prose margins killed).
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page URL
        default: https://maisoncroyez.com/pages/manifestation-ritual
      out:
        description: Output folder (repo path)
        default: lp-factory/pages/free-diffusers/ritual/shots
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/page-shot.yml']
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: ${{ github.event.inputs.url || 'https://maisoncroyez.com/pages/manifestation-ritual' }}
      OUT: ${{ github.event.inputs.out || 'lp-factory/pages/free-diffusers/ritual/shots' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Shoot
        run: |
          mkdir -p "$OUT"
          cat > shot.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const URL_ = process.env.URL, OUT = process.env.OUT;
          const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 13);
          const b = await chromium.launch();
          const notes = [];
          for (const [W, H, name, mobile] of [[390, 844, 'phone', true], [360, 740, 'small', true], [1366, 900, 'desktop', false]]) {
            const ctx = await b.newContext({ viewport: { width: W, height: H }, deviceScaleFactor: 2, isMobile: mobile, hasTouch: mobile, userAgent: mobile ? 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36' : undefined });
            const pg = await ctx.newPage(); const errs = []; pg.on('pageerror', (e) => errs.push(e.message));
            await pg.goto(URL_, { waitUntil: 'domcontentloaded' });
            try { await pg.waitForSelector('#buybox .picker', { timeout: 30000 }); } catch (e) { notes.push(`${name}: buy box did not mount`); }
            await pg.waitForTimeout(2500);
            const d = await pg.evaluate(() => ({ logoDeco: (() => { const a = document.querySelector('.rit-logo-a'); if (!a) return null; const c = getComputedStyle(a); return [c.textDecorationLine, c.backgroundImage.slice(0, 30), c.boxShadow.slice(0, 30), getComputedStyle(a, '::after').content]; })(), key: (([...document.scripts].find((x) => /mc-rt-app\.js/.test(x.src)) || {}).src || 'none').split('v=')[1], themeHeader: [...document.querySelectorAll('.shopify-section-group-header-group')].map((e) => getComputedStyle(e).display), ownHeader: !!document.querySelector('.rit-hdr'), ann: (document.querySelector('.rit-ann') || {}).innerText, logoW: (document.querySelector('.rit-logo') || {}).naturalWidth, h1: (document.querySelector('#buybox h1') || {}).innerText, price: ((document.querySelector('.hd-price') || {}).innerText || '').replace(/\s+/g, ' '), picks: document.querySelectorAll('#buybox .pick').length, fq: document.querySelectorAll('.fq').length, hero: (() => { const v = document.querySelector('#root video'); return v ? [v.readyState, v.paused, (v.currentSrc || '').slice(-30)] : null; })(), prehero: [...document.querySelectorAll('#mc-prehero')].map((e) => getComputedStyle(e).display), title: document.title, bodyPad: getComputedStyle(document.body).paddingTop, firstTop: (() => { const e = document.querySelector('.rit-ann'); return e ? Math.round(e.getBoundingClientRect().top + scrollY) : null; })() }));
            await pg.screenshot({ path: `${OUT}/${stamp}-${name}-top.png` });
            try { const hb = await pg.locator('.rit-hdr').boundingBox(); if (hb) await pg.screenshot({ path: `${OUT}/${stamp}-${name}-header.png`, clip: hb }); } catch (e) {}
            const picks = await pg.$$('#buybox .pick .pick-qty button[aria-label="Add one"]:not([disabled])'); for (let i = 0; i < Math.min(3, picks.length); i++) { if (await picks[i].isDisabled()) break; await picks[i].click({ timeout: 3000 }).catch(() => {}); await pg.waitForTimeout(150); }
            await pg.waitForTimeout(400);
            await pg.mouse.wheel(0, 400); await pg.waitForTimeout(1500); await pg.waitForSelector('#sec-patricia', { timeout: 15000 }).catch(() => {}); await pg.evaluate(() => window.scrollTo(0, 0)); await pg.waitForTimeout(300);
            await pg.screenshot({ path: `${OUT}/${stamp}-${name}-full.png`, fullPage: true });
            const after = await pg.evaluate(() => ({ pill: ((document.querySelector('.pick-pill') || {}).innerText || ''), preselected: [...document.querySelectorAll('#buybox .pick.on .pick-scent')].map((e) => e.innerText), btn: ((document.querySelector('#buybox .btn.atc') || {}).innerText || ''), sticky: ((document.querySelector('.sticky .btn') || {}).innerText || ''), sections: [...document.querySelectorAll('[id^=sec-]')].map((e) => e.id.slice(4)), heroSrc: (() => { const v = document.querySelector('#root video, #mc-hero-v'); return v ? (v.currentSrc || v.getAttribute('data-src') || v.src || '').slice(-40) : null; })(), cmpRows: document.querySelectorAll('.cmp tbody tr').length, rvs: document.querySelectorAll('.rv').length, faq: document.querySelectorAll('#sec-faq .qa').length, tried: (() => { const im = document.querySelector('#sec-enemyStack .split-half img'); return im ? [im.naturalWidth, (im.currentSrc || '').slice(-28)] : null; })(), h2px: (() => { const h = document.querySelector('#sec-goodbye h2'); return h ? getComputedStyle(h).fontSize : null; })(), gap: (() => { const h = document.querySelector('.rit-hdr'), g = document.querySelector('.gal'); return h && g ? Math.round(g.getBoundingClientRect().top - h.getBoundingClientRect().bottom) : null; })(), ratingTag: ((document.querySelector('.tb-rating') || {}).tagName), ratingGap: (() => { const g = document.querySelector('.gal'), r = document.querySelector('.tb-rating'); return g && r ? Math.round(r.getBoundingClientRect().top - g.getBoundingClientRect().bottom) : null; })(), pics: [...new Set([...document.querySelectorAll('#buybox .pick .ph img')].map((im) => im.naturalWidth + 'x' + im.naturalHeight + '@' + Math.round(im.getBoundingClientRect().width)))], steps: [...document.querySelectorAll('.hstep .ph')].map((e) => e.querySelector('video') ? 'video' : e.querySelector('img') ? 'img' : 'none'), galW: Math.round((document.querySelector('.gal') || document.body).getBoundingClientRect().width), loop: (() => { const v = document.querySelector('#root video'); return v ? v.loop : null; })() }));
            notes.push(`${name} ${W}x${H}: ${JSON.stringify({ ...d, ...after, errs })}`);
            await ctx.close();
          }
          await b.close();
          const fs = await import('fs'); fs.writeFileSync(`${OUT}/${stamp}-notes.txt`, notes.join('\n') + '\n'); console.log(notes.join('\n'));
          EOF2
          node shot.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          git commit -m "page-shot: $URL" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
