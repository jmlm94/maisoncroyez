name: drawer-recon
# run 46 — copy round live verify: single-Circle offer, new title, black ATC (fd52) — DOM checks + Lighthouse median-of-3
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify + Lighthouse x3
        run: |
          npm i -s playwright@1.56.1 lighthouse@12 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          URL='https://maisoncroyez.com/pages/free-diffuser?utm_source=instagram&utm_medium=bio&utm_campaign=perf_test'
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files'
          # 1) origin propagation of the new bundle bytes (cache-busted with unique ?v=)
          for i in $(seq 1 50); do
            OK=1
            curl -fsSL "$B/mc-lp-free-diffuser-app.js?v=oc$RANDOM$RANDOM" | grep -q "Join the Manifestation Circle today and enjoy" || OK=0
            curl -fsSL "$B/mc-lp-free-diffuser.css?v=oc$RANDOM$RANDOM" | grep -q "atc-guar" || OK=0
            if [ "$OK" = "1" ]; then echo "origin propagated (attempt $i)"; break; fi
            echo "origin still stale (attempt $i)"; sleep 30
          done
          [ "$OK" = "1" ] || { echo "FATAL: origin never propagated"; exit 1; }
          # 2) wait for the page to flip to fd52, then verify canonical hourly URLs
          OK=0
          for i in $(seq 1 40); do
            V="fd52-$(date -u +%Y%m%d%H)"
            if curl -fsSL "$URL&flip=$i" | grep -q "fd52-" \
               && curl -fsSL "$B/mc-lp-free-diffuser-app.js?v=$V" | grep -q "Join the Manifestation Circle today and enjoy" \
               && curl -fsSL "$B/mc-lp-free-diffuser.css?v=$V" | grep -q "atc-guar"; then OK=1; echo "fd52 live, canonical URLs fresh (attempt $i)"; break; fi
            echo "page not on fd52 yet / edge stale (attempt $i)"; sleep 60
          done
          [ "$OK" = "1" ] || { echo "FATAL: fd52 not live within 40 min"; exit 1; }
          node - <<'EOS' > copy-verify.txt
          (async()=>{
          const { chromium } = require('playwright');
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:412,height:823}, deviceScaleFactor:1.75 });
          await page.goto('https://maisoncroyez.com/pages/free-diffuser?utm_source=instagram&utm_medium=bio&utm_campaign=perf_test',{waitUntil:'load',timeout:90000});
          await page.waitForTimeout(9000);
          const t = await page.evaluate(()=>{
            const q=(s)=>{const e=document.querySelector(s);return e?e.textContent.trim():null};
            const atc=document.querySelector('.btn.atc');
            return {
              h1: q('#root h1'),
              badge: q('.price-badge'),
              dayrate: q('.dayrate'),
              planCount: document.querySelectorAll('.plansel .plan').length,
              planName: q('.plan-name'),
              planselTitle: q('.plansel-title'),
              planBullet1: q('.plan ul li'),
              pickerTitles: [...document.querySelectorAll('.picker-title')].map(e=>e.textContent.trim().slice(0,60)),
              firstIngs: q('.pick-ings'),
              atcText: atc?atc.textContent.trim():null,
              atcBg: atc?getComputedStyle(atc).backgroundColor:null,
              atcGuar: q('.atc-guar'),
              hiwTitle: q('.hiw-title'),
              hiwKeys: [...document.querySelectorAll('.hiw-k')].map(e=>e.textContent.trim()),
              hiwLast: (()=>{const r=[...document.querySelectorAll('.hiw-row')];return r.length?r[r.length-1].textContent.trim().slice(0,120):null})(),
              oneTimeVisible: /One-Time/.test(document.getElementById('root').innerText),
              needToKnow: /need to know/i.test(document.getElementById('root').innerText),
              preDisplay: getComputedStyle(document.getElementById('mc-prehero')).display,
              rootKids: document.getElementById('root').children.length,
              stickyText: (()=>{const s=document.querySelector('.sticky .btn');return s?s.textContent.trim().slice(0,60):null})(),
            };
          });
          console.log(JSON.stringify(t,null,1));
          await b.close();
          })();
          EOS
          cat copy-verify.txt
          for n in 1 2 3; do
            npx lighthouse "$URL" --quiet --chrome-flags="--headless=new --no-sandbox" --chrome-path="$CHROME" \
              --only-categories=performance --form-factor=mobile --screenEmulation.mobile \
              --output=json --output-path=lh-$n.json || true
          done
          node - <<'EOS'
          const fs=require('fs');
          const runs=[1,2,3].map(n=>{try{return JSON.parse(fs.readFileSync('lh-'+n+'.json'))}catch(e){return null}}).filter(Boolean);
          const rows=runs.map(r=>({score:Math.round(r.categories.performance.score*100),
            fcp:r.audits['first-contentful-paint'].numericValue, lcp:r.audits['largest-contentful-paint'].numericValue,
            tbt:r.audits['total-blocking-time'].numericValue, cls:r.audits['cumulative-layout-shift'].numericValue,
            si:r.audits['speed-index'].numericValue, bench:r.environment.benchmarkIndex, r}));
          rows.forEach((x,i)=>console.log('run'+(i+1)+': score '+x.score+' FCP '+Math.round(x.fcp)+' LCP '+Math.round(x.lcp)+' TBT '+Math.round(x.tbt)+' CLS '+x.cls.toFixed(3)+' SI '+Math.round(x.si)+' bench '+Math.round(x.bench)));
          const med=a=>a.slice().sort((x,y)=>x-y)[Math.floor(a.length/2)];
          const m={score:med(rows.map(x=>x.score)),fcp:med(rows.map(x=>x.fcp)),lcp:med(rows.map(x=>x.lcp)),tbt:med(rows.map(x=>x.tbt)),cls:med(rows.map(x=>x.cls)),si:med(rows.map(x=>x.si))};
          let out='MEDIAN of '+rows.length+'\nSCORE: '+m.score+'\nfirst-contentful-paint: '+(m.fcp/1000).toFixed(1)+' s\nlargest-contentful-paint: '+(m.lcp/1000).toFixed(1)+' s\ntotal-blocking-time: '+Math.round(m.tbt)+' ms\ncumulative-layout-shift: '+m.cls.toFixed(3)+'\nspeed-index: '+(m.si/1000).toFixed(1)+' s\n';
          console.log(out);
          fs.writeFileSync('lh-summary-r46.txt',out);
          const keep=rows.find(x=>x.score===m.score)||rows[0];
          fs.writeFileSync('lh-r46.json',JSON.stringify(keep.r));
          const a=keep.r.audits;
          const fb=(a['network-requests'].details.items||[]).filter(i=>/connect\.facebook/.test(i.url));
          console.log('FB pixel requests: '+fb.length);
          EOS
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/pages/pdp-free-diffuser/perf2
          cp lh-r46.json lh-summary-r46.txt copy-verify.txt lp-factory/pages/pdp-free-diffuser/perf2/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-free-diffuser/perf2
          git commit -m "LP copy round verify r46 fd52 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
