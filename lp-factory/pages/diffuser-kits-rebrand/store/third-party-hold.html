<script>
(function(){if(window.__MC_TP__)return;window.__MC_TP__=1;
/* fd15 perf: hold NON-essential third-party scripts that are injected after this point until the first touch/scroll/key
   (or a timeout), so the hero paint and the first tap are not competing with them. Shopify's own scripts, the Meta pixel,
   Subi, Klaviyo etc. still load; only the moment changes. Tier A (Clarity) releases at first interaction or 6 s; tier B
   (Klaviyo onsite chunks, Postscript, Gorgias, 9gtb/Trybe, Subi SDK) at first interaction or 12 s. fd16: tier C = the Meta
   pixel library (connect.facebook.net/fbevents.js) at first interaction or 5 s — Shopify's channel pixel queues PageView in
   the fbq stub meanwhile, so the event still goes out (with its event id); AddToCart/InitiateCheckout always come after a
   tap, i.e. after the release. */
var A=/scripts\.clarity\.ms/,B=/(static(-tracking)?\.klaviyo\.com|sdk\.postscript\.io|gorgias\.(chat|help)|content\.9gtb\.com\/script|cdn\.subi\.co)/,C=/connect\.facebook\.net/;
var q=[],rel={A:false,B:false,C:false};
function tier(n){try{if(!n||n.tagName!=='SCRIPT')return'';var s=n.src||n.getAttribute('src')||'';if(!s)return'';if(A.test(s))return'A';if(B.test(s))return'B';if(C.test(s))return'C';}catch(e){}return'';}
var ap=Node.prototype.appendChild,ib=Node.prototype.insertBefore;
Node.prototype.appendChild=function(n){var t=tier(n);if(t&&!rel[t]){q.push([t,this,n,null]);return n;}return ap.call(this,n);};
Node.prototype.insertBefore=function(n,r){var t=tier(n);if(t&&!rel[t]){q.push([t,this,n,r]);return n;}return ib.call(this,n,r);};
function release(t){if(rel[t])return;rel[t]=true;var keep=[];q.forEach(function(x){if(x[0]!==t){keep.push(x);return;}try{if(x[3]&&x[3].parentNode===x[1])ib.call(x[1],x[2],x[3]);else ap.call(x[1]||document.head,x[2]);}catch(e){try{ap.call(document.head,x[2]);}catch(e2){}}});q=keep;
if(rel.A&&rel.B&&rel.C){Node.prototype.appendChild=ap;Node.prototype.insertBefore=ib;}}
function all(){setTimeout(function(){release('C');},1200);setTimeout(function(){release('A');},2500);setTimeout(function(){release('B');},4500);} /* dk9r (2026-10-22, perf): staggered after the first interaction, so the tap itself keeps the main thread and the network */
['touchstart','touchmove','scroll','wheel','keydown','pointerdown'].forEach(function(e){addEventListener(e,all,{once:true,passive:true,capture:true});});
setTimeout(function(){release('C');},5000);setTimeout(function(){release('A');},6000);setTimeout(function(){release('B');},12000);
window.__mcReleaseThirdParties=all;})();
</script>
