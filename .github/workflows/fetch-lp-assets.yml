name: fetch-lp-assets
# Relay: fetches generated LP media past the sandbox egress allowlist.
on:
  workflow_dispatch:
  push:
    branches: [claude/maison-landing-page-iyikm5]
    paths: ['.github/workflows/fetch-lp-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch generated images
        run: |
          set -euo pipefail
          DIR=lp-factory/pages/pdp-diffuser/assets/raw
          mkdir -p "$DIR"
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU"
          curl -fsSL -o "$DIR/guests.png" "$BASE/hf_20260707_185707_62608ce3-07bb-454a-9e51-05fc5343a9f2.png"
          curl -fsSL -o "$DIR/soot.png"   "$BASE/hf_20260707_185709_8cab6ef1-807a-4ed0-9fa0-efc75f588bf2.png"
          curl -fsSL -o "$DIR/mold.png"   "$BASE/hf_20260707_185712_ba9e17fc-73eb-43e7-827c-553f07d24c3c.png"
          curl -fsSL -o "$DIR/hotel.png"  "$BASE/hf_20260707_185714_91d69223-3c34-49e2-9eb2-5161b849285d.png"
          curl -fsSL -o "$DIR/dog.png"    "$BASE/hf_20260707_185715_9442beea-56ac-4a8a-adbc-ae9ef41be55b.png"
          GDIR=lp-factory/pages/pdp-diffuser/assets/gallery-raw
          mkdir -p "$GDIR"
          CDN="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          for f in "25-min.png?v=1767910199" "image-1_1_1.png?v=1773273488" "image-2_1_1.png?v=1773273488" "image-5_1_1.png?v=1773273488" "image-3_1_1.png?v=1773273488" "image-6_1_1.png?v=1773273488" "image-4_1_1.png?v=1773273488" "image-7_1_1.png?v=1773273488" "26-min.png?v=1773273488" "27-min.png?v=1773273488"; do
            name="${f%%\?*}"
            curl -fsSL -o "$GDIR/$name" "$CDN/$f&width=900"
          done
          ls -la "$DIR" "$GDIR"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-diffuser/assets/raw lp-factory/pages/pdp-diffuser/assets/gallery-raw
          git commit -m "Fetch PDP angle media (raw)"
          git push
