name: drawer-recon
# run 161 — gate mc-ic files at origin + storefront cart smoke (selling plan + BXGY combo)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate files
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          curl -s "$B/mc-ic-app.js?v=og$RANDOM$RANDOM" -o /tmp/app.js
          curl -s "$B/mc-ic.css?v=og$RANDOM$RANDOM" -o /tmp/ic.css
          curl -s -o /dev/null -w "mp4=%{http_code} bytes=%{size_download}\n" "$B/mc-hero-loop-780.mp4?v=og$RANDOM"
          curl -s -o /dev/null -w "webm=%{http_code} bytes=%{size_download}\n" "$B/mc-hero-loop-780.webm?v=og$RANDOM"
          echo "appBytes=$(wc -c < /tmp/app.js)"
          echo "claim=$(grep -c 'CLAIM MY FREE DIFFUSER' /tmp/app.js || true)"
          echo "plan=$(grep -c 'selling_plan: CART.sellingPlan' /tmp/app.js || true)"
          echo "vid=$(grep -c 'mc-hero-loop-780.mp4' /tmp/app.js || true)"
          echo "cssBytes=$(wc -c < /tmp/ic.css)"
          echo "offhero=$(grep -c '\.offhero{' /tmp/ic.css || true)"
          echo "hardening=$(grep -c '#root \.offhero{display:flex !important}' /tmp/ic.css || true)"
          echo "vsimg=$(grep -c 'video\.simg' /tmp/ic.css || true)"
      - name: Cart smoke (membership combo)
        run: |
          J=/tmp/jar
          curl -s -c $J -o /dev/null "https://maisoncroyez.com/"
          R=$(curl -s -b $J -c $J -X POST "https://maisoncroyez.com/cart/add.js" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d '{"items":[{"id":41212020457581,"quantity":1,"selling_plan":2661875821},{"id":41212018655341,"quantity":1,"selling_plan":2661875821},{"id":45450822778989,"quantity":1}]}')
          echo "$R" | head -c 400; echo
          C=$(curl -s -b $J "https://maisoncroyez.com/cart.js")
          echo "itemCount=$(echo "$C" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["item_count"]); print("totalCents", d["total_price"]); [print(i["id"], i["selling_plan_allocation"]["selling_plan"]["id"] if i.get("selling_plan_allocation") else "one-time", i["final_line_price"]) for i in d["items"]]')"
          curl -s -b $J -X POST "https://maisoncroyez.com/cart/clear.js" -o /dev/null -w "clear=%{http_code}\n"
