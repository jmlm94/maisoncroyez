name: drawer-recon
# run 228 — /pages/free-diffusers fd4: one-time = "(One-Time)" kit variants ($80.00 / $90.05 / $140.10) + full-price scents
#           => $129.95 / $189.95 / $289.95. r228 hit Shopify 429s on /cart.js (runner throttled) -> 45 s gap between paths. Same 5 paths: 2S plan (phone), 3S plan (desktop),
#           2S one-time (desktop), 1S plan (phone), 3S one-time (phone). page → kit → scents → review → add to cart → drawer → checkout.
#           Real carts, real checkout page, no order placed.
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Funnel
        run: |
          mkdir -p lp-factory/pages/free-diffusers/recon/r228
          cat > r228.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const OUT = 'lp-factory/pages/free-diffusers/recon/r228/';
          const URL = 'https://maisoncroyez.com/pages/free-diffusers';
          const b = await chromium.launch();
          const R = []; const ok = (n, c, i = '') => R.push({ n, c: !!c, i: String(i).replace(/\s+/g, ' ').slice(0, 260) });
          const $ = (n) => String(n.toFixed(2)).replace('.', '\\.');
          const PATHS = [
            { id: '2S-phone-plan', tier: 2, picks: [0, 6], total: 99.90, save: 160, oneTotal: 189.95, oneKit: '90.05', desktop: false },
            { id: '3S-desktop-plan', tier: 3, picks: [1, 2, 4], total: 149.85, save: 240, oneTotal: 289.95, oneKit: '140.10', desktop: true },
            { id: '2S-desktop-onetime', tier: 2, picks: [3, 5], total: 189.95, planTotal: 99.90, save: 160, oneTotal: 189.95, oneKit: '90.05', oneSave: 70, desktop: true, one: true },
            { id: '1S-phone-plan', tier: 1, picks: [2], total: 49.95, save: 80, oneTotal: 129.95, oneKit: '80', desktop: false },
            { id: '3S-phone-onetime', tier: 3, picks: [0, 4, 6], total: 289.95, planTotal: 149.85, save: 240, oneTotal: 289.95, oneKit: '140.10', oneSave: 100, desktop: false, one: true },
          ];
          for (const P of PATHS) {
            const n = P.tier, planTotal = P.planTotal || P.total;
            const vp = P.desktop ? { width: 1366, height: 900 } : { width: 390, height: 844 };
            const ctx = await b.newContext({ viewport: vp, deviceScaleFactor: P.desktop ? 1 : 2 }); const pg = await ctx.newPage();
            const errs = []; pg.on('pageerror', (e) => errs.push(e.message));
            const net = []; pg.on('response', (r) => { if (/\/cart(\/add)?\.js|\/cart\?section/.test(r.url())) net.push(r.request().method() + ' ' + r.url().replace(/^https?:\/\/[^/]+/, '').slice(0, 60) + ' -> ' + r.status()); });
            const T = async (s) => (await pg.locator(s).first().innerText()).replace(/\s+/g, ' ').trim();
            try {
              const t0 = Date.now();
              await pg.goto(URL, { waitUntil: 'domcontentloaded', timeout: 90000 });
              await pg.waitForSelector('#buybox .tiers', { timeout: 60000 }); const tBuy = Date.now() - t0; await pg.waitForTimeout(2000);
              const key = await pg.evaluate(() => { const s = [...document.scripts].find((x) => /mc-fd-app\.js/.test(x.src)); return s ? s.src.split('v=')[1] : 'none'; });
              ok(`${P.id} page version fd4, buy box in ${tBuy}ms`, /^fd4-/.test(key), key);
              ok(`${P.id} no overflow s1`, await pg.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1));
              ok(`${P.id} black promo strip + deal box (3 rows)`, /THE FIRST 1,000 FREE DIFFUSERS ARE ON US, ONLY A FEW LEFT!/.test(await T('#root .promo-strip')) && (await pg.$$eval('#buybox .dealbox .deal-row', (a) => a.length)) === 3 && /1 scent = 1 FREE diffuser/.test(await T('#buybox .dealbox')) && /20% OFF, for life/.test(await T('#buybox .dealbox')) && /We.ll pay the return \+ full refund/.test(await T('#buybox .dealbox')), await T('#buybox .dealbox'));
              ok(`${P.id} step-1 title`, /How many free diffusers would you like to receive\?/.test(await T('#buybox .step-title')), await T('#buybox .step-title'));
              const cards = await pg.$$eval('#buybox .tier', (a) => a.map((e) => ({ t: e.innerText.replace(/\s+/g, ' '), name: (e.querySelector('.tier-name') || {}).innerText || '', req: (e.querySelector('.tier-req') || {}).innerText || '', claim: (e.querySelector('.tier-claim') || {}).innerText || '', ship: (e.querySelector('.tier-ship') || {}).innerText || '', shipFree: !!e.querySelector('.tier-ship.free'), on: e.classList.contains('on'), reqUpper: getComputedStyle(e.querySelector('.tier-req')).textTransform })));
              ok(`${P.id} 3 kit cards: names, (REQUIRES N SCENT) caps, claim bold, ship pills, NO prices, 2-kit default`, cards.length === 3 && cards[0].name.startsWith('1 FREE Diffuser') && cards[1].name.startsWith('2 FREE Diffusers') && cards[2].name.startsWith('3 FREE Diffusers') && cards.every((c, i) => new RegExp(`\\(requires ${i + 1} scent`, 'i').test(c.req) && c.reqUpper === 'uppercase' && new RegExp(`You.re claiming \\$${$((i + 1) * 79.95)} of diffusers, free\\.`).test(c.claim) && !/\$(49\.95|99\.90|149\.85)/.test(c.t)) && /\$9\.95 FLAT FEE — FREE ON \$75\+ ORDERS/.test(cards[0].ship) && !cards[0].shipFree && cards[1].shipFree && cards[2].shipFree && /ELIGIBLE FOR FREE SHIPPING/.test(cards[1].ship) && /ELIGIBLE FOR FREE SHIPPING/.test(cards[2].ship) && /Restroom, Studio, Storage/.test(cards[0].t) && /Living Room \+ Bedroom/.test(cards[1].t) && /Living Room, Bedroom, Kitchen/.test(cards[2].t) && /MOST POPULAR/.test(cards[1].t) && /BEST VALUE/.test(cards[2].t) && cards[1].on && !cards[0].on && !cards[2].on, JSON.stringify(cards).slice(0, 500));
              await pg.click(`#buybox .tier:nth-child(${n})`); await pg.waitForTimeout(300);
              ok(`${P.id} step-1 button = pick your scents + 62% offer line`, /Pick your scents/i.test(await T('#buybox .step-next')) && /62% OFF \+ FREE DIFFUSERS OFFER APPLIED!/.test(await T('#buybox .step-next')), await T('#buybox .step-next'));
              await pg.evaluate(() => document.querySelector('#buybox .step-next').scrollIntoView({ block: 'center' })); await pg.locator('#buybox .step-next').click(); await pg.waitForTimeout(500);
              ok(`${P.id} step 2 title asks ${n}, pick-free line, long-form hidden, NO gift note`, new RegExp(`Pick your ${n} scent${n > 1 ? 's' : ''}:`).test(await T('#buybox .step-title')) && /\$49\.95 \+ FREE diffuser/.test(await T('#buybox .pick-free')) && (await pg.$$eval('[id^=sec-]', (a) => a.length)) === 1 && !(await pg.$('#buybox .gift-obj')) && !/mystery gift/i.test(await T('#buybox')), await T('#buybox .step-title'));
              const btnBefore = await T('#buybox .navrow .btn.atc');
              const c = pg.locator('#buybox .pick.compact');
              for (const k of P.picks) { if ((await c.nth(k).locator('.pick-qty b').innerText()) !== '0') await c.nth(k).locator('.pick-qty button:last-child').click(); else await c.nth(k).click(); await pg.waitForTimeout(150); }
              ok(`${P.id} ${n}/${n} chosen, button unlocks`, new RegExp(`${n}/${n} scent`, 'i').test(await T('#buybox .pick-count')) && /PICK/i.test(btnBefore) && /REVIEW MY KIT/i.test(await T('#buybox .navrow .btn.atc')), await T('#buybox .pick-count'));
              ok(`${P.id} no overflow s2`, await pg.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1));
              await pg.click('#buybox .navrow .btn.atc'); await pg.waitForTimeout(600);
              const rev = await pg.evaluate(() => ({ rows: [...document.querySelectorAll('#buybox .kr-row .kr-pr')].map((e) => e.innerText.replace(/\s+/g, ' ').trim()), struck: !!document.querySelector('#buybox .kr-row .kr-pr s'), total: (document.querySelector('#buybox .kr-total') || {}).innerText || '', save: (document.querySelector('#buybox .kr-save') || {}).innerText || '', strip: (document.querySelector('#buybox .scarcity-strip') || {}).innerText || '', sirens: document.querySelectorAll('#buybox .scarcity-strip .siren').length, opts: [...document.querySelectorAll('#buybox .plan-opts .popt')].map((e) => ({ on: e.classList.contains('on'), chk: e.getAttribute('aria-checked'), t: e.innerText.replace(/\s+/g, ' ') })), fact: (document.querySelector('#buybox .plan-fact') || {}).innerText || '', old: document.querySelectorAll('#buybox .decline, #buybox .modes, #buybox .mode, #buybox .plan-card, #buybox .onetime, #buybox .gift-obj').length, btn: document.querySelector('#buybox .btn.atc').innerText.replace(/\s+/g, ' ') }));
              ok(`${P.id} review: ${n} scents $49.95, diffusers struck FREE, total $${planTotal}, saving $${P.save}`, rev.rows.filter((r) => r === '$49.95').length === n && rev.struck && new RegExp(`^\\$${$(n * 79.95)} ?FREE$`).test(rev.rows[rev.rows.length - 1]) && new RegExp(`You only pay: ?\\$${$(planTotal)}`).test(rev.total.replace(/\s+/g, ' ')) && new RegExp(`saving \\$${P.save} today!`).test(rev.save), JSON.stringify(rev).slice(0, 300));
              ok(`${P.id} red strip 🚨 LAST 100 🚨, two plain options (sub selected), fact line, no old widgets`, /LAST 100 DIFFUSERS AVAILABLE/.test(rev.strip) && rev.sirens === 2 && rev.opts.length === 2 && rev.opts[0].on && rev.opts[0].chk === 'true' && !rev.opts[1].on && rev.opts[1].chk === 'false' && /Auto-refill every 30 days \+ 20% OFF lifetime/.test(rev.opts[0].t) && new RegExp(`\\$${$(planTotal)} today, then \\$39\\.95/scent, every 30 days\\.`).test(rev.opts[0].t) && /Pause, swap and cancel anytime\./.test(rev.opts[0].t) && /✓ Selected/i.test(rev.opts[0].t) && /One-Time Payment/.test(rev.opts[1].t) && new RegExp(`\\$${$(P.oneTotal)} today\\. ${n} scent${n > 1 ? 's' : ''} at full price \\+ (the diffuser|both diffusers|all 3 diffusers) for \\$${P.oneKit.replace('.', '\\.')}\\. No refills\\.`).test(rev.opts[1].t) && !/Selected/i.test(rev.opts[1].t) && /Fact: 86% of customers have stayed with us for 6\+ months/.test(rev.fact) && /or your money back\. Try us out\./.test(rev.fact) && rev.old === 0, JSON.stringify(rev.opts) + ' ' + rev.fact);
              ok(`${P.id} ATC button (plan) $${planTotal} + 62% line`, new RegExp(`ADD TO CART — \\$${$(planTotal)}`).test(rev.btn) && /62% OFF \+ FREE DIFFUSERS OFFER APPLIED!/.test(rev.btn), rev.btn);
              ok(`${P.id} step 3: ONE add-to-cart button, no stale step-2 nodes (fd2 fix)`, (await pg.$$eval('#buybox .btn.atc', (a) => a.length)) === 1 && !(await pg.$('#buybox .buybox > .pick-count')) && !(await pg.$('#buybox .buybox > .navrow:not(.back-only)')) && !(await pg.$('#buybox .buybox > .picker')), await pg.$$eval('#buybox .buybox > *', (a) => a.map((e) => e.tagName.toLowerCase() + '.' + String(e.className).replace(/\s+/g, '.')).join(' ')));
              ok(`${P.id} hero: poster <img> under the adopted video in the gallery slide, same box (LCP fix)`, await pg.evaluate(() => { const s = document.querySelector('#root .gal-slide'); const i = s && s.querySelector('img.hv-poster'); const v = s && s.querySelector('.hv-host video'); if (!i || !v) return false; const a = i.getBoundingClientRect(), b = v.getBoundingClientRect(); return !document.getElementById('mc-hero-v') && a.width > 300 && Math.abs(a.width - b.width) < 2 && Math.abs(a.height - b.height) < 2 && Math.abs(a.top - b.top) < 2 && [...s.children].indexOf(i) < [...s.children].indexOf(v.parentElement); }), await pg.evaluate(() => { const v = document.querySelector('#root .gal-slide video'); return v ? `paused=${v.paused} rs=${v.readyState} t=${v.currentTime.toFixed(1)}` : 'no video'; }));
              if (P.one) {
                await pg.click('#buybox .plan-opts .popt:nth-child(2)'); await pg.waitForTimeout(400);
                const after = await pg.evaluate(() => ({ opts: [...document.querySelectorAll('#buybox .plan-opts .popt')].map((e) => ({ on: e.classList.contains('on'), chk: e.getAttribute('aria-checked'), sel: /Selected/i.test(e.innerText) })), rows: [...document.querySelectorAll('#buybox .kr-row .kr-pr')].map((e) => e.innerText.replace(/\s+/g, ' ').trim()), struck: !!document.querySelector('#buybox .kr-row .kr-pr s'), total: document.querySelector('#buybox .kr-total').innerText.replace(/\s+/g, ' '), save: (document.querySelector('#buybox .kr-save') || {}).innerText || '', btn: document.querySelector('#buybox .btn.atc').innerText.replace(/\s+/g, ' ') }));
                ok(`${P.id} one-time selected: total $${P.total}, scents $49.95, diffusers struck -> $${P.oneKit}, saving $${P.oneSave}, ONE-TIME button`, after.opts[1].on && after.opts[1].chk === 'true' && after.opts[1].sel && !after.opts[0].on && !after.opts[0].sel && after.rows.filter((r) => r === '$49.95').length === n && after.struck && new RegExp(`^\\$${$(n * 79.95)} \\$${P.oneKit.replace('.', '\\.')}$`).test(after.rows[after.rows.length - 1]) && after.total.includes('$' + P.total.toFixed(2)) && new RegExp(`saving \\$${P.oneSave} today`).test(after.save) && new RegExp(`ADD TO CART — \\$${$(P.total)}`).test(after.btn) && /ONE-TIME PAYMENT · NO REFILLS · FREE SHIPPING/.test(after.btn), JSON.stringify(after).slice(0, 300));
              }
              ok(`${P.id} carousel 6 CDN photos + 5 FAQ`, await pg.evaluate(() => [...document.querySelectorAll('#buybox .rv6-card img')].length === 6 && document.querySelectorAll('#buybox .acc.faq .qa').length === 5));
              ok(`${P.id} no overflow s3`, await pg.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1));
              await pg.evaluate(() => document.querySelector('#buybox .btn.atc').scrollIntoView({ block: 'center' })); await pg.locator('#buybox .btn.atc').click();
              await pg.waitForTimeout(5000);
              const dr = await pg.evaluate(() => { const d = document.getElementById('cart-drawer'); if (!d) return null; return { lines: [...d.querySelectorAll('.line-item')].map((li) => ({ t: ((li.querySelector('a.bold') || {}).textContent || '').trim().slice(0, 40), q: ((li.querySelector('.mc-qty') || {}).innerText || ''), v: ((li.querySelector('.mc-var') || {}).innerText || ''), price: (li.innerText.match(/\$[\d.,]+/g) || []).join(' ') })), total: (d.innerText.match(/Today's total:\s*\$[\d.,]+/) || [''])[0] }; });
              const isKit = (l) => /Free Diffuser Kit|Special Kits/.test(l.t);
              const scentLines = dr ? dr.lines.filter((l) => !isKit(l)) : [];
              const scentQty = dr ? scentLines.reduce((s, l) => s + (parseInt((l.q.match(/×(\d+)/) || [])[1] || '0', 10)), 0) : -1;
              const fdKit = dr && dr.lines.find((l) => /Free Diffuser Kit/.test(l.t));
              const skKit = dr && dr.lines.find((l) => /Special Kits/.test(l.t));
              const toast = await pg.evaluate(() => ((document.querySelector('#buybox .toast, #buybox [class*=toast]') || {}).innerText || ''));
              if (P.one) ok(`${P.id} drawer one-time: Free Diffuser Kit "${n} Diffuser(s) + ${n} Scent(s) (One-Time)" $${P.oneKit} + ${n} scents at $49.95, NO Special Kits, total $${P.total}`, fdKit && !skKit && new RegExp(`${n} Diffusers? \\+ ${n} Scents? \\(One-Time\\)`).test(fdKit.v) && scentQty === n && scentLines.every((l) => /\$49\.95/.test(l.price) && !/\$0\.00/.test(l.price)) && dr.total.includes('$' + P.total.toFixed(2)), JSON.stringify(dr).slice(0, 320) + ' NET=' + JSON.stringify(net) + ' TOAST=' + JSON.stringify(toast));
              else ok(`${P.id} drawer plan: Free Diffuser Kit "${n} FREE Diffuser(s) + ${n} Scent(s)" + ${n} scents at $0, NO Special Kits, total $${P.total}`, fdKit && !skKit && new RegExp(`${n} FREE Diffusers? \\+ ${n} Scents?`).test(fdKit.v) && scentQty === n && scentLines.every((l) => /\$0\.00/.test(l.price)) && dr.total.includes('$' + P.total.toFixed(2)), JSON.stringify(dr).slice(0, 320) + ' NET=' + JSON.stringify(net) + ' TOAST=' + JSON.stringify(toast));
              await pg.screenshot({ path: OUT + `${P.id}-drawer.png` });
              await pg.locator('#cart-drawer form.buy-buttons button, #cart-drawer form.buy-buttons .btn').first().click();
              await pg.waitForURL(/checkouts\//, { timeout: 60000 }); await pg.waitForLoadState('domcontentloaded'); await pg.waitForTimeout(6000);
              const sumBtn = pg.locator('button:has-text("order summary"), button[aria-controls*="order-summary"]').first();
              if (await sumBtn.count()) { try { await sumBtn.click({ timeout: 3000 }); await pg.waitForTimeout(1200); } catch (e) {} }
              const txt = await pg.evaluate(() => document.body.innerText.replace(/\s+/g, ' '));
              const money = (label) => { const m = txt.match(new RegExp(label + '\\s*(?:USD)?\\s*\\$([\\d,]+\\.\\d\\d)', 'i')); return m ? parseFloat(m[1].replace(',', '')) : null; };
              const total = money('Total'), subtotal = money('Subtotal(?: · \\d+ items?)?');
              ok(`${P.id} checkout total $${P.total}`, total === P.total, `total=${total} subtotal=${subtotal}`);
              if (P.one) {
                ok(`${P.id} checkout: one-time, no plan, no discount, kit line "(One-Time)", no Special Kits`, !/Every 30 days/.test(txt) && !/First payment/.test(txt) && !/recurring/i.test(txt) && total === subtotal && new RegExp(`${n} Diffusers? \\+ ${n} Scents? \\(One-Time\\)`).test(txt) && /Free Diffuser Kit/.test(txt) && !/Special Kits/.test(txt), `plan mentions=${(txt.match(/Every 30 days/g) || []).length} total=${total} subtotal=${subtotal}`);
              } else {
                const plans = (txt.match(/Every 30 days/g) || []).length; const firstZero = (txt.match(/First payment \$0\.00/g) || []).length;
                ok(`${P.id} checkout: scents on the 30-day plan, first payment $0, then $39.95`, plans >= 1 && firstZero >= 1 && /then \$39\.95/.test(txt), `"Every 30 days"×${plans}, "First payment $0.00"×${firstZero}, recurring notice=${/recurring charge/i.test(txt)}`);
                ok(`${P.id} checkout kit line "${n} FREE Diffuser(s) + ${n} Scent(s)"`, new RegExp(`${n} FREE Diffusers? \\+ ${n} Scents?`).test(txt) && /Free Diffuser Kit/.test(txt));
              }
              ok(`${P.id} checkout express pay present`, /shop|Google Pay|G Pay/i.test(txt));
              await pg.screenshot({ path: OUT + `${P.id}-checkout.png` });
              ok(`${P.id} no JS errors`, errs.length === 0, errs.join(' | '));
            } catch (e) { ok(`${P.id} crashed`, false, e.message); await pg.screenshot({ path: OUT + `${P.id}-crash.png` }).catch(() => {}); }
            await ctx.close(); await new Promise((r) => setTimeout(r, 45000));
          }
          await b.close();
          for (const r of R) console.log((r.c ? 'PASS' : 'FAIL') + '  ' + r.n + (r.i ? '  —  ' + r.i : ''));
          console.log(`RESULT ${R.filter((r) => r.c).length}/${R.length}`);
          EOF2
          node r228.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/free-diffusers/recon/r228
          git commit -m "r228: funnel QA on /pages/free-diffusers fd4 (one-time kit variants)" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
