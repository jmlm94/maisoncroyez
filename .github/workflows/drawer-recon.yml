name: drawer-recon
# run 137 — fetch preact+hooks+htm UMD builds and commit for vendor slimming
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p lp-factory/pages/kits-lp/vendor-slim
          cd lp-factory/pages/kits-lp/vendor-slim
          curl -sL -o preact.min.js https://unpkg.com/preact@10.19.3/dist/preact.min.js
          curl -sL -o hooks.umd.js https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js
          curl -sL -o htm.umd.js https://unpkg.com/htm@3.1.1/dist/htm.js
          ls -la
          head -c 100 preact.min.js; echo
          head -c 100 hooks.umd.js; echo
          head -c 100 htm.umd.js; echo
          cd ../../../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/vendor-slim
          git commit -m "recon r137: preact/htm umd builds for vendor slimming" || echo "no changes"
          git push || echo "no push"
