name: drawer-recon
# run 112 — live verify announcement below gallery + rating removed (key p6m4)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          await p.goto('https://maisoncroyez.com/pages/six-month-program?utm_campaign=diag112',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(9000);
          const d=await p.evaluate(()=>{
            const cs=s=>{const e=document.querySelector(s);return e?getComputedStyle(e).display:null;};
            const ann=document.querySelectorAll('#root .adv-announce');
            const gal=document.querySelector('.gal');
            const first=ann[0];
            const rel=first&&gal ? (first.getBoundingClientRect().top >= gal.getBoundingClientRect().bottom - 5 ? 'below-gallery':'not-below') : 'missing';
            return {key:[...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.href).filter(h=>/mc-6mp/.test(h)),
              announceCount:ann.length, position:rel, ratingCount:document.querySelectorAll('#root .rating').length,
              annWidth:first?Math.round(first.getBoundingClientRect().width):null,
              kitRow:cs('.kit-row'),pickQty:cs('.pick-qty')};});
          console.log('R112 '+JSON.stringify(d)+' errs='+JSON.stringify(errs));
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-390.png', fullPage:false});
          await p.evaluate(()=>{const e=document.querySelector('.adv-announce'); if(e) e.scrollIntoView({block:'center'});});
          await p.waitForTimeout(600);
          await p.screenshot({path:'lp-factory/pages/kits-lp/live/live-hero2.png'});
          await b.close();})();
          EOS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live
          git commit -m "recon r112: announcement-below-gallery live verify"
          git push
