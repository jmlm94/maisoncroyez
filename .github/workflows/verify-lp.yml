name: verify-lp
# run: 41 — offer v3 scoped-CSS fix check: qty selector icons/borders, stepper circles, fd11 key
on:
  push:
    branches: [claude/maison-landing-page-iyikm5]
    paths: ['.github/workflows/verify-lp.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait out bot-protection block if present
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36' 'https://maisoncroyez.com/pages/free-diffuser')
            echo "attempt $i: HTTP $code" | tee -a gate-log.txt
            if [ "$code" = "200" ]; then break; fi
            sleep 45
          done
      - name: Verify live free-diffuser LP (offer v2)
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > check.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          const errs=[], failed=[];
          page.on('console', m=>{ if(m.type()==='error') errs.push(m.text().slice(0,200)); });
          page.on('pageerror', e=>errs.push('PAGEERROR: '+String(e).slice(0,200)));
          page.on('requestfailed', r=>{ const u=r.url(); if(/cdn\.shopify|maisoncroyez/.test(u)) failed.push(r.failure()?.errorText+' '+u.slice(0,90)); });
          const resp=[];
          page.on('response', r=>{ const u=r.url(); if(/mc-lp-free-diffuser|mc-lp-vendor|mc-lp-diffuser-assets|mc-lp-d-/.test(u)) resp.push(r.status()+' '+u.split('/').pop().slice(0,50)); });
          await page.addInitScript(() => {
            window.__perf={events:[]};
            new PerformanceObserver(l=>{for(const e of l.getEntries()) window.__perf.events.push({n:e.name,d:Math.round(e.duration)});}).observe({type:'event',durationThreshold:16,buffered:true});
          });
          let nav=null;
          for(let a=0;a<4;a++){
            nav=await page.goto('https://maisoncroyez.com/pages/free-diffuser?cb='+Date.now(), {waitUntil:'load',timeout:60000});
            console.log('goto attempt '+(a+1)+': HTTP '+(nav?nav.status():'?'));
            if(nav && nav.status()===200) break;
            const snip=(await page.content()).replace(/\s+/g,' ').slice(0,300);
            console.log('BODY SNIPPET: '+snip);
            await page.waitForTimeout(30000);
          }
          await page.waitForTimeout(9000);
          await page.evaluate(async()=>{ for(let y=0;y<document.body.scrollHeight;y+=500){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,60));} window.scrollTo(0,0); await new Promise(r=>setTimeout(r,1500)); });
          const audit = await page.evaluate(()=>{
            const q=s=>document.querySelectorAll(s).length;
            const imgs=[...document.querySelectorAll('#root img')];
            const brokenImgs=imgs.filter(i=>i.complete && i.naturalWidth===0).map(i=>i.currentSrc.split('/').pop().slice(0,40));
            const atc=document.querySelector('.buybox .atc');
            return {
              root: !!document.getElementById('root'),
              rootHtmlLen: (document.getElementById('root')||{}).innerHTML?.length||0,
              h1: (document.querySelector('#root h1')||{}).innerText||'MISSING',
              price: (document.querySelector('.price-row .price')||{}).innerText||'MISSING',
              valstackRows: q('.valstack .vrow'),
              selBar: (document.querySelector('.sel-bar')||{}).innerText||'MISSING',
              freeLine: (document.querySelector('.free-line')||{}).innerText||'MISSING',
              sections: q('#root section'),
              galSlides: q('.gal-slide'),
              fragCards: q('.pick'),
              atcText: atc? atc.innerText.replace(/\s+/g,' ').trim().slice(0,80):'MISSING',
              faqs: q('.faq .qa'),
              stickyExists: q('.sticky')>0,
              trustIcons: q('.trust-strip .tsi'),
              imgTotal: imgs.length,
              brokenImgs,
              overflowX: document.documentElement.scrollWidth>document.documentElement.clientWidth+2
            };
          });
          // offer v2: SINGLE-select picker — swap radio to 3rd scent, then back to 1st
          await page.click('.pick:nth-child(3)');
          await page.waitForTimeout(400);
          const pickedAlt = await page.evaluate(()=>({
            selBar:(document.querySelector('.sel-bar')||{}).innerText,
            selectedCount:document.querySelectorAll('.pick.sel,.pick.selected,.pick[aria-checked="true"],.pick input:checked').length
          }));
          await page.click('.pick:nth-child(1)');
          await page.waitForTimeout(400);
          const picked = await page.evaluate(()=>({
            selBar:(document.querySelector('.sel-bar')||{}).innerText,
            freeLine:(document.querySelector('.free-line')||{}).innerText,
            selectedCount:document.querySelectorAll('.pick.sel,.pick.selected,.pick[aria-checked="true"],.pick input:checked').length
          }));
          // real ATC click -> drawer
          await page.evaluate(()=>document.querySelector('.buybox .atc').scrollIntoView({block:'center'}));
          await page.waitForTimeout(400);
          await page.click('.buybox .atc');
          await page.waitForTimeout(5000);
          const drawer = await page.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            return {exists:!!d, open:d?(d.hasAttribute('open')||d.classList.contains('active')||getComputedStyle(d).visibility!=='hidden'):false};
          });
          await page.screenshot({ path:'fd-drawer.png' });
          const cart = await page.evaluate(async()=>{
            const j=await (await fetch('/cart.js')).json();
            return {total:j.total_price/100, items:j.items.map(i=>({t:i.product_title.slice(0,42), v:i.variant_id, q:i.quantity, price:i.price/100, line:i.final_line_price/100, plan:((i.selling_plan_allocation||{}).selling_plan||{}).id||null, discounts:(i.discounts||[]).map(d=>d.title+' -'+d.amount/100)}))};
          });
          const inpProxy = await page.evaluate(()=>{ const ds=window.__perf.events.map(e=>e.d).sort((a,b)=>b-a); return {worstEventMs:ds[0]||0, events:window.__perf.events.slice(0,12)}; });
          console.log('=== AUDIT ==='); console.log(JSON.stringify(audit,null,1));
          console.log('=== PICKED-ALT (3rd scent) ==='); console.log(JSON.stringify(pickedAlt));
          console.log('=== PICKED (back to 1st) ==='); console.log(JSON.stringify(picked));
          console.log('=== DRAWER ==='); console.log(JSON.stringify(drawer));
          console.log('=== CART ==='); console.log(JSON.stringify(cart,null,1));
          console.log('=== INP PROXY (interaction event durations) ==='); console.log(JSON.stringify(inpProxy));
          console.log('=== CONSOLE ERRORS ('+errs.length+') ==='); errs.slice(0,15).forEach(e=>console.log(' - '+e));
          console.log('=== FAILED REQUESTS ('+failed.length+') ==='); failed.slice(0,15).forEach(e=>console.log(' - '+e));
          console.log('=== OUR BUNDLE RESPONSES ==='); [...new Set(resp)].forEach(e=>console.log(' - '+e));
          await page.evaluate(()=>window.scrollTo(0,0));
          await page.waitForTimeout(800);
          await page.screenshot({ path:'fd-live-full.png', fullPage:true });
          await b.close();
          EOS
          node check.mjs 2>&1 | tee verify-log.txt
      - name: Performance audit (throttled mobile lab x3)
        if: always()
        run: |
          cat > perf.mjs <<'EOS'
          import { chromium } from 'playwright';
          const URL='https://maisoncroyez.com/pages/free-diffuser';
          const runs=[];
          for(let i=0;i<3;i++){
            const b=await chromium.launch();
            const ctx=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,userAgent:'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36'});
            const page=await ctx.newPage();
            const cdp=await ctx.newCDPSession(page);
            await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:150,downloadThroughput:1.6*1024*1024/8,uploadThroughput:750*1024/8});
            await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
            await page.addInitScript(()=>{
              window.__m={lcp:0,lcpEl:'',cls:0,fcp:0,lt:[],shifts:[]};
              const sel=n=>{ if(!n||!n.tagName) return '?'; let s=n.tagName.toLowerCase(); if(n.id) s+='#'+n.id; if(n.className&&typeof n.className==='string') s+='.'+n.className.trim().split(/\s+/).slice(0,2).join('.'); return s; };
              new PerformanceObserver(l=>{for(const e of l.getEntries()){ window.__m.lcp=e.startTime; window.__m.lcpEl=sel(e.element)+(e.url?' url='+e.url.split('/').pop().slice(0,50):''); }}).observe({type:'largest-contentful-paint',buffered:true});
              new PerformanceObserver(l=>{for(const e of l.getEntries()) if(!e.hadRecentInput){ window.__m.cls+=e.value; if(e.value>0.01) window.__m.shifts.push({t:Math.round(e.startTime),v:+e.value.toFixed(4),src:(e.sources||[]).slice(0,3).map(s=>sel(s.node)).join(',')}); }}).observe({type:'layout-shift',buffered:true});
              new PerformanceObserver(l=>{for(const e of l.getEntries()) if(e.name==='first-contentful-paint') window.__m.fcp=e.startTime;}).observe({type:'paint',buffered:true});
              new PerformanceObserver(l=>{for(const e of l.getEntries()) window.__m.lt.push({s:Math.round(e.startTime),d:Math.round(e.duration)});}).observe({type:'longtask',buffered:true});
            });
            const t0=Date.now();
            let nv=null;
            for(let a=0;a<5;a++){
              nv=await page.goto(URL+'?perf='+Date.now(),{waitUntil:'load',timeout:120000});
              console.log('perf run '+(i+1)+' goto attempt '+(a+1)+': HTTP '+(nv?nv.status():'?'));
              if(nv && nv.status()===200) break;
              await page.waitForTimeout(45000);
            }
            await page.waitForTimeout(12000);
            const m=await page.evaluate(()=>{
              const nav=performance.getEntriesByType('navigation')[0]||{};
              const res=performance.getEntriesByType('resource');
              const ours=res.filter(r=>/mc-lp/.test(r.name)).map(r=>({f:r.name.split('?')[0].split('/').pop(),transferKB:Math.round(r.transferSize/1024),decodedKB:Math.round(r.decodedBodySize/1024),ms:Math.round(r.duration)}));
              const byType={};
              for(const r of res){const t=r.initiatorType||'other';byType[t]=byType[t]||{n:0,kb:0};byType[t].n++;byType[t].kb+=Math.round(r.transferSize/1024);}
              const top=[...res].sort((a,b)=>b.transferSize-a.transferSize).slice(0,12).map(r=>({f:r.name.split('?')[0].split('/').pop().slice(0,55),transferKB:Math.round(r.transferSize/1024),ms:Math.round(r.duration)}));
              const tbt=window.__m.lt.reduce((s,t)=>s+Math.max(0,t.d-50),0);
              const fonts={unna:document.fonts.check('16px Unna'),unnaB:document.fonts.check('bold 16px Unna'),outfit:document.fonts.check('16px Outfit'),bvp:document.fonts.check('16px "Be Vietnam Pro"')};
              const fontReqs=res.filter(r=>/mc-lp-f-/.test(r.name)).map(r=>({f:r.name.split('?')[0].split('/').pop(),transferKB:Math.round(r.transferSize/1024),ms:Math.round(r.duration)}));
              const vidReqs=res.filter(r=>/\.(mp4|webm)/.test(r.name)).map(r=>({f:r.name.split('?')[0].split('/').pop(),transferKB:Math.round(r.transferSize/1024)}));
              const hero=res.filter(r=>/Diseno_sin_titulo_92/.test(r.name)).map(r=>({transferKB:Math.round(r.transferSize/1024),ms:Math.round(r.duration)}));
              return {ttfbMs:Math.round(nav.responseStart||0),fcpMs:Math.round(window.__m.fcp),lcpMs:Math.round(window.__m.lcp),lcpEl:window.__m.lcpEl,cls:+window.__m.cls.toFixed(4),shifts:window.__m.shifts.slice(0,10),tbtMs:Math.round(tbt),longtasks:window.__m.lt.length,loadMs:Math.round(nav.loadEventEnd||0),reqCount:res.length,totalTransferKB:Math.round(res.reduce((s,r)=>s+r.transferSize,0)/1024),fonts,fontReqs,vidReqs,hero,byType,ourBundles:ours,topTransfers:top};
            });
            m.wallMs=Date.now()-t0; runs.push(m); await b.close();
            if(i<2) await new Promise(r=>setTimeout(r,70000));
          }
          const med=k=>{const v=runs.map(r=>r[k]).sort((a,b)=>a-b);return v[1];};
          console.log('=== PERF RUNS (Slow4G 150ms RTT / 1.6Mbps / 4x CPU, Pixel-class) ===');
          runs.forEach((r,i)=>console.log('run'+(i+1)+': TTFB='+r.ttfbMs+'ms FCP='+r.fcpMs+'ms LCP='+r.lcpMs+'ms CLS='+r.cls+' TBT='+r.tbtMs+'ms load='+r.loadMs+'ms reqs='+r.reqCount+' transfer='+r.totalTransferKB+'KB'));
          console.log('=== MEDIAN ===');
          console.log(JSON.stringify({ttfbMs:med('ttfbMs'),fcpMs:med('fcpMs'),lcpMs:med('lcpMs'),cls:med('cls'),tbtMs:med('tbtMs'),loadMs:med('loadMs'),totalTransferKB:med('totalTransferKB')}));
          console.log('=== LCP ELEMENT (per run) ==='); runs.forEach((r,i)=>console.log('run'+(i+1)+': '+r.lcpEl));
          console.log('=== LAYOUT SHIFT SOURCES (run1, >0.01) ==='); console.log(JSON.stringify(runs[0].shifts,null,1));
          console.log('=== FONTS LOADED (run1) ==='); console.log(JSON.stringify(runs[0].fonts), JSON.stringify(runs[0].fontReqs));
          console.log('=== VIDEO REQS DURING LOAD, NO SCROLL (run1 — expect none) ==='); console.log(JSON.stringify(runs[0].vidReqs));
          console.log('=== HERO IMG (run1) ==='); console.log(JSON.stringify(runs[0].hero));
          console.log('=== OUR BUNDLES (run1) ==='); console.log(JSON.stringify(runs[0].ourBundles,null,1));
          console.log('=== TOP TRANSFERS (run1) ==='); console.log(JSON.stringify(runs[0].topTransfers,null,1));
          console.log('=== BY TYPE (run1) ==='); console.log(JSON.stringify(runs[0].byType));
          EOS
          node perf.mjs 2>&1 | tee perf-log.txt
          echo "--- asset headers ---" | tee -a perf-log.txt
          for f in mc-lp-free-diffuser.css mc-lp-free-diffuser-app.js mc-lp-vendor.js mc-lp-diffuser-assets.js; do
            echo "== $f ==" | tee -a perf-log.txt
            curl -sI -H 'Accept-Encoding: br,gzip' "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/$f?v=fd5check" | grep -iE 'content-length|content-encoding|content-type|cache-control|x-cache' | tee -a perf-log.txt
          done
      - name: CrUX field data p75 (PageSpeed Insights API)
        if: always()
        run: |
          curl -s "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Fmaisoncroyez.com%2Fpages%2Ffree-diffuser&strategy=mobile" -o psi.json || true
          node -e '
            try{
              const j=require("./psi.json");
              const out={};
              const fx=(le,tag)=>{ if(!le||!le.metrics) return; const m=le.metrics;
                out[tag]={ lcp75_ms:(m.LARGEST_CONTENTFUL_PAINT_MS||{}).percentile??null,
                           inp75_ms:(m.INTERACTION_TO_NEXT_PAINT||{}).percentile??null,
                           cls75:((m.CUMULATIVE_LAYOUT_SHIFT_SCORE||{}).percentile??null)!==null?(m.CUMULATIVE_LAYOUT_SHIFT_SCORE.percentile/100):null,
                           fcp75_ms:(m.FIRST_CONTENTFUL_PAINT_MS||{}).percentile??null,
                           ttfb75_ms:(m.EXPERIMENTAL_TIME_TO_FIRST_BYTE||{}).percentile??null,
                           overall:le.overall_category }; };
              fx(j.loadingExperience,"page_field_data");
              fx(j.originLoadingExperience,"origin_field_data");
              if(j.loadingExperience && j.loadingExperience.origin_fallback) out.note="page-level CrUX unavailable (low traffic) — origin-level shown";
              const lh=j.lighthouseResult;
              if(lh) out.lighthouse_lab={ perf_score:Math.round((lh.categories.performance.score||0)*100),
                lcp:lh.audits["largest-contentful-paint"].displayValue, cls:lh.audits["cumulative-layout-shift"].displayValue,
                tbt:lh.audits["total-blocking-time"].displayValue, fcp:lh.audits["first-contentful-paint"].displayValue,
                si:lh.audits["speed-index"].displayValue };
              if(j.error) out.error=j.error.message;
              console.log(JSON.stringify(out,null,1));
            }catch(e){console.log("PSI parse failed: "+e.message);}
          ' 2>&1 | tee psi-summary.txt
      - name: Commit results
        if: always()
        run: |
          mkdir -p lp-factory/pages/pdp-free-diffuser/verify
          mv fd-live-full.png fd-drawer.png verify-log.txt perf-log.txt psi-summary.txt lp-factory/pages/pdp-free-diffuser/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-free-diffuser/verify
          git commit -m "Free-diffuser LP verify run 32: offer v2 checks + perf audit" || true
          git pull --rebase origin claude/maison-landing-page-iyikm5
          git push
