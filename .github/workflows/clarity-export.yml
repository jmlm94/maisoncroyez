name: clarity-export
# Pulls Microsoft Clarity "project live insights" (aggregated metrics, last 1-3 days) using the
# CLARITY_TOKEN repository secret and commits the JSON under lp-factory/analytics/clarity/.
# The token never appears in the repo. Clarity allows 10 requests per project per day, so this
# job makes at most 4 per run: by URL, by device, by URL+device, and by OS+browser.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days (1-3)"
        default: "3"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull insights
        env:
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          set -e
          if [ -z "$CLARITY_TOKEN" ]; then echo "CLARITY_TOKEN secret is not set"; exit 1; fi
          STAMP=$(date -u +%Y%m%dT%H%MZ)
          OUT=lp-factory/analytics/clarity/$STAMP
          mkdir -p "$OUT"
          call () {
            curl -sS -m 90 -H "Authorization: Bearer $CLARITY_TOKEN" -H "Accept: application/json" \
              "https://www.clarity.ms/export-data/api/v1/project-live-insights?numOfDays=${DAYS:-3}&$2" -o "$OUT/$1.json"
            echo "$1: $(wc -c < "$OUT/$1.json") bytes"
            head -c 300 "$OUT/$1.json"; echo
          }
          call by-url "dimension1=URL"
          call by-device "dimension1=Device"
          call by-url-device "dimension1=URL&dimension2=Device"
          call by-os-browser "dimension1=OS&dimension2=Browser"
          echo "$STAMP" > lp-factory/analytics/clarity/LATEST
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/analytics/clarity/
          git commit -m "clarity export $(cat lp-factory/analytics/clarity/LATEST)" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
