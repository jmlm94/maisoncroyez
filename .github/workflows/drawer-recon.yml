name: drawer-recon
# run 201 — the-scent-story after cadence 45 -> 30 and loader key ss20-: zero "45" wording anywhere on the page; 30-day cadence lines present; scripts loaded with the ss20 key
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Verify
        run: |
          mkdir -p lp-factory/pages/kits-lp/live
          cat > r201.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const pg = await (await b.newContext({ viewport: { width: 390, height: 844 } })).newPage();
          const scripts = [];
          pg.on('request', r => { const u = r.url(); if (/files\/mc-[^?]+\.js/.test(u)) scripts.push(u.replace(/^.*files\//, '')); });
          await pg.goto('https://maisoncroyez.com/pages/the-scent-story', { waitUntil: 'domcontentloaded', timeout: 90000 });
          try { await pg.waitForSelector('#root *', { timeout: 30000 }); } catch (e) {}
          await pg.waitForTimeout(4000);
          for (const q of await pg.locator('details summary, .faq-q, [class*=faq] button').all()) { try { await q.click({ timeout: 500 }); } catch (e) {} }
          await pg.waitForTimeout(300);
          const t = await pg.evaluate(() => document.body.innerText);
          const ctx = (re) => [...t.matchAll(re)].map(m => t.slice(Math.max(0, m.index - 45), m.index + 35).replace(/\s+/g, ' '));
          const out = { n45: (t.match(/\b45\b/g) || []).length, ctx45: ctx(/\b45\b/g).slice(0, 12), ctx30: ctx(/every 30 days|Every 30 days|30\+ days|30-day/gi).slice(0, 14), scripts };
          const el = pg.locator('text=/Every 30 days/i').first(); try { await el.scrollIntoViewIfNeeded(); } catch (e) {}
          await pg.waitForTimeout(300); await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/scent-story-30day.png' });
          console.log('STORY ' + JSON.stringify(out, null, 1));
          await b.close();
          EOF2
          node r201.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/
          git commit -m "r201: scent-story 30-day screenshot" || exit 0
          git pull --rebase -q origin claude/maison-diffuser-perf-fixes-f45ggl || true
          git push
