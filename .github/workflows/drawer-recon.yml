name: drawer-recon
# run 61 — kb14 origin-freshness gate using ONLY throwaway keys (never the visitor key — avoids cache poisoning)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Origin gate
        run: |
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files'
          OK=0
          for i in $(seq 1 80); do
            CSS=$(curl -fsSL "$B/mc-kit.css?v=oc$RANDOM$RANDOM$i")
            APP=$(curl -fsSL "$B/mc-kit-app.js?v=oc$RANDOM$RANDOM$i")
            if echo "$CSS" | grep -q "kb14 armor wall" && echo "$APP" | grep -q "Secure Checkout" && echo "$APP" | grep -q "4diffusers.png"; then
              OK=1; echo "ORIGIN FRESH (attempt $i)"; break
            fi
            echo "origin stale (attempt $i) css=$(echo "$CSS"|wc -c)B app=$(echo "$APP"|wc -c)B"; sleep 45
          done
          [ "$OK" = "1" ] || { echo "FATAL: origin never fresh"; exit 1; }
          mkdir -p lp-factory/pages/kit-builder/verify
          echo "ORIGIN FRESH at $(date -u)" > lp-factory/pages/kit-builder/verify/r61-origin.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kit-builder/verify
          git commit -m "kb14 origin gate r61 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
