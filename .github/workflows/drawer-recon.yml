name: drawer-recon
# run 17 — capture 4 competitor funnels (fixed: move only recon files)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture competitor funnels
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > recon.mjs <<'EOS'
          import { chromium } from 'playwright';
          const SITES = [
            {k:'aromatech', u:'https://aromatechscent.com/products/starter-kit?view=starter-kit-v2'},
            {k:'aroma360', u:'https://aroma360.com/products/free-diffuser'},
            {k:'hotelcollection', u:'https://www.hotelcollection.com/products/free-diffuser'},
            {k:'pura', u:'https://pura.com/pages/get-started'},
          ];
          const b = await chromium.launch();
          for (const s of SITES) {
            console.log('\n\n######## '+s.k+' ########');
            const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
            try {
              for(let a=0;a<3;a++){
                const nav=await page.goto(s.u,{waitUntil:'load',timeout:60000});
                console.log('goto '+(a+1)+': '+(nav?nav.status():'?'));
                if(nav && nav.status()<400) break;
                await page.waitForTimeout(15000);
              }
              await page.waitForTimeout(9000);
              try{ await page.click('button:has-text("Accept")',{timeout:2500}); }catch(e){}
              try{ await page.click('[aria-label*=lose i], [class*=close i] >> nth=0',{timeout:2000}); }catch(e){}
              await page.evaluate(async()=>{ for(let y=0;y<Math.min(document.body.scrollHeight,14000);y+=500){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,110));} window.scrollTo(0,0); await new Promise(r=>setTimeout(r,1800)); });
              const dump = await page.evaluate(()=>{
                const t=document.body.innerText;
                const btns=[...document.querySelectorAll('button, a[class*=btn], [role=button], input[type=submit]')].map(b=>String(b.innerText||b.value||b.textContent||'').trim().replace(/\s+/g,' ').slice(0,80)).filter(Boolean);
                const uniq=[...new Set(btns)].slice(0,50);
                return {textLen:t.length, btns:uniq, text:t.slice(0,15000)};
              });
              console.log('=== BUTTONS ==='); dump.btns.forEach(x=>console.log(' - '+x));
              console.log('=== PAGE TEXT ('+dump.textLen+' chars) ===');
              console.log(dump.text);
              await page.screenshot({ path:s.k+'-m.png', fullPage:true });
            } catch(e){ console.log('SITE FAILED: '+e.message.slice(0,200)); }
            await page.close();
          }
          await b.close();
          EOS
          node recon.mjs 2>&1 | tee competitors-recon.txt
      - name: Compress screenshots
        if: always()
        run: |
          sudo apt-get install -y imagemagick > /dev/null 2>&1 || true
          for f in aromatech aroma360 hotelcollection pura; do
            [ -f "$f-m.png" ] && convert "$f-m.png" -resize 780x -quality 72 "$f-m.jpg" && rm "$f-m.png" || true
          done
          ls -la *.jpg 2>/dev/null || true
      - name: Commit results
        if: always()
        run: |
          mkdir -p lp-factory/recon-competitors
          mv competitors-recon.txt lp-factory/recon-competitors/ 2>/dev/null || true
          for f in aromatech aroma360 hotelcollection pura; do mv "$f-m.jpg" lp-factory/recon-competitors/ 2>/dev/null || true; done
          git checkout -- . 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/recon-competitors
          git commit -m "competitor recon: 4 funnels captured" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
