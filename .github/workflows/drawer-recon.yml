name: drawer-recon
# run 20 — homepage capture for redesign: full-page desktop + mobile screenshots + section map
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture homepage
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > cap.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          async function shot(label, vw, vh, dsf){
            const page = await b.newPage({ viewport:{width:vw,height:vh}, deviceScaleFactor:dsf });
            await page.goto('https://maisoncroyez.com/?cb='+Date.now(),{waitUntil:'load',timeout:90000});
            await page.waitForTimeout(6000);
            await page.evaluate(async()=>{ // force lazy images
              window.scrollTo(0,document.body.scrollHeight);
              await new Promise(r=>setTimeout(r,1500));
              window.scrollTo(0,0);
              await new Promise(r=>setTimeout(r,800));
            });
            await page.waitForTimeout(1500);
            await page.screenshot({ path:'home-'+label+'.png', fullPage:true });
            if(label==='mobile'){
              const map=await page.evaluate(()=>{
                const out=[];
                const root=document.querySelector('.__instant');
                const kids=root?[...root.querySelectorAll(':scope > div > div, :scope > div > section')]:[];
                const pool=kids.length>3?kids:[...document.querySelectorAll('.__instant [id^="i"]')];
                pool.slice(0,30).forEach(el=>{
                  const r=el.getBoundingClientRect();
                  if(r.height<40) return;
                  const cs=getComputedStyle(el);
                  out.push({id:el.id||el.className.slice(0,40), top:Math.round(r.top+scrollY), h:Math.round(r.height),
                    bg:cs.backgroundColor, txt:(el.innerText||'').replace(/\s+/g,' ').slice(0,90)});
                });
                return out;
              });
              console.log('=== SECTION MAP (mobile) ===');
              map.forEach(s=>console.log(JSON.stringify(s)));
              const hdr=await page.evaluate(()=>{
                const h=document.querySelector('header, .header, #shopify-section-header, [id*="header"]');
                const f=document.querySelector('footer, [id*="footer"]');
                return {header:h?(h.innerText||'').replace(/\s+/g,' ').slice(0,200):null,
                        footer:f?(f.innerText||'').replace(/\s+/g,' ').slice(0,400):null,
                        title:document.title};
              });
              console.log('=== CHROME === '+JSON.stringify(hdr));
            }
            await page.close();
          }
          await shot('desktop', 1440, 900, 1);
          await shot('mobile', 390, 844, 2);
          await b.close();
          EOS
          node cap.mjs 2>&1 | tee home-capture.txt
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/recon-home
          mv home-capture.txt home-desktop.png home-mobile.png lp-factory/recon-home/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/recon-home
          git commit -m "recon run 20: homepage capture" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
