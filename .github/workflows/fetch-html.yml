name: fetch-html
# Loads a live page in real Chromium (phone viewport), saves its raw HTML into lp-factory/assets/live/<name>.html plus the head links / section-group wrappers, and logs the Largest Contentful Paint candidates + the prehero/app mount timeline (the dev container cannot reach maisoncroyez.com; curl gets a Cloudflare challenge). Edit this line and push, or dispatch. Run 2026-10-20: reference capture of /pages/build-your-kit for the kits dk9 rebuild, saved as build-your-kit-live.
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/fetch-html.yml']
  workflow_dispatch:
    inputs:
      url:
        description: Page URL
        default: https://maisoncroyez.com/pages/diffuser-kits
      name:
        description: Output file name (without .html)
        default: diffuser-kits
permissions:
  contents: write
concurrency: fetch-html
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL: ${{ github.event.inputs.url || 'https://maisoncroyez.com/pages/build-your-kit' }}
      NAME: ${{ github.event.inputs.name || 'build-your-kit-live' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Fetch + LCP diagnostic
        run: |
          mkdir -p lp-factory/assets/live
          cat > fetch.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const URL0 = process.env.URL, NAME = process.env.NAME;
          const b = await chromium.launch({ args: ['--no-sandbox'] });
          const out = [];
          for (const [label, vp, cpu] of [['phone-fast', { width: 390, height: 844 }, 1], ['phone-cpu4x', { width: 412, height: 823 }, 4]]) {
            const ctx = await b.newContext({ viewport: vp, deviceScaleFactor: 2, isMobile: true, hasTouch: true, userAgent: 'Mozilla/5.0 (Linux; Android 11; moto g power (2022)) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36' });
            const pg = await ctx.newPage();
            await pg.addInitScript(() => {
              window.__lcp = []; window.__tl = []; window.__paints = [];
              try { new PerformanceObserver((l) => { for (const e of l.getEntries()) window.__lcp.push({ t: Math.round(e.startTime), size: e.size, tag: e.element && e.element.tagName, id: e.element && e.element.id, cls: e.element && e.element.className && String(e.element.className).slice(0, 40), url: (e.url || '').slice(0, 48) }); }).observe({ type: 'largest-contentful-paint', buffered: true }); } catch (e) {}
              try { new PerformanceObserver((l) => { for (const e of l.getEntries()) window.__paints.push({ n: e.name, t: Math.round(e.startTime) }); }).observe({ type: 'paint', buffered: true }); } catch (e) {}
              const t0 = performance.now(); let done = false;
              const tick = () => { if (done) return; const p = document.getElementById('mc-prehero'), v = document.getElementById('mc-hero-v'), r = document.getElementById('root'); const cs = p && getComputedStyle(p); const box = (el) => { if (!el) return null; const q = el.getBoundingClientRect(); return [Math.round(q.top), Math.round(q.width), Math.round(q.height)]; }; const rec = { t: Math.round(performance.now()), pre: p ? [cs.display, cs.position, cs.opacity, cs.visibility, box(p)] : null, vposter: v ? (v.poster || '').slice(0, 20) : null, rootKids: r ? r.children.length : -1, poster: box(document.querySelector('#root img.hv-poster')), themecss: !!Array.from(document.styleSheets).find((s) => (s.href || '').includes('theme.css')) }; const last = window.__tl[window.__tl.length - 1]; if (!last || JSON.stringify(last).replace(/"t":\d+,/, '') !== JSON.stringify(rec).replace(/"t":\d+,/, '')) window.__tl.push(rec); if (r && r.children.length && performance.now() - t0 > 6000) { done = true; return; } setTimeout(tick, 50); };
              tick();
            });
            if (cpu > 1) { const cdp = await ctx.newCDPSession(pg); await cdp.send('Emulation.setCPUThrottlingRate', { rate: cpu }); }
            const t = Date.now();
            await pg.goto(URL0, { waitUntil: 'load', timeout: 60000 });
            await pg.waitForTimeout(7000);
            const r = await pg.evaluate(() => ({ lcp: window.__lcp, paints: window.__paints, tl: window.__tl.slice(0, 40), title: document.title, nav: (() => { const n = performance.getEntriesByType('navigation')[0]; return n ? { ttfb: Math.round(n.responseStart), dcl: Math.round(n.domContentLoadedEventEnd), load: Math.round(n.loadEventEnd), size: n.transferSize } : null; })() }));
            out.push({ label, ms: Date.now() - t, ...r });
            console.log(label, JSON.stringify(r).slice(0, 3000));
            if (label === 'phone-fast') {
              const html = await pg.evaluate(() => '<!doctype html>\n' + document.documentElement.outerHTML);
              fs.writeFileSync(`lp-factory/assets/live/${NAME}.html`, html);
              const raw = await (await ctx.request.get(URL0)).text().catch(() => '');
              if (raw && raw.length > 20000) fs.writeFileSync(`lp-factory/assets/live/${NAME}.raw.html`, raw);
              const src = raw && raw.length > 20000 ? raw : html;
              fs.writeFileSync(`lp-factory/assets/live/${NAME}.links.txt`, (src.match(/<link[^>]*rel="?(preconnect|dns-prefetch|preload|stylesheet|modulepreload)"?[^>]*>/g) || []).join('\n'));
              fs.writeFileSync(`lp-factory/assets/live/${NAME}.sections.txt`, (src.match(/<(div|header|footer)[^>]*id="shopify-section[^>]*>/g) || []).join('\n'));
              fs.writeFileSync(`lp-factory/assets/live/${NAME}.head.txt`, (src.match(/<head>[\s\S]*?<\/head>/) || [''])[0].replace(/(<script[^>]*>)[\s\S]*?(<\/script>)/g, (m, a, b) => a + (m.length > 400 ? `/* ${m.length} chars */` : m.slice(a.length, -b.length)) + b).replace(/data:image\/[a-z]+;base64,[A-Za-z0-9+\/=]+/g, 'data:...'));
            }
            await ctx.close();
          }
          fs.writeFileSync(`lp-factory/assets/live/${NAME}.lcp.json`, JSON.stringify(out, null, 1));
          await b.close();
          JS
          node fetch.mjs
          wc -c lp-factory/assets/live/$NAME.*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/assets/live
          git commit -m "fetch-html: $NAME" || echo "nothing to commit"
          for i in 1 2 3 4; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep $((i*5)); done
