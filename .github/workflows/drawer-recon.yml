name: drawer-recon
# run 40 — fd47: persistent prehero (LCP attribution) + staggered chunks; probe + Lighthouse median-of-3
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse x3
        run: |
          npm i -s playwright@1.56.1 lighthouse@12 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          URL='https://maisoncroyez.com/pages/free-diffuser?utm_source=instagram&utm_medium=bio&utm_campaign=perf_test'
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files'
          # 1) verify ORIGIN bytes on cache-busted URLs (never touches the canonical hourly URL)
          for i in $(seq 1 30); do
            OK=1
            curl -fsSL "$B/mc-lp-free-diffuser-app.js?origincheck=$RANDOM$RANDOM" | grep -q "mc-prehero" || OK=0
            curl -fsSL "$B/mc-lp-free-diffuser.css?origincheck=$RANDOM$RANDOM" | grep -q "align-items:flex-start;overflow-x:auto" || OK=0
            if [ "$OK" = "1" ]; then echo "origin propagated (attempt $i)"; break; fi
            echo "origin still stale (attempt $i)"; sleep 30
          done
          [ "$OK" = "1" ] || { echo "FATAL: origin never propagated"; exit 1; }
          # 2) wait for the page to flip to fd47, then verify canonical hourly URLs
          OK=0
          for i in $(seq 1 20); do
            V="fd47-$(date -u +%Y%m%d%H)"
            if curl -fsSL "$URL&flip=$i" | grep -q "fd47-" \
               && curl -fsSL "$B/mc-lp-free-diffuser-app.js?v=$V" | grep -q "mc-prehero" \
               && curl -fsSL "$B/mc-lp-free-diffuser.css?v=$V" | grep -q "align-items:flex-start;overflow-x:auto"; then OK=1; echo "fd47 live, canonical URLs fresh (attempt $i)"; break; fi
            echo "page not on fd47 yet / edge stale (attempt $i)"; sleep 60
          done
          [ "$OK" = "1" ] || { echo "FATAL: fd47 not live within 20 min"; exit 1; }
          node - <<'EOS' > cls-probe.txt
          (async()=>{
          const { chromium } = require('playwright');
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:412,height:823}, deviceScaleFactor:1.75 });
          const t0=Date.now(); const marks=[];
          page.on('load',()=>{});
          await page.goto('https://maisoncroyez.com/pages/free-diffuser?utm_source=instagram&utm_medium=bio&utm_campaign=perf_test',{waitUntil:'commit',timeout:90000});
          for(let i=0;i<40;i++){
            const m = await page.evaluate(()=>{
              const g=(s)=>{const e=document.querySelector(s);return e?Math.round(e.getBoundingClientRect().height):-1};
              return {t:performance.now()|0, ann:g('.announcement-bar'), hdr:g('header .header__wrapper')||g('store-header'), pre:g('#mc-prehero'), root:g('#root'), hero:g('.gal-slide img')};
            }).catch(()=>null);
            if(m) marks.push(m);
            await page.waitForTimeout(250);
          }
          console.log('t(ms) ann hdr prehero root heroImg');
          marks.forEach(m=>console.log([m.t,m.ann,m.hdr,m.pre,m.root,m.hero].join(' ')));
          const fin=await page.evaluate(()=>({
            preDisplay:(document.getElementById('mc-prehero')||{}).style?getComputedStyle(document.getElementById('mc-prehero')).display:'?',
            rootKids:(document.getElementById('root')||{children:[]}).children.length,
            heroRect:(()=>{const i=document.querySelector('#root .gal-slide img');const r=i?i.getBoundingClientRect():null;return r?Math.round(r.width)+'x'+Math.round(r.height):'-'})(),
            cls:undefined}));
          console.log('FINAL '+JSON.stringify(fin));
          await b.close();
          })();
          EOS
          cat cls-probe.txt
          for n in 1 2 3; do
            npx lighthouse "$URL" --quiet --chrome-flags="--headless=new --no-sandbox" --chrome-path="$CHROME" \
              --only-categories=performance --form-factor=mobile --screenEmulation.mobile \
              --output=json --output-path=lh-$n.json || true
          done
          node - <<'EOS'
          const fs=require('fs');
          const runs=[1,2,3].map(n=>{try{return JSON.parse(fs.readFileSync('lh-'+n+'.json'))}catch(e){return null}}).filter(Boolean);
          const rows=runs.map(r=>({score:Math.round(r.categories.performance.score*100),
            fcp:r.audits['first-contentful-paint'].numericValue, lcp:r.audits['largest-contentful-paint'].numericValue,
            tbt:r.audits['total-blocking-time'].numericValue, cls:r.audits['cumulative-layout-shift'].numericValue,
            si:r.audits['speed-index'].numericValue, bench:r.environment.benchmarkIndex, r}));
          rows.forEach((x,i)=>console.log('run'+(i+1)+': score '+x.score+' FCP '+Math.round(x.fcp)+' LCP '+Math.round(x.lcp)+' TBT '+Math.round(x.tbt)+' CLS '+x.cls.toFixed(3)+' SI '+Math.round(x.si)+' bench '+Math.round(x.bench)));
          const med=a=>a.slice().sort((x,y)=>x-y)[Math.floor(a.length/2)];
          const m={score:med(rows.map(x=>x.score)),fcp:med(rows.map(x=>x.fcp)),lcp:med(rows.map(x=>x.lcp)),tbt:med(rows.map(x=>x.tbt)),cls:med(rows.map(x=>x.cls)),si:med(rows.map(x=>x.si))};
          let out='MEDIAN of '+rows.length+'\nSCORE: '+m.score+'\nfirst-contentful-paint: '+(m.fcp/1000).toFixed(1)+' s\nlargest-contentful-paint: '+(m.lcp/1000).toFixed(1)+' s\ntotal-blocking-time: '+Math.round(m.tbt)+' ms\ncumulative-layout-shift: '+m.cls.toFixed(3)+'\nspeed-index: '+(m.si/1000).toFixed(1)+' s\n';
          console.log(out);
          fs.writeFileSync('lh-summary-r40.txt',out);
          // keep the run whose score == median score for detail archaeology
          const keep=rows.find(x=>x.score===m.score)||rows[0];
          fs.writeFileSync('lh-r40.json',JSON.stringify(keep.r));
          const a=keep.r.audits;
          const lcpEl=a['largest-contentful-paint-element'];
          try{console.log('median-run LCP el: '+lcpEl.details.items[0].items[0].node.snippet.slice(0,160));
            console.log('median-run LCP phases: '+JSON.stringify(lcpEl.details.items[1].items.map(i=>i.phase+':'+Math.round(i.timing))));}catch(e){}
          const fb=(a['network-requests'].details.items||[]).filter(i=>/connect\.facebook/.test(i.url));
          console.log('FB pixel requests: '+fb.length); fb.slice(0,3).forEach(i=>console.log('  '+i.url.slice(0,100)));
          EOS
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/pages/pdp-free-diffuser/perf2
          cp lh-r40.json lh-summary-r40.txt cls-probe.txt lp-factory/pages/pdp-free-diffuser/perf2/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-free-diffuser/perf2
          git commit -m "LP perf r40 fd47 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
