name: drawer-recon
# run 151 — origin gate margin-zero rule in css
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          U="https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-6mp.css?v=og$RANDOM$RANDOM"
          curl -s "$U" -o /tmp/k.css
          echo "bytes=$(wc -c < /tmp/k.css)"
          echo "rule=$(grep -c 'kitgrid>.kg-card' /tmp/k.css || true)"
          echo "hardening=$(grep -c 'font-family:inherit' /tmp/k.css || true)"
