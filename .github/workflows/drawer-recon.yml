name: drawer-recon
# run 54 — kit-builder kb7 verify: origin + served-bytes gates, DOM probe (gallery/guar cards/flow), Lighthouse x3 baseline
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify kit builder kb7
        run: |
          npm i -s playwright@1.56.1 lighthouse@12 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          URL='https://maisoncroyez.com/pages/build-your-kit?utm_source=instagram&utm_medium=bio&utm_campaign=kb7_verify'
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files'
          # gate A: origin serves kb7 build
          OK=0
          for i in $(seq 1 60); do
            APP=$(curl -fsSL "$B/mc-kit-app.js?v=oc$RANDOM$RANDOM")
            CSS=$(curl -fsSL "$B/mc-kit.css?v=oc$RANDOM$RANDOM")
            if echo "$APP" | grep -q "kbgtrack" && echo "$APP" | grep -q "guar3" && echo "$CSS" | grep -q "kbg-arw"; then OK=1; echo "origin has kb7 build (attempt $i)"; break; fi
            echo "origin still old (attempt $i)"; sleep 30
          done
          [ "$OK" = "1" ] || { echo "FATAL: origin never got kb7"; exit 1; }
          # gate B (key-agnostic): whatever kb key the page serves, those bytes must be kb7
          OK=0
          for i in $(seq 1 45); do
            KEY=$(curl -fsSL "$URL&w=$i" | grep -o "kb[0-9]*-" | head -1)
            V="${KEY}$(date -u +%Y%m%d%H)"
            APP=$(curl -fsSL "$B/mc-kit-app.js?v=$V")
            CSS=$(curl -fsSL "$B/mc-kit.css?v=$V")
            if [ -n "$KEY" ] && echo "$APP" | grep -q "kbgtrack" && echo "$CSS" | grep -q "kbg-arw"; then OK=1; echo "page on $KEY serving kb7 bytes (attempt $i)"; break; fi
            echo "served bytes not kb7 yet on key $KEY (attempt $i)"; sleep 60
          done
          [ "$OK" = "1" ] || { echo "FATAL: served bytes never became kb7"; exit 1; }
          node - <<'EOS' > kb7-verify.txt
          (async()=>{
          const { chromium } = require('playwright');
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:412,height:823}, deviceScaleFactor:1.75 });
          await page.goto('https://maisoncroyez.com/pages/build-your-kit?utm_source=instagram&utm_medium=bio&utm_campaign=kb7_verify',{waitUntil:'load',timeout:90000});
          await page.waitForTimeout(8000);
          const t = await page.evaluate(()=>{
            const q=(s)=>{const e=document.querySelector(s);return e?e.textContent.trim().slice(0,80):null};
            const s1=[...document.querySelectorAll('.kbg-slide')];
            return {
              banner:q('.banner'), slides:s1.length, firstSlideLoaded:s1[0]?(s1[0].complete&&s1[0].naturalWidth>0):null,
              firstSlideW:s1[0]?s1[0].naturalWidth:null,
              thumbs:document.querySelectorAll('.kbg-th').length, arrows:!!document.getElementById('kbgprev'),
              plans:document.querySelectorAll('.plan').length,
              planPrices:[...document.querySelectorAll('.plan-price')].map(e=>e.textContent.trim()),
              planSave:q('.plan-save'), usp3AboveCards:!!document.querySelector('.stepsub + .usp3'),
              ship:q('.ship-line'), guarBlocks:document.querySelectorAll('.guar3').length,
              sticky:!!document.getElementById('sbar'),
              stepsub:q('.stepsub')
            };
          });
          console.log('S1 ' + JSON.stringify(t,null,1));
          /* flow: pick 3-space plan, step 2, pick 3 scents, step 3 — no cart POST */
          const flow = await page.evaluate(async()=>{
            document.querySelectorAll('.plan')[2].click();
            window.go(2);
            const r={title2:document.querySelector('#s2 .steptitle').textContent.trim().slice(0,70),
              reserved:document.getElementById('reserved').textContent.trim(),
              booklet:!!document.querySelector('.booklet-obj')};
            const bimg=document.querySelector('.booklet-img');
            await new Promise(res=>setTimeout(res,2500));
            r.bookletImgLoaded=bimg?(bimg.complete&&bimg.naturalWidth>0):null;
            const adds=document.querySelectorAll('.pick .add');
            adds[0].click();adds[1].click();adds[2].click();
            r.pickcount=document.getElementById('pickcount').textContent.trim();
            const rb=document.getElementById('reviewbtn');
            r.reviewLabel=rb.querySelector('span').textContent; r.reviewDisabled=rb.disabled;
            window.go(3);
            r.due=document.getElementById('duetoday').textContent;
            r.pay4=document.getElementById('pay4').textContent;
            r.valline=document.getElementById('valline').textContent;
            r.minirevs=document.querySelectorAll('.minirev').length;
            r.mariana=/Mariana V\./.test(document.body.innerText);
            r.lifetimeW=/Lifetime warranty/i.test(document.body.innerText);
            r.faqs=document.querySelectorAll('.faqs details').length;
            r.ctaText=(document.querySelector('#s3 .navrow .btn:not(.secondary)')||{}).textContent;
            return r;
          });
          console.log('FLOW ' + JSON.stringify(flow,null,1));
          await b.close();
          })();
          EOS
          cat kb7-verify.txt
          for n in 1 2 3; do
            npx lighthouse "$URL" --quiet --chrome-flags="--headless=new --no-sandbox" --chrome-path="$CHROME" \
              --only-categories=performance --form-factor=mobile --screenEmulation.mobile \
              --output=json --output-path=lh-$n.json || true
          done
          node - <<'EOS'
          const fs=require('fs');
          const runs=[1,2,3].map(n=>{try{return JSON.parse(fs.readFileSync('lh-'+n+'.json'))}catch(e){return null}}).filter(Boolean);
          const rows=runs.map(r=>({score:Math.round(r.categories.performance.score*100),
            fcp:r.audits['first-contentful-paint'].numericValue, lcp:r.audits['largest-contentful-paint'].numericValue,
            tbt:r.audits['total-blocking-time'].numericValue, cls:r.audits['cumulative-layout-shift'].numericValue,
            si:r.audits['speed-index'].numericValue, bench:r.environment.benchmarkIndex, r}));
          rows.forEach((x,i)=>console.log('run'+(i+1)+': score '+x.score+' FCP '+Math.round(x.fcp)+' LCP '+Math.round(x.lcp)+' TBT '+Math.round(x.tbt)+' CLS '+x.cls.toFixed(3)+' SI '+Math.round(x.si)+' bench '+Math.round(x.bench)));
          const med=a=>a.slice().sort((x,y)=>x-y)[Math.floor(a.length/2)];
          const m={score:med(rows.map(x=>x.score)),fcp:med(rows.map(x=>x.fcp)),lcp:med(rows.map(x=>x.lcp)),tbt:med(rows.map(x=>x.tbt)),cls:med(rows.map(x=>x.cls)),si:med(rows.map(x=>x.si))};
          let out='MEDIAN of '+rows.length+'\nSCORE: '+m.score+'\nfirst-contentful-paint: '+(m.fcp/1000).toFixed(1)+' s\nlargest-contentful-paint: '+(m.lcp/1000).toFixed(1)+' s\ntotal-blocking-time: '+Math.round(m.tbt)+' ms\ncumulative-layout-shift: '+m.cls.toFixed(3)+'\nspeed-index: '+(m.si/1000).toFixed(1)+' s\n';
          console.log(out);
          fs.writeFileSync('lh-summary-r54.txt',out);
          const keep=rows.find(x=>x.score===m.score)||rows[0];
          fs.writeFileSync('lh-r54.json',JSON.stringify(keep.r));
          EOS
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/pages/kit-builder/verify
          cp lh-r54.json lh-summary-r54.txt kb7-verify.txt lp-factory/pages/kit-builder/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kit-builder
          git commit -m "kit builder kb7 verify r54 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
