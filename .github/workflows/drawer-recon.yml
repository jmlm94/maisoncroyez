name: drawer-recon
# run 210 — cart drawer: ×N inside the title + variant line under each title (branch mc-drawer.js swapped into the live page), real add-to-cart click
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Drawer
        run: |
          mkdir -p lp-factory/pages/kits-lp/recon/r210
          cat > r210.mjs <<'EOF2'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const OUT = 'lp-factory/pages/kits-lp/recon/r210/';
          const DR = fs.readFileSync('lp-factory/pages/kits-lp/deploy-ready/mc-drawer.js', 'utf8');
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 });
          await ctx.route(/mc-drawer\.js/, (r) => r.fulfill({ status: 200, contentType: 'application/javascript', body: DR }));
          const pg = await ctx.newPage(); const errs = []; pg.on('pageerror', (e) => errs.push(e.message));
          await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await pg.waitForSelector('#buybox .tiers', { timeout: 60000 }); await pg.waitForTimeout(2000);
          await pg.click('#buybox .step-next'); await pg.waitForTimeout(500);
          const c = pg.locator('#buybox .pick.compact');
          await c.nth(0).click(); await c.nth(0).locator('.pick-qty button:last-child').click(); await c.nth(6).click(); await pg.waitForTimeout(200);
          await pg.click('#buybox .navrow .btn.atc'); await pg.waitForTimeout(600);
          await pg.evaluate(() => document.querySelector('#buybox .btn.atc').scrollIntoView({ block: 'center' }));
          await pg.locator('#buybox .btn.atc').click(); await pg.waitForTimeout(5000);
          const open = await pg.evaluate(() => { const d = document.getElementById('cart-drawer'); return d ? { open: d.hasAttribute('open') || d.classList.contains('is-open') || getComputedStyle(d).visibility !== 'hidden', lines: [...d.querySelectorAll('.line-item')].map((li) => ({ title: (li.querySelector('a.bold') || {}).textContent, qv: (li.querySelector('.mc-qv') || {}).innerText })) } : null; });
          console.log('DRAWER', JSON.stringify(open), 'url', pg.url(), 'errs', JSON.stringify(errs));
          await pg.screenshot({ path: OUT + 'drawer-x-n-inline.png' });
          await pg.evaluate(() => fetch('/cart/clear.js', { method: 'POST' }).catch(() => {}));
          await b.close();
          EOF2
          node r210.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/recon/r210
          git commit -m "r210: drawer ×N inline screenshot" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
