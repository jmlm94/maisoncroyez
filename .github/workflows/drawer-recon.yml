name: drawer-recon
# run 124 — gate spacing/price/copy tweak files
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          for i in 1 2 3 4 5 6 8; do
            K="og$RANDOM$RANDOM"
            curl -sSL "$B/mc-6mp-app.js?v=$K" -o a.js
            curl -sSL "$B/mc-6mp.css?v=$K" -o c.css
            INC=$(grep -o -F 'Included!' a.js | wc -l)
            OLD=$(grep -o -F 'Included FREE in your kit' a.js | wc -l)
            M16=$(grep -o -F 'margin-bottom:16px' c.css | wc -l)
            P104=$(grep -o -F '1.04rem' c.css | wc -l)
            echo "R124 try$i inc=$INC old=$OLD m16=$M16 p104=$P104"
            if [ "$INC" -ge 1 ] && [ "$OLD" -eq 0 ] && [ "$M16" -ge 1 ] && [ "$P104" -ge 1 ]; then echo "R124 PROPAGATED"; exit 0; fi
            sleep 10
          done
          echo "R124 NOT PROPAGATED"
