name: drawer-recon
# run 55c — capture the exact bytes the CDN serves for mc-kit-app.js (checksum varies per request — diagnose)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture served bytes
        run: |
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files'
          mkdir -p lp-factory/pages/kit-builder/verify
          D=lp-factory/pages/kit-builder/verify
          curl -fsSL -D $D/served-app-headers.txt "$B/mc-kit-app.js?v=oc$RANDOM$RANDOM" -o $D/served-app.bin
          curl -fsSL "$B/mc-kit-app.js?v=oc$RANDOM$RANDOM" -o /tmp/second.bin
          ls -la $D/served-app.bin /tmp/second.bin
          md5sum $D/served-app.bin /tmp/second.bin
          cmp $D/served-app.bin /tmp/second.bin && echo IDENTICAL || echo "DIFFER at first byte offsets above"
          echo "=== first 600 bytes ==="; head -c 600 $D/served-app.bin; echo
          echo "=== last 400 bytes ==="; tail -c 400 $D/served-app.bin; echo
          # also capture the hour-keyed URL the page actually uses
          V="kb8-$(date -u +%Y%m%d%H)"
          curl -fsSL "$B/mc-kit-app.js?v=$V" -o $D/served-app-hourkey.bin || true
          md5sum $D/served-app-hourkey.bin || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kit-builder/verify
          git commit -m "served-bytes capture r55c (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
