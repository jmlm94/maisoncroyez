name: drawer-recon
# run 47 — css state diagnosis: is the hourly URL serving the 02:47 version (stale, fine) or garbage (broken)?
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose CSS state
        run: |
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files'
          V="fd52-$(date -u +%Y%m%d%H)"
          for tag in "v=$V" "v=1786682323" "v=diag$RANDOM$RANDOM"; do
            echo "=== $tag ==="
            curl -fsSL "$B/mc-lp-free-diffuser.css?$tag" -o f.css || { echo "FETCH FAILED"; continue; }
            wc -c f.css
            head -c 120 f.css; echo
            echo "--- markers ---"
            for m in "atc-guar" "#root .btn.atc{background:#111}" "align-items:flex-start" "picker-title"; do
              printf "%-40s %s\n" "$m" "$(grep -c -- "$m" f.css || true)"
            done
            tail -c 150 f.css; echo
          done
          echo "=== page styled sanity (does live LP css load & apply?) ==="
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{
          const { chromium } = require('playwright');
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:412,height:823} });
          await page.goto('https://maisoncroyez.com/pages/free-diffuser?utm_source=instagram&utm_medium=bio&utm_campaign=perf_test',{waitUntil:'load',timeout:90000});
          await page.waitForTimeout(8000);
          const t=await page.evaluate(()=>{
            const atc=document.querySelector('.btn.atc');
            const cs=atc?getComputedStyle(atc):null;
            return { cssLinks:[...document.querySelectorAll('link[rel=stylesheet]')].map(l=>l.href.split('?')[1]||'').filter(v=>/fd5/.test(v)),
              atcBg:cs?cs.backgroundColor:null, atcRadius:cs?cs.borderRadius:null,
              bodyFont:getComputedStyle(document.body).fontFamily.slice(0,40),
              pickerTitleSize:(()=>{const e=document.querySelector('.picker-title');return e?getComputedStyle(e).fontSize:null})(),
              rootKids:document.getElementById('root').children.length };
          });
          console.log(JSON.stringify(t));
          await b.close();
          })();
          EOS
      - name: Commit marker
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/pages/pdp-free-diffuser/perf2
          date -u > lp-factory/pages/pdp-free-diffuser/perf2/r47-done.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-free-diffuser/perf2
          git commit -m "css diagnosis r47 done (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
