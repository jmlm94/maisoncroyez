name: drawer-recon
# run 77 — drawer-flow origin gate: throwaway keys, wait for Add-to-cart + drawer markers
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate
        run: |
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-kit-app.js'
          for i in $(seq 1 24); do
            K="oc$RANDOM$RANDOM"
            BODY=$(curl -sS "$B?v=$K")
            ATC=$(printf %s "$BODY" | grep -c "Add to cart" || true)
            CD=$(printf %s "$BODY" | grep -c "cart-drawer" || true)
            CR=$(printf %s "$BODY" | grep -c "cart:refresh" || true)
            OLD=$(printf %s "$BODY" | grep -c "Secure Checkout" || true)
            echo "try$i key=$K AddToCart=$ATC cartdrawer=$CD refresh=$CR oldSC=$OLD len=${#BODY}"
            if [ "$ATC" -ge 3 ] && [ "$CD" -ge 1 ] && [ "$CR" -ge 1 ] && [ "$OLD" -eq 0 ]; then echo "ORIGIN_FRESH"; exit 0; fi
            sleep 10
          done
          echo "ORIGIN_STALE"; exit 1
