<title>Maison Scent Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* layout: one question per screen in a narrow column, large tap targets (most buyers are 55+ and on a phone);
   every two or three questions a trust screen answers one worry; the last screen is her kit, ready to check out */
:root{
  --cream:#F9F6EE;--paper:#FFFDF9;--sand:#EAE1D1;--stone:#CFC4B1;--drift:#6E655B;--night:#161210;--dusk:#231D19;
  --sig:#6169DF;--ink:#4B55D6;--wash:#E7E8FB;--sig-light:#A9AEF7;
  --f:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"Roboto Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--night);font:400 18px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.ic{width:1em;height:1em;flex:none}
h1,h2{font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.note{background:var(--sand);color:var(--drift);text-align:center;font:500 11px/1.4 var(--m);letter-spacing:.1em;text-transform:uppercase;padding:7px 12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream)}
.top .in{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;max-width:560px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .lg{width:86px;justify-self:center;display:block}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--stone);background:var(--paper);display:grid;place-items:center;cursor:pointer;font-size:20px}
.back .ic{transform:rotate(180deg)}
.back[hidden]{display:grid!important;visibility:hidden}
.prog{height:5px;background:var(--sand)}
.prog i{display:block;height:100%;width:0;background:var(--sig);border-radius:0 3px 3px 0;transition:width .35s ease}
.stage{max-width:560px;margin:0 auto;padding:26px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:grid;gap:20px}
.stage:focus{outline:0}
.q-h{font-size:clamp(28px,7.4vw,38px)}
.q-s{color:var(--drift);margin-top:-8px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;min-height:64px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--paper);border:1.5px solid var(--stone);border-radius:14px;padding:12px 16px;cursor:pointer}
.opt b{display:block;font-weight:600;font-size:18.5px;letter-spacing:-.01em;line-height:1.2}
.opt small{display:block;color:var(--drift);font-size:15px;line-height:1.3;margin-top:2px}
.opt .mk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--stone);display:grid;place-items:center;color:transparent;font-size:16px;background:var(--cream)}
.opt.multi .mk{border-radius:7px}
.opt[aria-pressed="true"]{border-color:var(--sig);box-shadow:inset 0 0 0 1px var(--sig);background:var(--wash)}
.opt[aria-pressed="true"] .mk{background:var(--sig);border-color:var(--sig);color:#fff}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible,.size:focus-visible,select:focus-visible{outline:3px solid var(--sig-light);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:0 24px;border-radius:999px;background:var(--sig);color:#fff;font:700 18px var(--f);letter-spacing:-.01em;text-decoration:none;border:0;cursor:pointer}
.btn[disabled]{background:var(--stone);cursor:default}
.btn .ic{font-size:20px}
/* trust screens */
.trust{display:grid;gap:18px}
.trust .pic{border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:var(--sand)}
.trust .pic img{width:100%;height:100%;object-fit:cover;display:block}
.trust h2{font-size:clamp(28px,7.4vw,38px)}
.ticks{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ticks li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.ticks .ic{font-size:22px;color:var(--ink);margin-top:2px}
.quote{background:var(--paper);border:1px solid var(--stone);border-radius:14px;padding:16px 18px;display:grid;gap:6px}
.quote p{font-weight:500;letter-spacing:-.01em}
.quote small{font:500 11.5px/1.4 var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--drift)}
.fact{color:var(--drift);font-size:16px}
.cost{background:var(--paper);border:1px solid var(--stone);border-radius:14px;padding:6px 18px}
.cost div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--sand)}
.cost div:last-child{border-bottom:0;font-weight:700}
.cost s{color:var(--drift);font-weight:400;margin-right:6px}
/* building */
.build{min-height:46vh;display:grid;align-content:center;gap:18px}
.build li{opacity:.28;transition:opacity .3s}
.build li.on{opacity:1}
/* result */
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.size{position:relative;background:var(--paper);border:1.5px solid var(--stone);border-radius:14px;padding:16px 4px 12px;text-align:center;cursor:pointer;display:grid;gap:2px}
.size b{font-size:16px;letter-spacing:-.01em}
.size span{font-weight:700;font-size:22px;letter-spacing:-.03em}
.size small{color:var(--drift);font-size:13px}
.size i{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);background:var(--sig);color:#fff;font:500 9px/1 var(--m);letter-spacing:.06em;text-transform:uppercase;font-style:normal;padding:4px 7px;border-radius:999px;white-space:nowrap}
.size[aria-pressed="true"]{border-color:var(--sig);box-shadow:inset 0 0 0 1px var(--sig);background:var(--wash)}
.picks{display:grid;gap:10px}
.pick{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;background:var(--paper);border:1px solid var(--stone);border-radius:14px;padding:12px}
.pick img{width:84px;height:84px;border-radius:10px;object-fit:cover;display:block}
.pick .rm{font:500 11px/1.3 var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--drift)}
.pick b{display:block;font-size:19px;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.pick .kd{font-weight:600;color:var(--ink);font-size:15px}
.pick p{font-size:15.5px;line-height:1.35;color:var(--drift);margin-top:4px}
.pick .why{color:var(--night);font-weight:500}
.pick .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.pick .free{font-weight:700}.pick .free s{color:var(--drift);font-weight:400;margin-left:6px}
.pick select{min-height:44px;border:1px solid var(--stone);border-radius:10px;background:var(--cream);padding:0 10px;font-size:15px;max-width:100%}
.tip{background:var(--wash);border-radius:14px;padding:14px 16px;font-size:16.5px}
.refill{display:grid;gap:8px}
.refill .opt{min-height:58px}
.sure{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:16px}
.sure li{display:flex;gap:10px;align-items:center}
.sure .ic{font-size:20px;color:var(--ink)}
.again{background:none;border:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;justify-self:center;min-height:44px}
.bn{text-align:center;font:500 12px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--drift)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.prog i,.build li{transition:none}}
</style>
<!--SYMBOLS-->
<div class="note">Proposal — nothing here is on the store</div>
<div class="top"><div class="in"><button class="back" id="back" type="button" aria-label="Back" hidden>{{i:arrow-right}}</button>{{logo:two}}<span></span></div>
<div class="prog" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div></div>
<main class="stage" id="stage" tabindex="-1"></main>

<script>
(function(){
  var KITS='https://maisoncroyez.com/pages/diffuser-kits-2';
  var CHECK='{{i:check}}', ARROW='{{i:arrow-right}}';
  /* the seven scents: names, kinds, "smells like" and notes exactly as on the kits page; rank = bottles sold (store orders to 2026-11-27) */
  var S={
    golden:{n:'Golden Blossom Harmony',k:'Honey floral',like:'Fresh flowers and a little honey. Like walking into a florist.',rank:6},
    midnight:{n:'Midnight Sensation',k:'Floral musk',like:'White flowers and soft musk. Like perfume on warm skin.',rank:5},
    euphoric:{n:'Euphoric Bloom',k:'Peach and tea',like:'White peach and jasmine tea. Fruity and bright, never sugary.',rank:4},
    chilled:{n:'Chilled Citrus',k:'Lavender',like:'Lavender and eucalyptus. Like a day spa.',rank:3},
    crisp:{n:'Crisp Citrus Scape',k:'Fresh citrus',like:'Fresh citrus peel and green leaves. Like a clean hotel lobby.',rank:2},
    wildwood:{n:'Wildwood Mystique',k:'Pine forest',like:'Pine and juniper. Like a walk in the woods after rain.',rank:1},
    honey:{n:'Honey Nectar',k:'Milk and honey',like:'Warm milk and honey. Like a café on a slow morning.',rank:0}
  };
  var ORDER=['golden','midnight','euphoric','chilled','crisp','wildwood','honey'];
  /* what she loves -> points per scent (matched on the notes printed on each box) */
  var LOVE={
    flowers:{t:'Fresh flowers',d:'Like walking into a florist',w:{golden:3,midnight:2,euphoric:1},why:'You love fresh flowers.'},
    sweet:{t:'Warm and sweet',d:'Honey, warm milk',w:{honey:3,golden:2},why:'You love warm, sweet smells.'},
    citrus:{t:'Clean citrus',d:'Fresh peel, green leaves',w:{crisp:3,chilled:1},why:'You love clean citrus.'},
    spa:{t:'Lavender and eucalyptus',d:'Like a day spa',w:{chilled:3},why:'You love lavender and eucalyptus.'},
    woods:{t:'Woods after rain',d:'Pine, juniper',w:{wildwood:3,crisp:1},why:'You love the smell of the woods.'},
    fruit:{t:'Peach and tea',d:'Fruity and bright, never sugary',w:{euphoric:3},why:'You love fruit and tea.'},
    musk:{t:'Soft musk',d:'Like perfume on warm skin',w:{midnight:3,euphoric:1},why:'You love a soft, perfume-like musk.'},
    any:{t:'Not sure. Surprise me',d:'We start from our best sellers',w:{},why:''}
  };
  /* what she does not enjoy -> scents left out (x) or marked down (m) */
  var HATE={
    sweet:{t:'Very sweet',x:['honey'],m:{golden:2}},
    floral:{t:'Strong flowers or perfume',x:['midnight','golden'],m:{euphoric:2}},
    woods:{t:'Pine and woods',x:['wildwood'],m:{}},
    spa:{t:'Lavender or eucalyptus',x:['chilled'],m:{honey:1}},
    citrus:{t:'Citrus',x:['crisp'],m:{chilled:1}},
    none:{t:'No, I like most things',x:[],m:{}}
  };
  /* small nudges only, from the brand's own notes on when each scent is used */
  var WHEN={walkin:['golden','euphoric'],evening:['honey','midnight'],bed:['chilled','midnight'],guests:['golden','euphoric'],allday:['crisp','euphoric']};
  /* scents ordered together most often (orders with both, store data) */
  var PAIR={'euphoric+midnight':62,'golden+midnight':51,'euphoric+golden':36,'midnight+wildwood':36,'honey+midnight':33,'chilled+midnight':31,'crisp+golden':28,'crisp+midnight':27,'crisp+honey':25,'chilled+golden':24,'chilled+wildwood':23,'golden+honey':23,'crisp+euphoric':22,'euphoric+wildwood':22,'chilled+euphoric':21,'crisp+wildwood':17,'golden+wildwood':16,'chilled+crisp':15,'chilled+honey':14,'honey+wildwood':14,'euphoric+honey':12};
  var PRICE={1:89,2:159,3:239}, WAS={2:178,3:267};
  var ROOMS={living:'living room',bedroom:'bedroom',entry:'entry',kitchen:'kitchen',bath:'bathroom',office:'home office',up:'upstairs'};

  var A={when:null,use:[],spend:null,love:[],hate:[],strong:null,home:[],rooms:[],size:null,picks:null,refill:0};
  var step=0, stage=document.getElementById('stage'), bar=document.getElementById('bar'), back=document.getElementById('back');
  function has(a,v){return a.indexOf(v)>-1}

  /* ---------- the flow ---------- */
  function flow(){
    var f=['when','use','t1'];
    if(!(A.use.length===1&&A.use[0]==='none'))f.push('spend');
    f.push('love','hate','t2','strong','home','t3','rooms','t4','build','result');
    return f;
  }
  var Q={
    when:{h:'When do you want your home to smell its best?',s:'Bonsoir. A few taps and we build your kit.',o:[['walkin','The moment I walk in'],['evening','In the evening, when I finally sit down'],['bed','At bedtime'],['guests','When guests are coming'],['allday','All day. I’m home a lot']]},
    use:{h:'What do you use at home today?',s:'Pick all that apply.',multi:1,solo:'none',o:[['candles','Candles'],['plugins','Plug-ins'],['sprays','Room sprays'],['water','A water diffuser'],['reeds','Reed sticks or wax melts'],['waterless','Another waterless diffuser'],['none','Nothing yet']]},
    spend:{h:'What does all of that cost you a month?',s:'Candles, plug-ins, sprays, refills. A guess is fine.',o:[['u20','Under $20'],['20','$20 to $40'],['40','$40 to $60'],['60','More than $60'],['idk','I’ve never added it up']]},
    love:{h:'Which smells do you love?',s:'Pick one or two.',multi:1,max:2,solo:'any',o:Object.keys(LOVE).map(function(k){return [k,LOVE[k].t,LOVE[k].d]})},
    hate:{h:'Any smells you don’t enjoy?',s:'We leave those out of your kit.',multi:1,solo:'none',o:Object.keys(HATE).map(function(k){return [k,HATE[k].t]})},
    strong:{h:'How strong do you like it?',o:[['soft','Soft. Just a hint'],['mid','Noticeable, never heavy'],['full','Fill the whole house'],['sens','Go easy. I’m sensitive to scent']]},
    home:{h:'Who’s at home?',s:'Pick all that apply.',multi:1,solo:'adults',o:[['kids','Kids'],['dog','A dog'],['cat','A cat'],['allergy','Someone with allergies'],['adults','Just the grown-ups']]},
    rooms:{h:'Which rooms should smell wonderful?',s:'One diffuser covers up to 600 square feet.',multi:1,o:Object.keys(ROOMS).map(function(k){var t=ROOMS[k];return [k,t.charAt(0).toUpperCase()+t.slice(1)]})}
  };

  /* ---------- matching ---------- */
  function scores(){
    var sc={},out={};
    ORDER.forEach(function(k){sc[k]=S[k].rank*0.15});
    A.love.forEach(function(l){var w=LOVE[l].w;for(var k in w)sc[k]+=w[k]});
    A.hate.forEach(function(h){HATE[h].x.forEach(function(k){out[k]=1});var m=HATE[h].m;for(var k in m)sc[k]-=m[k]});
    (WHEN[A.when]||[]).forEach(function(k){sc[k]+=1});
    if(A.strong==='soft'||A.strong==='sens'){sc.crisp+=1.5;sc.chilled+=1.5}   /* the two lightest scents, as the kits page says */
    return {sc:sc,out:out};
  }
  function pairN(a,b){return PAIR[[a,b].sort().join('+')]||0}
  function match(n){
    var r=scores(),left=ORDER.filter(function(k){return !r.out[k]}),got=[];
    if(left.length<n)left=ORDER.slice();
    while(got.length<n&&left.length){
      var best=null,bv=-99;
      left.forEach(function(k){var v=r.sc[k];got.forEach(function(g){v+=pairN(g,k)/62*0.8});if(v>bv){bv=v;best=k}});
      got.push(best);left.splice(left.indexOf(best),1);
    }
    return got;
  }
  function why(k,i){
    var best=null,bw=0;
    A.love.forEach(function(l){var w=LOVE[l].w[k]||0;if(w>bw){bw=w;best=l}});
    if(best&&bw>=1)return LOVE[best].why;
    if((A.strong==='soft'||A.strong==='sens')&&(k==='crisp'||k==='chilled'))return 'One of our two lightest scents.';
    if(i>0&&A.picks&&pairN(A.picks[0],k)>=20)return 'Customers often order it with '+S[A.picks[0]].n+'.';
    if(S[k].rank>=4)return 'One of our three best sellers.';
    return 'A change from your first pick.';
  }
  function sizeFor(){var n=A.rooms.length;return n<=1?1:n===2?2:3}
  function rooms(){   /* which room each scent goes to: the softer one to the bedroom when she picked it */
    var r=A.rooms.slice(0,A.size),p=A.picks,out=p.map(function(){return ''});
    var bi=r.indexOf('bedroom');
    if(bi>-1){var pi=-1;['chilled','midnight','honey'].some(function(k){pi=p.indexOf(k);return pi>-1});if(pi>-1){out[pi]='bedroom';r.splice(bi,1)}}
    out.forEach(function(v,i){if(!v&&r.length)out[i]=r.shift()});
    return out;
  }

  /* ---------- screens ---------- */
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function qHTML(id){
    var q=Q[id],cur=q.multi?A[id]:[A[id]];
    return '<h1 class="q-h" id="h">'+q.h+'</h1>'+(q.s?'<p class="q-s">'+q.s+'</p>':'')+
      '<ul class="opts">'+q.o.map(function(o){return '<li><button type="button" class="opt'+(q.multi?' multi':'')+'" data-v="'+o[0]+'" aria-pressed="'+(has(cur,o[0])?'true':'false')+'"><span class="mk">'+CHECK+'</span><span><b>'+o[1]+'</b>'+(o[2]?'<small>'+o[2]+'</small>':'')+'</span></button></li>'}).join('')+'</ul>'+
      (q.multi?'<button class="btn" type="button" id="go"'+(A[id].length?'':' disabled')+'>Continue '+ARROW+'</button>':'');
  }
  function tHTML(pic,alt,h,p,ticks,quote,src,fact){
    return '<div class="trust">'+(pic?'<div class="pic"><img src="img/'+pic+'" alt="'+alt+'"></div>':'')+'<h2 id="h">'+h+'</h2>'+(p?'<p>'+p+'</p>':'')+
      (ticks&&ticks.length?'<ul class="ticks">'+ticks.map(function(t){return '<li>'+CHECK+'<span>'+t+'</span></li>'}).join('')+'</ul>':'')+
      (quote?'<div class="quote"><p>“'+quote+'”</p><small>'+src+'</small></div>':'')+(fact?'<p class="fact">'+fact+'</p>':'')+
      '<button class="btn" type="button" id="go">Continue '+ARROW+'</button></div>';
  }
  var T={
    t1:function(){   /* the worry: "is it really better than what I use?" / "too good to be true" */
      var u=A.use,fact='In our last customer survey, 16 of 23 buyers had switched from plug-ins and 14 from candles.';
      if(has(u,'water'))return tHTML('believe.webp','The diffuser’s night light glowing beside a bed','No water. Nothing to grow.','There is no tank and no standing water, so there is nothing to clean and nothing that can grow.',['The bottle locks in. Nothing spills.','A timer turns it off after 1, 3, 6 or 12 hours.'],'I can go to sleep with it on in our bedroom and feel safe.','Customer survey | bought it for safety and no mold',fact);
      if(has(u,'candles'))return tHTML('door-kits.webp','The diffuser and a scent bottle on an entry table','No flame to watch.','No flame, no smoke and no heat. Leave the room, leave the house, go to bed.',['A timer turns it off after 1, 3, 6 or 12 hours.','One diffuser covers up to 600 square feet.'],'Clean, easy to use and lasts longer.','Customer survey | switched from a water diffuser and candles',fact);
      if(has(u,'waterless'))return tHTML('door-kits.webp','The diffuser and a scent bottle on an entry table','It plugs in. No charging.','It is always ready, and one diffuser covers up to 600 square feet.',['Three strengths, one button.','A timer for 1, 3, 6 or 12 hours.'],'Much heavier stream than my other two diffusers, and no charging every 8 hours. This is my favorite out of the three.','Customer survey | already owned two waterless diffusers','');
      if(has(u,'none'))return tHTML('door-kits.webp','The diffuser and a scent bottle on an entry table','One press. The whole room.','Pour in your scent, press once. In about ten minutes the room smells like the evening.',['No water, no flame, nothing to clean.','One diffuser covers up to 600 square feet.'],'It was better than I expected. Awesome experience.','Customer survey','');
      return tHTML('door-kits.webp','The diffuser and a scent bottle on an entry table','One press. The whole room.','One diffuser covers up to 600 square feet, in about ten minutes. No water, no flame, nothing to clean.',['A timer turns it off after 1, 3, 6 or 12 hours.','It plugs in. No charging, no refilling with water.'],'I removed all the other things I paid for that only worked for an hour, if that.','Customer survey | switched from reed sticks',fact);
    },
    t2:function(){   /* the worry: "I can't smell it through a screen" */
      return tHTML('door-scents.webp','Three Maison Croyez scent boxes on a marble shelf','You can’t smell it through a screen. We know.','It is the worry we hear most. So here is the deal.',['If you don’t love a scent, we swap it. Free.','30 days to love it, or every dollar back. We send the prepaid label.','Your first scents are free with your diffusers.'],'Your scents are unusual and great. They stand on their own.','Customer survey | lives in an apartment','');
    },
    t3:function(){   /* the worry: strength, kids, pets, sensitivity */
      var soft=A.strong==='soft'||A.strong==='sens',t=[];
      t.push(soft?'Three strengths. Start on Subtle, the softest.':A.strong==='full'?'Three strengths. On Full it fills the room in about ten minutes.':'Three strengths, one button. Balanced suits most evenings.');
      if(has(A.home,'dog')||has(A.home,'cat'))t.push('Start on the subtle setting in the room where your pet sleeps.');
      if(has(A.home,'allergy')||A.strong==='sens')t.push('Sensitive to fragrance? Stay on Subtle. If a scent is too much, we swap it, free.');
      t.push('A timer turns it off after 1, 3, 6 or 12 hours.');
      var q=has(A.home,'dog')?['That my house smelled amazing. Fantastic.','Customer survey | bought it for dog smell']:['I can go to sleep with it on in our bedroom and feel safe.','Customer survey | bought it for safety and no mold'];
      return tHTML('how-3.webp','A woman resting in bed with her dog, the diffuser on the nightstand','Made to be left on.','There is no flame, no smoke, no heat and no water, so it is safe to leave on overnight, in a kid’s room or near pets.',t,q[0],q[1],'');
    },
    t4:function(){   /* the worries: price and the subscription */
      var n=sizeFor(),sp={'20':'$20 to $40','40':'$40 to $60','60':'more than $60'}[A.spend];
      var cmp=sp?'You told us you spend '+sp+' a month today. A refill here is $29.95, and only when you ask for one.':'A refill is $29.95, and only when you ask for one.';
      return '<div class="trust"><h2 id="h">What it costs. Plainly.</h2><p>For the '+(n===1?'room':n+' rooms')+' you picked:</p>'+
        '<div class="cost"><div><span>'+n+' diffuser'+(n>1?'s':'')+'</span><span>'+(WAS[n]?'<s>$'+WAS[n]+'</s>':'')+'$'+PRICE[n]+'</span></div><div><span>'+n+' scent'+(n>1?'s':'')+', 100 ml each</span><span><s>$'+(39.95*n).toFixed(2)+'</s>Free</span></div><div><span>Shipping</span><span>Free</span></div><div><span>Today</span><span>$'+PRICE[n]+'</span></div></div>'+
        '<ul class="ticks"><li>'+CHECK+'<span><b>No subscription needed.</b> Refills are your choice: every 30, 60 or 90 days, or never. We email you before every charge.</span></li><li>'+CHECK+'<span>'+cmp+'</span></li><li>'+CHECK+'<span>30 days to love it, or every dollar back. The diffuser is covered for life.</span></li></ul>'+
        '<div class="quote"><p>“Only need one deodorizer now. It felt nice, it was easy and it smelled good.”</p><small>Customer survey | almost didn’t buy because of the price</small></div>'+
        '<p class="fact">19 of the 23 customers we surveyed said a bottle lasted two weeks or longer. 11 said more than a month.</p>'+
        '<button class="btn" type="button" id="go">Build my kit '+ARROW+'</button></div>';
    }
  };
  function buildHTML(){
    return '<div class="build"><h1 class="q-h" id="h">Putting your kit together.</h1><ul class="ticks"><li>'+CHECK+'<span>The smells you love, without the ones you don’t</span></li><li>'+CHECK+'<span>The right strength for your home</span></li><li>'+CHECK+'<span>One scent for each room</span></li></ul></div>';
  }
  function resultHTML(){
    var n=A.size,rm=rooms(),setting=(A.strong==='soft'||A.strong==='sens')?'Subtle':A.strong==='full'?'Full':'Balanced';
    return '<h1 class="q-h" id="h">Bonsoir. Your kit is ready.</h1><p class="q-s">Built from your answers. Change anything you like.</p>'+
      '<div class="sizes">'+[1,2,3].map(function(k){return '<button type="button" class="size" data-n="'+k+'" aria-pressed="'+(k===n)+'">'+(k===2?'<i>Most popular</i>':'')+'<b>'+k+' diffuser'+(k>1?'s':'')+'</b><span>$'+PRICE[k]+'</span><small>'+(k*600).toLocaleString('en-US')+' sq ft</small></button>'}).join('')+'</div>'+
      '<div class="picks">'+A.picks.map(function(k,i){var s=S[k];return '<div class="pick"><img src="img/pick-'+k+'.webp" alt="'+s.n+' box" width="84" height="84"><div>'+
        '<span class="rm">'+(rm[i]?'For your '+ROOMS[rm[i]]:'Scent '+(i+1))+'</span><b>'+s.n+'</b><span class="kd">'+s.k+'</span><p>'+s.like+'</p><p class="why">'+why(k,i)+'</p>'+
        '<div class="row"><span class="free">Free<s>$39.95</s></span><label class="sr" for="sw'+i+'">Change scent '+(i+1)+'</label><select id="sw'+i+'" data-i="'+i+'">'+ORDER.map(function(o){return '<option value="'+o+'"'+(o===k?' selected':'')+'>'+(o===k?'Change scent':S[o].n)+'</option>'}).join('')+'</select></div></div></div>'}).join('')+'</div>'+
      '<p class="tip"><b>Your setting: '+setting+'.</b> One button, three strengths. A 100 ml bottle lasts 15+ days.</p>'+
      '<div class="cost"><div><span>'+n+' diffuser'+(n>1?'s':'')+'</span><span>'+(WAS[n]?'<s>$'+WAS[n]+'</s>':'')+'$'+PRICE[n]+'</span></div><div><span>'+n+' scent'+(n>1?'s':'')+', 100 ml each</span><span><s>$'+(39.95*n).toFixed(2)+'</s>Free</span></div><div><span>Shipping from Miami</span><span>Free</span></div><div><span>Today</span><span>$'+PRICE[n]+'</span></div></div>'+
      '<div class="refill" role="group" aria-label="Refills"><button type="button" class="opt" data-r="0" aria-pressed="'+(A.refill===0)+'"><span class="mk">'+CHECK+'</span><span><b>No refills for now</b><small>Order more when you want it. $39.95 a scent.</small></span></button>'+
      '<button type="button" class="opt" data-r="30" aria-pressed="'+(A.refill===30)+'"><span class="mk">'+CHECK+'</span><span><b>Send refills every 30 days</b><small>$29.95 a scent instead of $39.95. We email you before every charge. Skip, swap or cancel any time.</small></span></button></div>'+
      '<a class="btn" id="buy" href="'+KITS+'">Checkout — $'+PRICE[n]+' '+ARROW+'</a>'+
      '<ul class="sure"><li>'+CHECK+'30 days to love it, or every dollar back</li><li>'+CHECK+'Don’t love a scent? We swap it, free</li><li>'+CHECK+'Lifetime warranty on the diffuser</li></ul>'+
      '<button class="again" type="button" id="again">Start over</button><p class="bn">Bonne nuit.</p>';
  }

  /* ---------- running it ---------- */
  var timer=null;
  function show(){
    var f=flow(),id=f[step];clearTimeout(timer);
    if(id==='result'&&!A.picks){A.size=A.size||sizeFor();A.picks=match(A.size)}
    stage.innerHTML=Q[id]?qHTML(id):T[id]?T[id]():id==='build'?buildHTML():resultHTML();
    stage.dataset.screen=id;
    var pct=Math.round(100*step/(f.length-1));bar.style.width=pct+'%';bar.parentNode.setAttribute('aria-valuenow',pct);
    back.hidden=step===0||id==='build';
    window.scrollTo(0,0);stage.focus({preventScroll:true});
    if(id==='build'){
      var li=stage.querySelectorAll('.build li'),still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(still){for(var i=0;i<li.length;i++)li[i].className='on';timer=setTimeout(next,700)}
      else{[0,1,2].forEach(function(i){setTimeout(function(){if(li[i])li[i].className='on'},250+i*450)});timer=setTimeout(next,1900)}
    }
  }
  function next(){var f=flow();if(step<f.length-1){step++;show()}}
  function prev(){var f=flow();if(step===0)return;if(f[step]==='result'){A.picks=null;A.size=null}step--;if(f[step]==='build')step--;show()}
  back.addEventListener('click',prev);
  stage.addEventListener('click',function(e){
    var id=stage.dataset.screen,b=e.target.closest('button,a');if(!b)return;
    if(b.id==='go'&&!b.disabled){next();return}
    if(b.id==='again'){A={when:null,use:[],spend:null,love:[],hate:[],strong:null,home:[],rooms:[],size:null,picks:null,refill:0};step=0;show();return}
    if(b.classList.contains('size')){A.size=+b.dataset.n;A.picks=match(A.size);show();return}
    if(b.dataset.r!==undefined){A.refill=+b.dataset.r;show();return}
    if(b.classList.contains('opt')&&Q[id]){
      var q=Q[id],v=b.dataset.v;
      if(!q.multi){A[id]=v;[].forEach.call(stage.querySelectorAll('.opt'),function(o){o.setAttribute('aria-pressed',o===b?'true':'false')});timer=setTimeout(next,320);return}
      var a=A[id],i=a.indexOf(v);
      if(i>-1)a.splice(i,1);
      else if(v===q.solo)a.splice(0,a.length,v);
      else{if(q.solo&&has(a,q.solo))a.splice(a.indexOf(q.solo),1);if(q.max&&a.length>=q.max)a.shift();a.push(v)}
      [].forEach.call(stage.querySelectorAll('.opt'),function(o){o.setAttribute('aria-pressed',has(a,o.dataset.v)?'true':'false')});
      document.getElementById('go').disabled=!a.length;
    }
  });
  stage.addEventListener('change',function(e){var s=e.target;if(s.tagName==='SELECT'){var i=+s.dataset.i,v=s.value,j=A.picks.indexOf(v);if(j>-1&&j!==i)A.picks[j]=A.picks[i];A.picks[i]=v;show()}});
  window.__quiz={get:function(){return A},set:function(o){for(var k in o)A[k]=o[k]},match:match,scores:scores};   /* for the checks */
  show();
})();
</script>
