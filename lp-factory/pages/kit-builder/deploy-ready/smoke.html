#root .panel{flex:1;max-width:560px;margin:0 auto;padding:0 16px 130px}

#root .banner{background:linear-gradient(92deg,#A67C3D 0%,#B8905A 55%,#C9A25C 100%);color:#fff;text-align:center;font-family:'Outfit',sans-serif;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;font-weight:700}

#root .top{display:flex;justify-content:center;padding:14px 0 2px}
#root .top img{height:29px}

#root .rating{display:flex;justify-content:center;align-items:center;gap:8px;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(.5rem,2.05vw,.64rem);letter-spacing:.05em;text-transform:uppercase;margin:10px 0 2px;white-space:nowrap}

#root .rating .stars{color:var(--star);letter-spacing:1px}

#root h1{font-family:'Unna',Georgia,serif;font-weight:700;text-align:center;font-size:2rem;line-height:1.12;margin:6px 0 4px;text-wrap:balance}

#root h1 em{color:var(--ink);font-style:italic}

#root .h1sub{text-align:center;color:var(--ink-soft);font-size:.9rem;margin-bottom:12px}

#root .h1sub b{color:var(--ink);font-weight:700}

#root .prog{max-width:260px;margin:0 auto 5px;height:5px;background:var(--blush);border-radius:99px;overflow:hidden}

#root .prog i{display:block;height:100%;background:var(--ink);transition:width .35s;border-radius:99px}

#root .pstep{text-align:center;font-family:'Outfit',sans-serif;font-size:.6rem;letter-spacing:.16em;color:var(--rosewood-deep);text-transform:uppercase;font-weight:700;margin-bottom:14px}

#root .steptitle{font-family:'Unna',Georgia,serif;font-size:1.5rem;font-weight:700;text-align:center;margin:6px 0 4px;line-height:1.15}

#root .steptitle em{color:var(--ink);font-style:italic}

#root .stepsub{text-align:center;font-size:.88rem;color:var(--ink-soft);margin-bottom:14px;line-height:1.5}

#root .step{display:none}
#root .step.on{display:block;animation:fade .3s}

@keyframes fade{from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:none}
}

#root .heroshot{width:min(100%,340px);border-radius:14px;margin:0 auto 14px;display:block}

@media(min-width:900px){
  #root .heroshot{display:none}
}

/* step 1 — LP plan cards */
#root .plansel{display:flex;flex-direction:column;gap:14px;margin-top:8px}

#root .plan{position:relative;overflow:visible;text-align:left;background:#fff;border:1.5px solid rgba(36,28,24,.16);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:9px;color:var(--ink);cursor:pointer;font:inherit;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;width:100%}

#root .plan.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),0 6px 16px rgba(36,28,24,.10);background:var(--blush-soft)}

#root .plan-badge{position:absolute;top:-10px;left:14px;background:#A67C3D;color:#fff;border-radius:999px;padding:4px 11px;font-family:'Outfit',sans-serif;font-weight:700;font-size:.56rem;letter-spacing:.09em;text-transform:uppercase;box-shadow:0 2px 8px rgba(166,124,61,.3)}

#root .plan-flex{display:flex;gap:12px;align-items:flex-start}

#root .plan-img{width:88px;height:88px;object-fit:cover;border-radius:10px;flex:0 0 88px}

#root .plan-info{display:flex;flex-direction:column;gap:5px;min-width:0}

#root .plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

#root .plan-name{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.05rem}

#root .plan-price{font-family:'Outfit',sans-serif;font-weight:800;font-size:.95rem;white-space:nowrap}

#root .plan-price s{color:var(--ink-soft);font-weight:600;margin-right:4px}

#root .plan-price b{color:var(--cta)}

#root .plan ul{list-style:none;display:flex;flex-direction:column;gap:6px}

#root .plan li{font-size:.88rem;line-height:1.45;padding-left:15px;position:relative}

#root .plan li::before{content:"";position:absolute;left:2px;top:.55em;width:5px;height:5px;border-radius:50%;background:#A67C3D}

/* step 2 — LP pick cards */
#root .picker{display:flex;flex-direction:column;gap:8px}

#root .pick{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;border:1.5px solid var(--blush);border-radius:14px;padding:11px 12px;background:var(--ivory);transition:border-color .15s ease}

#root .pick.on{border-color:var(--ink);background:var(--grad)}

#root .pick-row{display:flex;align-items:center;gap:12px}

#root .pick-row img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:0 0 44px}

#root .pick-txt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}

#root .pick-name{font-weight:700;font-size:.92rem}

#root .pick-int{font-family:'Outfit',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.6rem;color:var(--rosewood-deep)}

#root .pick-ings{font-weight:700;color:var(--ink);font-size:.8rem}

#root .pick-tags{display:flex;flex-wrap:wrap;gap:5px}

#root .tagpill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:.68rem;font-weight:700;color:#fff;line-height:1.35;white-space:nowrap}

#root .stepper{display:flex;align-items:center;gap:8px;flex:0 0 auto}

#root .stepper button{width:32px;height:32px;border-radius:50%;border:2px solid var(--rosewood);background:#fff;color:var(--ink);font-size:1.1rem;font-weight:700;cursor:pointer;line-height:1}

#root .pick.on .stepper button{border-color:var(--ink)}

#root .pick.on .add{background:var(--ink);color:#fff}

#root .stepper .qty{min-width:16px;text-align:center;font-weight:700}

#root .pick:not(.on) .sub{opacity:.25;pointer-events:none}

/* usp chips — main-PDP style */
#root .usp3{display:flex;gap:8px;margin:14px 0 2px}

#root .usp3 .usp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:12px;padding:11px 6px 10px;font-family:'Outfit',sans-serif;font-weight:700;font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;text-align:center;color:var(--ink);line-height:1.35}

#root .usp3 .usp-ic{width:38px;height:38px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:19px}

#root .usp3 .usp-tx{white-space:pre-line}

#root .usp3 .usp:nth-child(1) .usp-ic{background:linear-gradient(145deg,#D8ECF3 0%,#B7D9E8 100%)}

#root .usp3 .usp:nth-child(2) .usp-ic{background:linear-gradient(145deg,#FBE3C9 0%,#F6C99B 100%)}

#root .usp3 .usp:nth-child(3) .usp-ic{background:linear-gradient(145deg,#DFF3D8 0%,#BCE4C0 100%)}

#root .usp3 .usp:nth-child(1){background:rgba(183,217,232,.16)}

#root .usp3 .usp:nth-child(2){background:rgba(246,201,155,.16)}

#root .usp3 .usp:nth-child(3){background:rgba(188,228,192,.16)}

/* testimonial — LP gold box */
#root .testi2{position:relative;background:linear-gradient(160deg,#FFFFFF 0%,#FBF5EC 100%);border:1.5px solid #DECBA0;border-radius:16px;padding:26px 20px 18px;margin:16px 0;text-align:center;box-shadow:0 6px 22px rgba(60,38,30,.08)}

#root .tmark{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--ink);color:#F9F5F0;font-family:'Unna',Georgia,serif;font-size:1.7rem;line-height:1.5;display:flex;align-items:center;justify-content:center}

#root .tstars{color:var(--star);font-size:.85rem;letter-spacing:3px;margin-bottom:6px}

#root .tq{font-family:'Unna',Georgia,serif;font-style:italic;font-weight:700;font-size:1.18rem;line-height:1.35;margin:0 auto 12px;max-width:34ch;text-wrap:balance}

#root .twhor{display:flex;align-items:center;justify-content:center;gap:10px}

#root .twhor img{width:42px;height:42px;object-fit:cover;border-radius:50%;border:2px solid #DECBA0}

#root .twhor span{text-align:left;font-size:.82rem;line-height:1.35}

#root .twhor b{font-weight:700}

#root .tv{display:block;font-size:.7rem;color:var(--ink-soft)}

/* step 3 — LP valstack */
#root .valstack{border:1.5px solid #E2D2AC;border-radius:14px;background:#F5EEDD;padding:14px 16px;display:flex;flex-direction:column;gap:9px}

#root .vrow{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}

#root .vrow .vfree{color:var(--cta);font-weight:700;white-space:nowrap}

#root .vrow s{color:var(--ink-soft);margin-right:5px}

#root .vrow.total{border-top:1.5px dashed #DECBA0;padding-top:10px;font-weight:700;font-size:1.05rem}

#root .valline{text-align:center;font-size:.86rem;margin:10px 0 0;color:var(--ink-soft)}

#root .valline b{color:var(--cta)}

#root .offer-terms{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:#F7F3EE;border:1px solid var(--blush);border-radius:14px;margin:14px 0 4px}

#root .term-row{display:flex;gap:11px;align-items:flex-start;font-size:.9rem;line-height:1.5;text-align:left}

#root .term-ic{flex:0 0 auto;font-size:1.05rem;line-height:1.4}

#root .term-row strong{font-weight:700}

#root .trust-strip{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-family:'Outfit',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border-top:1px solid var(--blush);border-bottom:1px solid var(--blush);padding:11px 4px;margin:14px 0}

/* review-step cart items */
#root .kitcart{display:flex;flex-direction:column;gap:9px;margin:0 0 16px}

#root .krow{display:flex;gap:11px;align-items:center;background:#fff;border:1.5px solid var(--blush);border-radius:14px;padding:10px 12px}

#root .krow img{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:0 0 54px}

#root .ktx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}

#root .ktx b{font-size:.9rem;line-height:1.3}

#root .kint{font-family:'Outfit',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:.56rem;color:var(--rosewood-deep)}

#root .kmeta{font-size:.72rem;color:var(--ink-soft)}

#root .kpr{text-align:right;flex:0 0 auto}

#root .kqty{display:block;font-size:.72rem;color:var(--ink-soft)}

#root .kpr b{font-size:.88rem;white-space:nowrap}

#root .kpr .kfree{color:var(--cta)}

#root .kpr s{color:var(--ink-soft);font-weight:500;margin-right:4px;font-size:.78rem}

/* review-step blocks */
#root .due{display:flex;flex-direction:column;align-items:center;gap:1px;margin:2px 0 12px;text-align:center}

#root .due-k{font-family:'Outfit',sans-serif;font-weight:700;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rosewood-deep)}

#root .due-v{font-family:'Unna',Georgia,serif;font-weight:700;font-size:2.4rem;line-height:1.05}

#root .due-sub{font-size:.8rem;color:var(--ink-soft)}

#root .hiw{display:flex;flex-direction:column;gap:9px;margin:14px 0 4px}

#root .hiw-row{display:flex;gap:12px;align-items:flex-start;font-size:.88rem;line-height:1.5;background:#fff;border:1.5px solid var(--blush);border-radius:12px;padding:10px 13px}

#root .hiw-k{flex:0 0 88px;font-family:'Outfit',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:.62rem;color:var(--rosewood-deep);padding-top:3px}

#root .nolock{margin:12px 0 2px;background:#EAF7E6;border:1.5px solid #BFE3B4;border-radius:12px;padding:11px 13px;font-size:.86rem;line-height:1.5}

#root .perkhead{font-family:'Unna',Georgia,serif;font-weight:700;font-size:1.2rem;line-height:1.3;margin:18px 0 10px;text-align:center;text-wrap:balance}

#root .perkhead em{font-style:italic}

#root .faqs{display:flex;flex-direction:column;gap:7px;margin:4px 0 8px}

#root .faqs details{background:#fff;border:1.5px solid var(--blush);border-radius:12px;padding:11px 14px}

#root .faqs summary{font-weight:700;font-size:.9rem;cursor:pointer;list-style:none;position:relative;padding-right:22px}

#root .faqs summary::after{content:"+";position:absolute;right:0;top:0;font-weight:700;color:var(--rosewood-deep)}

#root .faqs details[open] summary::after{content:"−"}

#root .faqs p{font-size:.86rem;color:var(--ink-soft);line-height:1.55;margin-top:7px}

#root .cd{display:inline-block;min-width:74px;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.22);border-radius:6px;padding:1px 7px;margin-left:6px}

/* CTA — LP pill button */
#root .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;padding:17px 26px;border-radius:999px;background:var(--cta);color:#fff;border:0;font-family:'Outfit',sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.86rem;box-shadow:0 12px 28px rgba(0,0,0,.28);transition:transform .15s ease,box-shadow .15s ease;text-align:center;cursor:pointer}

#root .btn:hover{transform:translateY(-1px);box-shadow:0 16px 34px rgba(0,0,0,.36)}

#root .btn[disabled]{background:#B7ABA6;box-shadow:none;cursor:not-allowed;transform:none}

#root .btn .btn-sub{font-size:.62rem;letter-spacing:.18em;opacity:.85;font-weight:700}

#root .btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none;width:auto;padding:17px 20px}

#root .navrow{display:flex;gap:10px;margin-top:16px}

#root .stickybar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--blush);padding:10px 16px;display:none;z-index:50;box-shadow:0 -4px 18px rgba(36,28,24,.08)}

#root .stickybar.on{display:block}

#root .sb-in{display:flex;gap:12px;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto}

#root .sb-l{font-size:.78rem;line-height:1.35;color:var(--ink-soft)}

#root .sb-l b{font-size:.95rem;color:var(--ink)}

#root .sb-in .btn{width:auto;flex:0 0 auto;padding:13px 22px;font-size:.72rem}

#root .sb-in .btn.secondary{padding:13px 16px}

#root .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-size:.85rem;max-width:90vw;opacity:0;transition:opacity .3s;z-index:99;text-align:center}

#root .toast.on{opacity:1}
