name: drawer-recon
# run 101 — fetch mc-drawer.js source
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          curl -sSL "$B/mc-drawer.js?v=src$RANDOM" -o lp-factory/pages/kits-lp/live/mc-drawer.js
          wc -c lp-factory/pages/kits-lp/live/mc-drawer.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/mc-drawer.js
          git commit -m "recon r101: mc-drawer.js source"
          git push
