name: drawer-recon
# run 191 — verify v3s11 live: tier grid reverted (cards back to the v3s9 flex layout), tiers screenshot mobile + desktop
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Verify
        run: |
          mkdir -p lp-factory/pages/kits-lp/live
          cat > r191.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const KEY = process.env.KEY;
          const b = await chromium.launch();
          const out = {};
          for (const [name, vp] of [['mobile', { width: 390, height: 844 }], ['small', { width: 360, height: 780 }], ['desktop', { width: 1366, height: 900 }]]) {
            const pg = await (await b.newContext({ viewport: vp })).newPage();
            await pg.goto('https://maisoncroyez.com/pages/six-month-program', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await pg.waitForSelector('.tiers', { timeout: 60000 }); await pg.waitForTimeout(3500);
            out[name] = await pg.evaluate((k) => ({ key: document.documentElement.innerHTML.includes(k), names: [...document.querySelectorAll('.tier-name')].map(e => { const r = e.getBoundingClientRect(); const fs = parseFloat(getComputedStyle(e).fontSize); return { text: e.textContent, h: Math.round(r.height), w: Math.round(r.width), fs, oneLine: r.height <= fs * 1.5, clipped: e.scrollWidth > e.clientWidth + 1 }; }), cardH: [...document.querySelectorAll('.tier')].map(e => Math.round(e.getBoundingClientRect().height)) }), KEY);
            await pg.locator('.tiers').scrollIntoViewIfNeeded(); await pg.waitForTimeout(500);
            await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3s11-tiers-' + name + '.png' });
            await pg.context().close();
          }
          console.log('TIERS ' + JSON.stringify(out, null, 1));
          await b.close();
          EOF2
          KEY="${KEY}" node r191.mjs
        env:
          KEY: v3s11-3677bdd
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/
          git commit -m "r191: v3s11 tier screenshots" || exit 0
          git pull --rebase -q origin claude/maison-diffuser-perf-fixes-f45ggl || true
          git push
