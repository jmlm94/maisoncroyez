name: drawer-recon
# run 117 — gate specificity-fixed margin css
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          for i in 1 2 3 4 5 6 7 8; do
            K="og$RANDOM$RANDOM"
            curl -sSL "$B/mc-6mp.css?v=$K" -o c.css
            M=$(grep -o -F '.gal-col .adv-announce{padding:11px 15px;margin-bottom:10px}' c.css | wc -l)
            B4=$(grep -o -F 'margin-bottom:4px' c.css | wc -l)
            echo "R117 try$i bytes=$(wc -c < c.css) galColMargin=$M old4px=$B4"
            if [ "$M" -ge 1 ] && [ "$B4" -eq 0 ]; then echo "R117 PROPAGATED"; exit 0; fi
            sleep 10
          done
          echo "R117 NOT PROPAGATED"
