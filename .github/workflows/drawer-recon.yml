name: drawer-recon
# run 15 — capture aurahouse.com build-your-starter-kit funnel (structure + copy + screenshots)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture aura house kit builder
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > recon.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          for(let a=0;a<4;a++){
            const nav=await page.goto('https://aurahouse.com/pages/build-your-starter-kit?source=homepage',{waitUntil:'load',timeout:60000});
            console.log('goto '+(a+1)+': '+(nav?nav.status():'?'));
            if(nav && nav.status()===200) break;
            await page.waitForTimeout(20000);
          }
          await page.waitForTimeout(10000);
          await page.evaluate(async()=>{ for(let y=0;y<document.body.scrollHeight;y+=500){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,120));} window.scrollTo(0,0); await new Promise(r=>setTimeout(r,2000)); });
          const dump = await page.evaluate(()=>{
            const t=document.body.innerText;
            const btns=[...document.querySelectorAll('button, a[class*=btn], [role=button]')].map(b=>String(b.innerText||b.textContent||'').trim().replace(/\s+/g,' ').slice(0,80)).filter(Boolean).slice(0,60);
            const imgs=[...document.querySelectorAll('img')].map(i=>(i.currentSrc||i.src).split('/').pop().split('?')[0]).filter(s=>s&&!/^data:/.test(s)).slice(0,50);
            const steps=[...document.querySelectorAll('[class*=step],[class*=Step],[class*=progress],[class*=Progress]')].map(e=>String(e.className)+' :: '+String(e.innerText||'').trim().replace(/\s+/g,' ').slice(0,120)).slice(0,30);
            return {textLen:t.length, btns, imgs, steps, text:t.slice(0,18000)};
          });
          console.log('=== BUTTONS ==='); dump.btns.forEach(x=>console.log(' - '+x));
          console.log('=== STEP/PROGRESS ELEMENTS ==='); dump.steps.forEach(x=>console.log(' - '+x));
          console.log('=== IMAGES ==='); dump.imgs.forEach(x=>console.log(' - '+x));
          console.log('=== PAGE TEXT ('+dump.textLen+' chars) ===');
          console.log(dump.text);
          await page.screenshot({ path:'aura-kit-m-full.png', fullPage:true });
          // try clicking through the flow: click first prominent CTA / product card, capture after each
          const clicks=['button:has-text("Add")','button:has-text("Select")','button:has-text("Next")','button:has-text("Continue")'];
          for(let i=0;i<clicks.length;i++){
            try{ await page.click(clicks[i],{timeout:3000}); await page.waitForTimeout(2500); console.log('clicked: '+clicks[i]); }
            catch(e){ console.log('no click: '+clicks[i]); }
          }
          await page.screenshot({ path:'aura-kit-m-after.png', fullPage:true });
          const after=await page.evaluate(()=>document.body.innerText.slice(0,6000));
          console.log('=== TEXT AFTER CLICKS ==='); console.log(after);
          // desktop pass
          const d = await b.newPage({ viewport:{width:1440,height:900}, deviceScaleFactor:1 });
          try{ await d.goto('https://aurahouse.com/pages/build-your-starter-kit?source=homepage',{waitUntil:'load',timeout:60000}); await d.waitForTimeout(9000);
            await d.evaluate(async()=>{ for(let y=0;y<document.body.scrollHeight;y+=700){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,100));} window.scrollTo(0,0); await new Promise(r=>setTimeout(r,1500)); });
            await d.screenshot({ path:'aura-kit-d-full.png', fullPage:true });
          }catch(e){ console.log('desktop pass failed: '+e.message.slice(0,100)); }
          await b.close();
          EOS
          node recon.mjs 2>&1 | tee aura-recon.txt
      - name: Commit results
        if: always()
        run: |
          mkdir -p lp-factory/recon-aura
          mv aura-recon.txt aura-kit-m-full.png aura-kit-m-after.png aura-kit-d-full.png lp-factory/recon-aura/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/recon-aura
          git commit -m "aura recon: build-your-starter-kit capture" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
