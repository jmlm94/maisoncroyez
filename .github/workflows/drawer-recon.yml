name: drawer-recon
# run 206 — post-deploy check of v3s20: CDN file sizes under the new key, then the LIVE page as visitors get it
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CDN files under the new key
        run: |
          for f in mc-v3-app.js mc-v3.css; do
            printf "%s  " "$f"; curl -sSL -o /tmp/$f "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/$f?v=v3s20-6304c3c"; wc -c < /tmp/$f
          done
          echo "expected app 86561 css 55812"
          grep -c 'OFFER_SUB' /tmp/mc-v3-app.js || true
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Live page
        run: |
          mkdir -p lp-factory/pages/kits-lp/recon/r206
          cat > r206.mjs <<'EOF2'
          import { chromium } from 'playwright';
          const OUT = 'lp-factory/pages/kits-lp/recon/r206/';
          const b = await chromium.launch();
          for (let attempt = 1; attempt <= 6; attempt++) {
            const pg = await (await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 })).newPage();
            const errs = []; pg.on('pageerror', (e) => errs.push(e.message));
            await pg.goto('https://maisoncroyez.com/pages/six-month-program?nocache=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 90000 });
            const key = await pg.evaluate(() => { const s = [...document.scripts].find((x) => /mc-v3-app\.js/.test(x.src)); return s ? s.src.split('v=')[1] : 'none'; });
            await pg.waitForSelector('#buybox .tiers', { timeout: 60000 }).catch(() => {}); await pg.waitForTimeout(2500);
            const tiers = await pg.$$eval('#buybox .tier', (a) => a.map((e) => e.innerText.replace(/\s+/g, ' ').slice(0, 70)));
            const steps = await pg.$$eval('#buybox .pstep', (a) => a.map((e) => e.innerText));
            console.log(`attempt ${attempt}: key=${key} steps=${JSON.stringify(steps)} tiers=${JSON.stringify(tiers)} errs=${JSON.stringify(errs)}`);
            if (/v3s20/.test(key) && steps.length) {
              await pg.evaluate(() => document.querySelector('#buybox .buybox').scrollIntoView()); await pg.screenshot({ path: OUT + 'live-v3s20-s1.png' });
              await pg.click('#buybox .step-next'); await pg.waitForTimeout(700); await pg.screenshot({ path: OUT + 'live-v3s20-s2.png' });
              const c = pg.locator('#buybox .pick.compact'); await c.nth(0).click(); await c.nth(2).click(); await c.nth(6).click(); await pg.click('#buybox .navrow .btn.atc'); await pg.waitForTimeout(700);
              await pg.evaluate(() => document.querySelector('#buybox .kitrev').scrollIntoView()); await pg.screenshot({ path: OUT + 'live-v3s20-s3.png' });
              console.log('LIVE OK ' + (await pg.locator('#buybox .kr-total').innerText()).replace(/\s+/g, ' '));
              break;
            }
            await pg.context().close(); await new Promise((r) => setTimeout(r, 20000));
          }
          await b.close();
          EOF2
          node r206.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/recon/r206
          git commit -m "r206: live v3s20 screenshots" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push
