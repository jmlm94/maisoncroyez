name: qa-kits
# Kits page only (https://maisoncroyez.com/pages/diffuser-kits), dk9s three-step version: step 1 (scents-first cards, hero picture, no video, no countdown, badges under the title, three option cards with struck value + FREE, no offer price, sticky bar from load), step 2 (reserved card, tap = read / + adds / − removes, smells-like bar with the ingredients link, "Review my kit" only when the kit is full), step 3 (16:9 picture, review, value line + DUE TODAY, 60/30/90 with the black Most popular pill, the fixed note, Add to cart in the first phone screen), then two real carts (2 diffusers + 3 scents every 30 days; 1 diffuser + 2 scents every 90 days). Edit this line and push to run. Run 2026-10-21 after dk9q (key dk9q-5d84bf3): kits page on the Subi group "04/10 Sub for Offer #2 and #3" (Every 30 / 60 / 90 days, full price every cycle), kit variants renamed 1 / 2 / 3 Diffusers at $89.95 / $179.90 / $269.85, BXGY titles "N FREE DIFFUSER(S) — SCENT SUBSCRIPTION" with minimums 2 / 3 / 5 scents. Rerun 21:08 UTC after the BXGY fix (customerBuys isSubscription restored, minimums 2 / 3 / 5). Rerun 2026-10-22 22:5x UTC after dk9r (key dk9r-b1746c3): perf-only change, the flows must be unchanged. Rerun 23:0x UTC: hero check accepts the inline frame on phones. [run dk9v-a21d428]
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/qa-kits.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: https://maisoncroyez.com/pages/diffuser-kits
      OUT: lp-factory/qa-kits
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Gate (the live kits page must already be on the dk9 three-step build; otherwise this run skips)
        id: gate
        run: |
          curl -sSL -A "Mozilla/5.0" https://maisoncroyez.com/pages/diffuser-kits -o live.html || true
          KEY=$(grep -o "var v='[^']*'" live.html | head -1 | cut -d"'" -f2)
          echo "live key: $KEY"
          if [[ "$KEY" == dk9* ]]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; echo "live page is not on dk9 yet — skipping"; fi
      - name: Kits QA
        if: steps.gate.outputs.run == 'yes'
