name: drawer-recon
# run 130 — verify WOW announcement bar text + blush styling post 23:00Z dr1 flip
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[]; p.on('pageerror',e=>errs.push(String(e).slice(0,120)));
          await p.goto('https://maisoncroyez.com/?utm_campaign=diag130',{waitUntil:'domcontentloaded',timeout:90000});
          await p.waitForTimeout(9000);
          const d=await p.evaluate(()=>{
            const sec=document.querySelector('.shopify-section--announcement-bar');
            if(!sec) return {found:false};
            const par=sec.querySelector('p');
            const cs=getComputedStyle(par||sec);
            const scs=getComputedStyle(sec);
            return {found:true, text:par?par.textContent.trim():null,
              bg:scs.backgroundColor, bgImage:scs.backgroundImage, color:cs.color,
              styleTag:!!document.getElementById('mc-banner-style')};});
          console.log('R130A '+JSON.stringify(d)+' errs='+JSON.stringify(errs));
          await p.evaluate(()=>window.scrollTo(0,0));
          await p.waitForTimeout(500);
          await p.screenshot({path:'lp-factory/pages/home/live/home-top.png'});
          await b.close();})();
          EOS
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/home/live
          git commit -m "recon r130: WOW banner live verify" || echo "no changes"
          git push || echo "no push"
