name: fetch-brand-art
# Downloads generated pictures for the rebrand into the folder named in DEST (board/img for the board, mockups/img for the pack mockups) as WebP
# (the session container cannot reach the image host). One "name url" pair per line in LIST. Edit the list and push to run. [run 1: the nine first pictures] [run 2: woman-silver, added after the Hanni reference] [run 3: the first five pack mockups, into mockups/img] [run 4: row 2 of the pack mockups] [run 5: gallery pictures for the bath soak PDP preview, into lp-factory/pages/bath-soak/img] [run 6: the real diffuser in the new look, for the kits preview, into lp-factory/pages/diffuser-kits-rebrand/img] [run 7: the 9 / 18 / 24-month variant pictures for the supply product, into lp-factory/pages/supply/img/variants] [run 8: the three scent cards of the bath soak PDP preview (ingredient + pouch + salts), into lp-factory/pages/bath-soak/img] [run 9: six pictures for the direct-response version of the bath soak preview (her four nights, the foot soak, asleep), same folder] [run 10: eleven 4:5 pictures for the bath soak static ads, into lp-factory/ads/bath-soak/img, kept up to 2800 px (MAXPX)] [run 11: four test pictures for the realistic redo of the ads (three models), into lp-factory/ads/bath-soak/img/test] [run 12: the realistic lifestyle pictures for version 2 of the ads (r2-*), into lp-factory/ads/bath-soak/img] [run 13: r2-three] [run 14: seven scenes reshot wider (r3-*)] [run 15: the foot basin from further back and a second take of the legs scene (r4-*)] [run 16: two takes each of the aches and the foot basin scenes with the bag being poured (r5-*)]
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/fetch-brand-art.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEST: lp-factory/ads/bath-soak/img
      MAXPX: "2800"
      LIST: |
        r5-aches-a https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261119_223656_afe0b1f7-8f13-45df-9f32-0c31c016ef2a.png
        r5-aches-b https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261119_223657_722b0d9d-701f-4b63-8006-bc9a9cc76750.png
        r5-foot-a https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261119_223657_719fc32f-f01b-426e-b8b4-1892fc9e0337.png
        r5-foot-b https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU/hf_20261119_223656_bc40a9c5-0462-4e3d-a825-a7f90722fbf5.png
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch and convert
        run: |
          pip install -q pillow
          D="$DEST"
          mkdir -p "$D" /tmp/raw
          echo "$LIST" | while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL -A "Mozilla/5.0" --max-time 120 -o "/tmp/raw/$name.png" -w "%{http_code}" "$url" || true)
            echo "$name http $code $(wc -c < "/tmp/raw/$name.png" 2>/dev/null) bytes $(file -b "/tmp/raw/$name.png" | cut -c1-60)"
          done
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          D=os.environ['DEST']
          for f in sorted(glob.glob('/tmp/raw/*.png')):
              try:
                  im=Image.open(f).convert('RGB')
              except Exception as e:
                  print('skip',f,e); continue
              m=int(os.environ.get('MAXPX') or 2000); im.thumbnail((m,m), Image.LANCZOS)
              out=os.path.join(D, os.path.basename(f)[:-4]+'.webp')
              im.save(out,'WEBP',quality=84,method=6)
              print(out, im.size, os.path.getsize(out))
          PY
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          git commit -m "rebrand board: fetched the generated reference pictures" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && break || sleep 3; done
