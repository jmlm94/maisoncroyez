name: cart-probe
# Ajax-cart probe: adds a kit + scents with a given selling plan from a fresh session and prints /cart.js (lines, plans, discount allocations, total). Edit this line and push to run. Run 2026-10-21 20:53 UTC: why the kit line is no longer zeroed after dk9q (04/10 plans + BXGY minimums 2/3/5). Rerun 20:57 UTC after setting appliesOnSubscription=true on the three BXGYs. Rerun 21:00 UTC after the minimums went back to 1 / 2 / 3 (titles kept). Rerun 21:05 UTC: code discount FREEDIFFUSERS applied through /cart/update.js (S7, S8) before the plain scenarios. Rerun 21:06 UTC after customerBuys isSubscription=true on the three BXGYs (the API update had reset it). Rerun 21:22 UTC: bundle page add (S9–S11) — qa-cart sees add.js 400 on the bundle page since 20:49.
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/cart-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: probe
        run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'
          probe() {
            name="$1"; body="$2"; J=$(mktemp)
            A=$(curl -s -A "$UA" -c "$J" -b "$J" -w "\nHTTP %{http_code}" -H 'Content-Type: application/json' -X POST https://maisoncroyez.com/cart/add.js -d "$body")
            echo "$name add.js $(echo "$A" | tail -n1)"; case "$A" in *"HTTP 200"*) ;; *) echo "  add.js body: $(echo "$A" | head -c 400)";; esac
            sleep 1
            R=$(curl -s -A "$UA" -b "$J" -H 'Accept: application/json' https://maisoncroyez.com/cart.js)
            echo "$R" | jq -c '{total: (.total_price/100), items: [.items[] | {v: .variant_id, q: .quantity, title: .product_title, variant: .variant_title, price: (.price/100), line: (.final_line_price/100), plan: (.selling_plan_allocation.selling_plan.name // null), disc: [.line_level_discount_allocations[] | {t: .discount_application.title, a: (.amount/100)}]}], cart_disc: [.cart_level_discount_applications[]? | .title]}' 2>/dev/null || echo "RAW: ${R:0:300}"
            sleep 2
            echo
          }
          K2=45900240289901; K1=45900240257133; G=41212020457581; W=41212021669997; C=41212021506157
          P30N=7883817069; P90N=7883882605; P30O=7876575341; P90O=7876640877
          probe_code() {
            name="$1"; body="$2"; code="$3"; J=$(mktemp)
            curl -s -A "$UA" -c "$J" -b "$J" -o /dev/null -w "$name add.js HTTP %{http_code}\n" -H 'Content-Type: application/json' -X POST https://maisoncroyez.com/cart/add.js -d "$body"
            sleep 1
            curl -s -A "$UA" -c "$J" -b "$J" -o /dev/null -w "$name update.js(discount=$code) HTTP %{http_code}\n" -H 'Content-Type: application/json' -X POST https://maisoncroyez.com/cart/update.js -d "{\"discount\":\"$code\"}"
            sleep 1
            R=$(curl -s -A "$UA" -b "$J" -H 'Accept: application/json' https://maisoncroyez.com/cart.js)
            echo "$R" | jq -c '{total: (.total_price/100), codes: [.discount_codes[]? | {c: .code, ok: .applicable}], items: [.items[] | {v: .variant_id, q: .quantity, variant: .variant_title, line: (.final_line_price/100), plan: (.selling_plan_allocation.selling_plan.name // null), disc: [.line_level_discount_allocations[] | {t: .discount_application.title, a: (.amount/100)}]}]}' 2>/dev/null || echo "RAW: ${R:0:300}"
            sleep 3
          }
          probe "S9 bundle 45728132202605 + Chilled + Midnight on 04/10 Every 30 days" "{\"items\":[{\"id\":45728132202605,\"quantity\":1},{\"id\":$C,\"quantity\":1,\"selling_plan\":$P30N},{\"id\":41212019933293,\"quantity\":1,\"selling_plan\":$P30N}]}"
          probe "S10 bundle + Chilled + Midnight one-time" "{\"items\":[{\"id\":45728132202605,\"quantity\":1},{\"id\":$C,\"quantity\":1},{\"id\":41212019933293,\"quantity\":1}]}"
          probe "S11 bundle alone" "{\"items\":[{\"id\":45728132202605,\"quantity\":1}]}"
          exit 0
          probe_code "S7 kit2 + 3 scents on 04/10 Every 30 days + code" "{\"items\":[{\"id\":$K2,\"quantity\":1},{\"id\":$G,\"quantity\":1,\"selling_plan\":$P30N},{\"id\":$W,\"quantity\":1,\"selling_plan\":$P30N},{\"id\":$C,\"quantity\":1,\"selling_plan\":$P30N}]}" FREEDIFFUSERS
          probe_code "S8 kit1 + Chilled x2 on 04/10 Every 90 days + code" "{\"items\":[{\"id\":$K1,\"quantity\":1},{\"id\":$C,\"quantity\":2,\"selling_plan\":$P90N}]}" FREEDIFFUSERS
          probe "S1 kit2 + 3 scents on 04/10 Every 30 days" "{\"items\":[{\"id\":$K2,\"quantity\":1},{\"id\":$G,\"quantity\":1,\"selling_plan\":$P30N},{\"id\":$W,\"quantity\":1,\"selling_plan\":$P30N},{\"id\":$C,\"quantity\":1,\"selling_plan\":$P30N}]}"
          probe "S2 kit2 + 3 scents on 02/10 Monthly" "{\"items\":[{\"id\":$K2,\"quantity\":1},{\"id\":$G,\"quantity\":1,\"selling_plan\":$P30O},{\"id\":$W,\"quantity\":1,\"selling_plan\":$P30O},{\"id\":$C,\"quantity\":1,\"selling_plan\":$P30O}]}"
          probe "S3 kit2 + 3 scents one-time" "{\"items\":[{\"id\":$K2,\"quantity\":1},{\"id\":$G,\"quantity\":1},{\"id\":$W,\"quantity\":1},{\"id\":$C,\"quantity\":1}]}"
          probe "S4 kit1 + Chilled x2 on 04/10 Every 90 days" "{\"items\":[{\"id\":$K1,\"quantity\":1},{\"id\":$C,\"quantity\":2,\"selling_plan\":$P90N}]}"
          probe "S5 kit1 + Chilled x2 on 02/10 Every 90 days" "{\"items\":[{\"id\":$K1,\"quantity\":1},{\"id\":$C,\"quantity\":2,\"selling_plan\":$P90O}]}"
          probe "S6 kit2 + 4 scents on 04/10 Every 30 days (one above the minimum)" "{\"items\":[{\"id\":$K2,\"quantity\":1},{\"id\":$G,\"quantity\":2,\"selling_plan\":$P30N},{\"id\":$W,\"quantity\":1,\"selling_plan\":$P30N},{\"id\":$C,\"quantity\":1,\"selling_plan\":$P30N}]}"
