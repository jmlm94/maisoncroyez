name: verify-lp
# run: 3
# Verification relay: the Claude sandbox can't reach cdn.shopify.com or the
# storefront, so this workflow checks them and commits live screenshots.
on:
  push:
    branches: [claude/maison-landing-page-iyikm5]
    paths: ['.github/workflows/verify-lp.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CDN bundles
        run: |
          for f in mc-lp-diffuser.css mc-lp-vendor.js mc-lp-diffuser-assets.js mc-lp-diffuser-app.js; do
            echo "== $f"
            curl -sSL -o /tmp/f --max-time 60 -w "status=%{http_code} bytes=%{size_download}\n" "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/$f"
          done
      - name: Check page HTML
        run: |
          curl -sSL -o /tmp/p --max-time 30 -w "status=%{http_code} bytes=%{size_download}\n" "https://maisoncroyez.com/pages/diffuser?cb=$(date +%s)"
          if grep -q "mc-lp-diffuser-assets" /tmp/p && grep -q 'id="root"' /tmp/p; then echo "LOADER PRESENT"; else echo "LOADER MISSING"; exit 1; fi
      - name: Save page HTML
        run: |
          curl -sSL -o page-html.txt "https://maisoncroyez.com/pages/diffuser?cb=$(date +%s)"
          wc -c page-html.txt
      - name: Screenshot live page (scroll-through for lazy media)
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > shot.mjs <<'EOS'
          import { chromium } from 'playwright';
          const shots = [[390, 844, 'live-mobile.png'], [1440, 900, 'live-desktop.png']];
          const b = await chromium.launch();
          for (const [w, h, path] of shots) {
            const page = await b.newPage({ viewport: { width: w, height: h } });
            await page.goto('https://maisoncroyez.com/pages/diffuser?cb=' + Date.now(), { waitUntil: 'load', timeout: 60000 });
            await page.waitForTimeout(8000);
            await page.evaluate(async () => {
              for (let y = 0; y < document.body.scrollHeight; y += 600) { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 80)); }
              window.scrollTo(0, 0); await new Promise(r => setTimeout(r, 1200));
            });
            await page.screenshot({ path, fullPage: true });
            await page.close();
          }
          await b.close();
          EOS
          node shot.mjs
          ls -la live-*.png
      - name: Commit screenshots
        run: |
          mkdir -p lp-factory/pages/pdp-diffuser/verify
          mv live-mobile.png live-desktop.png page-html.txt lp-factory/pages/pdp-diffuser/verify/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-diffuser/verify
          git commit -m "PDP diffuser live verification screenshots"
          git pull --rebase origin claude/maison-landing-page-iyikm5
          git push
