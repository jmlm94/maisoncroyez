name: drawer-recon
# run 122 — gate list-hardened css, then verify handled by r123
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          for i in 1 2 3 4 5 6; do
            K="og$RANDOM$RANDOM"
            curl -sSL "$B/mc-6mp.css?v=$K" -o c.css
            L=$(grep -o -F '#root li' c.css | wc -l)
            echo "R122 try$i bytes=$(wc -c < c.css) rootLi=$L"
            if [ "$L" -ge 2 ]; then echo "R122 PROPAGATED"; exit 0; fi
            sleep 10
          done
          echo "R122 NOT PROPAGATED"
