name: drawer-recon
# run 31 — sitewide drawer verify with 429-aware retry (runner IPs get cart-throttled)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sitewide drawer
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > verify.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const PV='preview_theme_id=149076607085';
          const WANT='Congrats, your order is reserved! ✓';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function cartCall(page, js){ // retry on 429 up to 7x with 25s backoff
            for(let a=0;a<7;a++){
              const r=await page.evaluate(js);
              if(r && r.status!==429) return r;
              console.log('  429 — backing off 25s (attempt '+(a+1)+')');
              await sleep(25000);
            }
            return {status:429};
          }
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          const errs=[]; page.on('pageerror',e=>errs.push(String(e).slice(0,150)));
          await page.goto('https://maisoncroyez.com/?'+PV+'&cb='+Date.now(),{waitUntil:'load',timeout:90000});
          await page.waitForTimeout(6000);
          const s0=await page.evaluate(()=>({ loader: !!document.querySelector('script[src*="mc-drawer.js"]'), drawer: !!document.getElementById('cart-drawer'), flag: window.__mcDrawer===1 }));
          console.log('=== SETUP === '+JSON.stringify(s0));
          await cartCall(page, `fetch('/cart/clear.js',{method:'POST'}).then(r=>({status:r.status}))`);
          await sleep(8000);
          const add=await cartCall(page, `fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:[{id:45511812284525,quantity:1}]})}).then(r=>({status:r.status}))`);
          console.log('add status: '+add.status);
          await sleep(8000);
          const cart=await cartCall(page, `fetch('/cart.js').then(async r=>({status:r.status, n:r.status===200?(await r.json()).items.length:-1}))`);
          console.log('cart: '+JSON.stringify(cart));
          await page.evaluate(()=>{ document.dispatchEvent(new CustomEvent('cart:refresh')); });
          await sleep(4000);
          await page.evaluate(()=>{ const d=document.getElementById('cart-drawer'); if(d&&d.show)d.show(); });
          // poll for populated drawer
          let s1=null;
          for(let a=0;a<10;a++){
            s1=await page.evaluate(()=>{
              const d=document.getElementById('cart-drawer');
              const h=d?d.querySelector('.cart-drawer__top p.h5'):null;
              return { hasTop:!!(d&&d.querySelector('.cart-drawer__top')),
                title:h?h.textContent:'none',
                shipbar:!!d.querySelector('.mc-shipbar'),
                testi:!!d.querySelector('.mc-testi')&&/Diane R\./.test((d.querySelector('.mc-testi')||{}).textContent||''),
                trust:!!d.querySelector('.mc-trust'),
                rm:d.querySelectorAll('.mc-rm').length,
                checkout:(()=>{const f=d.querySelector('form.buy-buttons button, form.buy-buttons .btn');return f?/Secure Checkout/i.test(f.textContent):false;})(),
                noUrg:!/Only\s*19\s*free diffusers/i.test(d.textContent) };
            });
            if(s1.hasTop) break;
            await sleep(2500);
          }
          console.log('=== ONE-TIME DRAWER === '+JSON.stringify(s1));
          await page.screenshot({ path:'drawer-home.png' });
          await cartCall(page, `fetch('/cart/clear.js',{method:'POST'}).then(r=>({status:r.status}))`);
          // --- LP: both scripts, circle cart ---
          await sleep(10000);
          const lp = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          const lperrs=[]; lp.on('pageerror',e=>lperrs.push(String(e).slice(0,150)));
          await lp.goto('https://maisoncroyez.com/pages/free-diffuser?'+PV+'&cb='+Date.now(),{waitUntil:'load',timeout:90000});
          await lp.waitForTimeout(9000);
          const addc=await cartCall(lp, `fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:[{id:41212019933293,quantity:1,selling_plan:2627895405},{id:45450822778989,quantity:1}]})}).then(r=>({status:r.status}))`);
          console.log('circle add status: '+addc.status);
          await sleep(6000);
          await lp.evaluate(()=>{ document.dispatchEvent(new CustomEvent('cart:refresh')); });
          await sleep(4000);
          await lp.evaluate(()=>{ const d=document.getElementById('cart-drawer'); if(d&&d.show)d.show(); });
          let t1=null;
          for(let a=0;a<10;a++){
            t1=await lp.evaluate(()=>{
              const d=document.getElementById('cart-drawer');
              const h=d?d.querySelector('.cart-drawer__top p.h5'):null;
              return { hasTop:!!(d&&d.querySelector('.cart-drawer__top')), title:h?h.textContent:'none',
                free:[...d.querySelectorAll('sale-price')].some(sp=>/FREE/.test(sp.textContent)),
                flag:window.__mcDrawer===1 };
            });
            if(t1.hasTop) break;
            await sleep(2500);
          }
          await sleep(6000);
          const t2=await lp.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            const h=d?d.querySelector('.cart-drawer__top p.h5'):null;
            return { title:h?h.textContent:'none' };
          });
          console.log('=== LP CIRCLE DRAWER === '+JSON.stringify(t1)+' later: '+JSON.stringify(t2));
          await lp.screenshot({ path:'drawer-lp.png' });
          await cartCall(lp, `fetch('/cart/clear.js',{method:'POST'}).then(r=>({status:r.status}))`);
          const checks={
            loader:s0.loader, drawerEl:s0.drawer,
            cartAdded:cart.n===1,
            titleOneTime:s1.title===WANT,
            shipbar:s1.shipbar, testi:s1.testi, trust:s1.trust, rmBtns:s1.rm>0,
            checkoutBtn:s1.checkout, noDiffuserUrgency:s1.noUrg,
            lpTitleNew:t1.title===WANT, lpTitleStable:t1.title===t2.title,
            lpFreeDiffuser:t1.free, lpFlag:t1.flag,
            noJsErrors:errs.length===0 && lperrs.length===0
          };
          console.log('=== VERDICT ===');
          Object.entries(checks).forEach(([k,v])=>console.log((v?'PASS':'FAIL')+' '+k));
          console.log('home errs: '+errs.join(' | '));
          console.log('lp errs: '+lperrs.join(' | '));
          await b.close();
          EOS
          node verify.mjs 2>&1 | tee drawer-verify.txt
      - name: Commit results
        if: always()
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p lp-factory/sitewide-drawer/verify
          mv drawer-verify.txt drawer-home.png drawer-lp.png lp-factory/sitewide-drawer/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/sitewide-drawer
          git commit -m "sitewide drawer verify r31 (bot)" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
