name: drawer-recon
# run 10 — screenshot the fragrance picker cards on live fd40 (clean buybox proof)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot picker cards on live LP
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > recon.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          let key='';
          for(let a=0;a<8;a++){
            const nav=await page.goto('https://maisoncroyez.com/pages/free-diffuser?cb='+Date.now(),{waitUntil:'load',timeout:60000});
            console.log('goto '+(a+1)+': '+(nav?nav.status():'?'));
            if(nav && nav.status()===200){
              await page.waitForTimeout(9000);
              key=await page.evaluate(()=>{const m=document.documentElement.outerHTML.match(/var v='(fd\d+-)'/);return m?m[1]:'?';});
              console.log('loader key: '+key);
              if(key==='fd40-' && await page.evaluate(()=>document.querySelectorAll('#root .pick').length>0)) break;
            }
            await page.waitForTimeout(60000);
          }
          const card=await page.evaluateHandle(()=>[...document.querySelectorAll('#root .pick')].find(p=>p.innerText.includes('Golden Blossom')));
          await card.asElement().scrollIntoViewIfNeeded();
          await page.waitForTimeout(800);
          const picker=await page.evaluateHandle(()=>document.querySelector('#root .picker'));
          await picker.asElement().screenshot({ path:'fd-picker-live.png' });
          await card.asElement().screenshot({ path:'fd-card-golden.png' });
          console.log('=== GOLDEN CARD TEXT ===');
          console.log(await card.asElement().innerText());
          await b.close();
          EOS
          node recon.mjs 2>&1 | tee picker-recon.txt
      - name: Commit results
        if: always()
        run: |
          mkdir -p lp-factory/pages/pdp-free-diffuser/verify
          mv picker-recon.txt fd-picker-live.png fd-card-golden.png lp-factory/pages/pdp-free-diffuser/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-free-diffuser/verify
          git commit -m "picker recon: live fd40 card screenshots" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
