name: drawer-recon
# run 4 — default product template recon: main DOM skeleton for body-embed takeover
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture kits product page
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > recon.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          for(let a=0;a<4;a++){
            const nav=await page.goto('https://maisoncroyez.com/products/maison-croyez-manifestation-scents-100ml?cb='+Date.now(),{waitUntil:'load',timeout:60000});
            console.log('goto '+(a+1)+': '+(nav?nav.status():'?'));
            if(nav && nav.status()===200) break;
            await page.waitForTimeout(30000);
          }
          await page.waitForTimeout(9000);
          await page.evaluate(async()=>{ for(let y=0;y<document.body.scrollHeight;y+=500){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,80));} window.scrollTo(0,0); await new Promise(r=>setTimeout(r,1500)); });
          const dump = await page.evaluate(()=>{
            const main=document.querySelector('main')||document.body;
            const walk=(n,d)=>{
              if(d>6||n.nodeType!==1) return '';
              const tag=n.tagName.toLowerCase();
              if(/^(svg|path|script|style|link)$/.test(tag)) return '';
              const cls=(typeof n.className==='string'&&n.className)?'.'+n.className.trim().split(/\s+/).slice(0,4).join('.'):'';
              const id=n.id?'#'+n.id:'';
              let out='  '.repeat(d)+tag+id+cls+'\n';
              for(const c of n.children) out+=walk(c,d+1);
              return out;
            };
            const desc=document.querySelector('.product-info__description, .prose, [class*=description]');
            return {skeleton:walk(main,0).slice(0,18000), descSel:desc?(desc.tagName.toLowerCase()+'.'+String(desc.className).trim().split(/\s+/).join('.')):'NOT FOUND', sections:[...document.querySelectorAll('main .shopify-section, .shopify-section')].map(x=>x.id+' :: '+String(x.className)).slice(0,25)};
          });
          console.log('=== DESCRIPTION NODE === '+dump.descSel);
          console.log('=== SECTIONS ==='); dump.sections.forEach(x=>console.log(' - '+x));
          console.log('=== MAIN SKELETON ===');
          console.log(dump.skeleton);
          await page.screenshot({ path:'kits-page-full.png', fullPage:true });
          await b.close();
          EOS
          node recon.mjs 2>&1 | tee kits-recon.txt
      - name: Commit results
        if: always()
        run: |
          mkdir -p lp-factory/pages/pdp-diffuser-kits/recon
          mv kits-recon.txt kits-page-full.png lp-factory/pages/pdp-diffuser-kits/recon/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-diffuser-kits
          git commit -m "kits recon: /products/diffuser-scents screenshot + text" || true
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
