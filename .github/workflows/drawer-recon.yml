name: drawer-recon
# run 140 — origin gate app deferral edits (pixel arm + late gallery)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          U="https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-6mp-app.js?v=og$RANDOM$RANDOM"
          curl -s "$U" -o /tmp/app.js
          echo "bytes=$(wc -c < /tmp/app.js)"
          echo "arm=$(grep -c 'pointerdown' /tmp/app.js || true)"
          echo "late=$(grep -c 'setLate' /tmp/app.js || true)"
          echo "guard=$(grep -c '__MC_KX_APP__' /tmp/app.js)"
