name: drawer-recon
# run 53 — relay the 13 kits-gallery images at width=820 format=pjpg (HD-but-light) for the kit-builder artifact gallery
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch gallery at 820px
        run: |
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files'
          D=lp-factory/pages/kit-builder/assets/gal820
          mkdir -p $D
          i=0
          for f in \
            "Diseno_sin_titulo_92.png?v=1783904283" \
            "image-1_1_1.png?v=1773273488" \
            "image-2_1_1.png?v=1773273488" \
            "image-3_1_1.png?v=1773273488" \
            "image-4_1_1.png?v=1773273488" \
            "image-7_1_1.png?v=1773273488" \
            "image-5_1_1.png?v=1773273488" \
            "24_60499c64-0c0b-48a4-8b5b-0785ce8dfa67.png?v=1779491849" \
            "image-6_1_1.png?v=1773273488" \
            "23_c869164d-5fdc-4499-b988-63a77e4acd84.png?v=1779491861" \
            "29_9898eecd-68da-4bd1-b33e-7a6cb2a0ab23.png?v=1779491862" \
            "26_ea76002e-317d-442d-afbc-5b85aa8011b8.png?v=1779491861" \
            "28_1b850a51-fe5a-4bec-82bc-24165d7e196c.png?v=1779491861"; do
            i=$((i+1)); n=$(printf "gal-%02d" $i)
            curl -fsSL "$B/$f&width=820&format=pjpg" -o "$D/$n.jpg"
            echo "$n <= $f" >> $D/manifest.txt
          done
          ls -la $D
          file $D/*.jpg
          # also refetch the kit-builder hero at 820 for definition parity
          curl -fsSL "$B/mc-kb-hero.jpg?width=820&format=pjpg" -o "$D/gal-00-hero.jpg" || true
          file $D/gal-00-hero.jpg || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kit-builder/assets
          git commit -m "kit-builder gallery relay 820px pjpg (bot)"
          git pull --rebase -X theirs origin claude/maison-offer-v2-deploy-dspkwe
          git push
