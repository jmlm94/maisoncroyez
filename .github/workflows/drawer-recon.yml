name: drawer-recon
# run 136 — waterfall probe: all resources starting <5s, sorted by size, to find early-bandwidth hogs
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node - <<'EOS'
          (async()=>{const { chromium } = require('playwright');
          const b=await chromium.launch();
          const ctx=await b.newContext({viewport:{width:390,height:844}});
          const p=await ctx.newPage();
          const cdp=await ctx.newCDPSession(p);
          await cdp.send('Network.enable');
          await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:150,downloadThroughput:1.6*1024*1024/8,uploadThroughput:750*1024/8});
          await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
          await p.goto('https://maisoncroyez.com/pages/six-month-program?utm_campaign=speed136',{waitUntil:'load',timeout:120000});
          await p.waitForTimeout(8000);
          const d=await p.evaluate(()=>{
            const res=performance.getEntriesByType('resource');
            const early=res.filter(r=>r.startTime<5000&&(r.transferSize||0)>5000)
              .map(r=>({n:(r.name.replace(/\?.*$/,'').split('/').pop()||r.initiatorType).slice(0,48),host:new URL(r.name).host.replace('cdn.shopify.com','cdn').slice(0,30),type:r.initiatorType,kb:Math.round((r.transferSize||0)/102.4)/10,start:Math.round(r.startTime),end:Math.round(r.responseEnd)}))
              .sort((a,b)=>b.kb-a.kb);
            const sum=early.reduce((a,r)=>a+r.kb,0);
            return {earlyKB:Math.round(sum),count:early.length,early};});
          console.log('R136 '+JSON.stringify(d,null,0));
          await b.close();})();
          EOS
