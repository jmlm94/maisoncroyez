name: fetch-lp-assets
# One-shot helper: the Claude Code cloud sandbox can't reach the image CDN,
# so this workflow fetches generated LP media and commits it to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch generated images
        run: |
          set -euo pipefail
          DIR=lp-factory/pages/adv-scent-ritual/assets/raw
          mkdir -p "$DIR"
          BASE="https://d8j0ntlcm91z4.cloudfront.net/user_36DYkAQBLYuFeIWq6SlzuEnE1VU"
          curl -fsSL -o "$DIR/grave.png"       "$BASE/hf_20260704_205137_35191b46-5538-42b6-8be6-39f6913b3cb9.png"
          curl -fsSL -o "$DIR/pain-scene.png"  "$BASE/hf_20260704_205140_933e2070-685f-429e-afc3-8a63f595e228.png"
          curl -fsSL -o "$DIR/golden-room.png" "$BASE/hf_20260704_205143_e25142f8-8c76-4200-b267-be8850ac4865.png"
          curl -fsSL -o "$DIR/narrator.png"    "$BASE/hf_20260704_205145_e53652f4-eabe-4a88-9737-949b343554a5.png"
          ls -la "$DIR"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/adv-scent-ritual/assets/raw
          git commit -m "Fetch generated advertorial media (raw)"
          git push
