name: verify-lp
# run: 69 — ingredients only on variant cards, sentence removed (fd35)
on:
  push:
    branches: [claude/maison-landing-page-iyikm5, claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/verify-lp.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait out bot-protection block if present
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36' 'https://maisoncroyez.com/pages/free-diffuser')
            echo "attempt $i: HTTP $code" | tee -a gate-log.txt
            if [ "$code" = "200" ]; then break; fi
            sleep 45
          done
      - name: Verify round-23 drawer takeover (both cart paths)
        run: |
          npm i -s playwright@1.56.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > check.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const page = await b.newPage({ viewport:{width:390,height:844}, deviceScaleFactor:2 });
          const errs=[];
          page.on('console', m=>{ if(m.type()==='error') errs.push(m.text().slice(0,200)); });
          page.on('pageerror', e=>errs.push('PAGEERROR: '+String(e).slice(0,200)));
          let loader='?';
          for(let a=0;a<8;a++){
            const nav=await page.goto('https://maisoncroyez.com/pages/free-diffuser?cb='+Date.now(), {waitUntil:'load',timeout:60000});
            console.log('goto attempt '+(a+1)+': HTTP '+(nav?nav.status():'?'));
            if(nav && nav.status()===200){
              await page.waitForTimeout(9000);
              loader = await page.evaluate(()=>{
                const s=[...document.querySelectorAll('script')].map(x=>x.textContent).join(' ');
                return (s.match(/fd\d+-/)||['?'])[0];
              });
              console.log('cache key seen: '+loader);
              if(loader==='fd35-') break;
            }
            await page.waitForTimeout(60000);
          }
          console.log('=== PAGE CACHE KEY (expect fd35-) === '+loader);
          await page.evaluate(async()=>{ for(let y=0;y<document.body.scrollHeight;y+=600){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,50));} });
          await page.waitForTimeout(1500);
          const section = await page.evaluate(()=>{
            const t=document.body.innerText;
            const img=[...document.querySelectorAll('#root img')].find(i=>/mc-lp-intentions-v2/.test(i.currentSrc||i.src));
            return {
              title:t.includes('Get ready to hear your guests complimenting your spaces'),
              italicLine:t.includes('for weeks, not hours, within a single fill.'),
              b600:t.includes('600 sq ft for over 45 days'),
              bMold:t.includes('no mold, no cleaning, no leaks'),
              bFeeling:t.includes('you choose the feeling your home holds all day'),
              oldTitleGone:!t.includes('Love? Relaxation? Abundance?'),
              v2Present:[...document.querySelectorAll('#root img')].some(i=>/mc-lp-intentions-v2/.test(i.currentSrc||i.src)),
              calloutsGone:!document.documentElement.outerHTML.includes('mc-lp-fd-hero-callouts'),
              tags:(()=>{const card=[...document.querySelectorAll('#root .pick')].find(p=>p.innerText.includes('Golden Blossom'));if(!card)return null;const pills=[...card.querySelectorAll('.pick-tags .tagpill')];const ing=card.querySelector('.pick-ings');return {values:pills.map(x=>x.textContent),bgs:pills.map(x=>getComputedStyle(x).backgroundColor),fgs:pills.map(x=>getComputedStyle(x).color),weights:pills.map(x=>getComputedStyle(x).fontWeight),ingBold:ing?getComputedStyle(ing).fontWeight:'?',ingText:ing?ing.textContent.slice(0,60):'?',descText:(card.querySelector('.pick-desc')||{innerText:'?'}).innerText.replace(/\s+/g,' ').slice(0,160),noOldRow:!document.querySelector('#root .scent-tags'),allCards:[...document.querySelectorAll('#root .pick')].every(p=>p.querySelectorAll('.pick-tags .tagpill').length===3)};})(),
              firstGallery:(()=>{const im=document.querySelector('#root .gallery img, #root [class*=gal] img, #root img');return im?(im.currentSrc||im.src).split('/').pop().slice(0,50):'none';})(),
              img:(()=>{const h=[...document.querySelectorAll('#root *')].filter(e=>e.children.length===0&&e.textContent.includes('complimenting your spaces'))[0];if(!h)return null;const sec=h.closest('section')||h.parentElement.parentElement.parentElement;const im=sec?sec.querySelector('img'):null;return im?{loaded:im.complete&&im.naturalWidth>0,src:(im.currentSrc||im.src).split('/').pop().slice(0,50)}:null;})()
            };
          });
          console.log('=== INTENTIONS SECTION ==='); console.log(JSON.stringify(section));
          console.log('=== GOLDEN BLOSSOM CARD TAGS ==='); console.log(JSON.stringify(section.tags));
          const secEl=await page.evaluateHandle(()=>{const h=[...document.querySelectorAll('#root h2, #root h3, #root .ang-title, #root [class*=head]')].find(e=>e.textContent.includes('complimenting your spaces'));return h?h.closest('section')||h.parentElement.parentElement:document.body;});
          try{ await secEl.asElement().scrollIntoViewIfNeeded(); await page.waitForTimeout(1200); await page.screenshot({path:'fd-section-intentions.png'});}catch(e){console.log('section shot skipped: '+e.message.slice(0,80));}
          await page.evaluate(()=>window.scrollTo(0,0));
          await page.waitForTimeout(800);
          const grab = async()=>page.evaluate(async()=>{
            for(let a=0;a<6;a++){
              const r=await fetch('/cart.js');
              const txt=await r.text();
              try{ const j=JSON.parse(txt); return {total:j.total_price/100, n:j.items.length}; }
              catch(e){ await new Promise(res=>setTimeout(res,4000)); }
            }
            return {total:-1, gated:true};
          });
          const drawerAudit = ()=>page.evaluate(()=>{
            const d=document.getElementById('cart-drawer');
            if(!d) return {found:false};
            const vis=s=>{ const el=d.querySelector(s); if(!el) return 'absent'; return getComputedStyle(el).display==='none'?'hidden':'VISIBLE'; };
            const txt=s=>{ const el=d.querySelector(s); return el?el.textContent.trim().replace(/\s+/g,' ').slice(0,90):'MISSING'; };
            const inner=d.querySelector('.cart-drawer__inner')||d;
            const scrollers=[...d.querySelectorAll('*')].filter(el=>{
              const cs=getComputedStyle(el);
              return /(auto|scroll)/.test(cs.overflowY) && el.scrollHeight>el.clientHeight+4;
            }).map(el=>({sel:el.tagName.toLowerCase()+'.'+String(el.className).trim().split(/\s+/).slice(0,2).join('.'), scrollH:el.scrollHeight, clientH:el.clientHeight, overflowPx:el.scrollHeight-el.clientHeight}));
            return {
              found:true,
              header:txt('.cart-drawer__top p.h5'),
              shipbar:txt('.mc-shipbar'),
              diffuserPrice:[...d.querySelectorAll('.line-item')].map(li=>{
                const a=li.querySelector('a.bold'); const sp=li.querySelector('sale-price');
                return (a?a.textContent.trim().slice(0,30):'?')+' -> '+(sp?sp.textContent.trim():'?');
              }),
              testi:{present:!!d.querySelector('.mc-testi'), name:txt('.mc-tname'), quoteStart:txt('.mc-tq').slice(0,50)},
              value:txt('.mc-value'),
              headerPx:(()=>{const el=d.querySelector('.cart-drawer__top p.h5');return el?getComputedStyle(el).fontSize:'?';})(),
              shipbarBox:(()=>{const el=d.querySelector('.mc-shipbar');if(!el)return{};const cs=getComputedStyle(el);return {pt:cs.paddingTop,pb:cs.paddingBottom,mt:cs.marginTop,mb:cs.marginBottom};})(),
              totalRow:(()=>{const sps=[...d.querySelectorAll('span.h5')].filter(s=>/Today|PAY TODAY|USD/i.test(s.textContent));return sps.map(s=>s.textContent.trim()+' @'+getComputedStyle(s).fontSize);})(),
              button:(()=>{const btn=d.querySelector('form.buy-buttons button, form.buy-buttons .btn');if(!btn)return{};const cs=getComputedStyle(btn);return {text:btn.textContent.trim().replace(/\s+/g,' ').slice(0,50), bg:cs.backgroundColor, tt:cs.textTransform};})(),
              urgline:txt('.mc-urgline'),
              trustBadges:[...d.querySelectorAll('.mc-trust>div')].map(x=>x.textContent.trim().replace(/\s+/g,' ')),
              removeBtns:d.querySelectorAll('.mc-rm').length,
              paysafe:!!d.querySelector('.mc-paysafe'),
              hidden:{
                giftBar:vis('.booklet-gift-container'),
                discountPills:vis('.line-item ul.contents'),
                qtyStepper:vis('line-item-quantity'),
                removeLink:vis('.line-item__actions'),
                subiPlanLine:vis('.line-item__info>p.text-sm')
              },
              oneView:{ innerScrollH:inner.scrollHeight, innerClientH:inner.clientHeight, scrollers },
              ctaText:txt('form.buy-buttons button, form.buy-buttons .btn')
            };
          });
          // --- CIRCLE PATH ---
          await page.evaluate(()=>document.querySelectorAll('.plan')[0].click());
          await page.waitForTimeout(300);
          await page.evaluate(()=>document.querySelector('.buybox .atc').scrollIntoView({block:'center'}));
          await page.waitForTimeout(200);
          await page.click('.buybox .atc');
          await page.waitForTimeout(7000);
          const cart1=await grab();
          const circle=await drawerAudit();
          console.log('=== CIRCLE CART (expect 49.95) === '+JSON.stringify(cart1));
          console.log('=== CIRCLE DRAWER ==='); console.log(JSON.stringify(circle,null,1));
          await page.screenshot({ path:'fd-drawer-r27-circle.png' });
          // functional removal: click the scent line's ✕, expect items 2 -> 1
          await page.evaluate(()=>{ const btns=[...document.querySelectorAll('#cart-drawer .mc-rm')]; if(btns.length) btns[btns.length-1].click(); });
          await page.waitForTimeout(6000);
          const afterRm=await grab();
          console.log('=== REMOVE TEST (expect n 2 -> 1) === '+JSON.stringify(afterRm));
          await page.evaluate(async()=>{ await fetch('/cart/clear.js',{method:'POST'}); });
          await page.waitForTimeout(4000);
          await page.keyboard.press('Escape');
          await page.waitForTimeout(1500);
          // --- ONE-TIME PATH ---
          await page.evaluate(()=>document.querySelectorAll('.plan')[1].click());
          await page.waitForTimeout(300);
          await page.evaluate(()=>document.querySelector('.buybox .atc').click());
          await page.waitForTimeout(7000);
          const cart2=await grab();
          const onetime=await drawerAudit();
          console.log('=== ONE-TIME CART (expect 139.90) === '+JSON.stringify(cart2));
          console.log('=== ONE-TIME DRAWER ==='); console.log(JSON.stringify(onetime,null,1));
          await page.screenshot({ path:'fd-drawer-r27-onetime.png' });
          await page.evaluate(async()=>{ await fetch('/cart/clear.js',{method:'POST'}); });
          // --- VERDICT ---
          const hid=circle.hidden||{};
          const allHidden=Object.values(hid).every(v=>v!=='VISIBLE');
          const fitOK=(circle.oneView.scrollers||[]).every(s=>s.overflowPx<=60);
          const checks={
            circleHeader:circle.header==='Congrats! Your free diffuser is reserved ✓',
            shipbar:/FREE SHIPPING UNLOCKED/.test(circle.shipbar),
            diffuserFree:circle.diffuserPrice.some(x=>/-> FREE/.test(x)),
            testi:circle.testi.present&&/Diane/.test(circle.testi.name),
            noFullValue:circle.value==='MISSING',
            header90:parseFloat(circle.headerPx)<=14.5,
            shipbarPad:parseFloat(circle.shipbarBox.pt)>=10&&parseFloat(circle.shipbarBox.mb)>=12&&parseFloat(circle.shipbarBox.mt)>=5,
            todaysTotal:circle.totalRow.some(x=>/Today's total:/.test(x))&&!circle.totalRow.some(x=>/PAY TODAY/.test(x)),
            secureCta:/Secure Checkout/i.test((circle.button||{}).text||''),
            blackCta:/rgb\(17, 17, 17\)/.test((circle.button||{}).bg||''),
            capsCta:(circle.button||{}).tt==='uppercase',
            urg19:/Only 19 free diffusers left/.test(circle.urgline),
            trust3:circle.trustBadges.length===3,
            noPaysafe:!circle.paysafe,
            clutterHidden:allHidden,
            oneViewFit:fitOK,
            onetimeHeader:onetime.header==='Your cart',
            onetimeTesti:onetime.testi.present&&/Diane/.test(onetime.testi.name),
            cartCircle:cart1.total===49.95,
            cartOnetime:cart2.total===139.9,
            rmBtns:circle.removeBtns===2,
            rmWorks:afterRm.n===1,
            secTitle:section.title&&section.italicLine&&section.oldTitleGone,
            secBullets:section.b600&&section.bMold&&section.bFeeling,
            secImg:!!(section.img&&section.img.loaded),
            v2ImgOnPage:section.v2Present,
            calloutsGone:section.calloutsGone,
            firstGalleryIsProduct:/Diseno_sin_titulo_92/.test(section.firstGallery),
            tagsOnCard:!!section.tags&&section.tags.values.join('|')==='Cozy|Entertaining Guests|Warm & Sweet',
            tagsDark:!!section.tags&&section.tags.bgs.join('|')==='rgb(138, 90, 43)|rgb(110, 75, 142)|rgb(156, 100, 20)',
            tagsWhiteBold:!!section.tags&&section.tags.fgs.every(c=>c==='rgb(255, 255, 255)')&&section.tags.weights.every(w=>+w>=700),
            ingredientsBold:!!section.tags&&+section.tags.ingBold>=700&&/Buttercup/.test(section.tags.ingText),
            allCardsTagged:!!section.tags&&section.tags.allCards,
            oldRowGone:!!section.tags&&section.tags.noOldRow,
            ingredientsOnly:!!section.tags&&section.tags.descText.trim()==='\ud83c\udf3c Buttercup \u00b7 \ud83c\udf38 Honeysuckle \u00b7 \ud83c\udf3b Sunflower',
            sentenceGone:!!section.tags&&!/For the home|pull the people/.test(section.tags.descText)
          };
          console.log('=== VERDICT ===');
          Object.entries(checks).forEach(([k,v])=>console.log((v?'PASS':'FAIL')+' '+k));
          console.log('=== CONSOLE ERRORS ('+errs.length+') ==='); errs.slice(0,15).forEach(e=>console.log(' - '+e));
          await b.close();
          EOS
          node check.mjs 2>&1 | tee verify-log.txt
      - name: Perf spot-check (1 throttled run, drawer must not affect load)
        if: always()
        run: |
          cat > perf.mjs <<'EOS'
          import { chromium } from 'playwright';
          const b=await chromium.launch();
          const ctx=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,userAgent:'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36'});
          const page=await ctx.newPage();
          const cdp=await ctx.newCDPSession(page);
          await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:150,downloadThroughput:1.6*1024*1024/8,uploadThroughput:750*1024/8});
          await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
          await page.addInitScript(()=>{
            window.__m={lcp:0,cls:0,fcp:0};
            new PerformanceObserver(l=>{for(const e of l.getEntries()) window.__m.lcp=e.startTime;}).observe({type:'largest-contentful-paint',buffered:true});
            new PerformanceObserver(l=>{for(const e of l.getEntries()) if(!e.hadRecentInput) window.__m.cls+=e.value;}).observe({type:'layout-shift',buffered:true});
            new PerformanceObserver(l=>{for(const e of l.getEntries()) if(e.name==='first-contentful-paint') window.__m.fcp=e.startTime;}).observe({type:'paint',buffered:true});
          });
          let nv=null;
          for(let a=0;a<5;a++){
            nv=await page.goto('https://maisoncroyez.com/pages/free-diffuser?perf='+Date.now(),{waitUntil:'load',timeout:120000});
            console.log('perf goto attempt '+(a+1)+': HTTP '+(nv?nv.status():'?'));
            if(nv && nv.status()===200) break;
            await page.waitForTimeout(45000);
          }
          await page.waitForTimeout(12000);
          const m=await page.evaluate(()=>{
            const nav=performance.getEntriesByType('navigation')[0]||{};
            const res=performance.getEntriesByType('resource');
            const app=res.filter(r=>/mc-lp-free-diffuser-app/.test(r.name)).map(r=>({transferKB:Math.round(r.transferSize/1024),decodedKB:Math.round(r.decodedBodySize/1024)}));
            return {ttfbMs:Math.round(nav.responseStart||0),fcpMs:Math.round(window.__m.fcp),lcpMs:Math.round(window.__m.lcp),cls:+window.__m.cls.toFixed(4),loadMs:Math.round(nav.loadEventEnd||0),reqCount:res.length,totalTransferKB:Math.round(res.reduce((s,r)=>s+r.transferSize,0)/1024),appBundle:app};
          });
          console.log('=== PERF (Slow4G / 4x CPU) ==='); console.log(JSON.stringify(m));
          await b.close();
          EOS
          node perf.mjs 2>&1 | tee perf-log.txt
      - name: Commit results
        if: always()
        run: |
          mkdir -p lp-factory/pages/pdp-free-diffuser/verify
          mv fd-drawer-r27-circle.png fd-drawer-r27-onetime.png fd-section-intentions.png verify-log.txt perf-log.txt lp-factory/pages/pdp-free-diffuser/verify/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/pdp-free-diffuser/verify
          git commit -m "verify run 69: ingredients-only cards on fd35" || true
          git pull --rebase -X theirs origin ${GITHUB_REF_NAME}
          git push
