name: drawer-recon
# run 159 — gate smells-like padding, then live verify pill clear (key p6m22)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          U="https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-6mp.css?v=og$RANDOM$RANDOM"
          curl -s "$U" -o /tmp/k.css
          echo "bytes=$(wc -c < /tmp/k.css)"
          echo "pad=$(grep -c 'padding-right:58px' /tmp/k.css || true)"
          echo "abs=$(grep -c 'right:12px;bottom:11px' /tmp/k.css || true)"
