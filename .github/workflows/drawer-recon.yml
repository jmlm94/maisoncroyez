name: drawer-recon
# run 146 — origin gate: banner override removed from mc-drawer.js, drawer code intact
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          U="https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-drawer.js?v=og$RANDOM$RANDOM"
          curl -s "$U" -o /tmp/d.js
          echo "bytes=$(wc -c < /tmp/d.js)"
          echo "banner=$(grep -c 'mcBanner' /tmp/d.js || true)"
          echo "wow=$(grep -c 'WOW' /tmp/d.js || true)"
          echo "drawer=$(grep -c '__mcDrawer' /tmp/d.js)"
          echo "checkout=$(grep -c 'Secure Checkout' /tmp/d.js)"
