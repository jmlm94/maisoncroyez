name: drawer-recon
# run 242 — fd13 (owner changes + CRO items 1/2/3/5, 2026-09-25): h1 "Pick your scents. The diffusers are on us." + price
#           lede; offer pill on the hero; kit cards "N FREE Diffusers + N Scents" with room badges, "$X today" + struck
#           value + "then $39.95/scent", no (requires) / ship pills, MOST POPULAR green; countdown "N free diffusers
#           reserved for you · HH:MM:SS"; step 2 progress pill + hint + auto-advance; step 3 "How would you like your
#           refills?" card (Auto-refill & 20% OFF for life, $39.95 from day 30) + "No thanks…" link, no scarcity strip,
#           "You only pay: $49.95/scent"; button "SECURE CHECKOUT — $X" adds to cart and goes straight to /checkout
#           (drawer no longer opened); Meta AddToCart beacon must leave before the redirect. Full-page phone screenshots.
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Wait for the page cache (one-off after the fd13 publish)
        run: sleep 90
      - name: Funnel
        run: |
          mkdir -p lp-factory/pages/free-diffusers/recon/r242
          cat > r242.mjs <<'EOF2'
