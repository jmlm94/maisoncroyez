name: drawer-recon
# run 79 — compliments-copy origin gate (grep -o|wc -l per minified-file rail)
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate
        run: |
          B='https://cdn.shopify.com/s/files/1/0020/3636/7469/files/mc-kit-app.js'
          for i in $(seq 1 24); do
            K="oc$RANDOM$RANDOM"
            BODY=$(curl -sS "$B?v=$K")
            NEW=$(printf %s "$BODY" | grep -o "apologize in advance for the" | wc -l)
            OLD=$(printf %s "$BODY" | grep -o "apologize in advance for all the" | wc -l)
            ATC=$(printf %s "$BODY" | grep -o "Add to cart" | wc -l)
            DRW=$(printf %s "$BODY" | grep -o "cart-drawer" | wc -l)
            echo "try$i key=$K new=$NEW old=$OLD AddToCart=$ATC drawer=$DRW len=${#BODY}"
            if [ "$NEW" -ge 1 ] && [ "$OLD" -eq 0 ] && [ "$ATC" -ge 3 ] && [ "$DRW" -ge 1 ]; then echo "ORIGIN_FRESH"; exit 0; fi
            sleep 10
          done
          echo "ORIGIN_STALE"; exit 1
