name: drawer-recon
# run 162 — re-gate mc-ic file sizes vs repo + BXGY subscription-vs-onetime isolation
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Gate sizes
        run: |
          B="https://cdn.shopify.com/s/files/1/0020/3636/7469/files"
          G="https://raw.githubusercontent.com/jmlm94/maisoncroyez/577531ab2603fbbc793ac473d34f7371a52e6c27/lp-factory/pages/kits-lp/deploy-ready"
          curl -s "$G/mc-ic-app.js" -o /tmp/gapp.js; curl -s "$G/mc-ic.css" -o /tmp/gcss.css
          curl -s "$B/mc-ic-app.js?v=og$RANDOM$RANDOM" -o /tmp/app.js
          curl -s "$B/mc-ic.css?v=og$RANDOM$RANDOM" -o /tmp/ic.css
          echo "github app=$(wc -c < /tmp/gapp.js) css=$(wc -c < /tmp/gcss.css)"
          echo "cdn    app=$(wc -c < /tmp/app.js) css=$(wc -c < /tmp/ic.css)"
          cmp -s /tmp/gapp.js /tmp/app.js && echo "APP-IDENTICAL" || echo "APP-DIFFERS"
          cmp -s /tmp/gcss.css /tmp/ic.css && echo "CSS-IDENTICAL" || echo "CSS-DIFFERS"
          echo "plan=$(grep -c 'selling_plan: CART.sellingPlan' /tmp/app.js || true)"
          echo "hardening=$(grep -c '#root \.offhero{display:flex !important}' /tmp/ic.css || true)"
      - name: BXGY isolation
        run: |
          echo "--- A: 2 ONE-TIME scents + diffuser ---"
          J=/tmp/j1; curl -s -c $J -o /dev/null "https://maisoncroyez.com/"
          curl -s -b $J -c $J -X POST "https://maisoncroyez.com/cart/add.js" -H "Content-Type: application/json" \
            -d '{"items":[{"id":41212020457581,"quantity":1},{"id":41212018655341,"quantity":1},{"id":45450822778989,"quantity":1}]}' -o /dev/null
          curl -s -b $J "https://maisoncroyez.com/cart.js" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("total", d["total_price"]); [print(i["id"], i["final_line_price"], "plan" if i.get("selling_plan_allocation") else "one-time") for i in d["items"]]'
          curl -s -b $J -X POST "https://maisoncroyez.com/cart/clear.js" -o /dev/null
          echo "--- B: 2 SUB scents + diffuser (repeat) ---"
          K=/tmp/j2; curl -s -c $K -o /dev/null "https://maisoncroyez.com/"
          curl -s -b $K -c $K -X POST "https://maisoncroyez.com/cart/add.js" -H "Content-Type: application/json" \
            -d '{"items":[{"id":41212020457581,"quantity":1,"selling_plan":2661875821},{"id":41212018655341,"quantity":1,"selling_plan":2661875821},{"id":45450822778989,"quantity":1}]}' -o /dev/null
          curl -s -b $K "https://maisoncroyez.com/cart.js" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("total", d["total_price"]); [print(i["id"], i["final_line_price"], "plan" if i.get("selling_plan_allocation") else "one-time") for i in d["items"]]'
          curl -s -b $K -X POST "https://maisoncroyez.com/cart/clear.js" -o /dev/null
          echo done
