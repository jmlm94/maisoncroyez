name: drawer-recon
# run 89 — fetch gallery slide 4 for artifact embed
on:
  push:
    branches: [claude/maison-offer-v2-deploy-dspkwe]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit
        run: |
          curl -sSL "https://cdn.shopify.com/s/files/1/0020/3636/7469/files/24_60499c64-0c0b-48a4-8b5b-0785ce8dfa67.png?v=1779491849&width=900" -o /tmp/intent.jpg
          ls -la /tmp/intent.jpg
          file /tmp/intent.jpg
          mkdir -p lp-factory/pages/kits-lp
          base64 -w0 /tmp/intent.jpg > lp-factory/pages/kits-lp/gal4.b64
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/gal4.b64
          git commit -m "recon r89: gallery slide 4 base64 for artifact embed"
          git push
