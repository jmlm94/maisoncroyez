name: drawer-recon
# run 183 — verify v3s3 live: hero video with autoplay BLOCKED (chromium --autoplay-policy=user-gesture-required) shows the play button and a tap starts it; normal chromium + iPhone WebKit autoplay; key v3s3
on:
  push:
    branches: [claude/maison-diffuser-perf-fixes-f45ggl]
    paths: ['.github/workflows/drawer-recon.yml']

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Install webkit
        run: npx playwright install --with-deps webkit
      - name: Verify
        run: |
          mkdir -p lp-factory/pages/kits-lp/live
          cat > r183.mjs <<'EOF2'
          import { chromium, webkit, devices } from 'playwright';
          const URL = 'https://maisoncroyez.com/pages/six-month-program';
          const out = {};
          const probe = async (pg) => pg.evaluate(() => {
            const v = document.querySelector('#root video'); const b = document.querySelector('#root .hv-play');
            return v ? { src: (v.currentSrc || v.src).slice(-40), paused: v.paused, t: +v.currentTime.toFixed(2), rs: v.readyState, muted: v.muted, attrs: ['muted','playsinline','autoplay'].map(a => v.hasAttribute(a)), btn: !!b, btnBox: b ? b.getBoundingClientRect().width : 0, key: [...document.scripts].map(s => s.src).filter(s => /mc-v3-app/.test(s)).map(s => s.split('v=')[1])[0] } : { novideo: true };
          });
          const settle = async (pg) => { await pg.waitForSelector('#root video', { timeout: 60000 }); await pg.waitForTimeout(4500); };
          // 1) chromium with autoplay refused (simulates iOS Low Power / Low Data mode)
          { const b = await chromium.launch({ args: ['--autoplay-policy=user-gesture-required'] });
            const pg = await (await b.newContext({ ...devices['iPhone 13'], defaultBrowserType: undefined })).newPage();
            const errs = []; pg.on('pageerror', e => errs.push(e.message.slice(0, 120)));
            await pg.goto(URL, { waitUntil: 'domcontentloaded', timeout: 90000 }); await settle(pg);
            const before = await probe(pg);
            await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3s3-blocked-before.png' });
            // tap somewhere neutral (the page background near the h1), not the button
            const h1 = await pg.$('#root h1'); const bb = await h1.boundingBox(); await pg.mouse.click(bb.x + 5, bb.y + 5);
            await pg.waitForTimeout(1500);
            const afterTap = await probe(pg);
            out.blocked = { before, afterTap, errs };
            await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3s3-blocked-after.png' });
            await b.close(); }
          // 2) chromium normal + 3) webkit iPhone
          for (const [name, bt, dev] of [['chromium', chromium, devices['Pixel 7']], ['webkit-iphone', webkit, devices['iPhone 13']]]) {
            const b = await bt.launch(); const pg = await (await b.newContext({ ...dev, defaultBrowserType: undefined })).newPage();
            const errs = []; pg.on('pageerror', e => errs.push(e.message.slice(0, 120)));
            await pg.goto(URL, { waitUntil: 'domcontentloaded', timeout: 90000 }); await settle(pg);
            const a = await probe(pg); await pg.waitForTimeout(1500); const c = await probe(pg);
            out[name] = { a, c, advanced: c.t > a.t, errs };
            await pg.screenshot({ path: 'lp-factory/pages/kits-lp/live/v3s3-' + name + '.png' });
            await b.close(); }
          console.log('V3S3 ' + JSON.stringify(out, null, 1));
          EOF2
          node r183.mjs
      - name: Commit
        run: |
          git config user.name "mc-recon"
          git config user.email "actions@users.noreply.github.com"
          git add lp-factory/pages/kits-lp/live/
          git commit -m "r183: v3s3 video fallback screenshots" || exit 0
          git push
